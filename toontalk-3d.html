  // has retracted and walked home, leaving the number hanging in mid-air.
  enqueueNext({
    dur: 0.22,
    start() { incoming.position.copy(start); },
    update(t) { incoming.position.lerpVectors(start, perch, ease(t)); },
    end() { incoming.position.copy(perch); },
  }, pause(0.3), {
    dur: 0.4,
    update(t) {
      const e = ease(t);
      incoming.position.lerpVectors(perch, dest, e);
      incoming.scale.setScalar(iScale.y * (1 - 0.85 * e));
    },
    end() { incoming.removeFromParent(); },
  }, {
    dur: 0.4,
    start() { target.setValue(result); flash(dest); },
    update(t) { target.scale.setScalar(base * (1 + 0.3 * Math.sin(Math.PI * t))); },
    end() { target.scale.setScalar(base); refreshUI(); },
  });
}

const flashes = [];
function flash(pos) {
  if (speed === Infinity || offstage()) return;   // nothing to see
  const m = new THREE.Mesh(geo('SphereGeometry', 0.15, 20, 12),
    new THREE.MeshBasicMaterial({ color: 0xffd27a, transparent: true, opacity: 0.55,
      blending: THREE.AdditiveBlending, depthWrite: false }));
  m.position.copy(pos); scene.add(m); flashes.push({ m, t: 0 });
}

// ---------------------------------------------------------------- interaction
function resolve(ev) {
  const ndc = new THREE.Vector2((ev.clientX / innerWidth) * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  // things created earlier in this same tick still have stale world matrices,
  // and the raycaster works off those
  scene.updateMatrixWorld();
  for (const h of ray.intersectObjects(pickables, true)) {
    // What you are carrying rides under the pointer (or sits in the claw), so
    // it would otherwise intercept every click meant for what is behind it.
    if (held && isDescendantOf(h.object, held)) continue;
    // things inside a room's miniature world belong to that world -- walk in
    // through the door to touch them
    let inMini = false;
    for (let p = h.object; p; p = p.parent) {
      if (p.name === 'worldRoot' && p.parent !== scene) { inMini = true; break; }
    }
    if (inMini) continue;
    let o = h.object;
    while (o && !o.__pick) o = o.parent;
    if (!o) continue;
    // the thought bubble floats over the bench; it takes clicks when Dusty is
    // awake to erase, or when an empty hand can take a copy of the memory.
    // The outer bubble shell never intercepts Dusty, so the ghost parts stay
    // individually erasable.
    if (o.__pick.kind === 'cond') {
      if (dustyActive || rubyActive) { if (o.__pick.outer) continue; }
      else if (held || !activeBot?.trainedOn) continue;
    }
    // handing things over only means anything in the workshop -- inside the
    // bubble the robot is working, and its body must not block clicks past it
    if (o.__pick.kind === 'botThing' && mode !== 'world') continue;
    return { ...o.__pick, point: h.point.clone() };
  }
  return null;
}
function isDescendantOf(node, ancestor) {
  for (let p = node; p; p = p.parent) if (p === ancestor) return true;
  return false;
}
const ray = new THREE.Raycaster();

function handleClick(target) {
  if (!target) return;
  // the helpers can always be woken or settled, even while a robot runs
  if (target.kind === 'dusty' || target.kind === 'ruby') {
    if (target.kind === 'dusty') {
      dustyActive = !dustyActive;
      if (dustyActive) rubyActive = false;
      say(dustyActive ? 'Dusty is awake — click things to vacuum them away, or parts of the robot’s thought to remove them.'
                      : 'Dusty settles down.');
    } else {
      rubyActive = !rubyActive;
      if (rubyActive) dustyActive = false;
      say(rubyActive ? 'Ruby is awake — click parts of the robot’s thought to erase them, one step more general each time.'
                     : 'Ruby settles down.');
    }
    return refreshUI();
  }
  if (target.kind === 'marty') { toggleMartyPanel(); return; }
  if (busy || mode === 'replay') return;

  if (target.kind === 'roomRoof' || target.kind === 'roomDoor') {
    const room = target.room;
    // a room still on its stack is stock -- any click just takes one
    if (stations.rooms?.cubes.includes(room)) {
      return handleClick({ kind: 'station', id: 'rooms' });
    }
    // with a full hand, roof and door take the drop like the body does
    if (held && mode === 'world') {
      const dropped = held; held = null;
      return roomDrop(room, dropped, (msg) => {
        putOnBench(dropped, benchSpot());
        sayAttn(msg);
      });
    }
  }
  if (target.kind === 'roomLever') {
    const room = target.room;
    if (stations.rooms?.cubes.includes(room)) {
      return handleClick({ kind: 'station', id: 'rooms' });
    }
    if (room.userData.dirty) {
      room.userData.dirty = false;
      say('The lever goes down — the robot inside stops.');
    } else if (roomHasWorker(room)) {
      room.userData.stepRounds = 0;
      room.userData.dirty = true;
      say('The lever goes up — the robot inside gets to work.');
    } else {
      say('Nothing to run: the room needs a robot and something on its desk.');
    }
    return refreshUI();
  }
  if (target.kind === 'roomRoof') {
    const room = target.room;
    room.setOpaque(!room.userData.opaque);
    say(room.userData.opaque
      ? 'The walls turn solid — inside, everything runs in an instant.'
      : 'The walls turn to glass — you can watch what the room holds.');
    return refreshUI();
  }
  if (target.kind === 'roomDoor') {
    return enterRoom(target.room);
  }
  if (target.kind === 'exitDoor') {
    return leaveRoom();
  }
  if (target.kind === 'growToggle') {
    resizeMode = !resizeMode;
    orbit.enabled = !resizeMode;      // dragging a handle must not spin the camera
    if (!resizeMode && grabbedCorner !== null) releaseCorner();
    showHandles(resizeMode);
    say(resizeMode ? 'Corner handles are out — click one to carry it, click again to set the corner.'
                   : 'The table keeps this shape.');
    return refreshUI();
  }
  if (grabbedCorner !== null) { releaseCorner(); return; }
  if (target.kind === 'benchHandle') return;   // handled by drag, below

  if (target.kind === 'nbFlip') {
    if (held) return say('Empty your hand to flip pages.');
    return notebookFlip(target.nb, target.dir);
  }
  if (target.kind === 'nbItem') {
    const nb = target.nb, slot = target.slot;
    if (dustyActive && !held) {
      pushUndo();
      nb.userData.pages[slot] = null;
      renderNotebook(nb);
      saveNotebook(nb);
      say('Dusty removed that page’s entry.');
      return refreshUI();
    }
    if (held) return say('Your hand is full.');
    if (mode === 'training' && nb.userData.main) {
      // the page it is open at is what the robot will look at when it runs
      return go({ type: 'take', at: { c: 'notebook', path: [slot - nb.userData.page] } });
    }
    pushUndo();
    let t = buildFromRec(nb.userData.pages[slot]);
    if (!t) return;
    // a lone nest comes out with a fresh egg (it hatches when set down); a
    // lone bird conjures herself a fresh nest beside the notebook
    if (t.userData.kind === 'nest' && !t.userData.hasEgg && !t.userData.pile.length) {
      const fresh = makeNest();
      if (t.userData.label) setThingLabel(fresh, t.userData.label);
      t = fresh;
    }
    if (t.userData.kind === 'bird' && !t.__nest) {
      const nest2 = makeNest();
      nest2.__egg.removeFromParent();
      nest2.userData.hasEgg = false;
      if (t.userData.label) setThingLabel(nest2, t.userData.label);
      const at = nb.getWorldPosition(new THREE.Vector3());
      putOnBench(nest2, { x: at.x - 0.6, z: at.z });
      nest2.scale.setScalar(0.01);
      enqueueNext({
        dur: 0.5,
        update(tt) { nest2.scale.setScalar(Math.max(0.01, ease(tt))); },
        end() { nest2.scale.setScalar(1); },
      });
      t.__nest = nest2;
      say('Her new nest grows beside the notebook.');
    }
    scene.add(t);
    t.position.copy(nb.getWorldPosition(new THREE.Vector3())).y += 0.4;
    userTake(t);
    say('A copy from the notebook — the page keeps its own.');
    return refreshUI();
  }
  if (target.kind === 'miniCond') {
    const bot = target.bot;
    if (held) return say('Empty your hand first.');
    const copy = bot.trainedOn ? thingIn(bot.trainedOn, new Map(), [])
                               : thingFromCond(bot.condition);
    if (!copy) return say('Its thought is empty — there is nothing to take out.');
    WROOT.add(copy);
    copy.position.copy(bot.node.getWorldPosition(new THREE.Vector3())).y += 0.5;
    userTake(copy);
    say(bot.trainedOn ? 'A copy of what it was first shown.'
                      : 'A copy of what it expects.');
    return;
  }
  if (target.kind === 'cond') {
    // Ruby erases (each click one step more general); Dusty removes outright,
    // leaving an empty hole that matches anything or nothing.
    if (rubyActive) { dustyErase(target.path); return; }
    if (dustyActive) { removeCondAt(target.path); return; }
    {
      // reaching into the bubble empty-handed takes out a copy of the very
      // thing the robot was first shown
      if (!held && activeBot) {
        const copy = activeBot.trainedOn ? thingIn(activeBot.trainedOn, new Map(), [])
                                         : thingFromCond(condition);
        if (copy) {
          WROOT.add(copy);
          copy.position.copy(condDisplay
            ? condDisplay.getWorldPosition(new THREE.Vector3())
            : new THREE.Vector3(0, 2.1, 0.4));
          userTake(copy);
          say(activeBot.trainedOn ? 'A copy of what the robot was first shown.'
                                  : 'A copy of what the robot expects.');
          return;
        }
      }
      return say('Wake Ruby to erase parts of the thought, or Dusty to remove them.');
    }
  }

  // A thing sits down inside its pocket, so a click meant for it can land on
  // the pocket instead. An occupied hole always means the thing in it.
  if (target.kind === 'hole') {
    if (!target.box) return;
    const occupant = target.box.userData.holes[target.index].thing;
    if (occupant) return handleClick({ kind: 'thing', thing: occupant });
  }

  // Ruby erases real things in place
  if (rubyActive && !held) {
    const victim = target.kind === 'thing' ? target.thing
      : target.kind === 'station' && stations[target.id]?.kind !== 'stack'
          && stations[target.id]?.occupant ? stations[target.id].occupant
      : null;
    if (victim) return eraseThingInPlace(victim);
  }
  // While Dusty is awake, pointing him at things removes them. In training the
  // robot learns it as a step; in the workshop it just happens.
  if (dustyActive && !held) {
    const victim = target.kind === 'thing' ? target.thing
      : target.kind === 'botThing' && target.bot !== activeBot ? target.bot.node
      : target.kind === 'station' && stations[target.id].kind !== 'stack'
          && stations[target.id].occupant ? stations[target.id].occupant
      : null;
    if (victim) {
      if (victim.userData.kind === 'room' && victim.userData.dirty) {
        victim.userData.dirty = false;
        return say('Dusty interrupts the room — its robot stops mid-task. Drop something on it to set it going again.');
      }
      if (victim.userData.kind === 'notebook') {
        const ud = victim.userData;
        if (ud.pages[ud.page] || ud.pages[ud.page + 1]) {
          return say('A notebook only goes when it is open at two blank pages.');
        }
      }
      if (mode === 'training') {
        if (victim.userData.kind === 'robot') return say('Dusty leaves robots alone during a lesson.');
        const at = addrOf(victim);
        if (!at) return say('While training, Dusty can only vacuum the robot’s own things.');
        return go({ type: 'vacuum', at });
      }
      if (victim.userData.kind === 'robot' && victim.__bot.program.length) {
        say('A trained robot, gone for good.');
      }
      pushUndo();
      dustySuck(() => victim);
      return;
    }
  }

  return mode === 'training' ? directRobot(target) : userClick(target);
}

// In the workshop the user does everything themselves.
function userClick(target) {
  const holdingBot = held?.userData.kind === 'robot';
  // rooms and notebooks take drops of anything, robots included
  if (target.kind === 'thing' && held
      && (target.thing.userData.kind === 'room' || target.thing.userData.kind === 'notebook')) {
    const it = target.thing;
    const dropped = held; held = null;
    const refuse = (msg) => { putOnBench(dropped, benchSpot()); sayAttn(msg); };
    if (it.userData.kind === 'room') return roomDrop(it, dropped, refuse);
    const side = target.point ? sideOf(it, target.point) : 'R';
    return notebookDrop(it, dropped, side, refuse);
  }
  if (target.kind === 'botThing') {
    let bot = target.bot;
    // A team has one leader and one work surface: whatever you hand to a
    // member is handed to the leader instead, and a robot dropped on a member
    // joins the leader's team rather than starting a team inside a team.
    const lead = teamLeaderOf(bot);
    if (lead && lead !== bot && (held || holdingBot)) bot = lead;
    if (holdingBot) {
      if (held.__bot === bot) return;
      return formTeam(bot, held.__bot);
    }
    if (held) {
      // a bare robot forms teams instead; robots INSIDE boxes may be given,
      // so robots can carry robots into rooms
      if (held.userData.kind === 'robot') return say('Robots don’t work on robots.');
      if (bot === activeBot) return giveToRobot();
      if (activeBot) {
        // an idle robot does not block the bench: it shrinks and steps onto
        // the table by itself, and the one you chose takes its place
        if (activeBot.waiting) {
          return say(`${activeBot.name ? `“${activeBot.name}”` : 'The robot'} at the bench is waiting on its nest — click it first.`);
        }
        if (busy || mode !== 'world') return say('Wait for the work to finish first.');
        parkActiveAside();
        enqueue(doNow(() => activateBot(bot)));   // it takes what you are holding
        return;
      }
      return activateBot(bot);
    }
    if (bot === activeBot) return miniaturizeActive();
    // a robot standing aside is on duty, not lying about: a click brings it
    // back into focus rather than snatching it off its feet
    if (bot.stand) {
      syncBot();
      bindBot(bot);
      renderProgram(); rebuildCondition(); refreshUI();
      return say(bot.waiting
        ? `${bot.name ? `“${bot.name}”` : 'That robot'} is waiting on its nest — click again to pick it up.`
        : `Now showing ${bot.name ? `“${bot.name}”` : 'that robot'}.`);
    }
    if (leaveTeam(bot)) {
      userTake(bot.node);
      refreshUI();
      return say('Out of the team — set it down, or drop it on a robot to join another.');
    }
    return userTake(bot.node);       // pick a mini off the bench
  }
  if (target.kind === 'station') {
    const st = target.st ?? stations[target.id];
    // both surfaces of the copier count as "the copier": holding something
    // puts it on the platform; an empty hand takes the copy, then the original
    const isCopier = st.kind === 'copyIn' || st.kind === 'copyOut';
    if (!held) {
      if (st.kind === 'stack') {
        if (st.demoHidden) return;
        return userTakeFromStack(st);
      }
      if (st.kind === 'stand' && st.occupant) return userTake(st.occupant);
      if (isCopier) {
        // take from the surface actually clicked, falling back to the other
        const first = st.kind === 'copyIn' ? stations.copyIn : stations.copyOut;
        const other = st.kind === 'copyIn' ? stations.copyOut : stations.copyIn;
        if (first.occupant) return userTake(first.occupant);
        if (other.occupant) return userTake(other.occupant);
        return say('Nothing there to pick up.');
      }
      if (st.occupant) return userTake(st.occupant);
      return say('Nothing there to pick up.');
    }
    if (st.kind === 'stack') return say('Stacks only give things out.');
    if (holdingBot && st.kind !== 'stand' && !isCopier) {
      return say('Little robots go on the table, or on another robot.');
    }
    if (isCopier) {
      if (stations.copyIn.occupant) return say('Take the original off the platform first.');
      if (stations.copyOut.occupant) return say('Take the copy out of the tray first.');
      return userUseCopier();
    }
    // the stand belongs to the robot: dropping something there IS giving it
    if (st.kind === 'stand') {
      if (st !== stations.stand) {
        return say('That desk belongs to a robot standing aside — click the robot first.');
      }
      // a mini set back on the desk wakes up -- the takeback for an
      // accidental shrink
      if (holdingBot && !activeBot) {
        const b = held.__bot, node = held;
        held = null;
        putOnBench(node, benchSpot());
        return activateBot(b);
      }
      if (activeBot) return giveToRobot();
    }
    return say('Hand it to the robot instead.');
  }
  if (target.kind === 'bench') {
    if (!held) return;
    // a thin pad's edge is a needle target: a bench click NEXT to a pad while
    // holding a pad means the pad, side and all
    if ((held.userData.kind === 'text' || held.userData.kind === 'number') && target.point) {
      const p = target.point;
      const near = benchThings.find(t2 => t2 !== held && t2.userData.kind === 'text'
        && Math.abs(p.x - t2.position.x) < 0.45 && Math.abs(p.z - t2.position.z) < 0.36);
      if (near) return userDropOn(near, p);
    }
    return userPutOnBench(target.point);
  }
  if (target.kind === 'thing') {
    if (!target.thing) return;
    const kind = target.thing.userData.kind;
    if (!held) {
      // the top of a pile comes off alone; grabbing the tower anywhere lower
      // lifts the nest itself, deliveries and all
      const pn = allNests.find(n2 => n2.userData.pile.includes(target.thing));
      if (pn && pn.userData.pile[pn.userData.pile.length - 1] !== target.thing) {
        return userTake(pn);
      }
      return userTake(target.thing);
    }
    if (target.thing === held) return;
    if (holdingBot) {
      // the shell of a box occludes its holes: aim at the hole meant
      const hs = holesOf(target.thing);
      if (hs && hs.length) {
        const h = holeUnder(target.thing, target.point) ?? hs.find(x => !x.thing);
        if (h && !h.thing) return userPutInHole(h);
        // the hole may be taken by a MOULD -- a box with no holes -- and a
        // team dropped on that comes apart into it, right where it sits
        if (h?.thing?.userData.kind === 'box' && !h.thing.userData.holes.length) {
          return handleClick({ kind: 'thing', thing: h.thing, point: target.point });
        }
        return say('That hole is taken — drop the robot in an empty one.');
      }
      // a box with NO holes has nowhere to file a robot, so it is the mould
      if (target.thing.userData.kind === 'box') {
        pushUndo();
        const dropped = held; held = null;
        const from = dropped.getWorldPosition(new THREE.Vector3());
        return combine({ thing: target.thing }, dropped, true, from);
      }
      return say('Robots only team up with other robots.');
    }
    // Any drop aimed at a box goes to the hole under the pointer -- clicks on
    // the shell used to fall through to a refusal and bounce to the bench.
    // (A held box still means join, and a box dropped on a number splits.)
    if (held.userData.kind !== 'box' && holesOf(target.thing)) {
      const h = holeUnder(target.thing, target.point);
      if (h) {
        if (!h.thing) return userPutInHole(h);
        return handleClick({ kind: 'thing', thing: h.thing, point: target.point });
      }
    }
    // a nest dropped on a nest folds the two into one -- everything else you
    // are carrying by the base is simply set down
    if (held.userData.kind === 'nest' && kind === 'nest') {
      pushUndo();
      const dropped = held; held = null;
      const from = dropped.getWorldPosition(new THREE.Vector3());
      return combine({ thing: target.thing }, dropped, true, from);
    }
    if (held.userData.kind === 'bird' || held.userData.kind === 'nest') {
      return say('Set it down on the bench.');
    }
    if (kind === 'bird') return birdDeliver(target.thing);
    if (kind === 'nest') return say('Give it to the bird — deliveries go through her.');
    // clicking whatever sits on the copier while holding means "use the copier",
    // not "combine with the thing that happens to be lying there"
    if (target.thing === stations.copyIn.occupant || target.thing === stations.copyOut.occupant) {
      return userClick({ kind: 'station', id: 'copyIn' });
    }
    // A held box aimed at a box usually hits the numbers standing in its holes,
    // since they occlude the shell. The intent is the box, so retarget it.
    if (held.userData.kind === 'box' && kind !== 'box') {
      let p = target.thing.parent;
      while (p && p.userData?.kind !== 'box' && p.userData?.kind !== 'scale') p = p.parent;
      if (p?.userData.kind === 'box') return userDropOn(p, target.point);
    }
    return userDropOn(target.thing, target.point);
  }
  if (target.kind === 'hole') {
    if (!held) return say('That hole is empty.');
    return userPutInHole(target.box.userData.holes[target.index]);
  }
}

// Inside the thought bubble the user directs the robot -- and a robot can only
// speak about the thing it was given, so anything else is off limits.
function directRobot(target) {
  const st = target.kind === 'station' ? stations[target.id] : null;
  if (st?.kind === 'stack') {
    if (held) return say('It is already holding something.');
    if (st.id === 'minis') return say('It cannot make robots.');
    return go({ type: st.id === 'boxes' ? 'newBox' : st.id === 'scales' ? 'newScale'
              : st.id === 'texts' ? 'newText' : st.id === 'nests' ? 'newNest'
              : st.id === 'rooms' ? 'newRoom' : st.id === 'dice' ? 'newDie'
              : 'newNumber' });
  }
  const c = st ? containerOfStation(st.id) : null;
  // The robot uses the copier exactly the way the user does: holding something,
  // it walks over and sets it on the platform; empty-clawed, it takes the copy
  // from the tray, or failing that the original back off the platform.
  if (c === 'in' || c === 'out') {
    if (held) {
      if (stations.copyIn.occupant) return say('Take the original off the platform first.');
      if (stations.copyOut.occupant) return say('The tray still has a copy in it.');
      return go({ type: 'put', at: { c: 'in', path: [] } });
    }
    // take from the surface actually clicked, falling back to the other
    const prefer = stationOf(c).occupant ? c : (c === 'in' ? 'out' : 'in');
    if (!stationOf(prefer).occupant) return say('The copier is empty.');
    return go({ type: 'take', at: { c: prefer, path: [] } });
  }
  if (c) {
    if (held) {
      if (st.occupant?.userData.kind === 'box') return say('Click one of its holes.');
      return go({ type: 'put', at: { c, path: [] } });
    }
    if (!st.occupant) return say('Nothing there.');
    return go({ type: 'take', at: { c, path: [] } });
  }
  if (target.kind === 'thing' || target.kind === 'hole') {
    // the top of a pile on a nest: the robot takes deliveries one at a time,
    // exactly as the user does
    if (!held && target.kind === 'thing') {
      const pn = allNests.find(n2 => n2.userData.pile.includes(target.thing));
      if (pn) {
        const a = addrOf(pn);
        if (!a) return say('The robot can only touch what it was given and its own work area.');
        // the top delivery alone, or -- grabbing lower -- the nest itself
        const top = pn.userData.pile[pn.userData.pile.length - 1] === target.thing;
        return go({ type: 'take', at: { c: a.c, path: a.path, nest: top } });
      }
    }
    const at = target.kind === 'hole'
      ? (() => { const a = addrOf(target.box); return a && { c: a.c, path: a.path.concat(target.index) }; })()
      : addrOf(target.thing);
    if (!at) return say('The robot can only touch what it was given and its own work area.');
    // a click on whatever sits on the copier means "use the machine" here too
    if (held && (at.c === 'in' || at.c === 'out') && !at.path.length) {
      return directRobot({ kind: 'station', id: 'copyIn' });
    }
    // held box aimed at a box's contents means the box (see userClick)
    if (held?.userData.kind === 'box' && target.kind === 'thing'
        && target.thing.userData.kind !== 'box' && at.path.length) {
      const parent = thingAt({ c: at.c, path: at.path.slice(0, -1) });
      if (parent?.userData.kind === 'box') {
        const side = target.point ? sideOf(parent, target.point) : 'R';
        return go({ type: 'put', at: { c: at.c, path: at.path.slice(0, -1) }, side });
      }
    }
    if (held) {
      const side = target.kind === 'thing' && target.point
        ? sideOf(target.thing, target.point) : 'R';
      return go({ type: 'put', at, side });
    }
    return go({ type: 'take', at });
  }
  say('The robot can only touch what it was given, or make a new number or box.');
}

// --- the user's own hand ---------------------------------------------------
// Outside the thought bubble the robot does nothing: the user moves things
// themselves. What they are carrying simply follows the pointer -- an invisible
// hand -- rather than being mimed by the robot.
const handNode = new THREE.Object3D();
scene.add(handNode);
scene.add(topCtx.root);
scene.add(benchRoot);
const handPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function moveHand(ev, hoverY = null) {
  if (!reachLocal) return;
  // Only just above working height: the higher this plane, the further the
  // carried thing drifts from whatever you clicked, since the camera looks in
  // at an angle. But a tall pile would swallow whatever you took off it, so
  // the hand rides up to meet whatever the pointer is actually over.
  const base = reachLocal.y + 0.15;
  handPlane.constant = -Math.min(base + 2.4,
    Math.max(base, hoverY == null ? base : hoverY + 0.07));
  const ndc = new THREE.Vector2((ev.clientX / innerWidth) * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.ray.intersectPlane(handPlane, new THREE.Vector3());
  if (hit) {
    // Clamp to the working area: with the pointer low on the screen the ray
    // meets this plane right next to the camera, which made the carried thing
    // balloon to fill the view.
    // a grabbed corner may range wider than a carried thing; a grown table
    // widens the carrying range with it
    const wide = grabbedCorner !== null;
    const xMax = wide ? 4.2 : Math.max(3.2, BENCH.x1 + 0.3);
    const xMin = wide ? -3.2 : Math.min(-3.2, BENCH.x0 - 0.3);
    const zMax = wide ? 3.4 : Math.max(2.4, BENCH.z1 + 0.25);
    hit.x = Math.min(xMax, Math.max(xMin, hit.x));
    hit.z = Math.min(zMax, Math.max(-0.6, hit.z));
    handNode.position.copy(hit);
    handNode.updateMatrixWorld();
    if (wide) dragCorner(hit);
  }
}
function takeIntoHand(obj) {
  // start from where the thing actually is, so it rises into the hand instead
  // of jumping there
  const fromWorld = obj.getWorldPosition(new THREE.Vector3());
  held = obj;
  // Stack items are tagged as the stack so the whole column is clickable; once
  // one is taken it has to become a thing in its own right, or clicking it
  // later just dispenses another from the stack.
  setPick(obj, obj.userData.kind === 'robot'
    ? { kind: 'botThing', bot: obj.__bot }
    : { kind: 'thing', thing: obj });
  sfx('pick');
  noteHeld();
  handNode.add(obj);
  obj.position.set(0, 0, 0);
  obj.quaternion.identity();
  obj.scale.setScalar(obj.userData.kind === 'robot' ? MINI : 1);
  // centre on the hand by bounding box: birds, nests, scales and rooms have
  // their origin at the base and otherwise ride high above the pointer
  obj.updateMatrixWorld(true);
  const bb = new THREE.Box3().setFromObject(obj);
  if (isFinite(bb.min.y) && isFinite(bb.max.y)) {
    const c0 = new THREE.Vector3();
    bb.getCenter(c0);
    handNode.worldToLocal(c0);
    // clamp: a nest with a tall pile would otherwise push its box right
    // under the table
    obj.position.y -= Math.max(-0.35, Math.min(0.35, c0.y));
  }
  enqueueNext(settleInto(obj, fromWorld, 0.24));
  refreshUI();      // the "holding" readout must track every pickup
}
// Holding a wordy pad up to the light: it turns to face you, big enough to
// read, and goes back to the hand when you are done.
let reading = null;
function toggleReading() {
  if (reading) {
    const r = reading; reading = null;
    r.node.scale.setScalar(r.scale);
    if (r.node === held) { r.node.position.set(0, 0, 0); r.node.quaternion.identity(); }
    refreshUI();
    return;
  }
  if (held?.userData.kind !== 'text') return say('Hold a text pad to read it.');
  reading = { node: held, scale: held.scale.x };
  refreshUI();
}
function placeReading() {
  if (!reading) return;
  const node = reading.node;
  if (node !== held || !node.parent) { reading = null; return; }
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  const at = camera.position.clone().addScaledVector(dir, 0.62);
  node.parent.updateMatrixWorld();
  node.position.copy(node.parent.worldToLocal(at.clone()));
  // the writing is on the pad's top face, so its +Y must point at the camera
  const m = new THREE.Matrix4().lookAt(at, camera.position, camera.up);
  const q = new THREE.Quaternion().setFromRotationMatrix(m)
    .multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -Math.PI / 2));
  const pq = new THREE.Quaternion();
  node.parent.getWorldQuaternion(pq);
  node.quaternion.copy(pq.invert().multiply(q));
  node.scale.setScalar(1.5);

document.getElementById('held')

// --- the user acting directly (no robot involved) --------------------------

}

function userPutInHole(hole) {

// Hand whatever is being carried to the robot. An untrained robot takes this as
// its lesson; a trained one takes it as the thing to work on.
function giveToRobot() {
  const stand = stations.stand;
  if (!activeBot) return say('No robot is at the bench.');
  if (stand.occupant) return say('It already has something — take that first.');
  clearFlags();      // a new given thing makes the old mismatch marks stale
  const thing = held; held = null;
  sfx('drop');
  putOnStation(stand, thing);
  const from = thing.getWorldPosition(new THREE.Vector3());
  enqueueNext(settleInto(thing, from, 0.5));
  if (!program.length) enterTraining();
  else {
    refreshUI();

    // and the thing is on its desk, it gets to work

  }
}

// A mini robot grows to full size, walks behind the bench, and takes what the
// user is dropping on it.
function activateBot(bot, after) {
  clearUndo();
  busy = true;
  addMiniBubble(bot.node, null);   // the full-size bubble takes over
  detach(bot.node);
  WROOT.attach(bot.node);
  bot.home = HOME;                       // it takes the middle
  bot.stand = defaultStand;
  bot.root.position.set(0, 0, 0);
  bot.root.scale.setScalar(1);
  const from = bot.node.position.clone();
  const fromScale = bot.node.scale.x;
  // Whatever you dropped on it goes to the work platform straight away, in the
  // same breath as the robot growing -- waiting for the robot to arrive and
  // then flicking the box across reads as two events, and it is one.
  const gift = held && held.userData.kind !== 'robot' ? held : null;
  let giftFrom = null, giftTo = null;
  if (gift) {
    held = null;
    clearFlags();
    sfx('drop');
    const fromW = gift.getWorldPosition(new THREE.Vector3());
    putOnStation(bot.stand, gift);
    giftTo = gift.position.clone();
    giftFrom = gift.parent.worldToLocal(fromW);
    gift.position.copy(giftFrom);
  }
  // A team crosses the floor together. Leaving the members to snap into place
  // after the leader had arrived made them look like scenery rather than like
  // robots that came with it.
  const marchers = bot.team.map((m, i) => {
    const n = m.node;
    const start = n.parent ? n.getWorldPosition(new THREE.Vector3()) : null;
    WROOT.add(n);
    if (start) n.position.copy(WROOT.worldToLocal(start));
    else n.position.copy(from);
    return { m, node: n, from: n.position.clone(), to: teamSlot(i + 1, bot), s0: n.scale.x };
  });
  enqueue({
    dur: 0.9,
    update(t) {
      const e = ease(t);
      bot.node.scale.setScalar(lerp(fromScale, 1, e));
      bot.node.position.set(lerp(from.x, 0, e), lerp(from.y, 0, e), lerp(from.z, 0, e));
      if (gift) {
        gift.position.lerpVectors(giftFrom, giftTo, e);
        gift.position.y += 0.18 * Math.sin(Math.PI * e);      // a gentle arc over
      }
      for (const w of marchers) {
        w.node.position.lerpVectors(w.from, w.to, e);
        w.node.scale.setScalar(lerp(w.s0, MINI, e));
      }
    },
    end() {
      bot.node.position.set(0, 0, 0); bot.node.scale.setScalar(1); bot.node.rotation.y = 0;
      if (gift) gift.position.copy(giftTo);
      for (const w of marchers) { w.node.position.copy(w.to); w.node.scale.setScalar(MINI); }
    },
  });
  enqueue(doNow(() => {
    bindBot(bot);
    setPick(bot.node, { kind: 'botThing', bot });   // stack minis carry the stack's tag
    parkRobot();
    renderProgram(); rebuildCondition();
    busy = false;
    if (gift) {
      // it is already on the platform: all that is left is what to do about it
      if (!program.length) enterTraining();
      else {
        say('It has something to work on.');
        enqueue(pause(0.3), doNow(() => { if (mode === 'world' && !busy) runProgram(); }));
      }
    }
    if (after) after();
    refreshUI();
  }));
}

// The active robot shrinks and steps onto the table by itself, making room
// for another. Unlike miniaturizeActive it never touches your hand -- you are
// already carrying the thing you meant to hand over.
// A team on the table is not one robot keeping a secret: they all stand there,
// the leader in front and the rest lined up beside it, each with its own small
// thought. Click any of them to take it out of the team; drop a robot on the
// leader to add one back.
const benchTeamShown = new Set();
function teamLeaderOf(bot) {
  if (activeBot?.team.includes(bot)) return activeBot;
  for (const t of benchThings) {
    if (t.userData?.kind === 'robot' && t.__bot?.team.includes(bot)) return t.__bot;
  }
  return null;
}
function layoutBenchTeams() {
  if (offstage()) return;
  const keep = new Set();
  for (const t of benchThings) {
    if (t.userData?.kind !== 'robot' || t.__bot === activeBot) continue;
    const lead = t.__bot;
    if (!lead || !lead.team.length) continue;
    // A queue, not a row: the leader stands at the front and the rest line up
    // behind it. If the line would run off the back of the table, the whole
    // queue -- leader included -- steps forward to make room.
    const gap = 0.28, depth = gap * lead.team.length;
    if (t.position.z - depth < BENCH.z0 + 0.12) {
      t.position.z = Math.min(BENCH.z1 - 0.12, BENCH.z0 + 0.12 + depth);
    }
    lead.team.forEach((m, i) => {
      const n = m.node;
      if (n === held) return;
      if (n.parent !== benchRoot) benchRoot.add(n);
      n.position.set(t.position.x, t.position.y, t.position.z - gap * (i + 1));
      n.quaternion.copy(t.quaternion);
      n.scale.setScalar(MINI);
      m.root.position.set(0, 0, 0);
      addMiniBubble(n, m.program.length ? m.condition : null);
      setPick(n, { kind: 'botThing', bot: m });
      keep.add(n);
    });
  }

  // are not the bench's to sweep away
  if (activeBot) for (const m of activeBot.team) keep.add(m.node);
  for (const n of benchTeamShown) if (!keep.has(n)) n.removeFromParent();
  benchTeamShown.clear();
  keep.forEach(n => benchTeamShown.add(n));
}
// Send one robot of the team back to its place in the queue. layoutTeam does
// this for the whole team when there is somebody watching; inside a house it

function parkInQueue(bot) {
  const i = roster().indexOf(bot);
  if (i < 0 || !bot.node) return;
  bot.node.scale.setScalar(MINI);
  bot.node.position.copy(teamSlot(i));
  bot.node.rotation.y = 0;
  bot.root.position.set(0, 0, 0);
  addMiniBubble(bot.node, bot.program.length ? bot.condition : null);
  setPick(bot.node, { kind: 'botThing', bot });
}
// Taking a member out of the team it belongs to -- the rest close ranks.
function leaveTeam(bot) {
  const lead = teamLeaderOf(bot);
  if (!lead) return false;
  lead.team = lead.team.filter(m => m !== bot);
  benchTeamShown.delete(bot.node);
  if (lead === activeBot) { teamView = 0; renderProgram(); layoutTeam(); }
  return true;
}
function hideTeam(bot) {

  if (bot) addMiniBubble(bot.node, bot.program.length ? bot.condition : null);

function parkActiveAside() {

  if (!bot) return;
  restoreLeaderBody(bot);
  hideTeam(bot);
  cancelWaiting(bot);
  clearUndo();
  syncBot();
  returnGivenToTable();
  clearScratch();
  parkRobot();
  dropStand(bot.stand);
  bot.stand = null; bot.home = HOME;
  bot.root.position.set(0, 0, 0);
  stations.stand = defaultStand;
  activeBot = null; robot = null; root = null;
  program = []; condition = null;
  renderProgram(); rebuildCondition();
  const node = bot.node;
  const from = node.getWorldPosition(new THREE.Vector3());
  busy = true;
  enqueue({ dur: 0.5, update(t) { node.scale.setScalar(lerp(1, MINI, ease(t))); } });
  enqueue(doNow(() => {
    node.scale.setScalar(MINI);
    WROOT.attach(node);
    putOnBench(node, benchSpot());
    addMiniBubble(node, bot.program.length ? bot.condition : null);
    enqueueNext(settleInto(node, from, 0.3));
    busy = false;
  }));
}
// The active robot shrinks into the user's hand, keeping all its training.
// Whoever was performing steps back so the leader is the one you pick up.
function restoreLeaderBody(bot) {
  if (!bot || bodyBot === bot) return;
  parkInQueue(bodyBot);              // whoever was performing steps back
  bot.node.position.set(0, 0, 0);
  bot.node.scale.setScalar(1);
  bot.node.rotation.y = 0;
  addMiniBubble(bot.node, null);      // the big thought is the leader's again
  bindBody(bot);

function miniaturizeActive() {

  clearUndo();
  syncBot();
  returnGivenToTable();
  clearScratch();
  parkRobot();
  dropStand(bot.stand);
  bot.stand = null; bot.home = HOME;
  bot.root.position.set(0, 0, 0);
  stations.stand = defaultStand;
  activeBot = null; robot = null; root = null;
  program = []; condition = null;
  renderProgram(); rebuildCondition();
  busy = true;
  enqueue({
    dur: 0.55,
    update(t) { bot.node.scale.setScalar(lerp(1, MINI, ease(t))); },

  enqueue(doNow(() => {
    takeIntoHand(bot.node);
    say(bot.program.length

// Dropping one trained robot on another forms a team: the one underneath leads,
// the dropped one waits behind for something it recognises.
function formTeam(leader, follower) {
  clearUndo();
  if (!follower.program.length) return say('Train that robot before adding it to a team.');
  if (!leader.program.length) return say('The robot underneath has no training to lead with.');
  held = null;
  follower.node.removeFromParent();
  leader.team.push(follower, ...follower.team);
  follower.team = [];
  flash(leader.node.getWorldPosition(new THREE.Vector3())
    .add(new THREE.Vector3(0, 1.4 * leader.node.scale.x, 0)));
  say(`A team of ${leader.team.length + 1} — each waits for something it recognises.`);
  if (leader === activeBot) layoutTeam();
  renderProgram(); refreshUI();
}

// Everything in the robot's private area is temporary: it is swept away when
// the robot is done, and whatever it was given goes back on the table.
function clearScratch() {
  for (const st of Object.values(stations)) {
    if (st.kind !== 'scratch' && st.kind !== 'copyIn' && st.kind !== 'copyOut') continue;
    if (st.occupant) { st.occupant.removeFromParent(); st.occupant = null; }
  }
  collapseScratch();
}
function returnGivenToTable() {
  const t = stations.stand.occupant;
  if (!t) return;
  const from = t.getWorldPosition(new THREE.Vector3());
  stations.stand.occupant = null;
  putOnBench(t, benchSpot());
  enqueueNext(settleInto(t, from, 0.35));
}

// --- directing the robot (training and replay) -----------------------------
// Every step is relative to the thing the robot was given. Nothing here can
// name a place, which is exactly what makes a trained robot general.
function go(step) {
  pushUndo();
  busy = true;
  // typing is recorded as its own step, just before whatever it applies to
  if (step.type === 'put' && held && held.userData.kind === 'number') {
    const v = held.userData.value, o = held.userData.op;
    // Typing digits fixes a value; typing only an operation must NOT, or a
    // robot shown "take 30, make it minus" would remember "make it -30" and
    // be useless on any other amount. The operation alone is a step of its own.
    if (!ratEq(v, valueAtPickup)) record({ type: 'setValue', value: v, op: o });
    else if (o !== opAtPickup) record({ type: 'setOp', op: o });
  }
  if (step.type === 'put' && held && held.userData.kind === 'box') {
    const n = held.userData.holes.length;
    if (n !== holesAtPickup) record({ type: 'setHoles', n });
  }
  // writing on a pad is a step too -- without it a robot could fetch a blank
  // pad but never a WORD, and a word is how you ask the notebook for something
  if (step.type === 'put' && held && held.userData.kind === 'text'
      && (held.userData.text ?? '') !== (textAtPickup ?? '')) {
    record({ type: 'setText', text: held.userData.text ?? '' });
  }
  record(step);
  runStep(step);
  refreshUI();
}
function runStep(step) {
  if (step.type === 'newNumber') actionNew('number');
  else if (step.type === 'newBox') actionNew('box');
  else if (step.type === 'newScale') actionNew('scale');
  else if (step.type === 'newText') actionNew('text');
  else if (step.type === 'newNest') actionNew('nest');
  else if (step.type === 'newRoom') actionNew('room');
  else if (step.type === 'newDie') actionNew('die');
  else if (step.type === 'take') actionTake(step.at);
  else if (step.type === 'copy') actionCopy(step.at);
  else if (step.type === 'put') actionPut(step.at, step.side);
  else if (step.type === 'vacuum') actionVacuum(step.at);
  else if (step.type === 'setHoles') {
    enqueue({ dur: 0.3, start() { if (held?.userData.kind === 'box') resizeHeldBox(step.n); } });
  } else if (step.type === 'setOp') {
    enqueue({
      dur: 0.35,
      start() { if (held?.setOp) { held.setOp(step.op); flash(held.getWorldPosition(new THREE.Vector3())); } },
      update(t) { if (held) held.scale.setScalar(1 + 0.2 * Math.sin(Math.PI * t)); },
      end() { if (held) held.scale.setScalar(1); refreshUI(); },
    });
  } else if (step.type === 'setText') {
    enqueue({
      dur: 0.35,
      start() { if (held?.setText) { held.setText(step.text); flash(held.getWorldPosition(new THREE.Vector3())); } },
      update(t) { if (held) held.scale.setScalar(1 + 0.15 * Math.sin(Math.PI * t)); },
      end() { if (held) held.scale.setScalar(1); refreshUI(); },
    });
  } else if (step.type === 'setValue') {
    enqueue({
      dur: 0.4,
      start() { if (held) { held.setValue(step.value, step.op); flash(held.getWorldPosition(new THREE.Vector3())); } },
      update(t) { if (held) held.scale.setScalar(1 + 0.26 * Math.sin(Math.PI * t)); },
      end() { if (held) held.scale.setScalar(1); refreshUI(); },
    });
  }
}
function record(step) {
  if (mode !== 'training') return;
  program.push(step);
  renderProgram();
}

// ---------------------------------------------------------------- training
// --- the condition, shown as a thought floating over the thinking pad -------
// A floating ghost '?' used to mark erased parts of a condition.
function ghostQuestion(size = 0.2) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g2 = c.getContext('2d');
  g2.fillStyle = '#dff2ff';
  g2.font = 'bold 96px Georgia, serif';
  g2.textAlign = 'center'; g2.textBaseline = 'middle';
  g2.fillText('?', 64, 70);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return new THREE.Mesh(geo('PlaneGeometry', size, size),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, side: THREE.DoubleSide }));
}
// "anything": its own cloud-with-? shape, so it can never be mistaken for a
// number wildcard.
function makeAnything() {
  const g = new THREE.Group();
  const mat = bubbleMat.clone();
  mat.opacity = 0.4;
  const s = new THREE.Mesh(geo('SphereGeometry', 0.13, 20, 14), mat);
  s.position.y = 0.13;
  g.add(s);
  const q = ghostQuestion(0.2);
  q.position.set(0, 0.13, 0.02);
  g.add(q);
  Object.assign(g.userData, { kind: 'anythingGhost', width: 0.26, rest: 0 });
  return g;
}

function ghostify(root) {
  root.traverse(o => {
    if (!o.isMesh || !o.material) return;
    o.castShadow = false; o.receiveShadow = false;
    // clone first: clones share materials with the model they came from, so
    // ghosting a robot in a thought bubble would ghost every robot there is
    o.material = Array.isArray(o.material) ? o.material.map(m => m.clone()) : o.material.clone();
    (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => {
      m.transparent = true;
      m.opacity = 0.78;
    });
  });
}
function buildCondNode(cond, path, marks) {
  let g;
  if (!cond) g = new THREE.Group();                       // an empty hole
  else if (cond.kind === 'wild') g = makeAnything();
  else if (cond.kind === 'wildNumber') { g = makeNumber(rat(0)); g.setLabel('?'); }
  else if (cond.kind === 'text') g = makeText(cond.text);
  else if (cond.kind === 'wildText') {
    g = makeText('');
    const q = ghostQuestion(0.16);
    q.position.y = 0.14;
    g.add(q);
  }
  else if (cond.kind === 'anyBird') g = makeBird(null);
  else if (cond.kind === 'anyNest') {
    g = makeNest();
    g.__egg.removeFromParent();
    g.userData.hasEgg = false;
  }
  else if (cond.kind === 'anyRobot') {
    g = makeMiniRobot();
    const q = ghostQuestion(0.22);
    q.position.y = 0.48;
    g.add(q);
  }
  else if (cond.kind === 'robot') {
    // a particular robot: it wears its name, and no question mark
    g = makeMiniRobot();
    if (cond.name) { g.__bot.name = cond.name; paintBotName(g.__bot); }
  }
  else if (cond.kind === 'anyRoom') {
    g = makeRoom();
    const q = ghostQuestion(0.22);
    q.position.y = 0.56;
    g.add(q);
  }
  else if (cond.kind === 'anyBox' || cond.kind === 'wildScale') {
    // an erased container: its own blank shape with one floating ?
    g = cond.kind === 'wildScale' ? makeScale() : makeBox(2);
    const q = ghostQuestion(0.22);
    q.position.set(0, cond.kind === 'wildScale' ? 0.34 : 0.2, 0.1);
    g.add(q);
  }
  else if (cond.kind === 'number') g = makeNumber(cond.value, cond.op);
  else if (cond.kind === 'die') g = makeDie(cond.faces);
  else if (cond.kind === 'wildDie') {
    g = makeDie();
    const q = ghostQuestion(0.18);
    q.position.y = 0.24;
    g.add(q);
  }
  else if (cond.kind === 'scaleTilt') {
    // the verdict itself: a scale frozen mid-tip
    g = makeScale();
    g.__tiltLock = cond.tilt;
    g.__pivot.rotation.z = cond.tilt === 'L' ? SCALE_TILT
      : cond.tilt === 'R' ? -SCALE_TILT : 0;
    g.__pans.forEach(p => { p.rotation.z = -g.__pivot.rotation.z; });
  }
  else {
    g = cond.kind === 'scale' ? makeScale() : makeBox(cond.holes.length);
    cond.holes.forEach((h, i) => {
      const child = buildCondNode(h, path.concat(i), marks);
      if (h) putInHole(g.userData.holes[i], child);
      else { child.position.set(0, 0, 0); g.userData.holes[i].anchor.add(child); }
    });
  }
  marks.push([g, path]);

}
// A trained robot on the table (or standing in a room) carries a small
// thought bubble of its own, so its condition is visible at a glance.
function addMiniBubble(node, cond) {
  if (node.__miniBubble) { node.__miniBubble.removeFromParent(); node.__miniBubble = null; }
  if (!cond) return;
  const g = new THREE.Group();
  const inner = buildCondNode(cond, [], []);
  ghostify(inner);
  inner.traverse(o => { delete o.__pick; });
  inner.scale.setScalar(0.5);
  inner.position.y = 0.02;
  g.add(inner);
  const halo = new THREE.Mesh(geo('SphereGeometry', 0.22, 20, 14), bubbleMat.clone());
  halo.material.opacity = 0.14;
  g.add(halo);
  g.position.y = 1.95;
  g.scale.setScalar(1.6);
  g.traverse(o => { delete o.__pick; });
  if (node.__bot?.trainedOn) {
    // every part of the bubble, box included, means "take a copy"
    g.traverse(o => setPick(o, { kind: 'miniCond', bot: node.__bot }));
    setPick(g, { kind: 'miniCond', bot: node.__bot });
  }
  node.add(g);

}
function rebuildCondition() {
  clearFlags();      // the marks live on nodes about to be destroyed
  if (condDisplay) { condDisplay.removeFromParent(); condDisplay = null; }
  if (!condition) { refreshUI(); return; }
  const marks = [];

    dur: 0.7,

      // cross UNDER the table and arrive hidden behind it -- which looked, from
      // where you sit, as though things vanished by themselves.

function snapshotWorld() {

    .filter(s => s.kind !== 'stack')

  // spec could not describe, and nothing in a daydream can touch them

  // describe, so undo moves them about but does not rewind their insides

    ['robot', 'nest', 'bird', 'room'].includes(t.userData.kind)
    ? { bot: t, at: { x: t.position.x, z: t.position.z } }
    : { spec: specOf(t), at: { x: t.position.x, z: t.position.z } });

      return held ? `Mimi the copier — click to have ${who} set that on the platform; a copy drops into the tray.`
        : stations.copyOut.occupant ? 'Mimi the copier — click to take the copy from the tray.'
        : stations.copyIn.occupant ? 'Mimi the copier — click to take the original back.'
        : 'Mimi the copier — put something on her platform and an exact copy drops into the tray.';
    }
    if (st.kind === 'stand') {
      return held && activeBot ? 'The robot’s stand — click to give that to the robot.'
        : 'The robot’s stand — whatever it is given sits here while it works.';
    }
    if (st.kind === 'scratch') return `${st.label[0].toUpperCase()}${st.label.slice(1)} — the robot’s own work spot, swept clean when it finishes.`;
    return null;
  }
  if (t.kind === 'bench') {
    if (held?.userData.kind === 'text' && t.point) {
      const near = benchThings.find(t2 => t2 !== held && t2.userData.kind === 'text'
        && Math.abs(t.point.x - t2.position.x) < 0.45 && Math.abs(t.point.z - t2.position.z) < 0.36);
      if (near) return 'Drop to join the pads — this side decides the order.';
    }
    return held ? 'Your workbench — click to put that down.'
                : 'Your workbench — build here. Robots cannot reach it.';
  }
  if (t.kind === 'marty') {
    return 'Marty the Martian — ask him anything about the workshop, or for a demonstration. Click to talk.';
  }
  if (t.kind === 'dusty') {
    return dustyActive
      ? 'Dusty is awake — click a part of the robot’s thought to vacuum it away.'
      : 'Dusty the vacuum — click to wake him, then click parts of a robot’s thought to erase them.';
  }
  if (t.kind === 'miniCond') {
    return 'Its little thought — click to take a copy of the very thing it was first shown.';
  }
  if (held && (t.kind === 'roomDoor' || t.kind === 'roomRoof'
      || (t.kind === 'thing' && t.thing?.userData.kind === 'room'))) {
    return 'Drop to send that inside — it lands on the desk, and the room’s robot gets to work.';
  }
  if (t.kind === 'roomDoor') {
    return 'The door — click to step inside. Your table and everything on it comes with you; only the robot\u2019s domain changes.';
  }
  if (t.kind === 'exitDoor') {
    return 'The way out — click to step back to where you came from.';
  }
  if (t.kind === 'roomLever') {
    const r = t.room;
    return r?.userData.dirty
      ? 'The switch, up — the robot inside is working. Click to stop it.'
      : (roomHasWorker(r)
         ? 'The switch, down — click to set the robot inside working, up to the Rounds limit.'
         : 'The switch — nothing to run yet: the room needs a robot and something on its desk.');
  }
  if (t.kind === 'roomRoof') {
    return 'The roof — click to switch between solid walls (works instantly, unseen) and glass (you can watch). A robot stopped at the Rounds limit also picks its work back up.';
  }
  if (t.kind === 'ruby') {
    return rubyActive
      ? 'Ruby is awake — click things or thought parts to erase them one step more general.'
      : 'Ruby the eraser — click to wake her; she erases things in place and loosens robot thoughts.';
  }
  if (t.kind === 'cond') {
    return 'The robot’s thought: the shape it must be given before it will run. '
      + (!held && activeBot?.trainedOn
          ? 'Click to take a copy of the very thing it was first shown. '
          : 'Red parts didn’t match. ')
      + 'Dusty can vacuum any part into an anything.';
  }
  if (t.kind === 'botThing') {
    const bot = t.bot, trained = bot.program.length;
    const teamNote = bot.team.length ? ` It leads a team of ${bot.team.length + 1}.` : '';
    const who = bot.name ? `“${bot.name}”` : 'The robot';
    if (bot === activeBot) {
      return held
        ? (trained ? 'Click to give it that to work on.' : 'Click to give it that — that starts its training.')
        : `${who} at the bench${trained ? ` (${trained} steps trained).` : ' — untrained.'} Click to shrink it into your hand.${teamNote}`;
    }
    if (held?.userData.kind === 'robot') {
      return 'Drop to form a team — each pass, the first member that recognises the thing runs.';
    }
    if (held) return activeBot ? 'Another robot is already at the bench.'
      : 'Drop that on it: it wakes, grows, and takes it — training if it is untrained.';
    if (trained) {
      const lines = bot.program.slice(0, 8).map((st2, i) => `${i + 1}. ${describe(st2)}`);
      if (bot.program.length > 8) lines.push(`… and ${bot.program.length - 8} more`);
      return `${bot.name ? `“${bot.name}” — runs` : 'Runs'} on ${condText(bot.condition)}:\n${lines.join('\n')}${teamNote ? '\n' + teamNote.trim() : ''}\nClick to pick it up.`;
    }
    return 'A little robot, untrained — click to pick it up.';
  }
  if (t.kind === 'thing') {
    const ud = t.thing.userData;
    if (ud.kind === 'number') {
      if (held?.userData.kind === 'number') {
        const o = held.userData.op, hv = ratShort(held.userData.value), tv = ratShort(ud.value);
        return 'Drop to ' + (o === '+' ? `add ${hv} to ${tv}` : o === '-' ? `subtract ${hv} from ${tv}`
          : o === '*' ? `multiply ${tv} by ${hv}` : o === '/' ? `divide ${tv} by ${hv}`
          : o === 'mod' ? `leave what is left of ${tv} after taking ${hv}s away`
          : o === 'set' ? `make ${tv} into ${hv}`
          : `raise ${tv} to the power ${hv}`) + '.';
      }
      if (held?.userData.kind === 'die') {
        return `Drop the die to re-roll this number — it becomes anything from 1 to ${held.userData.faces}.`;
      }
      if (held?.userData.kind === 'text') {
        const chars = [...(held.userData.text ?? '')];
        if (!chars.length) return 'That pad is blank — write on it first.';
        const v = ud.value;
        return (v.d === 1n && v.n >= 1n && v.n <= BigInt(chars.length))
          ? `Drop the pad to pick out its letter ${v.n}: “${chars[Number(v.n) - 1]}”.`
          : `Drop a pad on a whole number from 1 to ${chars.length} to pick out that letter.`;
      }
      const OPW = { '+': 'adds itself to', '-': 'subtracts itself from', '*': 'multiplies',
                    '/': 'divides', '^': 'raises the power of' };
      return `${ratShort(ud.value)} — dropped on a number, it ${OPW[ud.op]} it. Click to pick it up; then type digits or + − * / ^.`;
    }
    if (ud.kind === 'box') {
      if (held?.userData.kind === 'robot') {
        if (!ud.holes.length) {
          return 'A box with no holes is a mould — drop the team on it and it comes apart, one robot to a hole.';
        }
        const h = holeUnder(t.thing, t.point);
        const i = h ? ud.holes.indexOf(h) + 1 : 0;
        return h && !h.thing ? `Drop the robot into hole ${i} — it lies down inside.`
          : 'Every hole is taken — empty one first.';
      }
      return `A box with ${ud.holes.length} hole${ud.holes.length > 1 ? 's' : ''} — a hole holds anything: numbers, pads, boxes, even a robot.`
        + (held ? ' Click a hole to fill it.' : ' Click to pick it up.');
    }
    if (ud.kind === 'scale') {
      return 'A scale — put a number in each of its two holes and it tips toward the larger.'
        + (held ? ' Click a hole to fill it.' : ' Click to pick it up.');
    }
    if (ud.kind === 'text') {
      const txt = ud.text ?? '';
      if (!held && txt.length > 24) {
        return txt.length > 700 ? txt.slice(0, 700) + '…' : txt;
      }
    }
    if (ud.kind === 'nest') {
      if (ud.hasEgg) return 'A nest with an egg — set it on the table and watch.';
      if (ud.pile.length) return `A nest with ${ud.pile.length} deliver${ud.pile.length > 1 ? 'ies' : 'y'} — the top is the oldest; click to take it.`;
      return 'An empty nest — its bird delivers here.';
    }
    if (ud.kind === 'bird') {
      return held ? 'Give it to the bird — she flies it home to her nest.'
                  : 'A bird — drop something on her to send it to her nest, or click to pick her up.';
    }
    if (ud.kind === 'die') {
      return `A die — drop it on a number and the number re-rolls to anything from 1 to ${ud.faces}; the die is spent in the throw. Click to pick it up, then type to change its faces.`;
    }
    return null;
  }
  if (t.kind === 'hole') {
    const pan = t.box?.userData.kind === 'scale';
    const occ = t.box?.userData.holes?.[t.index]?.thing;
    const what = !occ ? 'empty'
      : occ.userData.kind === 'number' ? `holds ${ratText(occ.userData.value)}`
      : `holds a ${occ.userData.label || occ.userData.kind}`;
    return `${pan ? 'Pan' : 'Hole'} ${t.index + 1} — ${what}.`
      + (held && !occ ? ' Click to put that in.' : '');
  }
  return null;
}

// ---------------------------------------------------------------- load
// Served as ordinary files, the models sit beside the page and are fetched.
// A packed build (build_artifact.py) puts their bytes in __TT_MODELS instead
// and they are parsed straight out of memory: a published artifact may not
// fetch anything at all, not even from a data: URI of its own making.
function loadModel(name, onLoad) {
  const loader = new GLTFLoader();
  const packed = window.__TT_MODELS?.[name];
  if (!packed) return loader.load(name, onLoad);
  const bin = atob(packed);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  loader.parse(bytes.buffer, '', onLoad);
}

const cornerOf = (i) => new THREE.Vector3(i % 2 ? BENCH.x1 : BENCH.x0, BENCH_TOP,

// small canvas painters, one per material family
function speckTexture(w, base, marks, n, mk) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = w;
  const c = cv.getContext('2d');
  c.fillStyle = base; c.fillRect(0, 0, w, w);
  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < n; i++) mk(c, rnd, w, marks);
  const tex = new THREE.CanvasTexture(cv);
  // these little canvases are painted in sRGB, and saying so is the difference
  // between kraft board and washed-out cream -- straw, leather and stucco were
  // all being read as linear and coming out pale
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;

// ---------------------------------------------------------------- loop
let last = performance.now();
renderer.setAnimationLoop((now) => {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (worldReady) {
    if (speed === Infinity) { fastForward(); advanceWorldClocks(dt); }
    else tick(dt * speed);
  }
  placeReading();          // a pad held up to read stays facing the camera
  if (condDisplay) {
    condDisplay.position.lerp(condAnchor(), Math.min(1, dt * 7));
    // the red mismatch marks pulse until something actually changes -- fading
    // them on a timer left the user with a message about parts they could no
    // longer see
    if (flagged.length) {
      flagTime += dt;
      const pulse = 0.7 + 0.9 * Math.abs(Math.sin(flagTime * 5));
      for (const f of flagged) f.m.emissiveIntensity = pulse;
    }
  }
  // numbers near the camera redraw with more digits and a finer canvas
  lodClock += dt;
  if (lodClock > 0.5) {
    lodClock = 0;
    let lazyBudget = 30;
    for (let i = allNumbers.length - 1; i >= 0; i--) {
      const nmb = allNumbers[i];
      if (!nmb.parent) { allNumbers.splice(i, 1); continue; }
      const dist = camera.position.distanceTo(nmb.getWorldPosition(_lodV));
      const tier = dist < 3.6 ? 2 : 1;
      if (tier !== nmb.__lod) { nmb.__lod = tier; nmb.__facesLive = true; nmb.__redraw(); }
      else if (nmb.__facesStale && nmb.visible && dist < 9 && lazyBudget > 0) {
        lazyBudget--;
        nmb.__facesLive = true;
        nmb.__paintSecondary();
      }
    }
  }
  // scales tip toward the larger number, pans staying level
  for (let i = allScales.length - 1; i >= 0; i--) {
    const sc = allScales[i];
    if (!sc.parent) { allScales.splice(i, 1); continue; }
    if (sc.__tiltLock) continue;      // a bubble scale holds its verdict
    const say = scaleTilt(sc);        // one rule for what a scale says
    const targetTilt = say === 'L' ? SCALE_TILT : say === 'R' ? -SCALE_TILT : 0;
    const piv = sc.__pivot;
    piv.rotation.z += (targetTilt - piv.rotation.z) * Math.min(1, dt * 5);
    sc.__pans.forEach(p => { p.rotation.z = -piv.rotation.z; });
  }
  // Dusty visibly awake: he sways and breathes until he is put back to sleep
  if (dusty) {
    if (dustyActive) {
      dustyBase ??= { y: dusty.rotation.y, s: dusty.scale.x };
      dustyT += dt;
      dusty.rotation.z = Math.sin(dustyT * 5) * 0.09;
      dusty.rotation.y = dustyBase.y + Math.sin(dustyT * 3.3) * 0.28;
      dusty.scale.setScalar(dustyBase.s * (1 + 0.035 * Math.sin(dustyT * 7)));
    } else if (dustyBase) {
      dusty.rotation.z = 0;
      dusty.rotation.y = dustyBase.y;
      dusty.scale.setScalar(dustyBase.s);
      dustyBase = null; dustyT = 0;
    }
  }
  // rooms with pending work run the moment the outer world goes quiet
  if (worldReady && !busy && !held && !queue.length && !current && mode === 'world') {
    processDirtyRooms();
  }
  if (ruby) {
    if (rubyActive) {
      rubyBase ??= { y: ruby.rotation.y, s: ruby.scale.x };
      rubyT += dt;
      ruby.rotation.z = Math.sin(rubyT * 6) * 0.14;
      ruby.rotation.y = rubyBase.y + Math.sin(rubyT * 2.8) * 0.3;
      ruby.scale.setScalar(rubyBase.s * (1 + 0.04 * Math.sin(rubyT * 8)));
    } else if (rubyBase) {
      ruby.rotation.z = 0;
      ruby.rotation.y = rubyBase.y;
      ruby.scale.setScalar(rubyBase.s);
      rubyBase = null; rubyT = 0;
    }
  }
  bubbleNow += (bubbleTarget - bubbleNow) * Math.min(1, dt * 4);
  bubbleMat.opacity = BUBBLE_OPACITY * bubbleNow;
  bubble.visible = bubbleNow > 0.01;
  for (let i = flashes.length - 1; i >= 0; i--) {
    const f = flashes[i];
    f.t += dt / 0.45;
    f.m.scale.setScalar(1 + f.t * 1.7);
    f.m.material.opacity = 0.55 * (1 - f.t);
    if (f.t >= 1) { scene.remove(f.m); flashes.splice(i, 1); }
  }
  orbit.update();
  renderer.render(scene, camera);
});

  return [[v.z - z0, new THREE.Vector3(v.x, 0, z0)],

  if (offstage()) return martySay('Step back out through the tall door first — I demonstrate on the big table.');
  if (mode !== 'world' || busy) return martySay('Wait for the robot to finish, then ask me again.');
  if (held) return martySay('Set down what you are holding first, then ask me again.');

  martyStopFlag = false;
  martyPendingDemo = null;

  // let him get there first, or his first props land wherever he happened to
  // be as he walked past
  await martyWalk(martySpot);

    const steps = demo.steps;
    for (let i = 0; i < steps.length; i++) {
      const step = steps[i];
      if (step.say) { martySay(step.say); say(step.say, 6000); }
      martyPerforming = true;
      if (step.do) await step.do(ctx);
      await martyIdleWait();
      await new Promise(r => setTimeout(r, step.hold ?? (speed === Infinity ? 150 : 600)));

        await new Promise(res => { martyNextResolve = res; });
        martyNextResolve = null;

  } catch (e) {
    martySay('Hm — that did not go as I meant. (' + e.message + ')');
  } finally {
    martyBusyDemo = false;
    martyPerforming = false;
    martyLiftTarget = 0;
    martySpot = null;
    if (mode === 'training') leaveTraining();
    // a stopped demo must not leave its prop in anyone's hand
    if (held && held.parent === martyNode.__hand) {
      const t = held; held = null;
      putOnBench(t, benchSpot());

  }

- The MANUAL below is the truth about this workshop. Answer from it. If it does not say, say you are not sure rather than inventing — you are describing a real program the visitor is looking at.

- NEVER write, design, or plan programs for the visitor, even if they insist. Building it themselves is the whole point. Offer a demonstration of the pieces instead.
- Set "demo" ONLY when the visitor asks to be shown, or asks how something works and words alone would not do. If your words already answer the question, use null — never pick a demo merely because the topic matches. The visitor gets a button to start it, and it plays one narrated step at a time.
- Demos are FIXED scripts — the blurb after each name says exactly what it covers. Offer one ONLY if its blurb covers what was asked; if nothing covers it, set demo to null and say so plainly ("I have no demonstration of that, but here is how it works…"). Never promise a demo will use the visitor's own numbers or words, and never offer a demo you have already given for the same question.
- When showing genuinely beats telling, pick exactly ONE demonstration from this list (use the name on the left): ${Object.entries(MARTY_DEMOS).map(([k, v]) => k + ' — ' + v.blurb).join('; ')}.

function martyOffline(q) {
  const t = q.toLowerCase();
  const table = [
    [/fraction|\bhalf\b|third|quarter|divide|\d\s*\/\s*\d/, 'fractions', 'Every number here is an exact fraction — let me make one.'],
    [/number|add|subtract|multiply|math|mod\b|remainder/, 'numbers', 'Numbers are blocks you type on — let me show you.'],
    [/pad|text|word|write|letter|sentence/, 'pads', 'Words live on text pads — watch.'],
    [/\bbox|hole|mould|mold|split|join/, 'boxes', 'Boxes are how things are kept together — like this.'],
    [/dice|die\b|random|roll/, 'dice', 'Dice are the workshop’s way of choosing at random.'],
    [/scale|weigh|compare|balance|bigger|larger/, 'scales', 'A scale compares by leaning — look.'],
    [/bird|nest|mail|message|send|deliver/, 'birds', 'Birds carry things home to their nests — watch.'],
    [/robot|train|teach|program|team|repeat|loop/, 'robot', 'You do not write programs here — you train a robot by doing the job once. Let me show you.'],
    [/cop(y|ier)|mimi|duplicate|clone/, 'copier', 'Mimi copies anything exactly — watch.'],
    [/dusty|vacuum|ruby|erase|remove|delete|wildcard/, 'dusty', 'Dusty removes; Ruby erases. The difference matters — look.'],
    [/room|house|world|door|roof|lever|smoke/, 'rooms', 'A room is a little world of its own — like this.'],
    [/notebook|file|save|library|page|look.?up/, 'notebook', 'The notebook is your library — and the robots’ too.'],
  ];
  for (const [re, demo, line] of table) if (re.test(t)) return { say: line, demo };
  return { say: 'Without a key I only know my demonstrations — ask me about: ' +
    Object.keys(MARTY_DEMOS).join(', ') + '. In a Claude artifact, or with an API key in my panel, I can really talk.', demo: null };
}

    const sealed = e instanceof TypeError || /fetch|network|load failed/i.test(e.message || '');

      ? 'No signal reaches Mars from this page — it is sealed and cannot call out. '
        + 'My phrasebook it is, then; the demonstrations are all still real.'
      : 'I could not reach the mothership — ' + e.message + '. Check the key in my panel?');

      // machinery: pull the words out of whatever arrived

        ? say[1].replace(/\\n/g, ' ').replace(/\\"/g, '"').replace(/\\\\/g, '\\').trim()

                    { role: 'assistant', content: JSON.stringify({ say: text, demo: demo ?? null }) });

    const q = document.getElementById('martyIn').value.trim();
    if (!q) return;
    document.getElementById('martyIn').value = '';
    if (martyBusyDemo) martyStopDemo();      // a new question ends the show
    // "show me X" starts a demonstration directly, whatever brain he has
    const m = q.toLowerCase().match(/^(?:show|demo)(?:\s+me)?\s+(?:the\s+)?(\w+)/);
    if (m && MARTY_DEMOS[m[1]]) { martySay(q, 'you'); martySay('Watch!'); setTimeout(() => runMartyDemo(m[1]), 50); return; }
    askMarty(q);
  };
  // typing in Marty's box must not fall through to the workshop's keys
  for (const ev of ['keydown', 'keypress', 'keyup']) {
    martyUI.addEventListener(ev, (e) => e.stopPropagation());
  }
}
window.__marty = { ask: askMarty, demo: runMartyDemo, demos: Object.keys(MARTY_DEMOS),
                   world: martyWorldText, offline: martyOffline, offer: martyOfferDemo,
                   next: () => { if (martyNextResolve) { const r = martyNextResolve; martyNextResolve = null; r(); } },
                   stop: martyStopDemo, brain: martyBrainText,
                   get waiting() { return !!martyNextResolve; },
                   get running() { return martyBusyDemo; },
                   get pos() { return martyNode.position.toArray().map(v => +v.toFixed(2)); } };

window.__nano = {
  THREE, scene, camera, renderer, stations,
  worldOut, worldIn, setThingLabel,
  get ready() { return worldReady; },
  get state() { return { mode, busy, program, queued: queue.length,
    held: held ? (held.userData.kind === 'number'
      ? ratText(held.userData.value) + (held.userData.op === '+' ? '' : ` ${held.userData.op}`)
      : held.userData.kind) : null }; },
  get active() { return activeBot ? { id: activeBot.id, steps: activeBot.program.length,
    team: activeBot.team.length } : null; },
  benchBots() { return benchThings.filter(t => t.userData.kind === 'robot'); },
  clickBot(node) { handleClick({ kind: 'botThing', bot: node.__bot }); },
  clickActive() { if (activeBot) handleClick({ kind: 'botThing', bot: activeBot }); },
  step(dt, n = 1) { for (let i = 0; i < n; i++) tick(dt); },
  settle(max = 9000) { let i = 0; while ((current || queue.length || busy) && i++ < max) tick(1 / 60); return i; },
  draw() { renderer.render(scene, camera); },
  pick(station, path = []) { handleClick({ kind: 'station', id: station }); if (path.length) throw new Error('use pickAt'); },
  click(station) { handleClick({ kind: 'station', id: station }); },
  giveRobot() {
    const bot = activeBot ?? benchThings.find(t => t.userData.kind === 'robot')?.__bot;
    if (bot) handleClick({ kind: 'botThing', bot });
  },
  clickThing(t) { handleClick({ kind: 'thing', thing: t }); },
  clickHole(box, index) { handleClick({ kind: 'hole', box, index }); },
  clickBench(x = 0.3, z = ROW_Z) { handleClick({ kind: 'bench', point: new THREE.Vector3(x, BENCH_TOP, z) }); },
  scratch() { return Object.values(stations).filter(s2 => s2.kind === 'scratch').map(s2 => s2.occupant); },
  handPos() { return handNode.position.toArray().map(n => +n.toFixed(2)); },
  heldPos() { return held ? held.getWorldPosition(new THREE.Vector3()).toArray().map(n => +n.toFixed(2)) : null; },
  mine(path = []) { return thingAt({ c: 'given', path }); },
  at(c, path = []) { return thingAt({ c, path }); },
  bench(i = 0) { return benchThings[i]; },
  type(v, op) { if (held) { held.setValue(rat(v), op); refreshUI(); } },
  setOp(op) { if (held) { held.setOp(op); refreshUI(); } },
  speed(s) { speed = s === 'inf' ? Infinity : s; document.getElementById('speed').value = s; },
  rounds(n) { maxIter = n; document.getElementById('rounds').value = n; },
  reset() { clearUndo(); if (mode === 'training') leaveTraining(false); resetWorld(); },
  exit() { leaveTraining(); },
  run() { runProgram(); },
  dusty(on = true) { dustyActive = on; if (on) rubyActive = false; refreshUI(); },
  rubyOn(on = true) { rubyActive = on; if (on) dustyActive = false; refreshUI(); },
  erase(path) { dustyErase(path); },
  clickCond(path = []) { handleClick({ kind: 'cond', path }); },
  clickRaw(target) { handleClick(target); },
  get hatchN() { return hatching.length; },
  get st() {
    return { mode, busy, held: held?.userData.kind ?? null,
      active: activeBot ? activeBot.program.map(s2 => s2.type) : null,
      queue: queue.length, waiters: waiters.size };
  },
  get flagged() { return flagged.length; },
  save(name) { saveRobot(name); },
  load(name) { loadRobot(name); },
  library() { return Object.keys(loadLibrary()); },
  holes(n) { if (held?.userData.kind === 'box') resizeHeldBox(n); },
  get condition() { return condition; },
  get condText() { return condText(condition); },
  words(n, d = 1) { return englishText(rat(BigInt(n), BigInt(d))); },
  say(c) { return condText(c); },
  get hint() { return document.getElementById('hint').textContent; },
  dump() {
    const d = (t) => !t ? null
      : t.userData.kind === 'number'
        ? ratText(t.userData.value) + (t.userData.op === '+' ? '' : ` ${t.userData.op}`)
      : t.userData.kind === 'robot' ? 'robot'
      : t.userData.kind === 'text' ? { text: t.userData.text }
      : t.userData.kind === 'notebook' ? { notebook: t.userData.pages.length }
      : t.userData.kind === 'room' ? { room: { has: !!(t.__ctx || t.userData.world), dirty: !!t.userData.dirty } }
      : t.userData.kind === 'bird' ? 'bird'
      : t.userData.kind === 'die' ? { die: t.userData.faces }
      : t.userData.kind === 'nest' ? { nest: t.userData.pile.map(d) }
      : { [t.userData.kind]: t.userData.holes.map(h => d(h.thing)) };
    return { stand: d(stations.stand.occupant), bench: benchThings.map(d),
             copyIn: d(stations.copyIn.occupant), copyOut: d(stations.copyOut.occupant) };
  },
};
</script>
