<script type="text/plain" id="martyManual">
## ToonTalk 3D

A workshop where you teach little robots by showing them what to do —
and everything, even a whole workshop, is a thing you can pick up.

Open the workshop ->

## The basics

Moving around
Drag with the left mouse button held to orbit the camera around the
workshop; scroll to zoom in and out (numbers show more digits and more
of their faces up close); drag with the right button to slide sideways.
On a touchpad: one-finger drag orbits, pinch zooms, two-finger drag slides.

Handling things
You do everything with single clicks: click a thing to pick it up, and
it follows your pointer; click where you want it to set it down. The row of dark
pedestals in a semicircle behind the robot's work area are stacks — endless
supplies of numbers, text pads, boxes, scales, nests, rooms and little robots.
Click a stack to take the top one.

The wooden table in front is your workbench. Robots can never reach it —
that is the point: what you build there is yours until you hand it over.

Everything in the manual's little windows below is the real
workshop — click things, carry them, try it.

## Numbers

Numbers come off their stack as 1s. While holding one, type digits to
set its value, - to make it negative, and * /
^ to choose what it does when dropped on another number
(adding is the default — and adding a negative is subtraction).
Dropping a number on a number combines them: the arriving one applies its
operation. Division gives exact fractions, never rounded decimals.

A number block shows its value on the front and top; walk the camera close
and the other faces show the same value in English words, scientific notation,
and decimal form — with a bar over a repeating part when it fits. Fractions get
words too: 1/6 reads one sixth, 3/4 three
quarters, 7/2 seven halves.

Try it: drop the 6 on the 1/2 to add them. Pick
up the ×3 and drop it on the result. Take fresh 1s from the stack and
type digits while holding them.

Two operations have names rather than signs, because nothing says an
operation has to be one character. Type mod on
a held number and it will leave what is left over — 17 dropped on… rather, drop
a mod 5 on 17 and 2 remains. Type set
and it simply replaces whatever it lands on. The letters need not be typed
cleanly: as soon as the last few you typed spell a name, the number takes it.

## Text pads

Text pads are paper for words. Type on a held pad to write (Enter
for a new line, Ctrl+V pastes). Drop one pad on
the left edge of another and it reads first; on the right edge
and it reads last — "Talk" dropped on the right of "Toon" makes "ToonTalk".
A whole number dropped on a written pad shifts its first or last letter along
the alphabet; on a blank pad, the number writes itself out as digits.

The other way round picks letters out: drop a pad on a whole number
and that number chooses a letter — "Talk" dropped on a 2 leaves a pad
reading "a". The number is spent saying which letter you meant.

Try it: pick up "Talk" and drop it on the right edge
of "Toon". Take a 1 from the number stack, type 2, and drop it on a
pad's left edge to shift a letter — or drop a pad on it to pick out letter 2.

## Boxes and scales

Boxes have holes, and holes hold anything — numbers, pads, nests, other
boxes, even little robots (they lie down inside). Type a digit while holding a
box to give it that many holes; type 0 and you have an empty box,
which joins onto another box without changing it. Boxes are arrays: drop a
box on a box to join them — left half to put its holes in front, right half
behind — and shrinking a box splits the extra holes off as a box of their
own.

Drop a box on a whole number and it splits there: a box of five
dropped on a 2 becomes a box of the first two and a box of the rest.
That, with an empty box for the end, is how a robot walks along an array.

Scales have two pans that work exactly like holes; the beam tips toward the
larger number. A robot trained on a scale that is saying something
remembers the tilt, not the numbers: its thought reads "a scale tipping left",
and it fires on any pair that leans that way — which is how a robot chooses
between two paths.

Try it: put the 8 and 9 in the holes. Hold the box and
type 4. Take a second box from the stack and join them.

A box with no holes is a mould. Drop a written pad onto one and it
takes the word apart, one letter to a hole; drop a robot team on one and it
comes apart, one robot to a hole (drop them on each other to make a team
again); and pour a box of letters onto a blank pad to get the word
back. A box that has holes is a container rather than a mould — dropping a
robot into a hole is how a program carries a spare team — so the two never get
in each other's way.

A scale weighs words as well as numbers: the one later in the
alphabet is the heavier, and case is not weight, so "Apple" and "apple"
balance.

## Dice

Dice are where chance comes from. A die does not show a rolled number of its
own — it re-rolls the number it lands on: drop a die on a 1 and the 1
becomes anything from 1 to 6, and the die is spent in the throw, like any pad
you drop. To change the range, hold a die and type: type 20 and you
have a twenty-sided one, and it says so on its faces.

Robots take dice from the stack exactly as you do, so "throw a die into hole
2" is an ordinary step. A team whose members expect different rolled numbers is
a program that branches on chance — that is all the
sentence factory does.

Try it: drop the die on the number and watch it
change. Take a die from the stack, type 20 while
holding it, and roll that one instead.

## Birds and nests

Take a nest from its stack and set it down: the egg hatches into a bird —
they are a pair for life. Give the bird anything and she flies it home
to her nest, tucking new deliveries under the pile so the top is
always the oldest. Click the top of a pile to take one delivery; grab the
tower lower down and you pick up the whole nest, deliveries and all.

Copy a bird on the copier and both birds serve the same nest. Copy a
nest and you have a broadcast: give any of their birds something and
every copy of the nest receives its own copy at once.

Try it: wait for the egg to hatch, then drop the 3 on
the bird and watch the delivery. Give her the 7 next — it goes under.

Two nests dropped together become one. The pile of the nest you are
holding joins the pile below it, and the survivor answers to both names — so
every bird of either nest goes on delivering, to here. That is how you rewire a
program that is already running.

## Robots

Take a mini robot from its stack, set it on the table, and drop something
on it: it grows, steps behind the bench, and its thought bubble opens —
you are now teaching it. Everything you make it do (take things, drop them,
fetch from stacks, use the copier) is remembered as steps about its own
things — "hole 1 of what it was given", never places in your world. Leave
the bubble and the daydream rewinds; the robot keeps the lesson.

Its thought bubble shows the condition: the shape it must be given
before it will run. Give a trained robot something that fits and it gets to
work at once, repeating while the condition still matches, up to the Rounds
limit. Stop does not freeze it mid-move: the round it is in finishes at
once, so nothing is left half done, and Run carries on from there. Drop one trained robot on another to form a team: the members
line up on the floor behind the leader, each with its own small thought over
its head, and whichever one recognises what the team was given walks up to the
desk and does the work while the others wait their turn.

A team stands in a queue — the leader at the front, the rest lined up
behind it, on the table as well as at the desk. Nothing is hidden. Whatever you
hand to a member is handed to the leader: a team has one leader and
one work surface. Click a member to take it out of the team; set it down
and it is a robot of its own again, or drop it on another robot to join that
one. Drop a robot on the leader to add it to the end. Picking the leader up
picks up the whole team.

How a robot says it is finished. A robot that vacuums away the very
box it was working on has ended the team for good — there is nothing left for
any thought to match, and the message says so rather than suggesting you erase
anything. It is worth doing deliberately at the end of a program. A house whose
robot has done that is a house with nobody working and nothing to work on, so
it folds away to nothing, taking whatever is left inside with it. That is how
a recursive program clears up after itself.

A robot in a thought bubble means that robot: one with the same name
and the same lesson. Erase it with Ruby and it becomes "a robot — any one", and
again "anything".

Typing on a number a robot is holding is remembered two ways, and the
difference matters. Type digits and the robot remembers that exact
number. Type only an operation — -,
* and so on — and it remembers "make it subtract",
which then works on whatever number it is handed. That is how one robot can
take away 30 today and 7 tomorrow.

Click the bubble of a robot (big or mini) to take out a copy of the very
thing it was first shown. Type while holding a robot to name it — the name
appears on its chest. To save a robot, hold it and press
Save held thing.

Try it: drop the 5 on the mini robot. In the thought
bubble, click the number stack, then click a work spot; leave the bubble and
it will run. Then erase its thought with Ruby and give it anything.

The little desks beside the robot are its work spots — its own
scratch space, swept clean when it finishes. A spot sizes what you set on it
the way a hole does: something too wide, a box of eight holes say, sits there
smaller rather than hanging over its neighbours, and comes back to full size
the moment it is picked up.

## Mimi the copier

The tall machine at the right end of the arc is Mimi the copier. Set
anything on her upper platform and she scans it; an independent, exact copy
drops into the lower tray — contents, names and all. Click a surface with an
empty hand to take from it (the tray first, then the original). Robots use
Mimi exactly the way you do, which is how a robot copies things mid-program.
She copies anything — a copied bird serves the same nest, a copied
nest joins the flock so deliveries broadcast, and a copied robot arrives with
its training, its name and its whole team. A robot that copies itself
this way and sets the copy to work in a new room is a recursive program.

Try it: set the 7 on Mimi's top platform and watch
the tray. Copy the box too — then put a number in one box and see the other
stays empty: copies are independent.

## Dusty and Ruby

Two helpers live in front of the table. Dusty the vacuum removes:
click him to wake him, then click things to vacuum them away, entries off
notebook pages, or parts of a robot's thought (leaving an empty hole, which
then matches anything). Ruby the eraser generalises: wake her and
click a part of a thought — a 7 becomes any number, then
anything. She also erases real things in place: an erased number
stands for any number, which is how you build a robot's expectations by hand.
Waking one settles the other, and whoever is awake fidgets.

## Rooms

Rooms are little houses that each hold an entire workshop. Drop a
robot on a room and it steps inside, ready behind the desk. Drop anything else
on the room and it lands on that desk — and the robot inside gets to work the
moment your world goes quiet. The chimney smokes while somebody in there is
actually working; a room merely holding unopened deliveries sits quiet.

Click the roof to switch between solid walls (the room works
instantly, unseen) and glass (you watch it work, round by round, at your speed
setting). The big lever on the side wall runs and stops the room: up, the robot
inside works; down, it rests. Click the door to step inside: the room
becomes the world around you, and the world you left shrinks onto the table as
a little room of its own — walk back out through its door. If the room was
running when you opened the door, its robot picks straight back up once it has
grown to full size. Birds fly in and out of rooms to reach their nests, so a
machine in a box can feed a nest on your table.

Robots can build rooms too. A robot may take a room from the stack,
drop a robot in and something for it to work on, and stow the whole house in a
hole of the box it is holding — a machine that builds machines. Rooms inside
rooms work as well, all the way down.

Try it: drop the mini robot on the room, then the 4.
Click the roof to make the walls glass. Click the door to step inside.

## Marty the Martian

The little green fellow beside Dusty and Ruby is Marty. Click him and
ask anything about the workshop — or say "show me birds" (or
fractions, numbers, pads, boxes, dice, scales, robot, copier, dusty, rooms,
notebook) and he demonstrates it right on your table, using the workshop
exactly the way you do — holding the pieces in his own hand.
A demonstration plays one narrated step at a time: Marty walks to the
stack, fetches what he needs, carries it to the table, does one thing, and
waits for you to click Next ▸ — Stop ends it, and so does asking him something else. When
an answer of his suggests a demonstration, you get a Show me
button rather than a surprise performance. He never builds programs for you —
doing it yourself is the whole point.

Marty thinks with whatever brain he has. Without a key his replies are
canned lines from a phrasebook — he can pick the right demonstration, but
he is not really answering. For real conversation open How Marty
thinks in his panel and choose a brain — Claude, ChatGPT or Gemini, and
which model — then paste that provider's API key; it is kept only in this
browser, and he then also sees what is on your table when he answers. Inside a
Claude artifact he needs no key at all. The panel always says which of these
he is using right now.

Whatever brain he has, Marty answers from this manual — the page you
are reading is handed to him with every question, so what he tells you is what
is written here rather than what a model imagines a workshop like this might
do. If the manual does not say, he is asked to admit he is unsure.

Marty can also speak and listen. The 🔊 button has him read his
replies aloud, a little high and quick with a drift between sentences.
How Marty thinks lets you pick which of your browser's voices he uses
— the list puts the ones that speak your language first, since a voice meant
for another language reads English with an accent. The 🎤 button lets you ask by voice, where the browser
offers a microphone — inside a Claude artifact it does not, so there the button
simply is not shown.

## The notebook, saving and sharing

The notebook on your table is a two-page spread. Drop anything on a blank
page to file it; click a filed entry to take out a copy (the page
keeps its own). Drop a written text pad on a full page to open the first page
mentioning that text; a whole number jumps to that page number. Only Dusty can
remove an entry, and a notebook itself only goes when open at two blank pages.
The first page holds a blank notebook — copy it out to make more. The main
notebook remembers everything between visits, and it is furniture: it
stays where it is when you load somebody else's world, because it is your
library, not part of theirs.

Robots can use it too, which is what lets one program use another by
name. A robot fetches a blank pad, writes a name on it, drops it on the
notebook — which opens at whatever that name finds — and takes a copy off the
page. That is the whole of the module system: the same three gestures you would
make yourself.

Save held thing writes whatever is in your hand to a file — a box, a
trained robot, a room with a whole workshop inside. Save world writes
everything. Import file (or dropping a file onto the app) brings either
back: things land in your hand, worlds replace the workshop.

## Example worlds

Finished programs live in the
examples
folder. Download one and use Import file to load it. The last five
are ports of Ken Kahn's own ToonTalk 3 programs, move for move.

Each example is a file in the examples folder, and the file name is worth
knowing — it is what you will be looking at in the folder, and what to call it
when asking Marty: sentence-generator, fibonacci and
fibonacci-recursive, bank-account, grammar,
account (Sally's), swap, factorial,
n-to-1 (the counting-down one), append and
reverse.

The sentence factory (sentence-generator.world.json). A glass room called the Scriptorium holds a team
of twenty robots that roll dice to pick words, join text pads into sentences,
and hand each one to a bird who flies it out to a nest on your table. Pull the
room's lever and the nest fills with lines like "the frog dreams of the
witch." Every mechanism in it is one from this manual: dice for the choice,
team matching for the branch, pads for the words, a bird for the stream.

Fibonacci (fibonacci.world.json and
fibonacci-recursive.world.json). Two of them: one that counts the leaves of the call
tree, and one written exactly as the definition reads — answer 1 for 1 and 2,
otherwise ask fib(n−1) and fib(n−2) and answer their sum, with each call
getting its own house, its own nest and its own bird to reply on. A robot
facing a bare nest simply dozes, so waiting for two answers needs no
machinery at all. The leaf-counting one works like this: given a box holding a number,
it drops a −1 on the number, copies its own box through Mimi twice,
builds two rooms, puts a copy of itself in each, and carries both houses away
in its own box — the two recursive calls. The robots that reach 1 or 2 mail a
single 1 to a shared nest, so counting the letters counts the leaves of
the call tree: for 8, twenty-one of them, from forty rooms nested six deep. A
second robot then adds the pile up.

The bank account (bank-account.world.json). The account sits on the Teller's desk
inside a house, so nothing on the table can reach the balance — the
only way in is to send a request to the bird. A request is a box holding an
amount and a bird to reply to. The Teller weighs what the balance
would be against nothing at all: tipping left or level he banks it
and sends the new balance home with the request's own bird; tipping right he
sends a "not enough money" slip instead. The scale is the whole decision, and
also the whole state — with no scale on the desk only the robot that takes a
request can match, and with one there only the three verdicts can.

The grammar (grammar.world.json). The sentence factory again, except the robots know
nothing about nouns or verbs: the grammar is a dictionary box on the desk.
A symbol is a word (a pad, said as it stands) or a rule (a number, looked
up); each rule keeps its alternatives and a die with one face per
alternative. Four robots run any language you write in those boxes — one
splits the next symbol off the front, one joins a word onto the sentence,
one expands a rule by splitting the dictionary at that number and throwing
its die, and one sends the finished sentence off when nothing is left to
say. Because the noun-phrase rule mentions itself, adjectives pile up:
"pink silly big big boys kick silly silly dogs." Walk in through
the door, edit the dictionary, and the language changes — no robot is
retrained, because none of them ever knew it.

Sally's account (account.world.json). The same idea as the bank, but open on the table so
you can see the whole of it, and message-driven: the account is
[Requests, Balance, Owner] and the first hole is a nest. Drop a
message like ["withdraw", 30] on the bird marked requests and
she carries it there; the robot whose thought carries that word wakes, lifts
the message off, does it, and dozes again — so the nest is bare between
messages and the team waits. The dispatch is nothing but the pattern matching,
and because the owner's name is in every thought, these robots serve Sally's
account and no other.

Swap, and factorial (swap.world.json,
factorial.world.json). Two programs where a balance does the
thinking. Swap is the smallest program here: its thought is "a scale
leaning left", and it puts the two numbers the other way round — after which
the scale leans the other way and it stops, because its thought no longer
matches. Factorial is the same idea kept running: you hand the team
[N, a bird] and the first robot builds the rest in front of you — a
scale with 1 in one pan and N in the other, and "so far" joined onto the left
of its own box. Then one robot counts up while the scale leans, and another
answers when it comes level. Nothing counts rounds; the scale is the only
test.

Lists: counting down, append, reverse — the counting-down one is
n-to-1.world.json, then append.world.json and
reverse.world.json. A list is the pair
[first, the rest], a box with no holes is the empty list, and
"the rest" is usually a nest — an answer that has not arrived yet. Counting
down hands its list over one link at a time, keeping each new nest's bird so
the next link lands inside the promise it just gave away. Append does the same
to join two lists, which is why it keeps working when its first list is still
being computed elsewhere. Reverse is the showpiece: for every link it sends a
box and a copy of the append team into a house of its own, and each house
dozes — smoking gently — until the nest it is watching fills. The last link is
settled first, and the answer unwinds from the end of the list back to the
front.

    if (cond?.kind === 'box') return { kind: 'anyBox' };
    if (cond?.kind === 'scale' || cond?.kind === 'scaleTilt') return { kind: 'wildScale' };
    if (cond?.kind === 'die') return { kind: 'wildDie' };
    if (cond?.kind === 'robot') return { kind: 'anyRobot' };

  const [i, ...rest] = path;

// Unhook a thing from wherever it currently lives.
function detach(thing) {

  for (const n of allNests) {
    const pi = n.userData.pile.indexOf(thing);
    if (pi >= 0) { n.userData.pile.splice(pi, 1); restackNest(n); return; }
  }
  for (const st of Object.values(stations)) if (st.occupant === thing) { st.occupant = null; return; }
  for (const st of allStands) if (st.occupant === thing) { st.occupant = null; return; }

// The bench takes things anywhere on its surface -- it is a work surface, not
// an address.
// A free spot near the one asked for. A saved world laid out on a wider
// table -- or two things aimed at the same place -- would otherwise stack
// invisibly, one thing hiding inside another.
function clearBenchSpot(thing, x, z) {
  if (benchThings.length > 80) return { x, z };      // a crowded table: leave it
  const half = (thing.userData.width || 0.3) / 2;
  const clash = (X, Z) => benchThings.some(o => {
    if (o === thing || !o.parent) return false;
    const oh = (o.userData.width || 0.3) / 2;
    return Math.abs(o.position.x - X) < (half + oh) * 0.8 && Math.abs(o.position.z - Z) < 0.17;
  });
  if (!clash(x, z)) return { x, z };
  const cx = (BENCH.x0 + BENCH.x1) / 2;
  for (let step = 1; step <= 20; step++) {
    const away = x < cx ? -1 : 1;                    // slide toward the near edge
    for (const [dx, dz] of [[step * 0.16 * away, 0], [-step * 0.16 * away, 0],
                            [0, step * 0.19], [0, -step * 0.19],
                            [step * 0.16 * away, step * 0.19]]) {
      const X = Math.min(BENCH.x1 - half - 0.05, Math.max(BENCH.x0 + half + 0.05, x + dx));
      const Z = Math.min(BENCH.z1 - 0.16, Math.max(BENCH.z0 + 0.16, z + dz));

    const spot = Object.values(stations).find(s2 => s2.kind === 'scratch' && !s2.occupant)
      ?? ensureScratchStation(scratchObjs.length, true);
    if (spot) return putOnStation(spot, thing);
  }
  benchRoot.add(thing);
  thing.scale.setScalar(thing.userData.kind === 'robot' ? MINI : 1);
  thing.quaternion.identity();
  const half = (thing.userData.width || 0.3) / 2 + 0.05;
  const spot = clearBenchSpot(thing,
    Math.min(BENCH.x1 - half, Math.max(BENCH.x0 + half, at.x)),
    Math.min(BENCH.z1 - 0.16, Math.max(BENCH.z0 + 0.16, at.z)));
  thing.position.set(spot.x, BENCH_TOP + thing.userData.rest, spot.z);
  if (!benchThings.includes(thing)) benchThings.push(thing);

    addMiniBubble(thing, thing.__bot?.program.length ? thing.__bot.condition : null);
  }

// A work spot is a small desk. Something too wide for it -- a box of eight
// holes, say -- used to hang over its neighbours; it sizes what it holds
// instead, exactly as a hole does, and never magnifies.
const SPOT_W = 0.4;

  Math.max(0.35, Math.min(1, (SPOT_W * 0.95) / (thing.userData.width || 0.3)));

    : st.kind === 'scratch' ? spotScale(thing) : 1);
  thing.quaternion.identity();

function putInHole(hole, thing) {
  hole.anchor.add(thing);

  const s = fitScale(thing, hole);
  thing.scale.setScalar(s);
  // A nest is a shallow ring with nothing under it: left at the pocket floor
  // it disappears into the shadow and the hole reads as empty. It sits on the
  // rim instead, where you can see it -- and see what lands on it.
  thing.position.y = (thing.userData.kind === 'nest' && !hole.pan) ? 0.05
    : thing.userData.rest * s;
  if (thing.userData.kind === 'robot') {
    // A robot lies on its back across the hole: rotating it puts its height
    // along the box's depth, which is roomier than a hole is wide. It rests on
    // the rim rather than sinking into the pocket, where it would vanish.
    const bb = robotBox();
    const sz = bb ? new THREE.Vector3().subVectors(bb.max, bb.min) : null;
    const s2 = sz ? Math.min(MINI, ((hole.w + 0.06) * 0.9) / Math.max(sz.y, 0.001),
                             (hole.w * 0.9) / Math.max(sz.x, 0.001)) : 0.165;
    thing.scale.setScalar(s2);
    thing.rotation.set(-Math.PI / 2, 0, 0);

      thing.position.y = 0.04 - bb.min.z * s2;
      thing.position.z = ((bb.min.y + bb.max.y) / 2) * s2;
    } else thing.position.y = 0.055;

  // above exactly as they do on the bench
  // A scale's pan is a flat dish with no rim to clear, so nothing is lifted
  // there -- a pad floated up over a pocket ends up in the beam.
  if (thing.userData.kind === 'text') {

  } else if (['box', 'scale', 'notebook', 'room'].includes(thing.userData.kind)) {

const COPY_LIFT = 0.52;                       // upper platform above the tray
function makeCopier(height, st) {
  const g = new THREE.Group();

  const cream = new THREE.MeshStandardMaterial({ color: 0xefe2c6, roughness: 0.45 });

  base.position.y = height / 2; base.castShadow = true; base.receiveShadow = true;

  const tray = new THREE.Mesh(geo('CylinderGeometry', 0.185, 0.185, 0.04, 32), cream);
  tray.position.y = height; tray.castShadow = true; tray.receiveShadow = true;

    const post = new THREE.Mesh(geo('BoxGeometry', 0.05, COPY_LIFT + 0.42, 0.05), dark);
    post.position.set(0.215 * s, height + (COPY_LIFT + 0.42) / 2, 0);
    post.castShadow = true;

  platform.position.y = height + COPY_LIFT;

    new THREE.MeshStandardMaterial({ color: 0x0b3d4d, roughness: 0.2,

  bar.position.set(0, height + COPY_LIFT + 0.36, 0);
  g.add(bar);
  st.scanBar = bar;
  st.scanTop = height + COPY_LIFT + 0.36;
  st.scanBottom = height + COPY_LIFT + 0.06;

}

const stackY = (st, c, i) => st.plinth + c.userData.rest + i * st.pitch;

// New stock joins at the *bottom*; with `animate` the whole column then rises
// one place, so taking the top one reads as the stack restoring itself rather
// than everything blinking into new positions.
function refillStack(st, animate = false) {
  const added = [];
  while (st.cubes.length < st.stackN) {
    const t = st.id === 'numbers' ? makeNumber(rat(1))
            : st.id === 'minis' ? makeMiniRobot()
            : st.id === 'scales' ? makeScale()
            : st.id === 'texts' ? makeText('')
            : st.id === 'rooms' ? makeRoom()
            : st.id === 'nests' ? makeNest()
            : st.id === 'dice' ? makeDie()
            : makeBox();
    scene.add(t);
    setPick(t, { kind: 'station', id: st.id });
    st.cubes.unshift(t);
    added.push(t);
    t.position.set(st.point.x, stackY(st, t, 0) - st.pitch, st.point.z);
    t.quaternion.identity();
    t.scale.setScalar(t.userData.kind === 'robot' ? MINI : 1);

    st.cubes.forEach((c, i) => {

      c.quaternion.identity();
      c.scale.setScalar(c.userData.kind === 'robot' ? MINI : 1);

  const to = st.cubes.map((c, i) => stackY(st, c, i));
  enqueueNext({
    dur: 0.38,
    update(t) {
      const e = ease(t);
      st.cubes.forEach((c, i) => { c.position.y = lerp(from[i], to[i], e); });
    },
    end() { st.cubes.forEach((c, i) => { c.position.y = to[i]; }); },
  });

// Time-based world effects that must not depend on the screen being visible:
// egg hatching and clone-bird flights. Called from tick() and, at Instant

    __visual: true,
    dur: 0.01,
    start() {
      tgt = typeof target === 'function' ? target() : target;

      y0 = root.rotation.y;

      dist = p0.distanceTo(tgt.pos);

        ? 0.0001 : Math.max(0.4, dist / WALK_SPEED, Math.abs(y1 - y0) * 0.42);

    update(t) {
      const e = ease(t);

      root.position.z = lerp(p0.z, tgt.pos.z, e);

// The robot stands at its own stand and never walks: everything it can do is
// reaching into the thing it was given, or conjuring a new number or box.

// The robot walks to the stack and takes the top one, the same way you do.
function actionNew(kind) {
  const st = stations[kind === 'box' ? 'boxes' : kind === 'scale' ? 'scales'
                    : kind === 'text' ? 'texts' : kind === 'nest' ? 'nests'
                    : kind === 'room' ? 'rooms' : kind === 'die' ? 'dice'
                    : 'numbers'];
  enqueue(walkTo(() => standForPoint(st.point)));
  enqueue(armTo(POSE.reach, JAW_OPEN, 0.6));
  enqueue(doNow(() => {
    const made = st.cubes.pop();
    held = made;
    setPick(made, { kind: 'thing', thing: made });
    noteHeld();
    grip.attach(made);
    enqueueNext(graspSettle(made));
  }));
  enqueue(armTo(POSE.reach, JAW_CLOSED, 0.35));
  enqueue(armTo(POSE.carry, JAW_CLOSED, 0.5));
  // only once the top one is visibly carried away does the stack rise again
  enqueue(doNow(() => refillStack(st, true)));
  enqueue(doNow(refreshUI));

const walkTargetFor = (c) =>
  c === 'given' ? (() => homeFor(activeBot))
  : (c === 'in' || c === 'out') ? () => standForPoint(stations.copyOut.point)
  : () => standForPoint(stationOf(c).point);

// Where to stand so the claw lands on the addressed hole itself, not the
// centre of whatever contains it.
const walkTargetForAt = (at) => () => {
  if (at.path.length) {
    const hole = holeAt(at);
    if (hole) {
      const hp = hole.anchor.getWorldPosition(new THREE.Vector3());
      return standForPoint(hp);
    }
  }
  const t = walkTargetFor(at.c);
  return typeof t === 'function' ? t() : t;
};

// Take whatever the address names, into the claw.
function actionTake(at) {
  const reach = at.c === 'in' ? POSE.reachHigh : POSE.reach;
  enqueue(walkTo(walkTargetForAt(at)));
  enqueue(armTo(reach, JAW_OPEN, 0.7));
  enqueue(doNow(() => {
    const obj = thingAt(at);
    if (!obj) return abort(`The robot expected something in ${holeName(at)} and found nothing.`);
    detach(obj);
    held = obj;
    setPick(held, { kind: 'thing', thing: held });
    noteHeld();
    grip.attach(held);
    // fetching from the raised platform is a long reach -- let it be seen
    enqueueNext(graspSettle(held, at.c === 'in' ? 0.5 : 0.2));
  }));
  enqueue(armTo(reach, JAW_CLOSED, 0.35));
  enqueue(armTo(POSE.carry, JAW_CLOSED, 0.6));
  enqueue(doNow(refreshUI));
}

// Put what the robot holds at the address. A hole takes it (or combines);
// a bare container places it (or combines with what sits there); placing on
// the copier platform sets the machine going.
function actionPut(at, side) {
  if (at.c === 'notebook' && !mainNotebook()) {
    return enqueue(doNow(() => abort('There is no notebook here to file that in.')));
  }
  const reach = at.c === 'in' ? POSE.reachHigh : POSE.reach;
  enqueue(walkTo(walkTargetForAt(at)));
  enqueue(armTo(reach, JAW_CLOSED, 0.6));
  enqueue(armTo(reach, JAW_OPEN, 0.35));
  enqueue(doNow(() => {
    const dropped = held; held = null;
    if (!dropped) return;
    const from = dropped.getWorldPosition(new THREE.Vector3());
    const fromQ = dropped.getWorldQuaternion(new THREE.Quaternion());
    if (at.path.length) {
      const hole = holeAt(at);
      if (!hole) return abort(`The robot expected ${holeName(at)} and there is no such hole.`);
      if (hole.thing?.userData.kind === 'bird') { held = dropped; return birdDeliver(hole.thing); }
      if (hole.thing) combine(hole, dropped, true, from, side);
      else { putInHole(hole, dropped); enqueueNext(settleInto(dropped, from, 0.3, fromQ)); }
    } else {
      const st = stationOf(at.c);
      if (st.occupant?.userData.kind === 'bird') { held = dropped; return birdDeliver(st.occupant); }
      if (st.occupant) combine(st, dropped, false, from, side);
      else {
        putOnStation(st, dropped);
        // the platform sits above the claw, so let the rise be seen
        enqueueNext(settleInto(dropped, from, at.c === 'in' ? 0.55 : 0.3, fromQ));

    // hatches there and then, and the bird lands on a free work spot.

const scanStep = (st) => ({
  dur: 0.7,
  update(t) {
    const e = Math.sin(Math.PI * t);
    st.scanBar.position.y = lerp(st.scanTop, st.scanBottom, e);
    st.scanBar.material.emissiveIntensity = 2.6 + 3.4 * e;
  },
  end() { st.scanBar.position.y = st.scanTop; st.scanBar.material.emissiveIntensity = 2.6; },
});

// Scan whatever is on the upper platform and lower a duplicate into the tray.
// The original never moves, so the machine is ready again immediately.
function runDuplicate() {
  const inSt = stations.copyIn, outSt = stations.copyOut;
  let copy = null, from = null;
  // enqueueNext: when a robot triggers this mid-action, the duplicate has to be
  // made before the following step (typically "take the copy") runs.
  enqueueNext(scanStep(inSt), {
    dur: 0.45,
    start() {
      copy = copyThing(inSt.occupant);
      WROOT.add(copy);
      from = inSt.occupant.getWorldPosition(new THREE.Vector3());
      copy.position.copy(from);
      copy.scale.setScalar(0.01);
      flash(from);
    },
    update(t) {
      const full = copy.userData.kind === 'robot' ? MINI : 1;
      const s = 0.01 + (full - 0.01) * ease(t);
      copy.scale.setScalar(s);
      copy.position.y = inSt.point.y + inSt.occupant.userData.rest + copy.userData.rest * s;
    },
  }, {
    dur: 0.5,
    update(t) {
      const e = ease(t);
      copy.position.y = lerp(inSt.point.y + 0.3, outSt.topY + copy.userData.rest, e);
      copy.position.x = lerp(from.x, outSt.point.x, e);
      copy.position.z = lerp(from.z, outSt.point.z, e);
    },
    end() { putOnStation(outSt, copy); refreshUI(); },
  });
}

// original stays put and the copy arrives in the claw.
// Copying is a trip to Mimi, the same one you would make: fetch the thing,
// set it on her platform, put the original back where it belongs, and carry
// the copy away. Nothing appears out of thin air.
function actionCopy(at) {
  enqueue(doNow(() => {
    if (stations.copyIn.occupant || stations.copyOut.occupant) {
      abort('The copier is not empty — the robot could not use it.');
    }
  }));
  actionTake(at);                              // fetch the original
  actionPut({ c: 'in', path: [] });            // onto the platform: she scans it
  actionTake({ c: 'in', path: [] });           // the original back off the platform
  actionPut(at);                               // and home to where it came from
  actionTake({ c: 'out', path: [] });          // the copy is what it carries away
  enqueue(doNow(refreshUI));
}

// Typing a number on a held box gives it that many holes. Rebuilt rather than
// reshaped, since hole width depends on the count. Shrinking splits the box
// like an array: the excess holes fall away as a box of their own -- onto the
// bench when you do it, onto a free work spot when the robot does.
function resizeHeldBox(n) {
  n = Math.max(0, Math.min(MAX_HOLES, n));
  const old = held;
  const oldHoles = old.userData.holes;
  if (n === oldHoles.length) return;
  // Occupied excess holes fall away as a box of their own; excess holes that
  // are all empty simply vanish, so a robot trimming a fresh box does not
  // litter its work area with empty husks.
  if (n < oldHoles.length && oldHoles.slice(n).some(h => h.thing)) {
    const rest = makeBox(oldHoles.length - n);
    for (let i = n; i < oldHoles.length; i++) {
      const t = oldHoles[i].thing;
      if (t) { oldHoles[i].thing = null; putInHole(rest.userData.holes[i - n], t); }
    }
    const from = old.getWorldPosition(new THREE.Vector3());
    if (mode === 'world') putOnBench(rest, benchSpot());
    else {
      const spot = Object.values(stations).find(s2 => s2.kind === 'scratch' && !s2.occupant)
        ?? ensureScratchStation(scratchObjs.length, true);
      putOnStation(spot, rest);
    }
    enqueueNext(settleInto(rest, from, 0.45));
  }
  const nb = makeBox(n);
  for (let i = 0; i < Math.min(n, oldHoles.length); i++) {
    const t = oldHoles[i].thing;
    if (t) { oldHoles[i].thing = null; putInHole(nb.userData.holes[i], t); }
  }
  if (old.userData.label) setThingLabel(nb, old.userData.label);
  const parent = old.parent;
  nb.position.copy(old.position);
  nb.quaternion.copy(old.quaternion);
  nb.scale.copy(old.scale);
  parent.add(nb);
  parent.remove(old);
  held = nb;
  refreshUI();
}

// Draw a just-grasped thing into the claw, and a just-released one into its
// slot, instead of snapping. Both animate local position so the parenting is
// already final and nothing can drift.
function graspSettle(thing, dur = 0.2) {
  const p0 = thing.position.clone(), s0 = thing.scale.x;
  const to = new THREE.Vector3(0, 0, 0);
  // a robot rides in the claw at its little size, never grown to full height
  const s1 = thing.userData.kind === 'robot' ? MINI : 1;
  return {
    __visual: true,       // its end() still lands the thing squarely in the claw
    dur,
    update(t) {
      const e = ease(t);
      thing.position.lerpVectors(p0, to, e);
      thing.scale.setScalar(lerp(s0, s1, e));
    },
    end() { thing.position.copy(to); thing.scale.setScalar(s1); },
  };
}
function settleInto(thing, fromWorld, dur = 0.22, fromQuatWorld = null) {
  // the thing is already where it belongs; this only shows the trip there
  if (offstage()) return { __visual: true, dur: 0.0001 };
  const to = thing.position.clone();
  const from = thing.parent.worldToLocal(fromWorld.clone());
  const toQ = thing.quaternion.clone();
  let fromQ = null;
  if (fromQuatWorld) {
    const pq = new THREE.Quaternion();
    thing.parent.getWorldQuaternion(pq);
    fromQ = pq.invert().multiply(fromQuatWorld);
  }
  return {
    dur,
    update(t) {
      const e = ease(t);
      thing.position.lerpVectors(from, to, e);
      if (fromQ) thing.quaternion.slerpQuaternions(fromQ, toQ, e);
    },
    end() { thing.position.copy(to); thing.quaternion.copy(toQ); },
  };
}

// The joined box replaces the target wherever it sits -- bench, station or
// hole -- and the dropped box's holes are appended after the target's.
function joinBoxes(target, incoming, refuse, side) {
  const nA = target.userData.holes.length, nB = incoming.userData.holes.length;
  const nb = makeBox(nA + nB);
  const move = (srcHoles, offset) => srcHoles.forEach((h, i) => {
    const t = h.thing;
    if (t) { h.thing = null; putInHole(nb.userData.holes[offset + i], t); }
  });
  // which side you drop on decides where the new holes go
  if (side === 'L') { move(incoming.userData.holes, 0); move(target.userData.holes, nB); }
  else { move(target.userData.holes, 0); move(incoming.userData.holes, nA); }
  const hole = holeContaining(target);
  const st = Object.values(stations).find(s => s.occupant === target);
  const bi = benchThings.indexOf(target);
  const at = { x: target.position.x, z: target.position.z };
  detach(target);
  target.removeFromParent();
  incoming.removeFromParent();
  if (hole) putInHole(hole, nb);
  else if (st) putOnStation(st, nb);
  else if (bi >= 0) putOnBench(nb, at);
  else WROOT.add(nb);
  flash(nb.getWorldPosition(new THREE.Vector3()));
  refreshUI();
}

// Where Bammer will eventually fly in with his hammer. Only numbers combine.
function sideOf(target, point) {
  if (!point) return 'R';
  return target.worldToLocal(point.clone()).x < 0 ? 'L' : 'R';
}
// The perch-then-sink merge that numbers use, shared by text drops: the
// arriving thing rests on the target for a beat, then sinks in and applies.
function mergeOnto(incoming, fromWorld, target, apply) {
  WROOT.attach(incoming);
  const dest = target.getWorldPosition(new THREE.Vector3());
  const iScale = new THREE.Vector3();
  incoming.getWorldScale(iScale);
  const perch = dest.clone();
  perch.y += 0.16;
  const start = fromWorld ? fromWorld.clone() : incoming.position.clone();
  enqueueNext({
    dur: 0.22,
    start() { incoming.position.copy(start); },
    update(t) { incoming.position.lerpVectors(start, perch, ease(t)); },
  }, pause(0.2), {
    dur: 0.35,
    update(t) {
      const e = ease(t);
      incoming.position.lerpVectors(perch, dest, e);
      incoming.scale.setScalar(iScale.y * (1 - 0.85 * e));
    },
    end() {
      incoming.removeFromParent();
      sfx('combine');
      apply();
      flash(dest);
      refreshUI();
    },
  });
}
// Put `made` exactly where `target` sits -- hole, station or bench -- and
// retire the target. What a thing turns INTO belongs where it was.
function replaceThing(target, made) {
  const hole = holeContaining(target);
  const st2 = Object.values(stations).find(s2 => s2.occupant === target);
  const bi = benchThings.indexOf(target);
  const at = { x: target.position.x, z: target.position.z };
  detach(target);
  target.removeFromParent();
  if (hole) putInHole(hole, made);
  else if (st2) putOnStation(st2, made);
  else if (bi >= 0) putOnBench(made, at);
  else WROOT.add(made);
  refreshUI();
  return made;
}
function combine(slot, incoming, isHole, fromWorld, side) {
  const target = isHole ? slot.thing : slot.occupant;
  // The old fallback parked refused things on a free pillar; pillars are gone,
  // so a refused thing lands on the bench instead of being lost.
  const refuse = (msg) => {
    sfx('refuse');
    const from = incoming.getWorldPosition(new THREE.Vector3());
    putOnBench(incoming, benchSpot());
    enqueueNext(settleInto(incoming, from, 0.3));
    sayAttn(msg);

  // and all, exactly as in ToonTalk.
  if (target.userData.kind === 'room') {
    return roomDrop(target, incoming, refuse);
  }
  if (target.userData.kind === 'notebook') {
    return notebookDrop(target, incoming, side, refuse);
  }
  if (incoming.userData.kind === 'notebook') {
    return refuse('Set the notebook down and drop things ON it instead.');
  }
  // Two nests dropped together become ONE nest: the pile of the one you are
  // holding joins the pile below it, and the survivor answers to both names --
  // so every bird of either nest goes on delivering, to here. That is how you
  // rewire a program that is already running.
  if (target.userData.kind === 'nest' && incoming.userData.kind === 'nest') {
    const keep = target.userData, gone = incoming.userData;
    keep.aliases = [...new Set([...(keep.aliases ?? []), gone.guid,
                                ...(gone.aliases ?? [])])].filter(g => g && g !== keep.guid);
    for (const it of gone.pile.slice()) { it.removeFromParent(); keep.pile.push(it); }
    gone.pile.length = 0;
    if (!keep.label && gone.label) setThingLabel(target, gone.label);
    if (gone.hasEgg && !keep.hasEgg && incoming.__egg) hatchNow(incoming);
    return mergeOnto(incoming, fromWorld, target, () => {
      const i = allNests.indexOf(incoming);
      if (i >= 0) allNests.splice(i, 1);
      keep.pile.forEach(it => { target.add(it); });
      restackNest(target);
      nestReceived(target);
      say('One nest now — it answers to both, so every bird still knows the way.');
    });
  }
  if (target.userData.kind === 'bird' || target.userData.kind === 'nest') {
    return refuse('Give things to the bird herself — she delivers to her nest.');
  }

    return joinBoxes(target, incoming, refuse, side);

  // A box with NO HOLES is a mould: pour something into it and it comes apart,
  // one part to a hole. A pad becomes its letters; a team becomes its robots.
  // A box that HAS holes is a container -- dropping a robot in one is how a
  // program carries a spare team -- so the two gestures never collide.
  const mould = target.userData.kind === 'box' && !target.userData.holes.length;
  if (mould && incoming.userData.kind === 'robot') {
    const bot = incoming.__bot;
    const members = [bot, ...bot.team];
    return mergeOnto(incoming, fromWorld, target, () => {
      const nb = makeBox(members.length);
      members.forEach((m, i) => {
        m.team = [];
        m.node.removeFromParent();
        putInHole(nb.userData.holes[i], m.node);
        setPick(m.node, { kind: 'botThing', bot: m });
      });
      replaceThing(target, nb);
      say(members.length > 1
        ? `The team, one robot to a hole — ${members.length} of them. Drop one on another to make a team again.`
        : 'The robot, in a box of its own.');
    });
  }
  if (mould && incoming.userData.kind === 'text') {
    const chars = [...(incoming.userData.text ?? '')];
    if (!chars.length) return refuse('That pad is blank — write on it first.');
    return mergeOnto(incoming, fromWorld, target, () => {
      const nb = makeBox(chars.length);
      chars.forEach((ch, i) => putInHole(nb.userData.holes[i], makeText(ch)));
      replaceThing(target, nb);
      say(`One hole per letter — ${chars.length} of them.`);

  // word. (A robot is not poured out this way -- dropping a robot into a hole
  // is how a program carries a spare team, and that must go on meaning that.)
  if (target.userData.kind === 'text' && !(target.userData.text ?? '')
      && incoming.userData.kind === 'box' && incoming.userData.holes.length
      && incoming.userData.holes.every(h => h.thing?.userData.kind === 'text'
                                         || h.thing?.userData.kind === 'number')) {
    const word = incoming.userData.holes.map(h => h.thing.userData.kind === 'text'
      ? h.thing.userData.text : ratText(h.thing.userData.value)).join('');
    return mergeOnto(incoming, fromWorld, target, () => {
      target.setText(word);
      say(`The holes, read straight through: “${word}”.`);
    });
  }
  // Text pads concatenate; the side of the drop decides the order, exactly as
  // dropping "Talk" on the right of "Toon" makes "ToonTalk" in the original.
  if (target.userData.kind === 'text' && incoming.userData.kind === 'text') {
    const merged = side === 'L' ? incoming.userData.text + target.userData.text
                                : target.userData.text + incoming.userData.text;
    return mergeOnto(incoming, fromWorld, target, () => target.setText(merged));
  }

      && incoming.userData.kind === 'text') {
    const v = parseTextNumber(incoming.userData.text);
    if (!v) return refuse('That pad does not read as a number.');
    return mergeOnto(incoming, fromWorld, target, () => {
      unErase(target);
      target.setValue(v);
    });
  }

    const v = incoming.userData.value;
    // a number restores an erased pad, writing its digits on it
    if (target.userData.erased) {
      return mergeOnto(incoming, fromWorld, target, () => {
        unErase(target);
        target.setText(ratText(v));
      });
    }
    // a number on a blank pad writes itself out as text
    if (target.userData.text === '') {
      return mergeOnto(incoming, fromWorld, target, () => target.setText(ratText(v)));
    }
    if (v.d !== 1n) return refuse('Only a whole number can shift letters.');
    // ...on a written pad it shifts the first or last letter along the alphabet
    return mergeOnto(incoming, fromWorld, target, () => {
      const txt = target.userData.text;
      const i = side === 'L' ? 0 : txt.length - 1;

  if (target.userData.kind === 'number' && incoming.userData.kind === 'die') {
    const faces = BigInt(incoming.userData.faces);
    return mergeOnto(incoming, fromWorld, target, () => {
      unErase(target);
      target.setValue(rat(1n + BigInt(Math.floor(Math.random() * Number(faces)))));
    });
  }

    return refuse('Nothing to do — to change a die, hold it and type how many faces it should have.');
  }

  // spent saying which one, and the letter takes its place

      && incoming.userData.kind === 'text') {

    const chars = [...(incoming.userData.text ?? '')];
    if (!chars.length) return refuse('That pad is blank — write on it first.');
    if (v.d !== 1n || v.n < 1n || v.n > BigInt(chars.length)) {
      return refuse(`Only a whole number from 1 to ${chars.length} picks a letter out of “${chars.join('')}”.`);
    }
    const ch = chars[Number(v.n) - 1];
    return mergeOnto(incoming, fromWorld, target, () => {
      const made = makeText(ch);
      replaceThing(target, made);
      flash(made.getWorldPosition(new THREE.Vector3()));
    });
  }
  if (target.userData.kind === 'text' || incoming.userData.kind === 'text') {
    return refuse('Text combines with text — or take a number to shift a letter or fill a blank pad.');
  }
  // a box dropped on a whole number splits there: [first N] and [the rest];
  // the number is spent showing where to cut
  if (target.userData.kind === 'number' && incoming.userData.kind === 'box') {
    const v = target.userData.value;
    const H = incoming.userData.holes.length;
    if (target.userData.erased || v.d !== 1n || v.n < 0n || v.n > BigInt(H)) {
      return refuse(`Only a whole number from 0 to ${H} can split this box.`);
    }
    const n = Number(v.n);
    const left = makeBox(n), right = makeBox(H - n);
    incoming.userData.holes.forEach((h, i) => {
      const t = h.thing;

      h.thing = null;
      putInHole((i < n ? left : right).userData.holes[i < n ? i : i - n], t);
    });
    if (incoming.userData.label) setThingLabel(left, incoming.userData.label);
    const at = { x: target.position.x, z: target.position.z };
    const hole = holeContaining(target);
    const st2 = Object.values(stations).find(s2 => s2.occupant === target);
    const bi = benchThings.indexOf(target);
    detach(target); target.removeFromParent();
    incoming.removeFromParent();
    sfx('combine');
    const park = (b) => {
      if (mode === 'world') putOnBench(b, benchSpot());
      else {
        const spot = Object.values(stations).find(s2 => s2.kind === 'scratch' && !s2.occupant)
          ?? ensureScratchStation(scratchObjs.length, true);
        putOnStation(spot, b);
      }
    };
    if (hole) { putInHole(hole, left); park(right); }
    else if (st2) { putOnStation(st2, left); park(right); }
    else if (bi >= 0) {
      putOnBench(left, { x: at.x - 0.12 - left.userData.width / 2, z: at.z });
      putOnBench(right, { x: at.x + 0.12 + right.userData.width / 2, z: at.z });
    } else { park(left); park(right); }
    flash(left.getWorldPosition(new THREE.Vector3()));
    refreshUI();

  if (target.userData.kind !== 'number' || incoming.userData.kind !== 'number') {
    return refuse('Only numbers combine — a box joins a box, a number adds to a number.');
  }

  // typing "*" on a number before dropping it means.
  const op = incoming.userData.op;
  const result = applyOp(target.userData.value, op, incoming.userData.value);
  if (!result) {
    return refuse(op === '/' && incoming.userData.value.n === 0n
      ? 'Nothing can be divided by zero.'
      : op === 'mod' ? 'A remainder needs two whole numbers, and no dividing by zero.'
      : `That ${op} makes a number too big to hold.`);
  }
  sfx('combine');
  WROOT.attach(incoming);

  const base = isHole ? fitScale(target, slot) : 1;
  // Rest on top of the number it landed on for a beat before merging, rather
  // than the two occupying the same spot.
  const tScale = new THREE.Vector3(), iScale = new THREE.Vector3();
  target.getWorldScale(tScale); incoming.getWorldScale(iScale);
  const perch = dest.clone();
  perch.y += target.userData.rest * tScale.y + incoming.userData.rest * iScale.y;
  const start = fromWorld ? fromWorld.clone() : incoming.position.clone();
