<!doctype html>
<!-- THE GALLERY'S PICTURES. Open with the dev server up (node serve.js 8311):
     for each world on gallery/route.json it loads the app, opens the world,
     runs it the way its card says, takes one frame and posts it to
     captures/gallery-<n>.jpg. Then: python gallery/make_gallery.py --shots
     ?only=5,12 shoots those alone. -->
<html lang="en">
<head><meta charset="utf-8"><title>gallery shots</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font: 13px/1.4 system-ui, sans-serif; }
  #log { padding: 8px; white-space: pre-wrap; max-height: 30vh; overflow: auto; }
  iframe { width: 1280px; height: 720px; border: 0; display: block; }
</style></head>
<body>
<div id="log">starting…</div>
<iframe id="app" src="../toontalk-3d.html?demo=1&bust=gallery"></iframe>
<script>
const log = (s) => { document.getElementById('log').textContent += '\n' + s; };
const frame = document.getElementById('app');
const only = (new URLSearchParams(location.search).get('only') || '').split(',').filter(Boolean).map(Number);
let VNOW = 1000;
const fnow = () => (VNOW += 17);
const breathe = () => new Promise(r => setTimeout(r, 0));
async function frames(D, n) { for (let i = 0; i < n; i++) { D.frame(1, fnow()); if ((i & 7) === 7) await breathe(); } }
async function settle(D, n) { await frames(D, n); }
function things(D) { const a = []; for (let i = 0; i < 40; i++) { const t = D.bench(i); if (!t) break; a.push(t); } return a; }
// CLOSER: fit the camera to what the world is about -- its things (not the
// instruction pads at the back, not the user's notebook), the desk and the
// robot at it -- from the front right, a little above. Whole-workshop shots
// all looked alike (ChatGPT's review).
function fitCamera(D) {
  const THREE = D.THREE, bb = new THREE.Box3(), v = new THREE.Vector3();
  // the whole of each thing, a tall pile on a nest included (the first cut took positions, and the piles ran off the top)
  // visible solid meshes only: a folded panel's tray is invisible and still solid to setFromObject, and it is huge
  const add = (t, w = 0) => { if (!t) return; t.updateMatrixWorld(true); const bx = new THREE.Box3();
    t.traverseVisible(o => { if (o.isMesh && !(o.material?.transparent && (o.material.opacity ?? 1) < 0.5)) bx.expandByObject(o); });
    if (!bx.isEmpty()) bb.union(bx); else { t.getWorldPosition(v); bb.expandByPoint(v); } };
  for (const t of things(D)) {
    if (t.userData.main) continue;
    if (t.userData.kind === 'text' && !t.userData.img && (t.userData.text || '').length > 60) continue;   // an instruction card
    add(t, t.userData.width || 0.3);
  }
  const st = D.stations.stand;
  if (st?.occupant) add(st.occupant, st.occupant.userData.width || 0.4);
  for (const b of D.benchBots()) add(b, 0.4);
  if (bb.isEmpty()) return false;
  const c = bb.getCenter(new THREE.Vector3()), size = bb.getSize(new THREE.Vector3());
  // a pile that runs off the top is better than a table seen from the ceiling: the height counts up to a point
  const h = Math.min(size.y, 1.3);
  c.y = bb.min.y + h / 2;
  const radius = Math.max(0.45, Math.hypot(size.x, size.z) / 2 + 0.2, h / 2 + 0.25);
  const cam = D.camera, fov = cam.fov * Math.PI / 180;
  const hfov = 2 * Math.atan(Math.tan(fov / 2) * cam.aspect);
  const dist = radius / Math.tan(Math.min(fov, hfov) / 2) * 1.08;
  const dir = new THREE.Vector3(0.45, 0.8, 1.05).normalize();
  cam.position.copy(c).addScaledVector(dir, dist);
  cam.position.y = Math.max(cam.position.y, 1.35);
  // the orbit controls re-aim the camera at THEIR target every frame: set that, not only lookAt
  D.orbit.target.set(c.x, c.y + 0.05, c.z); D.orbit.update();
  cam.lookAt(c.x, c.y + 0.05, c.z);
  return true;
}
async function shoot(D, i, name, shot) {
  const w = await (await fetch('../examples/' + name + '.world.json')).json();
  D.worldIn(w); await settle(D, 120);
  D.speed('inf'); D.rounds(shot === 'lever' ? 30 : 1000);   // the garden is 667 rounds
  const ts = things(D);
  if (shot === 'give') {
    const arg = ts.find(t => ['box', 'scale'].includes(t.userData.kind));
    const bot = ts.find(t => t.userData.kind === 'robot');
    if (arg && bot) { D.clickThing(arg); await settle(D, 60); D.clickBot(bot); await settle(D, 900); }
  } else if (shot === 'lever') {
    const room = ts.find(t => t.userData.kind === 'room');
    if (room) { D.clickRaw({ kind: 'roomLever', room }); await settle(D, 600); }
  } else if (shot === 'run') {
    const box = D.stations.stand?.occupant;
    if (box) { D.hold(box); await settle(D, 10); D.giveRobot(); await settle(D, 900); }
  } else if (shot === 'space') {
    const g = ts.find(t => t.userData.gadget) ?? ts.find(t => t.userData.panel || t.userData.panelWorld) ?? ts.find(t => t.userData.kind === 'model');
    if (g) { try { D.switchGadget(g, true, true); } catch (e) { try { D.switchBound(g, true); } catch (e2) {} } await settle(D, 150); }
  } else if (shot === 'yard') {
    D.clickRaw({ kind: 'yardDoor' }); await settle(D, 200);
  }
  D.speed(1); D.rounds(8);
  await settle(D, 20);
  // one pose for the table, a closer one for a drawing, the file's own if it has one
  if (shot !== 'yard' && !w.camera) {
    D.orbitStart();
    if (shot === 'run') { D.camera.position.set(0.7, 1.95, 2.75); D.orbit.target.set(0, 1.1, 1.55); D.orbit.update(); D.camera.lookAt(0, 1.1, 1.55); }
    else if (!fitCamera(D)) { D.camera.position.set(0, 2.75, 4.35); D.orbit.target.set(0, 0.85, 1.6); D.orbit.update(); D.camera.lookAt(0, 0.85, 1.6); }
  }
  const png = D.snapshot(960);
  const r = await fetch('/capture?name=gallery-' + String(i).padStart(2, '0'), { method: 'POST', body: png });
  log(i + ' ' + name + ' -> ' + (r.ok ? 'ok' : 'FAILED ' + r.status));
  if (shot === 'space') { try { const g = ts.find(t => t.userData.gadget); if (g) D.switchGadget(g, false, true); } catch (e) {} }
  if (shot === 'yard') { try { D.clickRaw({ kind: 'yardDoor' }); await settle(D, 100); } catch (e) {} }
}
(async () => {
  for (let i = 0; i < 300; i++) { if (frame.contentWindow.__nano?.frame) break; await new Promise(r => setTimeout(r, 100)); }
  const D = frame.contentWindow.__nano;
  await new Promise(r => setTimeout(r, 1500));
  // the harness owns the clock: the app's own loop kept the star sliding
  // between the camera fit and the picture, so the star was off to the side
  D.autoLoop(false);
  const route = await (await fetch('../gallery/route.json')).json();
  for (const e of route) {
    if (only.length && !only.includes(e.i)) continue;
    try { await shoot(D, e.i, e.name, e.shot); }
    catch (err) { log(e.i + ' ' + e.name + ' threw: ' + err.message); }
  }
  log('done');
  document.title = 'SHOTS DONE';
})();
</script>
</body>
</html>
