  const deep = segs.length ? Math.max(...zs) - Math.min(...zs) : 0;
  const round = tall > 0.5 && Math.abs(tall - deep) < 0.12;
  // ...and it stayed on the table: no wall clipped the back of the loop
  const onTheTable = plane.position.z > 1.2 && plane.position.z < 2.2;
  const ok = started && bothRunning && tookOff && cameDown && round && onTheTable;
  put((ok ? 'PASS' : 'FAIL') + ' the airplane loops  (both-behaviours=' + bothRunning
      + ' climbed=' + Math.max(...ups).toFixed(2) + ' landed=' + cameDown
      + ' path ' + tall.toFixed(2) + ' tall x ' + deep.toFixed(2) + ' deep'
      + ' on-the-table=' + onTheTable + ')', ok ? 'pass' : 'fail');
  return ok;
}

// A HOUSE POSTS TO A HOUSE, AND EVERY HOUSE WORKS. activity1 is three houses
// in a row: Add 1 posts to the letterbox INSIDE Doubler and the one inside
// Split (both nests answer to the same name), and those two post out to the
// nests on the desk. Two things a watcher must see, and neither was checked:
// the bird crossing the table between the houses, and all three robots doing
// their rounds -- the two woken by mail stood still for weeks because their
// round runs in checkWaiting, below where the performance was built.
async function postAcrossCheck(D) {
  const w = await (await fetch('../examples/infinity/activity1-even-numbers.world.json')).json();
  D.worldIn(w); await slowSettle(D, 2000);
  const rooms = [];
  for (let i = 0; i < 14; i++) { const t = D.bench(i); if (!t) break;
    if (t.userData.kind === 'room') rooms.push(t); }
  D.speed(1);
  // START WHAT IS OFF -- and "off" is not "not dirty". A house woken by post is
  // dirty only for the instant its round takes, so a house that has run once
  // and gone quiet reads as not-dirty while being very much switched ON. This
  // loop used to pull ITS lever too, which since the lever learned to mean
  // stop is a press that stops it: activity1's Doubler and Split were switched
  // off before the first letter and stood there with eight waiting (measured:
  // d0 s1 w0 r1 p8 apiece). The house itself was right; the test was asking
  // the old question.
  for (const r of rooms) {
    if (!r.userData.dirty && !r.__switched) D.clickRaw({ kind: 'roomLever', room: r });
  }
  await settle(D, 4000);
  const walk = new Map(rooms.map(r => [r, 0]));
  const last = new Map();
  const trips = new Map();
  let mostInTheAir = 0;
  // REAL seconds, not virtual frames: the houses pace themselves by the wall
  // clock (about a round a second at speed 1), so the watch must last real
  // time. Driven by frame count, the loop's wall-clock was whatever the
  // yields happened to cost -- it PASSED while breathe() was slow and failed
  // the moment breathe() got fast, with walks of 0.0 because no round fit.
  const tWatch = performance.now();
  for (let k = 0; performance.now() - tWatch < 8000; k++) {
    D.frame(1, performance.now());
    await maybeBreathe();
    for (const r of rooms) {
      let mini = r.__ctx?.activeBot?.node;
      if (!mini) r.__ctx?.root?.traverse(o => {
        if (!mini && o.userData?.kind === 'robot') mini = o; });
      if (!mini) continue;
      const p0 = last.get(r);
      if (p0) walk.set(r, walk.get(r) + Math.hypot(mini.position.x - p0.x, mini.position.z - p0.z));
      last.set(r, { x: mini.position.x, z: mini.position.z });
    }
    // birds ON THE DESK -- outside every house -- and how far each travelled
    let air = 0;
    D.scene.traverse(o => {
      if (o.userData?.kind !== 'bird' || !o.__flying) return;
      air++;
      for (let q = o.parent; q; q = q.parent) if (q.userData?.kind === 'room') return;
      const wp = o.getWorldPosition(new D.V3());
      const seen = trips.get(o) ?? { x0: wp.x, z0: wp.z, d: 0 };
      seen.d = Math.max(seen.d, Math.hypot(wp.x - seen.x0, wp.z - seen.z0));
      trips.set(o, seen);
    });
    mostInTheAir = Math.max(mostInTheAir, air);
  }
  const walks = rooms.map(r => walk.get(r));
  const allWork = walks.every(d => d > 1);
  // Add 1 stands at x -1.20 and Split at x 0.60: a courier between them
  // crosses most of the table
  const crossings = [...trips.values()].filter(t2 => t2.d > 0.8).length;
  // and the piles say the activity itself ran: odds and evens, one each
  const piles = {};
  D.scene.traverse(o => { if (o.userData?.kind === 'nest' && o.userData.label)
    piles[o.userData.label] = (o.userData.pile || []).length; });
  // eight rounds, because the suite leaves the Rounds limit at 8 and a house
  // stops there like any robot: four odds and four evens is the whole run
  // A HOUSE YOU CAN SEE INTO RUNS AT A PACE YOU CAN WATCH -- about a round a
  // second at speed 1 -- so nine hundred frames is a handful of rounds, not a
  // thousand. That pace IS the assertion: Ken watched two glass houses tear
  // through 20 rounds a second because a house running its own inner houses
  // also found its neighbours on the desk and pumped them, cooldown ignored.
  const sorted = ((piles['A: odds'] ?? 0) + (piles['B: evens'] ?? 0)) > 0;
  const rounds = rooms.reduce((n, r) => n + (r.userData.stepRounds || 0), 0);
  const paced = rounds < 60;
  // no unbounded queue in the air: letters land in order, so a fast sender
  // could pile them up for ever
  const bounded = mostInTheAir <= 40;
  // OFF IS A DECISION. A "." typed while a house's turn was running was
  // undone by the turn's own answer to "is there more to do" -- so a house
  // Ken had switched off carried straight on.
  const one = rooms[0];
  D.press(one, '.');
  const roundsAtStop = one.userData.stepRounds || 0;
  await frames(D, 400);
  const staysStopped = !one.userData.dirty && !!one.userData.stopped
    && (one.userData.stepRounds || 0) === roundsAtStop;
  const ok = allWork && crossings > 0 && sorted && bounded && paced && staysStopped;

  put((ok ? 'PASS' : 'FAIL') + ' a house posts to a house  (walks='
      + walks.map(d => d.toFixed(1)).join('/') + ' desk-crossings=' + crossings
      + ' odds=' + (piles['A: odds'] ?? 0) + ' evens=' + (piles['B: evens'] ?? 0)
      + ' most-in-the-air=' + mostInTheAir + ' rounds-in-900-frames=' + rounds
      + ' stop-sticks=' + staysStopped + ')', ok ? 'pass' : 'fail');
  return ok;
}

// A DOCUMENT ARRIVES AS A PAGE. Measured off the pad's own canvas, not off a
// flag: a rendered page is laid out from the left margin, while the plain pad
// centres every line -- so the same words, imported as .md and as .txt, must
// have their ink starting in different places. And the mark has to survive a
// save, which is exactly what the first cut got wrong: the import rendered
// and came back from a load as centred grey.
const MD_DOC = ['# Zeno\'s postman', '',
  'A halver posts **1/2**, then *1/4*, then `1/8`.', '',
  '## What to watch', '', '- the bird carries the post', '- the total is exact',
  '  - even at 1/1024', '', '1. pull the halver', '2. pull the totaller', '',
  '> An empty nest puts the totaller to sleep.', '', '---', '',
  '```', 'total = (2^k - 1) / 2^k', '```', '', 'Plain last line.'].join('\n');
async function markdownCheck(D) {
  // where the ink starts, and how far down the page it reaches
  const inkOf = (pad) => {
    let cv = null;
    pad?.traverse(o => {
      const ms = o.isMesh ? [].concat(o.material) : [];
      for (const m of ms) if (!cv && m?.map?.image?.getContext) cv = m.map.image;
    });
    if (!cv) return null;
    const px = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data;
    let left = cv.width, top = cv.height, bottom = 0, dark = 0;
    for (let y = 0; y < cv.height; y++) {
      for (let x = 0; x < cv.width; x++) {
        const i = (y * cv.width + x) * 4;
        // ink, not paper: the paper is cream, the writing is dark
        if (px[i] + px[i + 1] + px[i + 2] > 330) continue;
        dark++;
        if (x < left) left = x;
        if (y < top) top = y;
        if (y > bottom) bottom = y;
      }
    }
    return { left: left / cv.width, top: top / cv.height,
             bottom: bottom / cv.height, dark, w: cv.width };
  };
  const bring = async (name, type, body) => {
    D.worldIn({ kind: 'world', v: 4, bench: [], stations: {}, active: null });
    await slowSettle(D, 2000);
    D.readMedia(new File([body ?? MD_DOC], name, { type }), null, { x: 0, z: 1.6 });
    await frames(D, 200);
    await new Promise(r => setTimeout(r, 350));
    await frames(D, 120);
    for (let i = 0; i < 8; i++) { const t = D.bench(i); if (!t) break;
      if (t.userData.kind === 'text') return t; }
    return null;
  };
  const page = await bring('notes.md', 'text/markdown');
  const inkA = inkOf(page);
  // it must survive a save: the mark is on the pad, not on the file
  const rec = D.worldOut();
  D.worldIn(rec); await slowSettle(D, 2000);
  let back = null;
  for (let i = 0; i < 8; i++) { const t = D.bench(i); if (!t) break;
    if (t.userData.kind === 'text') { back = t; break; } }
  await frames(D, 60);
  const inkB = inkOf(back);
  // A DOCUMENT TOO LONG FOR ONE PAGE HAS PAGES. Ken imported the behaviours
  // README -- eighteen thousand characters -- and got two hundred lines of
  // grey thread, because the page shrank its type until the whole of it fitted.
  const gap = String.fromCharCode(10, 10);
  const long = await bring('long.md', 'text/markdown',
    MD_DOC + gap + MD_DOC + gap + MD_DOC + gap + MD_DOC);
  const pages = long?.__mdPages ?? 1;
  const inkP1 = inkOf(long);
  long.userData.mdPage = 1;
  long.setText(long.userData.text);
  await frames(D, 40);
  const inkP2 = inkOf(long);
  const turns = pages > 1 && !!inkP1 && !!inkP2 && Math.abs(inkP1.dark - inkP2.dark) > 50;
  const plain = await bring('notes.txt', 'text/plain');
  const inkC = inkOf(plain);
  const rendered = !!page?.userData.md && !!inkA;
  const survives = !!back?.userData.md
    && !!inkB && Math.abs(inkB.left - inkA.left) < 0.03;
  // a page starts at its margin; a poem is centred, so its ink starts further in
  const fromTheMargin = !!inkA && !!inkC && inkA.left < 0.12 && inkC.left > inkA.left + 0.05;
  // and it fills the page from the top rather than floating in the middle
  const fillsThePage = !!inkA && inkA.top < 0.2 && inkA.bottom > 0.7;
  const ok = rendered && survives && fromTheMargin && fillsThePage && turns;
  put((ok ? 'PASS' : 'FAIL') + ' a document arrives as a page  (md=' + !!page?.userData.md
      + ' ink-from-left=' + (inkA ? inkA.left.toFixed(3) : '-')
      + ' plain-from-left=' + (inkC ? inkC.left.toFixed(3) : '-')
      + ' top=' + (inkA ? inkA.top.toFixed(2) : '-')
      + ' bottom=' + (inkA ? inkA.bottom.toFixed(2) : '-')
      + ' survives-save=' + survives + ' pages=' + pages
      + ' page-turns=' + turns + ')', ok ? 'pass' : 'fail');
  return ok;
}

// UNDO NEVER MINTS A TWIN. Drop a gadget into another gadget's open tray,
// undo: the pilot must come back OUT of the tray -- the same node, name and
// binding intact -- not be rebuilt on the bench while the original lives on
// inside the tray with the same live name.
async function undoTwinCheck(D) {
  const w = await (await fetch('../examples/behaviours/airplane-flight.world.json')).json();
  D.worldIn(w); await settle(D, 4000);
  const find = (lid) => { for (let i = 0; i < 30; i++) { const t = D.bench(i); if (!t) break;
    if (t.userData.lid === lid) return t; } return null; };
  const pilots = () => { let n = 0;
    D.scene.traverse(o => { if (o.userData?.lid === 'A903') n++; }); return n; };
  const pilot = find('A903'), turtle = find('A902');
  if (!pilot || !turtle) { put('FAIL undo never twins  (world did not build)', 'fail'); return false; }
  D.clickThing(turtle); await settle(D, 9000);
  D.openHeldPanel(); await settle(D, 9000);
  D.clickBench(1.4, 1.25); await settle(D, 9000);
  const tray = D.panelOf(turtle);
  D.clickThing(pilot); await settle(D, 9000);
  D.clickThing(tray); await settle(D, 20000);
  const inTray = pilots() === 1;
  D.undo(); await settle(D, 20000);
  const after = pilots();
  const back = find('A903');
  const ok = inTray && after === 1 && !!back && back.userData.boundTo === 'A901';
  put((ok ? 'PASS' : 'FAIL') + ' undo never twins  (into-tray=' + inTray
      + ' pilots-after-undo=' + after + ' back-on-bench=' + !!back
      + ' binding-kept=' + (back?.userData.boundTo === 'A901') + ')', ok ? 'pass' : 'fail');
  return ok;
}

// THE ROBOT READS ITS OWN NOTEBOOK. A round snapshots the pages at its first
// read, so the user can be HOLDING the notebook mid-run and the robot still
// works -- where it used to abort with "there is no notebook here".
async function notebookCheck(D) {
  D.worldIn({ kind: 'world', v: 4,
    bench: [{ thing: { kind: 'notebook', page: 0,
                       pages: [{ kind: 'number', value: { n: '7', d: '1' } }] },
              x: 0.9, z: 1.3 }],
    stations: { stand: { kind: 'box', holes: [null] } },
    active: { kind: 'robot', name: 'reader',
      condition: { kind: 'anyBox', n: 1 },
      program: [
        { type: 'take', at: { c: 'notebook', path: [0] } },
        { type: 'put', at: { c: 'given', path: [0] } }],
      trainedOn: { kind: 'box', holes: [null] }, team: [] } });
  await settle(D, 4000);
  let nb = null;
  D.scene.traverse(o => { if (o.userData?.kind === 'notebook') nb = o; });
  if (!nb) { put('FAIL the robot reads its own notebook  (no notebook)', 'fail'); return false; }
  nb.userData.main = true;
  D.hold(nb); await settle(D, 9000);
  D.rounds(5);
  D.run(); await settle(D, 60000);
  D.rounds(ROUNDS);
  const given = D.mine([0]);
  const total = given?.userData?.kind === 'number'
    ? given.userData.value.n + '/' + given.userData.value.d : '-';
  const stillHeld = D.state.hand === 'notebook';
  const ok = total === '35/1' && stillHeld;
  put((ok ? 'PASS' : 'FAIL') + ' the robot reads its own notebook  (five sevens='
      + total + ' notebook-stayed-in-hand=' + stillHeld + ')', ok ? 'pass' : 'fail');
  return ok;
}

// A LETTER AT A TIME, AND THE LEVER MEANS STOP. zeno behind glass at speed
// 1: a house that has posted a courier is not offered another turn until the
// letter is on the nest, so no backlog can build behind the watcher's back --
// and stopping the sender stops the arrivals within one flight. The lever of
// the mail-driven totaller must STOP it: it is dirty only for the instant a
// letter lands, and judged by dirty the press used to take the start branch
// instead ("the totaller robot ignored the stop button").
async function paceAndLeverCheck(D) {
  const w = await (await fetch('../examples/behaviours/zeno.world.json')).json();
  D.worldIn(w); await slowSettle(D, 2000);
  D.speed(1);
  const rooms = [];
  for (let i = 0; i < 10; i++) { const t = D.bench(i); if (!t) break;
    if (t.userData.kind === 'room') rooms.push(t); }
  const halver = rooms.find(r => r.userData.label !== 'the totaller');
  const tot = rooms.find(r => r.userData.label === 'the totaller');
  D.clickRaw({ kind: 'roomLever', room: halver });
  D.clickRaw({ kind: 'roomLever', room: tot });
  const denOf = () => {
    const v = tot.__ctx?.standOcc?.userData?.holes?.[1]?.thing?.userData?.value;
    return v ? BigInt(v.d) : null;
  };
  // REAL seconds -- the pace is wall-clock
  let most = 0;
  const t0 = performance.now();
  while (performance.now() - t0 < 7000) {
    D.frame(1, performance.now());
    most = Math.max(most, D.sizes.flights);
    await maybeBreathe();
  }
  const den1 = denOf();
  const delivered = den1 != null && den1 >= 4n;   // at least two letters landed
  const paced = most <= 3;                        // one letter at a time, not a swarm
  // the lever stops the mail-driven house
  D.clickRaw({ kind: 'roomLever', room: tot });
  const totStopped = !!tot.userData.stopped && !tot.userData.dirty;
  D.clickRaw({ kind: 'roomLever', room: tot });   // and starts it again
  const totRestarts = !tot.userData.stopped;
  // stopping the SENDER stops the arrivals within about one flight
  D.clickRaw({ kind: 'roomLever', room: halver });
  const halverStopped = !!halver.userData.stopped;
  const t1 = performance.now();
  while (performance.now() - t1 < 2500) { D.frame(1, performance.now()); await maybeBreathe(); }
  const den2 = denOf();
  const t2 = performance.now();
  while (performance.now() - t2 < 3000) { D.frame(1, performance.now()); await maybeBreathe(); }
  const den3 = denOf();
  const drains = den2 != null && den3 === den2;   // nothing more once the air is clear
  const ok = delivered && paced && totStopped && totRestarts && halverStopped && drains;
  put((ok ? 'PASS' : 'FAIL') + ' a letter at a time, and the lever means stop  (total-den='
      + String(den1) + ' most-in-air=' + most + ' lever-stops=' + totStopped
      + ' lever-restarts=' + totRestarts + ' sender-stops=' + halverStopped
      + ' drains=' + drains + ' den-after=' + String(den3) + ')', ok ? 'pass' : 'fail');
  D.speed(1);
  return ok;
}

// FOLDING A PANEL NEVER FREEZES THE LIVE PANEL NESTED INSIDE IT. The knob
// used to judge the plane's panel by its own work -- no robot, not dirty --
// and serialized the whole world, taking the switched-on turtle panel with
// it: its letterbox left the scene and Ken's hand-flown orders had nowhere
// to land. A fold over live nested work keeps the tray on the bench, closed.
async function foldAliveCheck(D) {
  const w = await (await fetch('../examples/behaviours/airplane-flight.world.json')).json();
  D.worldIn(w); await slowSettle(D, 2000);
  D.speed(1);
  const all = [];
  for (let i = 0; i < 20; i++) { const t = D.bench(i); if (!t) break; all.push(t); }
  const plane = all.find(t => t.userData.kind === 'model');
  const turtleG = all.find(t => t.userData.lid === 'A902');
  if (!plane || !turtleG) { put('FAIL a fold keeps nested work alive  (world did not build)', 'fail'); return false; }
  const at = { x: plane.position.x, z: plane.position.z };
  D.switchGadget(turtleG, true); await slowSettle(D, 2000);
  const turtleTray = D.panelOf(turtleG);
  const letterbox = turtleTray?.__ctx?.standOcc?.userData?.holes?.map(h => h.thing)
    .find(t => t?.userData?.kind === 'nest') ?? null;
  D.hold(plane); D.openHeldPanel(); D.clickBench(at.x, at.z);
  await slowSettle(D, 2000);
  const planeTray = D.panelOf(plane);
  if (!planeTray || !turtleTray || !letterbox) {
    put('FAIL a fold keeps nested work alive  (no trays)', 'fail'); return false;
  }
  turtleTray.visible = true; turtleTray.__closed = false;
  D.hold(turtleTray); D.clickRaw({ kind: 'thing', thing: planeTray });
  await slowSettle(D, 2000);
  let nested = false;
  for (let q = turtleTray.parent; q; q = q.parent) if (q === planeTray) { nested = true; break; }
  D.clickRaw({ kind: 'panelClose', tray: planeTray });
  await slowSettle(D, 2000);
  const keptLive = plane.__panelTray === planeTray && !!planeTray.__closed;
  const boxInScene = (() => { let q = letterbox; while (q && q.parent) q = q.parent;
    return q?.type === 'Scene'; })();
  const f0 = turtleTray.__frame || 0;
  for (let i = 0; i < 90; i++) { D.frame(1, fnow()); if ((i & 31) === 31) await maybeBreathe(); }
  const stillTicks = (turtleTray.__frame || 0) > f0;
  const ok = nested && keptLive && boxInScene && stillTicks;
  put((ok ? 'PASS' : 'FAIL') + ' a fold keeps nested work alive  (nested=' + nested
      + ' tray-kept-live=' + keptLive + ' letterbox-in-scene=' + boxInScene
      + ' nested-panel-still-ticks=' + stillTicks + ')', ok ? 'pass' : 'fail');
  return ok;
}

// THE ROBOT MOVES OVER SO ITS HAND IS AT THE STACK. One decision picks the
// grab pose by the pile-top's height and stands where that pose's claw lands
// on the pile -- so the horizontal claw-to-top distance at the closest
// approach is ~0, for the take AND for the drop onto the target. The lerp
// this replaced could be a cube's width off ("reaching to the wrong place").
async function reachAtPileCheck(D) {
  const pile = [];
  for (let i = 0; i < 12; i++) pile.push({ kind: 'number', value: { n: String(i + 1), d: '1' }, op: '+' });
  D.worldIn({ kind: 'world', v: 4, bench: [],
    stations: { stand: { kind: 'box', holes: [
      { kind: 'nest', id: 7701, guid: 'reach-post', hasEgg: false, pile },
      { kind: 'number', value: { n: '0', d: '1' }, op: '+' }] } },
    active: { kind: 'robot', name: 'reader',
      condition: { kind: 'box', holes: [{ kind: 'wildNumber' }, { kind: 'wildNumber' }] },
      program: [{ type: 'take', at: { c: 'given', path: [0] } },
                { type: 'put',  at: { c: 'given', path: [1] } }],
      trainedOn: { kind: 'box', holes: [{ kind: 'number', value: { n: '1', d: '1' }, op: '+' },
                                        { kind: 'number', value: { n: '0', d: '1' }, op: '+' }] },
      team: [] } });
  await slowSettle(D, 4000);
  const nests = [];
  D.scene.traverse(o => { if (o.userData?.kind === 'nest') nests.push(o); });
  const nest = nests.find(n => (n.userData.pile || []).length);
  if (!nest) { put('FAIL the hand is at the stack  (no pile built)', 'fail'); return false; }
  const topOf = () => { const p2 = nest.userData.pile; return p2.length ? p2[p2.length - 1] : null; };
  D.speed(1); D.rounds(2);
  D.run();
  let minTake = 99, minPut = 99, takeDy = 99;
  // AND IT CAN BE SEEN ON THE WAY. The nest remembers the ten it showed last
  // so that a restack stays cheap, and the top of the pile -- the one a robot
  // takes -- was in that list, so the number crossed the desk invisibly and
  // appeared only where it landed. Every frame the claw holds something, that
  // something must be visible.
  let carried = 0, seenCarried = 0;
  for (let i = 0; i < 60 * 40 && (D.state.busy || D.state.queued || D.state.current); i++) {
    D.frame(1, fnow());
    const ch = D.clawThing();
    if (ch) { carried++; if (ch.visible) seenCarried++; }
    const c = D.claw();
    const top = topOf();
    if (top && c.y != null) {
      const tp = top.getWorldPosition(new D.V3());
      const d = Math.hypot(c.x - tp.x, c.z - tp.z);
      if (d < minTake) { minTake = d; takeDy = c.y - tp.y; }
    }
    const targ = D.mine ? D.mine([1]) : null;
    if (targ && c.y != null) {
      const tp2 = targ.getWorldPosition(new D.V3());
      minPut = Math.min(minPut, Math.hypot(c.x - tp2.x, c.z - tp2.z));
    }
    await maybeBreathe();
  }
  await slowSettle(D, 30000);
  D.rounds(ROUNDS);
  const total = D.mine([1]);
  const sum = total?.userData?.value ? total.userData.value.n + '/' + total.userData.value.d : '-';
  const ok = minTake < 0.15 && minPut < 0.15 && sum === '23/1'
    && nest.userData.pile.length === 10
    && carried > 60 && seenCarried === carried;
  put((ok ? 'PASS' : 'FAIL') + ' the hand is at the stack  (take-off-by='
      + minTake.toFixed(3) + ' take-dy=' + takeDy.toFixed(2)
      + ' put-off-by=' + minPut.toFixed(3) + ' sum=' + sum
      + ' pile-left=' + nest.userData.pile.length
      + ' carried-frames=' + carried + ' seen=' + seenCarried + ')', ok ? 'pass' : 'fail');
  return ok;
}

// A PUZZLE IS A WORLD FILE. Nothing new is needed to make one: a constrained
// world (rules say which stacks and tools exist), a goal in plain sight that
// cannot be taken, a bird to give the answer to, and a judge -- a robot team
// in an opaque house, dozing on the post nest -- that decides with its own
// thought bubble and answers by bird. The judge's last step opens the next
// world by name, which is the one robot step that did not exist. This drives
// puzzle 1 from the original tutorial end to end: a wrong answer comes back,
// the right one is judged and puzzle 2 arrives, Marty gives the author's
// hints in order, and Start over puts the puzzle back.
async function puzzleCheck(D, w) {
  let stage = 'load';
  try { return await puzzleCheckBody(D, w, (s2) => { stage = s2; }); }
  catch (e) { throw new Error('at stage "' + stage + '": ' + e.message); }
}
async function puzzleCheckBody(D, w, at) {
  const rec = await (await fetch('../examples/puzzles/p1.world.json')).json();
  D.worldIn(rec);
  await slowSettle(D, 3000);
  const find = (pred) => { for (let i = 0; i < 14; i++) { const t = D.bench(i); if (t && pred(t)) return t; } return null; };
  const line = [];
  const must = (x, what) => { if (!x) throw new Error('no ' + what + ' on the table: '
    + (() => { const k = []; for (let i = 0; i < 14; i++) { const t = D.bench(i); if (!t) break; k.push(t.userData.kind); } return k.join(','); })()); return x; };
  // 1. the rules of the place
  at('rules');
  const constrained = D.worldName === 'p1'
    && D.stations.numbers.__plinth.visible === false
    && D.stations.copyOut.__node?.visible === false
    && w.document.getElementById('againBtn').style.display !== 'none';
  line.push('constrained=' + constrained);
  // 2. the goal stays put
  at('goal');
  const goal = must(find(t => t.userData.fixed && !t.userData.ghost), 'goal');
  D.clickThing(goal); await frames(D, 30);
  const goalStays = !!goal && D.state.hand === null;
  line.push('goal-stays=' + goalStays);
  // 3. hints, in the author's order, no brain needed
  at('hints');
  const h1 = D.nextHint('hint'), h2 = D.nextHint('I am stuck'), h3 = D.nextHint('hint'), h4 = D.nextHint('hint');
  const hinted = /pick up numbers/.test(h1) && /first hole/.test(h2) && /what I/.test(h3) && h4 === h3;
  line.push('hints-in-order=' + hinted);
  // 4. a wrong answer comes back
  at('wrong answer');
  const bird = must(find(t => t.userData.kind === 'bird'), 'bird');
  const reply = must(find(t => t.userData.kind === 'nest'), 'reply nest');
  const one = must(find(t => t.userData.kind === 'number' && t.userData.value.n === 1n), 'a 1');
  const two = must(find(t => t.userData.kind === 'number' && t.userData.value.n === 2n), 'a 2');
  const emptyBox = must(find(t => t.userData.kind === 'box' && !t.userData.fixed), 'an empty box');
  D.hold(one); D.clickThing(bird);
  const heard = []; const hintEl2 = w.document.getElementById('hint');
  const seen2 = () => { const t = hintEl2?.textContent || ''; if (t && heard[heard.length - 1] !== t) heard.push(t.slice(0, 70)); };
  // A WRONG ANSWER COMES BACK WITH A NOTE: the judge sends a copy of its "not
  // quite" pad -- Mimi is the workshop's, so a robot in a house can copy --
  // and then the answer itself. Two deliveries, the pad first.
  for (let i = 0; i < 200 && reply.userData.pile.filter(t => t.userData.kind === 'number').length === 0; i++) { await frames(D, 20); await maybeBreathe(); seen2(); }
  for (let i = 0; i < 60 && !reply.userData.pile.some(t => t.userData.kind === 'text'); i++) { await frames(D, 20); await maybeBreathe(); seen2(); }
  const back = must(reply.userData.pile.find(t => t.userData.kind === 'number'), 'answer back on the reply nest (judge: '
    + JSON.stringify(D.ctxInfo(find(t => t.userData.kind === 'room'))) + ')');
  const noted = reply.userData.pile.some(t => /Not quite/.test(t.userData.text || ''));
  const wrongBack = !!back && back.userData.kind === 'number' && noted;
  line.push('wrong-comes-back=' + wrongBack + '/with-a-note=' + noted
    + (noted ? '' : ' pile=' + reply.userData.pile.map(t => t.userData.kind).join(',') + ' heard=' + JSON.stringify(heard.slice(-4))));
  // ...and the note is a COPY: the judge still holds its own
  const judgeRoom = find(t => t.userData.kind === 'room');
  const keeps = D.ctxInfo(judgeRoom).standOcc === 'box';
  line.push('judge-keeps-its-note=' + keeps);
  // TAKING A THING OUT OF A BOX ON A NEST strikes it off the hole. It did not:
  // the hole went on pointing at a number now in the hand, so a number
  // dropped elsewhere changed the box too, and undo doubled everything.
  const note = reply.userData.pile.find(t => t.userData.kind === 'text');
  if (note) { D.clickThing(note); await frames(D, 30); D.clickBench(0.9, 2.2); await frames(D, 60); }
  const holeBefore = null;
  line.push('hole-struck-off=' + (() => { return 'n/a'; })());
  at('taking it back');
  D.clickThing(back); await frames(D, 60);
  const one2 = D.state.hand === 'number' ? back : one;
  const struck = !reply.userData.pile.includes(back);
  line[line.length - 1] = 'taken-off-the-nest=' + struck;
  D.clickBench(-0.6, 1.6); await frames(D, 120);
  // 5. the right answer is judged, and the next puzzle arrives
  at('right answer');
  D.hold(one2); D.clickHole(emptyBox, 0); await frames(D, 90);
  D.hold(two); D.clickHole(emptyBox, 1); await frames(D, 90);
  D.hold(emptyBox); D.clickThing(bird);
  // THE JUDGE OFFERS, THE PLAYER PRESSES. Ken never saw the note for solving
  // puzzle 1 -- it was in the air when the table changed under it. So the
  // right answer must leave the note ON the reply nest, the table still on
  // puzzle 1, and the Next button armed; Next is what brings puzzle 2.
  for (let i = 0; i < 120 && !D.nextWorld; i++) { await frames(D, 20); await maybeBreathe(); }
  // the offer is made the moment the judge's last step runs; the note is
  // still in the bird's beak for a second after that
  for (let i = 0; i < 150 && !reply.userData.pile.some(t => /Well done/.test(t.userData.text || '')); i++) { await frames(D, 20); await maybeBreathe(); }
  const offered = D.nextWorld === 'p2' && D.worldName === 'p1'
    && reply.userData.pile.some(t => /Well done/.test(t.userData.text || ''))
    && w.document.getElementById('nextBtn').style.display !== 'none';
  line.push('offered=' + offered);
  D.goNext();
  for (let i = 0; i < 120 && D.worldName !== 'p2'; i++) { await frames(D, 20); await maybeBreathe(); }
  const next = D.worldName === 'p2' && !!find(t => t.userData.fixed && t.userData.kind === 'number')
    && w.document.getElementById('nextBtn').style.display === 'none';
  line.push('next-puzzle=' + next);
  // 6. start over puts THIS puzzle back exactly as it began
  at('start over');
  const twos = () => { let n = 0; for (let i = 0; i < 14; i++) { const t = D.bench(i);
    if (t?.userData.kind === 'number' && !t.userData.fixed && t.userData.value.n === 2n) n++; } return n; };
  const a = find(t => t.userData.kind === 'number' && !t.userData.fixed);
  D.hold(a); D.clickBench(0.2, 1.9); await frames(D, 120);       // move one, so restart has something to undo
  D.startOver(); await slowSettle(D, 3000);
  const again = D.worldName === 'p2' && twos() === 2;
  line.push('start-over=' + again);

  const panel = w.document.getElementById('martyPanel'); if (panel) panel.style.display = 'none';
  w.document.activeElement?.blur?.();
  const ok = constrained && goalStays && hinted && wrongBack && keeps && struck && offered && next && again;
  put((ok ? 'PASS' : 'FAIL') + ' a puzzle is a world file  (' + line.join(' ') + ')', ok ? 'pass' : 'fail');
  return ok;
}

// EVERY PUZZLE FILE JUDGES ITS OWN GOAL. Five files, each with a goal on the
// table and a judge in a house whose leader's thought is meant to BE that
// goal -- so the thing the author put on the table to be copied must be a
// thing the judge would accept. Asked from outside the house, through the
// hydrated robot's condition, for each file in turn; and each file's rules
// must have taken effect (no number stack on a puzzle that lists none).
async function puzzleSetCheck(D) {
  const line = [];
  let ok = true;
  for (const name of ['p1', 'p2', 'p3', 'p4', 'p5', 'p6', 'p7']) {
    const rec = await (await fetch('../examples/puzzles/' + name + '.world.json')).json();
    D.worldIn(rec);
    await slowSettle(D, 3000);
    let goal = null, judge = null;
    for (let i = 0; i < 16; i++) { const t = D.bench(i); if (!t) break;
      if (t.userData.fixed && !t.userData.ghost) goal = t;   /* the ship is fixed too, and ghost */ if (t.userData.kind === 'room' && t.userData.judge) judge = t; }
    const cond = judge?.__ctx?.activeBot?.condition;
    const accepts = cond && goal ? D.matchOf(cond.holes[0], goal) : 'no judge';
    const stacksOff = (rec.rules.stacks.length === 0) === (D.stations.numbers.__plinth.visible === false);
    const good = accepts === 'yes' && stacksOff && D.worldName === name;
    if (!good) ok = false;
    line.push(name + '=' + accepts + (stacksOff ? '' : '/stacks?'));
  }
  put((ok ? 'PASS' : 'FAIL') + ' every puzzle judges its own goal  (' + line.join(' ') + ')', ok ? 'pass' : 'fail');
  return ok;
}

// A DAYDREAM LEAVES NOTHING BEHIND. Ken watched a robot copy a unicorn until
// the work spots were full, stopped it, and found the herd on the desk -- and
// read that as a lesson that had failed to rewind. It was a RUN, whose work is
// real and is meant to be kept; but the two look identical at the moment the
// robot stops, so the workshop now says which just happened. This pins the
// half that must never change: whatever you do inside the bubble -- copies on
// the table, copies on fresh work spots, something left on Mimi, something
// still in the claw -- is gone when you leave.
async function daydreamCheck(D, w) {
  const models = () => { let m = 0;
    D.scene.traverse(o => { if (o.userData?.kind === 'model') m++; }); return m; };
  const spots = () => Object.values(D.stations)
    .filter(s2 => s2.kind === 'scratch').length;
  const start = async () => {
    D.worldIn({ kind: 'world', v: 4, stations: {}, bench: [],
      active: { kind: 'robot', name: 'copier', program: [], team: [] } });
    await slowSettle(D, 3000);
    const m = D.makeFromReply(JSON.stringify({ name: 'a unicorn', parts: [
      { shape: 'sphere', size: [0.09], at: [0, 0.08, 0], color: '#ffffff' }] }), 'a unicorn')?.thing;
    await slowSettle(D, 2000);
    D.hold(m);
    D.clickActive();                       // the lesson begins
    await slowSettle(D, 4000);
    return m;
  };
  const copyOnto = async (model, where) => {
    D.clickThing(model); await slowSettle(D, 4000);
    D.clickRaw({ kind: 'station', id: 'copyIn' }); await slowSettle(D, 5000);
    D.clickRaw({ kind: 'station', id: 'copyOut' }); await slowSettle(D, 4000);
    if (where === 'bench') D.clickBench(-0.5, 1.9);
    else D.clickRaw({ kind: 'station', id: where });
    await slowSettle(D, 4000);
  };
  const line = [];
  let ok = true;
  for (const [tag, run2] of [
    ['work spots', async (m) => { await copyOnto(m, 's0'); await copyOnto(m, 's1'); }],
    ['the table', async (m) => { await copyOnto(m, 'bench'); }],
    ['on Mimi', async (m) => { D.clickThing(m); await slowSettle(D, 4000);
      D.clickRaw({ kind: 'station', id: 'copyIn' }); await slowSettle(D, 5000); }],
    ['in the claw', async (m) => { D.clickThing(m); await slowSettle(D, 4000); }],
  ]) {
    const model = await start();
    if (!model) { put('FAIL a daydream leaves nothing behind  (no model)', 'fail'); return false; }
    const base = models();                 // the given one, and the bubble's picture
    await run2(model);
    const during = models();
    w.document.getElementById('exitBtn').click();
    await slowSettle(D, 6000);
    const after = models();
    const clean = after === base && D.state.mode === 'world';
    if (!clean) ok = false;
    line.push(tag + '=' + during + '->' + after + (clean ? '' : ' LEAK'));
  }

  // ...and the two robots on the table are described differently, since what
  // dropping something on one MEANS depends on whether it has been taught
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [
    { thing: { kind: 'robot', name: 'green', program: [], team: [] }, x: -0.7, z: 1.5 },
    { thing: { kind: 'robot', name: 'taught', team: [],
        condition: { kind: 'box', holes: [{ kind: 'wildNumber' }] },
        program: [{ type: 'take', at: { c: 'given', path: [0] } }],
        trainedOn: { kind: 'box', holes: [{ kind: 'number', value: { n: '1', d: '1' }, op: '+' }] } },
      x: 0.7, z: 1.5 },
    { thing: { kind: 'number', value: { n: '5', d: '1' }, op: '+' }, x: 0, z: 2.0 }] });
  await slowSettle(D, 3000);
  const bots = [];
  for (let i = 0; i < 10; i++) { const t = D.bench(i); if (!t) break;
    if (t.userData.kind === 'robot') bots.push(t); }
  let num = null;
  for (let i = 0; i < 10; i++) { const t = D.bench(i);
    if (t?.userData.kind === 'number') { num = t; break; } }
  D.hold(num); await frames(D, 60);
  const cv = D.renderer.domElement, r = cv.getBoundingClientRect();
  const tipOver = (node) => {
    const pt = node.getWorldPosition(new D.V3()); pt.y += 0.15; pt.project(D.camera);
    cv.dispatchEvent(new w.PointerEvent('pointermove', { bubbles: true,
      clientX: r.left + (pt.x * 0.5 + 0.5) * r.width,
      clientY: r.top + (-pt.y * 0.5 + 0.5) * r.height }));
    return w.document.getElementById('tip')?.textContent || '';
  };
  const green = tipOver(bots[0]), taught = tipOver(bots[1]);
  const tips = /lesson/.test(green) && /work/.test(taught) && green !== taught;
  if (!tips) ok = false;

  put((ok ? 'PASS' : 'FAIL') + ' a daydream leaves nothing behind  (' + line.join(' ')
      + ' untrained-tip=' + /lesson/.test(green) + ' trained-tip=' + /work/.test(taught)
      + ')', ok ? 'pass' : 'fail');
  return ok;
}

// THE BRAIN IN CHROME IS TOLD WHAT SHAPE TO ANSWER IN, and it was told the
// chat shape whatever it was asked -- so Make got a perfectly well-formed
// conversational reply and was blamed for not being a model. Ken's console:
// {"say":"Here you go! A little blue box...","demo":"boxes"}. The check stands
// in for Chrome's model and reads back what it was asked to answer with.
async function nanoShapeCheck(D, w) {
  const asked = [];
  const had = w.LanguageModel;
  w.LanguageModel = {
    availability: async () => 'available',
    create: async () => ({
      prompt: async (q, o) => {
        const props = Object.keys(o?.responseConstraint?.properties || {});
        asked.push(props.join(',') || 'none');
        if (props.includes('parts')) return JSON.stringify({ name: 'a blue box',
          parts: [{ shape: 'box', size: [0.2, 0.1, 0.2], at: [0, 0.05, 0], color: 'blue' }] });
        if (props.includes('orders')) return JSON.stringify({ name: 'a line', orders: 'forward 40' });
        return JSON.stringify({ say: 'Hello!', demo: null });
      },
      destroy() {},
    }),
  };
  w.localStorage.setItem('tt3d.marty-provider', 'nano');
  try {
    D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [] });
    await slowSettle(D, 3000);
    const count = (k) => { let m = 0;
      D.scene.traverse(o => { if (o.userData?.kind === k) m++; }); return m; };
    const models0 = count('model'), pads0 = count('text');
    w.document.getElementById('martyIn').value = 'a little blue box';
    w.document.getElementById('martyMakeBtn').click();
    for (let i = 0; i < 90 && count('model') === models0; i++) { await frames(D, 10); }
    const made = count('model') - models0;
    w.document.getElementById('martyIn').value = 'a straight line';
    w.document.getElementById('martyDrawBtn').click();
    for (let i = 0; i < 90 && count('text') === pads0; i++) { await frames(D, 10); }
    const drew = count('text') - pads0;
    const ok = asked[0] === 'name,parts' && asked[1] === 'name,orders' && made === 1 && drew === 1;
    put((ok ? 'PASS' : 'FAIL') + ' the brain in Chrome is asked properly  (told="'
        + asked.join('" then "') + '" made=' + made + ' drew=' + drew + ')',
        ok ? 'pass' : 'fail');
    return ok;
  } finally {
    if (had) w.LanguageModel = had; else delete w.LanguageModel;
    w.localStorage.removeItem('tt3d.marty-provider');
    w.document.activeElement?.blur?.();
    const panel = w.document.getElementById('martyPanel'); if (panel) panel.style.display = 'none';
  }
}

// A NUMBER IN YOUR HAND. Two things Ken asked for, and they are the same
// thought twice: what you have done to a thing belongs to the thing. A cube
// turned to the face you wanted was levelled the moment it touched the table,
// and the face you were reading could not be copied at all -- a face is a
// canvas, and a canvas is not text.
async function numberInHandCheck(D, w) {
  w.document.activeElement?.blur?.();     // a check that types must own the keyboard
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [
    { thing: { kind: 'number', value: { n: '1234567', d: '1' }, op: '+' }, x: 0.2, z: 1.6 }] });
  await slowSettle(D, 3000);
  const num = D.bench(0);
  // the clipboard, watched rather than read: reading it needs a permission the
  // suite has no way to grant, and what matters is what the workshop offered
  let copied = null;
  const realWrite = w.navigator.clipboard.writeText;
  w.navigator.clipboard.writeText = (t) => { copied = t; return Promise.resolve(); };
  try {
    D.hold(num);
    await frames(D, 60);
    w.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'c', ctrlKey: true, bubbles: true }));
    await frames(D, 30);
    const plain = copied;
    // turn it: the arrows have always turned what you hold
    w.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
    await frames(D, 60);
    w.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'c', ctrlKey: true, bubbles: true }));
    await frames(D, 30);
    const turnedCopy = copied;
    const heldQ = num.quaternion.toArray();
    // ...and put it down: it must stay as you left it
    D.clickBench(0.6, 1.6);
    await slowSettle(D, 4000);
    const downQ = num.quaternion.toArray();
    // as you left it -- SQUARED TO THE TABLE: the hand rolls a number about the
    // line of sight so its writing is upright for the camera, and a thing set
    // down keeps its quarter turns and drops that roll (Ken: a cube's face was
    // not parallel to the desk). So: within the roll of the held turn, and
    // every axis of the set-down turn on an axis of the table.
    const Q = D.THREE.Quaternion, M = D.THREE.Matrix4;
    const roll = new Q().fromArray(heldQ).angleTo(new Q().fromArray(downQ));
    const els = new M().makeRotationFromQuaternion(new Q().fromArray(downQ)).elements.slice(0, 12);
    const offAxis = Math.max(...els.map(v => Math.min(Math.abs(v), Math.abs(Math.abs(v) - 1))));
    const turned = new Q().fromArray(downQ).angleTo(new Q()) > 1.0;   // the quarter turn survived
    const kept = roll < 0.6 && offAxis < 1e-3 && turned;

    const copiesFace = plain === '1234567' && turnedCopy !== plain && !!turnedCopy;
    // ...and a MADE THING tips end over end, which a number could always do and
    // a model could not: a unicorn has a top and an underside.
    const model = D.makeFromReply(JSON.stringify({ name: 'a unicorn', parts: [
      { shape: 'sphere', size: [0.09], at: [0, 0.08, 0], color: '#fff' }] }), 'a unicorn')?.thing;
    await frames(D, 60);
    D.hold(model);
    await frames(D, 60);
    const mq = model.quaternion.clone();
    w.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'ArrowUp', bubbles: true }));
    await frames(D, 60);
    const tipped = mq.angleTo(model.quaternion);
    const tips = tipped > 1.3 && tipped < 1.9;

    const ok = copiesFace && kept && tips;
    const focus = w.document.activeElement; const focusName = focus ? (focus.id || focus.tagName) : 'none';
    put((ok ? 'PASS' : 'FAIL') + ' a number keeps what you did to it  (focus=' + focusName + ' mode=' + D.state.mode + ' copied="'
        + String(plain).slice(0, 12) + '" after-a-turn="' + String(turnedCopy).slice(0, 14)
        + '" keeps-its-turn=' + kept + '/roll=' + roll.toFixed(2) + '/off-axis=' + offAxis.toFixed(3) + '/turned=' + turned + ' model-tips=' + tipped.toFixed(2) + 'rad)',
        ok ? 'pass' : 'fail');
    return ok;
  } finally {
    w.navigator.clipboard.writeText = realWrite;
  }
}

// A ROBOT CAN BE TAUGHT WITH A MODEL. Giving one to a robot builds its thought
// bubble and puts the thought into words, and both of those walked into the
// same trap the copier did: an else that assumed a box, reading holes a model
// has not got. It threw during the click that starts the lesson, so the
// workshop stopped with the bubble half-built -- "it couldn't pick it up and
// then it froze". And underneath that, a quieter one: a kind with no matching
// rule of its own answered "no" to ITSELF, so a robot taught with a model
// would not have recognised that very model afterwards.
async function trainWithModelCheck(D, w) {
  D.worldIn({ kind: 'world', v: 4, stations: {}, bench: [],
    active: { kind: 'robot', name: 'learner', program: [], team: [] } });
  await slowSettle(D, 3000);
  const model = D.makeFromReply(JSON.stringify({ name: 'a boat', parts: [
    { shape: 'box', size: [0.14, 0.035, 0.34], at: [0, 0.02, 0], color: '#8b5a2b' }]
  }), 'a boat')?.thing;
  if (!model) { put('FAIL a robot can be taught with a model  (no model)', 'fail'); return false; }
  D.hold(model);
  D.clickActive();                       // hand it over: that starts the lesson
  await slowSettle(D, 4000);
  const teaching = D.state.mode === 'training';
  const words = D.condWords() || '';
  const saidSomething = /model|boat/i.test(words);
  // it takes the model off its desk, and what it carries can be seen
  D.clickThing(model);
  await slowSettle(D, 6000);
  const held = D.clawThing();
  const tookIt = !!held && held.kind === 'model' && held.visible;
  // ...and the very same model answers its thought
  const answers = D.condMatches(model);
  const still = !D.state.current && !D.state.queued;
  w.document.getElementById('exitBtn').click();
  await slowSettle(D, 6000);
  const backOut = D.state.mode === 'world';

  const ok = teaching && saidSomething && tookIt && answers === 'yes' && still && backOut;
  put((ok ? 'PASS' : 'FAIL') + ' a robot can be taught with a model  (lesson-starts='
      + teaching + ' thought-says="' + words.slice(0, 40) + '"'
      + ' picks-it-up=' + tookIt + ' recognises-it=' + answers
      + ' answering=' + still + ' leaves=' + backOut + ')', ok ? 'pass' : 'fail');
  return ok;
}

// EVERY WHOLE NUMBER SAYS ITSELF IN ENGLISH. The names ran out at decillion and
// everything past it fell into scientific notation, which is not something a
// child reads aloud. The scales now go to vigintillion, and past even those a
// number is read as "about five point seven times ten to the power of sixty" --
// still English, still true. The check asks what the FACE would show, since a
// name that has to be cut off with an ellipsis is not the number displayed.
async function bigWordsCheck(D) {
  const cases = [
    ['12 digits', '123456789012', 'full'],
    ['36 digits', '576460752303423487576460752303423487', 'full'],
    ['40 digits', '1234567890123456789012345678901234567890', 'full'],
    ['70 digits', '5'.padEnd(70, '7'), 'full'],
    ['200 digits', '7'.padEnd(200, '3'), 'full'],
  ];
  const line = [], bad = [];
  for (const [tag, n, want2] of cases) {
    const shown = D.faceWords(n);
    const short = /times ten to the power of/.test(shown);
    // a gap in the MIDDLE is the head-and-tail showing; only a trailing ellipsis is a name cut off
    const cut = /…\s*$/.test(shown.trim());
    const digits = /[0-9]/.test(shown);
    // the whole name, head and tail with the middle closing up -- Ken wanted
    // the name itself on the face, not the "about ... times ten" reading
    const gapped = /…/.test(shown) && !/…\s*$/.test(shown);
    const okOne = !cut && !digits && (want2 === 'short' ? short : !short)
      && (n.length < 60 || gapped);
    if (!okOne) bad.push(tag + (cut ? ' cut-off' : '') + (digits ? ' has-digits' : '')
      + (short ? ' short' : ' full'));
    line.push(tag + '=' + (short ? 'short' : 'full') + (cut ? '/CUT' : '') + (n.length >= 60 ? (gapped ? '/head+tail' : '/NO-GAP') : ''));
  }
  // THE SCALE NAMES ARE BUILT FROM LATIN, so they do not stop where a table
  // would have. Three spot checks against the names the dictionaries give.
  const named = { vigintillion: D.words('1'.padEnd(64, '0')),      // ten to the 63rd
                  trigintillion: D.words('1'.padEnd(94, '0')),     // ...to the 93rd
                  centillion: D.words('1'.padEnd(304, '0')) };     // ...to the 303rd
  const latin = /^one vigintillion$/.test(named.vigintillion)
    && /^one trigintillion$/.test(named.trigintillion)
    && /^one centillion$/.test(named.centillion);

  // AND A FACE TOO LONG TO HOLD IT SHOWS THE FIRST AND LAST OF IT, the way a
  // long number's digits taper to an ellipsis and come back. Cutting the tail
  // off threw away the half a reader most wants.
  const huge = '2399787825375610644499733573594241610221812538008592263008224'.padEnd(900, '3');
  const grouped = D.faceWords(huge, 1, 'grouped').replace(/\s+/g, ' ');
  const gap = /\u2026/.test(grouped) && !/\u2026\s*$/.test(grouped);
  const headShown = grouped.startsWith('239,978');
  const tailShown = /3(33|,3)/.test(grouped.slice(-12));
  const bothEnds = gap && headShown && tailShown;

  const ok = !bad.length && latin && bothEnds;
  put((ok ? 'PASS' : 'FAIL') + ' every number says itself  (' + line.join(' ')
      + ' latin-scales=' + latin
      + ' head-and-tail=' + bothEnds + '/gap=' + gap + '/head=' + headShown
      + '/tail=' + tailShown
      + (bad.length ? ' BAD: ' + bad.join(', ') : '') + ')', ok ? 'pass' : 'fail');
  return ok;
}

// THE OPERATOR DOES NOT SIT ON THE NUMBER. The badge that says what dropping
// this number does is painted AFTER the face, so wherever it is put it wins.
// At (54,54) with a radius of 30 it reached down to row 84, and a long number
// spells itself out in a block that starts at row 56 -- so the plus sign lay
// across the first line of Ken's monster fraction. The check reads the painted
// canvases and asks where the writing starts, which is the thing that was
// wrong; comparing constants would only be comparing the code with itself.
async function opBadgeCheck(D) {
  const big = '576460752303423487576460752303423487';
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [
    { thing: { kind: 'number', value: { n: big, d: '8' }, op: '+' }, x: 0.2, z: 1.6 }] });
  await slowSettle(D, 3000);
  await frames(D, 400);                     // the secondary faces paint lazily
  const num = D.bench(0);
  const ims = [];
  num.traverse(o => { const i = o.material?.map?.image; if (i && i.width) ims.push(i); });
  const faces = [...new Set(ims)];
  if (!faces.length) { put('FAIL the operator keeps out of the way  (no faces painted)', 'fail'); return false; }
  const BADGE_BOTTOM = 56;                  // authored coordinates: the face is 256 square
  const rows = faces.map((im) => {
    const K = im.width / 256;
    const cv = document.createElement('canvas');
    cv.width = im.width; cv.height = im.height;
    const cx = cv.getContext('2d');
    cx.drawImage(im, 0, 0);
    const d = cx.getImageData(0, 0, im.width, im.height).data;
    // the paper's own colour, read from a blank spot rather than assumed
    const px = (x, y) => { const i = (((y * K) | 0) * im.width + ((x * K) | 0)) * 4;
      return [d[i], d[i + 1], d[i + 2]]; };
    const paper = px(128, 250 / 4);
    const ink = (x, y) => { const c2 = px(x, y);
      return Math.abs(c2[0] - paper[0]) > 14 || Math.abs(c2[1] - paper[1]) > 14
          || Math.abs(c2[2] - paper[2]) > 16; };
    // the writing, well inside the frame and away from the badge's corner
    for (let y = 30; y < 232; y++)
      for (let x = 64; x < 196; x++) if (ink(x, y)) return y;
    return 999;
  });
  const worst = Math.min(...rows);
  const ok = worst > BADGE_BOTTOM;
  put((ok ? 'PASS' : 'FAIL') + ' the operator keeps out of the way  (badge ends at '
      + BADGE_BOTTOM + ', writing starts at ' + worst + ' on ' + faces.length
      + ' faces)', ok ? 'pass' : 'fail');
  return ok;
}

// MIMI COPIES WHATEVER SHE IS GIVEN. Every kind was written into the copier
// by hand and the last branch was a catch-all that assumed a BOX -- so a made
// model, which has parts and no holes, was copied by reading holes it does not
// have. The throw happened inside the step that lowers the copy into the tray,
// which leaves that step half-run and every later click waiting on a scan that
// will never finish: "the app froze when I placed a generated model on the
// copier". The check drives the machine and then asks whether the workshop
// still answers, because a wedged queue is the symptom that matters.
async function copierKindsCheck(D) {
  const line = [];
  const still = () => !D.state.current && !D.state.queued && !D.state.busy;
  const count = (kind) => { let n = 0;
    D.scene.traverse(o => { if (o.userData?.kind === kind) n++; }); return n; };
  const setOnPlatform = async (thing) => {
    D.hold(thing);
    D.clickRaw({ kind: 'station', id: 'copyIn' });
    for (let i = 0; i < 900 && !still(); i++) { D.frame(1, fnow()); await maybeBreathe(); }
    await slowSettle(D, 4000);
  };

  // 1. a MADE MODEL -- the one Ken put on the platform
  D.worldIn({ kind: 'world', v: 4, bench: [], stations: {}, active: null });
  await slowSettle(D, 3000);
  const model = D.makeFromReply(JSON.stringify({ name: 'a boat', parts: [
    { shape: 'box', size: [0.14, 0.035, 0.34], at: [0, 0.02, 0], color: '#8b5a2b' },
    { shape: 'cone', size: [0.08, 0.24], at: [0, 0.15, 0.02], rot: [90, 0, 0], color: 'crimson' }]
  }), 'a boat')?.thing;
  if (!model) { put('FAIL Mimi copies what she is given  (no model built)', 'fail'); return false; }
  await setOnPlatform(model);
  const models = [];
  D.scene.traverse(o => { if (o.userData?.kind === 'model') models.push(o); });
  const copied = models.length === 2;
  const answering = still();
  // ...and WHOLLY ITS OWN: the parts were sliced as a list and shared as
  // objects, so editing one model would have edited its copy
  let own = false;
  if (copied) {
    models[0].userData.parts[0].color = '#00ff00';
    models[0].userData.parts[0].size[0] = 9;
    own = models[1].userData.parts[0].color !== '#00ff00'
       && models[1].userData.parts[0].size[0] !== 9;
  }
  line.push('model=' + models.length + ' its-own=' + own + ' answering=' + answering);

  // 2. a TRAIL -- swept-up pen marks, the other kind with no branch of its own
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [
    { thing: { kind: 'trail', segs: [
      { x0: 0, y0: 1, z0: 0, x1: 0.2, y1: 1.1, z1: 0.1, ink: '#ff0000', wide: 0.01 },
      { x0: 0.2, y0: 1.1, z0: 0.1, x1: 0.3, y1: 1.0, z1: 0.2, ink: '#ff0000', wide: 0.01 }] },
      x: 0.2, z: 1.6 }] });
  await slowSettle(D, 3000);
  const trail = D.bench(0);
  const had = count('trail');
  await setOnPlatform(trail);
  const trails = count('trail');
  const trailOK = had === 1 && trails === 2 && still();
  line.push('trail=' + had + '->' + trails);

  const ok = copied && answering && own && trailOK;
  put((ok ? 'PASS' : 'FAIL') + ' Mimi copies what she is given  ('
      + line.join(' ') + ')', ok ? 'pass' : 'fail');
  return ok;
}

// A CLOSEUP OF ANYTHING. Enter used to answer for pads alone, and a pad is
// read from straight above -- which for a number is a square with a lid on it.
// Anything that is not a pad is now flown to from the FRONT, at the bearing you
// were already watching it from, and the arrows turn it there: the only way to
// read the other five faces of a number without picking it up. Nothing shakes
// while you are in there.
async function closeupCheck(D, w) {
  w.document.activeElement?.blur?.();     // a check that types must own the keyboard
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [
    { thing: { kind: 'number', value: { n: '7', d: '1' }, op: '+' }, x: 0.2, z: 1.6 },
    { thing: { kind: 'text', text: 'a pad' }, x: -0.9, z: 1.6 }] });
  await slowSettle(D, 3000);
  const num = D.bench(0), pad = D.bench(1);
  const home = D.camera.position.clone();
  const fly = (n) => { for (let i = 0; i < n; i++) D.holdStraightOn(1 / 60); };
  const where = (t) => {
    const c = t.getWorldPosition(new D.V3()), at = D.camera.position;
    const flat = Math.hypot(at.x - c.x, at.z - c.z);
    return { el: Math.atan2(at.y - c.y, flat) * 180 / Math.PI, d: at.distanceTo(c) };
  };

  // 1. THE POINTER, then Enter -- the whole route, not just the function
  const cv = D.renderer.domElement, r = cv.getBoundingClientRect();
  const pt = num.getWorldPosition(new D.V3()).project(D.camera);
  cv.dispatchEvent(new w.PointerEvent('pointermove', { bubbles: true,
    clientX: r.left + (pt.x * 0.5 + 0.5) * r.width,
    clientY: r.top + (-pt.y * 0.5 + 0.5) * r.height }));
  const stirred = D.wiggling() === 'number';        // it acknowledges the pointer...
  w.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
  const entered = D.straightOn === num;
  const stillNow = D.wiggling() === null;           // ...and stops the moment you go in
  fly(120);
  const onNum = where(num);
  const front = entered && onNum.el > 5 && onNum.el < 45 && onNum.d < 1.2
    && D.camera.up.y > 0.99;

  // 2. the arrows turn it, a quarter at a time
  const q0 = num.quaternion.clone();
  w.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'ArrowLeft', bubbles: true }));
  const turned = q0.angleTo(num.quaternion);
  const turns = turned > 1.3 && turned < 1.9;       // a right angle, give or take the roll

  // 3. Escape comes back to exactly where you were
  D.comeBackFrom(); fly(120);
  const back = D.camera.position.distanceTo(home) < 0.01;

  // 4. and a PAD is still read from straight above -- AND KEEPS ITS ARROWS.
  // A pad in a closeup is a game being played and the arrows are very likely
  // what is playing it; turning the pitch a quarter round mid-rally would be
  // the fix doing more harm than the thing it fixed.
  D.lookStraightOn(pad); fly(120);
  const onPad = where(pad);
  const overhead = onPad.el > 80 && D.camera.up.z < -0.9;
  const pq = pad.quaternion.clone();
  w.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'ArrowLeft', bubbles: true }));
  const padStill = pq.angleTo(pad.quaternion) < 0.001;
  D.comeBackFrom(); fly(120);

  const ok = stirred && front && stillNow && turns && back && overhead && padStill;
  put((ok ? 'PASS' : 'FAIL') + ' a closeup of anything  (enter-on-a-number=' + entered
      + ' from-the-front=' + onNum.el.toFixed(0) + 'deg/' + onNum.d.toFixed(2) + 'm'
      + ' arrows-turn-it=' + turned.toFixed(2) + 'rad'
      + ' wiggles-first=' + stirred + ' still-in-closeup=' + stillNow
      + ' escape-comes-back=' + back
      + ' pad-still-overhead=' + onPad.el.toFixed(0) + 'deg'
      + ' pad-keeps-its-arrows=' + padStill + ')', ok ? 'pass' : 'fail');
  return ok;
}

// MARTY MAKES A THING. He may make nouns and never verbs: what arrives is a
// prop the child still has to program. Three canned answers stand in for the
// brain -- the guards, which are the whole risk, live on this side of the wire.
async function martyMakesCheck(D) {
  D.worldIn({ kind: 'world', v: 4, bench: [], stations: {}, active: null });
  await slowSettle(D, 2000);
  const benchN = () => { let n = 0; for (let i = 0; i < 30; i++) { if (!D.bench(i)) break; n++; } return n; };
  const n0 = benchN();

  // 1. a good answer, wrapped in the chatter models like to add
  const good = 'Here you go!\n```json\n' + JSON.stringify({
    name: 'a red sailboat', say: 'One sailboat, ready for the sea.',
    parts: [
      { shape: 'box', size: [0.16, 0.03, 0.34], at: [0, 0.015, 0], color: '#8b5a2b' },
      { shape: 'cylinder', size: [0.006, 0.006, 0.3], at: [0, 0.17, 0], color: '#efe2c6' },
      { shape: 'cone', size: [0.09, 0.26], at: [0, 0.16, 0.03], rot: [90, 0, 0], color: 'crimson' },
    ] }) + '\n```';
  const r1 = D.makeFromReply(good);
  const boat = r1?.thing;
  const built = !!boat && boat.userData.kind === 'model' && boat.userData.parts.length === 3;
  const named = (boat?.userData?.label || '') === 'a red sailboat';
  const onBench = benchN() === n0 + 1;
  // it is a THING: it survives a save and a load like anything else
  const saved = D.worldOut();
  D.worldIn(saved); await slowSettle(D, 2000);
  let again = null;
  for (let i = 0; i < 30; i++) { const t = D.bench(i); if (!t) break;
    if (t.userData.kind === 'model') again = t; }
  const survives = !!again && again.userData.parts.length === 3;

  // 2. a hostile answer: too many parts, a shape that is not a shape, numbers
  // that are not numbers, a colour that is a script, and a boat the size of a
  // house. Every one of those is a poisoned scene if it gets through.
  const nasty = { name: 'x'.repeat(200), say: 'y',
    parts: [{ shape: 'box', size: [900, 900, 900], at: [0, 0, 0], color: 'javascript:alert(1)' },
            { shape: 'banana', size: [1], at: [0, 0, 0] },
            { shape: 'sphere', size: ['NaN'], at: [null, undefined, 'x'] },
            { shape: 'cone', size: [0.05, 0.1], at: [0, 0, 0], rot: [1e9, NaN, 0] }] };
  for (let i = 0; i < 200; i++) nasty.parts.push({ shape: 'box', size: [0.05], at: [0, 0.02, 0] });
  const r2 = D.makeFromReply(JSON.stringify(nasty));
  const t2 = r2?.thing;
  const parts2 = t2?.userData?.parts ?? [];
  const capped = parts2.length > 0 && parts2.length <= 40;
  const shapesOK = parts2.every(pt => ['box', 'sphere', 'cylinder', 'cone'].includes(pt.shape));
  const finite = parts2.every(pt => [...pt.size, ...pt.at, ...(pt.rot || [])].every(Number.isFinite));
  const noScript = parts2.every(pt => !/script/i.test(pt.color || ''));
  const wide = t2 ? t2.userData.width : 99;
  const fits = wide > 0 && wide <= 0.55;
  const shortName = (t2?.userData?.label || '').length <= 40;

  // 2b. ...and the same error the other way: a toy answered in centimetres is
  // a speck too small to point at, so it is grown as surely as a giant shrinks
  const speck = D.makeFromReply(JSON.stringify({ name: 'a bead',
    parts: [{ shape: 'sphere', size: [0.008], at: [0, 0.008, 0], color: 'teal' },
            { shape: 'box', size: [0.01, 0.004, 0.02], at: [0, 0.002, 0.01], color: 'teal' }] }));
  const grown = !!speck && speck.thing.userData.width >= 0.1;

  // 2c. A REVISION LANDS BESIDE WHAT IT REVISED, on free space. Ken: "when I
  // asked for a new drawing or model it replaces the previous one. they should
  // appear on any free space on the desk." Comparing what you asked for
  // against what you got is the whole of iterating, and there is nothing to
  // compare with once the last one has been thrown away.
  D.worldIn({ kind: 'world', v: 4, bench: [], stations: {}, active: null });
  await slowSettle(D, 2000);
  const one = D.makeFromReply(JSON.stringify({ name: 'a bug',
    parts: [{ shape: 'sphere', size: [0.08], at: [0, 0.08, 0], color: 'olive' }] }));
  const at1 = { x: one.thing.position.x, z: one.thing.position.z };
  const afterFirst = benchN();
  const two = D.makeFromReply(JSON.stringify({ name: 'a bug with six legs',
    parts: [{ shape: 'sphere', size: [0.08], at: [0, 0.08, 0], color: 'olive' },
            { shape: 'cylinder', size: [0.004, 0.004, 0.1], at: [0.05, 0.04, 0], rot: [0, 0, 60], color: 'black' }] }));
  const replaced = benchN() === afterFirst + 1
    && !!one.thing.parent && !!two.thing.parent
    && Math.hypot(two.thing.position.x - at1.x, two.thing.position.z - at1.z) > 0.05
    && two.thing.userData.parts.length === 2;
  // ...and once it is in your hand it is yours: the next one arrives beside it
  D.hold(two.thing);
  const held = benchN();
  const three = D.makeFromReply(JSON.stringify({ name: 'a snail',
    parts: [{ shape: 'sphere', size: [0.07], at: [0, 0.07, 0], color: 'peru' }] }), 'a snail');
  const spares = benchN() === held + 1 && !!three;
  D.clickBench(1.2, 1.4);            // put the held one down again
  await slowSettle(D, 2000);

  // 2d. HE REMEMBERS WHAT HE JUST MADE. Without this the next wish is a fresh
  // start, and "good, but it should have six legs" builds a second insect
  // instead of fixing the first -- which is what Ken hit in real use.
  const mem = D.makeMemory();
  const remembers = mem.length === 2 && mem[0] === 'a snail'
    && /"parts"/.test(mem[1]) && /peru/.test(mem[1]);

  // 2e. A LONG ANSWER IS NOT A BAD ANSWER. Ken's six-legged mantis came back
  // from Sonnet and Opus cut off mid-array (their branch is the one that
  // sends a token cap) and was refused outright, while the same wish built
  // under GPT. What arrived whole is a toy; only the tail is missing.
  const leg = (i) => '{"shape":"cylinder","size":[0.004,0.004,0.09],'
    + '"at":[' + (0.03 * (i - 3)) + ',0.05,0],"color":"olive"}';
  const truncated = '{"name":"a preying mantis","say":"here","parts":['
    + '{"shape":"box","size":[0.05,0.03,0.16],"at":[0,0.06,0],"color":"olive"},'
    + '{"shape":"sphere","size":[0.03],"at":[0,0.08,0.09],"color":"olive"},'
    + [0, 1, 2, 3].map(leg).join(',') + ',{"shape":"cyli';
  const salvaged = D.makeFromReply(truncated, 'a preying mantis');
  const rescued = !!salvaged && salvaged.thing.userData.parts.length === 6
    && salvaged.made.cutShort === true;
  // ...and an answer with a sentence after the JSON parses too: taking the
  // first brace to the LAST one made that unreadable
  const chatty = '{"name":"a top","parts":[{"shape":"cone","size":[0.06,0.12],'
    + '"at":[0,0.06,0],"color":"tomato"}]}\n\nHope that helps! {smiley}';
  const afterWords = !!D.makeFromReply(chatty, 'a top');

  // 3. an answer that is not one: nothing is built, and nothing is disturbed
  const before3 = benchN();
  const r3 = D.makeFromReply('I would rather not, honestly.');
  const r4 = D.makeFromReply(JSON.stringify({ name: 'empty', parts: [] }));
  const refuses = r3 === null && r4 === null && benchN() === before3;

  const ok = built && named && onBench && survives && capped && shapesOK
    && finite && noScript && fits && grown && replaced && spares
    && remembers && rescued && afterWords && shortName && refuses;
  put((ok ? 'PASS' : 'FAIL') + ' Marty makes a thing  (built=' + built + ' named=' + named
      + ' on-bench=' + onBench + ' survives-save=' + survives
      + ' capped=' + parts2.length + ' shapes=' + shapesOK + ' finite=' + finite
      + ' no-script=' + noScript + ' fits=' + (+wide.toFixed(2))
      + ' speck-grown=' + (speck ? +speck.thing.userData.width.toFixed(2) : 'none')
      + ' both-toys-stay=' + replaced + ' spares-what-you-hold=' + spares
      + ' remembers-last=' + remembers
      + ' salvages-cut-off=' + rescued + ' reads-past-chatter=' + afterWords
      + ' refuses-nonsense=' + refuses + ')', ok ? 'pass' : 'fail');
  return ok;
}

// HE IS FACING YOU WHEN YOU WALK IN. A robot's yaw is wherever its last walk
// left it -- the glass-house performance turns it toward each hole it visits
// and used to leave it pointing whichever way it walked home -- so stepping
// through the door showed you its back. Measured before the fix: five entries
// in ten settled at -138 degrees and stayed there.
async function facingCheck(D) {
  const deg = (r) => Math.round(((r % (2 * Math.PI)) * 180 / Math.PI + 540) % 360 - 180);
  const yaws = [];
  for (const waitTicks of [60, 100, 160, 220]) {
    const w = await (await fetch('../examples/behaviours/zeno.world.json')).json();
    D.worldIn(w); await slowSettle(D, 4000);
    D.speed(1);
    const rooms = [];
    for (let i = 0; i < 10; i++) { const t = D.bench(i); if (!t) break;
      if (t.userData.kind === 'room') rooms.push(t); }
    const halver = rooms.find(r => r.userData.label !== 'the totaller');
    const tot = rooms.find(r => r.userData.label === 'the totaller');
    if (!tot) { put('FAIL he faces you  (zeno did not build)', 'fail'); return false; }
    D.clickRaw({ kind: 'roomLever', room: halver });
    D.clickRaw({ kind: 'roomLever', room: tot });
    for (let i = 0; i < waitTicks; i += 4) { D.step(1 / 60, 4); }
    await maybeBreathe();
    D.enter(tot); await slowSettle(D, 9000);
    for (let i = 0; i < 60; i += 4) { D.step(1 / 60, 4); }
    const bot = tot.__ctx?.activeBot?.node;
    yaws.push(bot ? deg(bot.rotation.y) : 999);
    D.leave(); await slowSettle(D, 4000);
  }
  const away = yaws.filter(y => Math.abs(y) > 90).length;
  const ok = away === 0;
  put((ok ? 'PASS' : 'FAIL') + ' he faces you when you walk in  (yaws='
      + yaws.join('/') + ' backs-turned=' + away + ')', ok ? 'pass' : 'fail');
  return ok;
}

// A BUSY NEST STAYS QUICK. Two costs grew with the pile and neither showed up
// as anything but "it feels sluggish": restacking hid every member of the pile
// on every delivery (n-squared over a run -- Ken's zeno save holds 3,840 on
// one nest), and the half-second detail sweep asked all of them where they
// were in the world, which walks each one's parents. Both are measured here
// as work rather than as wall-clock: how many pile members a restack touches,
// and how long a frame that DOES run the sweep takes.
async function bigPileCheck(D) {
  const pile = [];
  for (let i = 0; i < 1200; i++) pile.push({ kind: 'number', value: { n: String(i + 1), d: '1' }, op: '+' });
  D.worldIn({ kind: 'world', v: 4,
    bench: [{ thing: { kind: 'nest', id: 8801, guid: 'big-post', hasEgg: false, pile },
              x: 0.4, z: 1.5 }],
    stations: {}, active: null });
  await slowSettle(D, 20000);
  // the DEEPEST pile, not the last nest the traverse happens on: the desk's
  // own nest stack is full of nests with nothing on them
  let nest = null;
  D.scene.traverse(o => {
    if (o.userData?.kind !== 'nest') return;
    if (!nest || (o.userData.pile || []).length > (nest.userData.pile || []).length) nest = o;
  });
  if (!nest) { put('FAIL a busy nest stays quick  (no nest)', 'fail'); return false; }
  const deep = (nest.userData.pile || []).length;
  const shown = (nest.userData.pile || []).filter(t => t.visible).length;
  // a LATER restack touches only what was standing up, not the whole pile
  // dir 1 is "towards the newer ones", which is the plate that EXISTS while
  // the window sits at the old end -- scrolling the other way restacks
  // nothing, and an assertion about nothing passes for the wrong reason
  const t0 = D.restackTouched();
  D.clickRaw({ kind: 'pileScroll', nest, dir: 1 });
  const touched = D.restackTouched() - t0;
  // ...and a frame that runs the detail sweep does not walk the hidden ones.
  // The clock is stepped by more than half a second per frame ON PURPOSE, so
  // every one of these frames runs the sweep -- at real frame spacing it runs
  // about twice a second and a timing sample would mostly miss it.
  let clock = performance.now();
  const times = [];
  for (let i = 0; i < 31; i++) {
    clock += 600;
    const a = performance.now();
    D.frame(1, clock);
    times.push(performance.now() - a);
    await maybeBreathe();
  }
  times.sort((x, y) => x - y);
  const median = times[15];
  const ok = deep === 1200 && shown > 0 && shown <= 12
    && touched > 0 && touched <= 24 && median < 8;
  put((ok ? 'PASS' : 'FAIL') + ' a busy nest stays quick  (pile=' + deep
      + ' standing=' + shown + ' restack-touched=' + touched
      + ' sweep-frame-median=' + median.toFixed(1) + 'ms)', ok ? 'pass' : 'fail');
  return ok;
}

// MARTY DRAWS, WITH A TURTLE. The picture is a program in the words the turtle
// behaviour already teaches, so what arrives can be read back -- and it is
// text, which is why this works in the artifact where no picture-model can be
// reached. The network is not part of the test: the interpreter and the guards
// are the whole risk and they are all on this side of the wire.
async function martyDrawsCheck(D) {
  D.worldIn({ kind: 'world', v: 4, bench: [], stations: {}, active: null });
  await slowSettle(D, 2000);
  const benchN = () => { let n = 0; for (let i = 0; i < 30; i++) { if (!D.bench(i)) break; n++; } return n; };

  // the interpreter itself: repeat, nesting, and the words it does not know
  const snow = 'color #7fd8ff\nwidth 2\n'
    + 'repeat 6 [ forward 60 repeat 3 [ back 20 right 60 forward 20 left 60 ] back 60 right 60 ]';
  const drew = D.turtle(snow).strokes.length;
  const pen = D.turtle('fd 10 penup fd 50 pendown fd 10').strokes.length;   // the gap is not drawn
  const chatty = D.turtle('draw a lovely house please fd 10 thank you rt 90 fd 10').strokes.length;
  // a runaway cannot hang the workshop, and nonsense draws nothing
  const runaway = D.turtle('repeat 999999 [ repeat 999999 [ fd 1 rt 1 ] ]').strokes.length;
  const prose = D.turtle('please draw me a lovely house, thank you!').strokes.length;
  // a colour that is a script is not a colour
  const evil = D.turtle('color javascript:alert(1)\nfd 10').strokes;
  const noScript = evil.every(st => !/script/i.test(st.color));

  // ...and the whole path: a reply becomes a pad with a picture on it
  const n0 = benchN();
  const r1 = D.drawFromReply(JSON.stringify(
    { name: 'a snowflake', say: 'one snowflake', turtle: snow }), 'a snowflake');
  const pad = r1 && r1.thing;
  const landed = !!pad && pad.userData.kind === 'text'
    && /^data:image\/png/.test(pad.userData.img || '')
    && (pad.userData.label || '') === 'a snowflake'
    && benchN() === n0 + 1;
  // it is a THING: it survives a save and a load
  const saved = D.worldOut();
  D.worldIn(saved); await slowSettle(D, 4000);
  let again = null;
  for (let i = 0; i < 30; i++) { const t = D.bench(i); if (!t) break;
    if (t.userData.img) again = t; }
  const survives = !!again;

  // a re-drawing takes the place of the one it re-draws
  D.worldIn({ kind: 'world', v: 4, bench: [], stations: {}, active: null });
  await slowSettle(D, 2000);
  const a = D.drawFromReply(JSON.stringify({ name: 'a spiral', turtle: 'repeat 60 [ fd 3 rt 6 ]' }), 'a spiral');
  const at1 = { x: a.thing.position.x, z: a.thing.position.z };
  const afterFirst = benchN();
  const b = D.drawFromReply(JSON.stringify({ name: 'a red spiral', turtle: 'color crimson\nrepeat 60 [ fd 3 rt 6 ]' }), 'in red');
  // A RE-DRAWING KEEPS THE OLD ONE, on free space beside it. Ken: "when I
  // asked for a new drawing or model it replaces the previous one. they should
  // appear on any free space on the desk" -- you cannot compare what you asked
  // for against what you got once the last one has been thrown away.
  const redrawn = benchN() === afterFirst + 1 && !!a.thing.parent && !!b.thing.parent
    && Math.hypot(b.thing.position.x - at1.x, b.thing.position.z - at1.z) > 0.05;

  // SOLID SHAPES ON TRANSPARENT PAPER, which is what a sprite is. Ken asked
  // for "a solid red triangle on a transparent background": before `fill` the
  // turtle could only outline, and with the pen left down a filled shape came
  // out ringed in ink.
  const tri = D.drawFromReply(JSON.stringify({ name: 'a red triangle',
    turtle: 'fill crimson [ repeat 3 [ forward 100 right 120 ] ]' }), 'a solid red triangle');
  const alpha = await new Promise(res => {
    if (!tri) return res(null);
    const im = new Image();
    im.onload = () => {
      const cv = document.createElement('canvas');
      cv.width = im.width; cv.height = im.height;
      const c2 = cv.getContext('2d');
      c2.drawImage(im, 0, 0);
      const d = c2.getImageData(0, 0, im.width, im.height).data;
      const at = (x, y) => { const i2 = (y * im.width + x) * 4;
        return [d[i2], d[i2 + 1], d[i2 + 2], d[i2 + 3]]; };
      let dark = 0, solid = 0;
      for (let i2 = 0; i2 < d.length; i2 += 4) {
        if (d[i2 + 3] > 200) { solid++;
          if (d[i2] < 120 && d[i2 + 1] < 120 && d[i2 + 2] < 120) dark++; }
      }
      res({ corner: at(3, 3), middle: at(256, 300), dark, solid });
    };
    im.onerror = () => res(null);
    im.src = tri.made.src;
  });
  const seeThrough = !!alpha && alpha.corner[3] === 0;
  const filledSolid = !!alpha && alpha.middle[3] === 255 && alpha.middle[0] > 180
    && alpha.solid > 5000;
  const noOutline = !!alpha && alpha.dark === 0;
  // the LAST exchange, which is now the triangle above -- that is what a
  // follow-up like "make it bigger" would be a change to
  const remembers = D.drawMemory().length === 2 && /fill crimson/.test(D.drawMemory()[1]);

  // CUT OFF MID-ORDER is barely a failure for a turtle: what arrived is still
  // a picture. (The orders are inside a JSON string, so a truncated answer
  // ends mid-string and the whole object never closes.)
  const truncated = '{"name":"a tree","say":"here","turtle":"color sienna\\nwidth 3\\n'
    + 'repeat 5 [ fd 20 rt 20 ]\\nfd 30 rt 9';
  const cutRes = D.drawFromReply(truncated, 'a tree');
  const salvaged = !!cutRes && cutRes.made.cutShort === true && cutRes.made.strokes > 0;

  // ...and an answer with no orders in it at all builds nothing
  const before = benchN();
  const refuses = D.drawFromReply('I would rather not, honestly.') === null
    && D.drawFromReply(JSON.stringify({ name: 'x', turtle: 'hello there' })) === null
    && benchN() === before;

  const ok = drew === 48 && pen === 2 && chatty === 2 && prose === 0 && noScript
    && runaway > 0 && runaway <= 40000
    && landed && survives && redrawn && remembers && salvaged && refuses
    && seeThrough && filledSolid && noOutline;
  put((ok ? 'PASS' : 'FAIL') + ' Marty draws with a turtle  (snowflake-strokes=' + drew
      + ' pen-lifts=' + (pen === 2) + ' skips-unknown-words=' + (chatty === 2)
      + ' prose-draws-nothing=' + (prose === 0) + ' no-script-colour=' + noScript
      + ' runaway-capped=' + runaway + ' lands-on-a-pad=' + landed
      + ' survives-save=' + survives + ' redraw-replaces=' + redrawn
      + ' remembers=' + remembers + ' salvages-cut-off=' + salvaged
      + ' transparent=' + seeThrough + ' fill-solid=' + filledSolid
      + ' fill-no-outline=' + noOutline + ' both-drawings-stay=' + redrawn
      + ' refuses-nonsense=' + refuses + ')', ok ? 'pass' : 'fail');
  return ok;
}

// POST DOES NOT PULL THE LEVER. Ken: "when a bird delivers it turns on -- it
// should only be on if it is explicitly turned on." A letter landing on a nest
// inside a house that nobody has started used to start it, so a house you were
// merely filling with post ran the moment the first letter arrived. The letter
// still lands and still waits; the lever is what makes the house work.
async function postDoesNotStartCheck(D) {
  const w = await (await fetch('../examples/behaviours/zeno.world.json')).json();
  D.worldIn(w); await slowSettle(D, 4000);
  D.speed(1);
  const rooms = [];
  for (let i = 0; i < 10; i++) { const t = D.bench(i); if (!t) break;
    if (t.userData.kind === 'room') rooms.push(t); }
  const halver = rooms.find(r => r.userData.label !== 'the totaller');
  const tot = rooms.find(r => r.userData.label === 'the totaller');
  if (!halver || !tot) { put('FAIL post does not pull the lever  (zeno did not build)', 'fail'); return false; }
  // ONLY the sender is switched on. Real seconds, because the pace is the
  // wall clock and virtual ticks fly straight past it.
  D.clickRaw({ kind: 'roomLever', room: halver });
  const t0 = performance.now();
  while (performance.now() - t0 < 7000) { D.frame(1, performance.now()); await maybeBreathe(); }
  const nest = tot.__ctx?.standOcc?.userData?.holes?.[0]?.thing;
  const landed = (nest?.userData?.pile || []).length;
  const stayedOff = !tot.userData.dirty && !tot.__switched;
  const totalNow = () => {
    const v = tot.__ctx?.standOcc?.userData?.holes?.[1]?.thing?.userData?.value;
    return v ? String(v.n) + '/' + String(v.d) : '-';
  };
  const untouched = totalNow() === '0/1';
  // ...and the lever still starts it, with the waiting post to hand
  D.clickRaw({ kind: 'roomLever', room: tot });
  const t1 = performance.now();
  while (performance.now() - t1 < 5000) { D.frame(1, performance.now()); await maybeBreathe(); }
  const worksAfter = totalNow() !== '0/1';
  const ok = landed > 0 && stayedOff && untouched && worksAfter;
  put((ok ? 'PASS' : 'FAIL') + ' post does not pull the lever  (letters-waiting=' + landed
      + ' stayed-off=' + stayedOff + ' total-untouched=' + untouched
      + ' lever-then-works=' + worksAfter + ')', ok ? 'pass' : 'fail');
  D.speed(1);
  return ok;
}

// THE THINGS THAT WAIT ON YOU. Three of Ken's asks in one check, because all
// three are about a thing being usable rather than merely present: an info
// notebook you can give back, helpers that look at you, and a saved file a
// person can actually edit.
async function attentiveCheck(D) {
  D.worldIn({ kind: 'world', v: 4, bench: [], stations: {}, active: null });
  await slowSettle(D, 3000);
  const benchN = () => { let n = 0; for (let i = 0; i < 30; i++) { if (!D.bench(i)) break; n++; } return n; };

  // 1. the info plaque hands out AND takes back
