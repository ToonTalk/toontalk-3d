  const five = (() => { for (let i = 0; i < 8; i++) { const t = D.bench(i); if (!t) break; if (t.userData.kind === 'box') return t; } return null; })();
  D.hold(five); D.giveRobot(); await slowSettle(D, 3000);       // refused: red, the thought view
  D.camStill(); await frames(D, 120);
  const d0 = dT();
  D.rubyOn(true);                                              // Ruby wakes: in on the thought
  D.camStill(); await frames(D, 120);
  const close = { d: dT(), on: D.onScreen(thought()), closer: dT() < d0 - 0.5 };
  D.clickCond([0]);                                            // the 1 becomes any number: it fits
  await slowSettle(D, 4000);                                   // Ruby's flight and the erasure
  const words = D.condWords();
  D.run();                                                     // ...and Start runs it (a loosening no longer does)
  for (let i = 0; i < 60 && D.state.mode !== 'replay'; i++) await frames(D, 10);
  const hint = D.doc.getElementById('hint').textContent.slice(0, 70);
  D.camStill(); await frames(D, 150);
  const g = D.mine();
  const gc = g ? new D.THREE.Box3().setFromObject(g).getCenter(new D.THREE.Vector3()) : null;
  const rubyOn = D.helperAt('ruby') ? D.onScreen(D.helperAt('ruby')) : null;
  const watch = { mode: D.state.mode, d: gc ? +D.camera.position.distanceTo(gc).toFixed(2) : -1,
                  workOn: gc ? D.onScreen(gc) : false, rubyOn, resting: D.smartCam().yield, following: D.smartCam().following };
  D.doc.getElementById('runBtn').click();                     // Stop
  await slowSettle(D, 6000);
  D.rubyOn(false);
  const ok = close.on && close.closer && close.d < 2.2 && watch.mode === 'replay' && watch.d > 3.0 && watch.workOn && watch.rubyOn === true && watch.resting;
  put((ok ? 'PASS' : 'FAIL') + ' Ruby’s view and the watched run  (thought-view=' + d0 + ' ruby-wakes=' + JSON.stringify(close)
      + ' words=' + JSON.stringify(words) + ' hint=' + JSON.stringify(hint) + ' run=' + JSON.stringify(watch) + ')', ok ? 'pass' : 'fail');
  return ok;
}

// THE LOOK-AROUND LESSON: Marty turns, zooms and slides the camera and hands
// it back where it was, in mouse words on a mouse.
async function cameraDemoCheck(D, w) {
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [] });
  await slowSettle(D, 2000);
  const p0 = D.camera.position.clone();
  const log = D.doc.getElementById('martyLog');
  const lines0 = log ? log.children.length : 0;
  let maxMove = 0;
  let done = false;
  const run = w.__marty.demo('camera').then(() => { done = true; });
  for (let i = 0; i < 400 && !done; i++) {  // through the four beats, pressing Next as they come
    await frames(D, 20);
    maxMove = Math.max(maxMove, D.camera.position.distanceTo(p0));
    w.__marty.next();
    await new Promise(r => setTimeout(r, 60));
  }
  await run;
  const d1 = D.camera.position.distanceTo(p0);
  await frames(D, 60);
  const d2 = D.camera.position.distanceTo(p0);
  const back = d2 < 0.05;
  const said = log ? [...log.children].slice(lines0).map(e => e.textContent).join(' | ') : '';
  const beats = log ? [...log.children].slice(lines0).length : 0;
  const mouse = /mouse/i.test(said) && !/finger/i.test(said);
  const ok = maxMove > 0.5 && back && mouse;
  put((ok ? 'PASS' : 'FAIL') + ' Marty shows how to look around  (moved=' + maxMove.toFixed(2) + ' back-where-it-was=' + back
      + ' off-by=' + d2.toFixed(2) + ' beats=' + beats + ' mouse-words=' + mouse + ')', ok ? 'pass' : 'fail');
  return ok;
}

// THE ROBOT DEMO RUNS WHAT IT TRAINED (ChatGPT, 21 Sep): it used to say
// "off it goes -- 4, 5, 6" over a desk that stayed at 3, since Ruby's
// loosening no longer starts a run. Now it presses Run for three rounds:
// the desk ends at 6, and the last line reads the desk.
async function robotDemoCheck(D, w) {
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [] });
  await slowSettle(D, 2000);
  const log = D.doc.getElementById('martyLog');
  const lines0 = log ? log.children.length : 0;
  let done = false;
  D.speed(8); D.showStacks(true);          // the suite's app hides its stacks; Marty needs the minis and the numbers
  const run = w.__marty.demo('robot').then(() => { done = true; });
  for (let i = 0; i < 1500 && !done; i++) {
    await frames(D, 20);
    w.__marty.next();
    await new Promise(r => setTimeout(r, 30));
  }
  await run;
  await frames(D, 30);
  const desk = D.stations.stand.occupant;
  const value = desk?.userData?.value ? String(desk.userData.value.n) + (String(desk.userData.value.d) !== '1' ? '/' + desk.userData.value.d : '') : null;
  const said = log ? [...log.children].slice(lines0).map(e => e.textContent) : [];
  const last = said[said.length - 1] || '';
  const ranThree = value === '6';
  const readsDesk = /The desk shows 6\./.test(last);
  const noFalsePromise = !said.some(l => /off it goes/.test(l));
  const ok = ranThree && readsDesk && noFalsePromise && D.helperState().mode === 'world';
  D.speed(1); D.showStacks(false);
  put((ok ? 'PASS' : 'FAIL') + ' the robot demo runs what it trained  (desk=' + value + ' reads-desk=' + readsDesk + ' no-false-promise=' + noFalsePromise + ' beats=' + said.length + ' mode=' + D.helperState().mode + ')', ok ? 'pass' : 'fail');
  if (!ok) { for (const l of said) put('ERR   said: ' + l.slice(0, 160), 'dim'); put('ERR   hint: ' + D.doc.getElementById('hint').textContent.slice(0, 160), 'dim'); }
  return ok;
}

// MARTY'S ONE HANDS-ON MOVE FOR A BUILDING PARTNER (ChatGPT, 21 Sep: "I put a
// little robot on the table for us" -- and none appeared). A reply may set
// "fetch" to a stack, and one fresh thing from it is set on the table -- in
// the building mode only; a reply without it places nothing, whatever it
// says; a stale Show-me offer clears on the next answer.
async function martyFetchCheck(D, w) {
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [] });
  await slowSettle(D, 1500);
  D.showStacks(true);
  const bench = () => { const o = []; for (let i = 0; i < 20; i++) { const t = D.bench(i); if (!t) break; o.push(t); } return o; };
  const help0 = D.help();
  let reply = '';
  D.brain(async () => reply);
  const ask = async (q, r) => { reply = r; await w.__marty.ask(q); for (let k = 0; k < 600 && D.martyBusy(); k++) await frames(D, 5); await frames(D, 20); };
  try {
    // hints mode: a fetch is not honoured, whatever the brain says
    D.help('guide');
    await ask('put a robot on the table', '{"say": "I put a robot on the table.", "demo": null, "fetch": "minis"}');
    const guideBench = bench().length;
    // an offer, then an answer about something else: the offer goes
    await ask('show me fractions', '{"say": "Here is a demonstration.", "demo": "fractions", "fetch": null}');
    const offered = !!D.doc.querySelector('#martyCtl button') && /Show me/.test(D.doc.getElementById('martyCtl').textContent);
    await ask('what does a robot do', '{"say": "It repeats what it was shown.", "demo": null, "fetch": null}');
    const cleared = !/Show me/.test(D.doc.getElementById('martyCtl').textContent);
    // building mode: a fetch sets a robot on the table
    D.help('plan');
    await ask('I am stuck, do the next step', '{"say": "Let me set a little robot down for you.", "demo": null, "fetch": "minis"}');
    const after = bench();
    const robot = after.find(t => t.userData.kind === 'robot');
    const said = [...D.doc.getElementById('martyLog').children].map(c => c.textContent);
    const told = said.some(l => /on the table for you/.test(l));
    const ok = guideBench === 0 && offered && cleared && !!robot && after.length === 1 && told;
    put((ok ? 'PASS' : 'FAIL') + ' Marty sets one thing on the table for a building partner, and only then  (guide-placed=' + guideBench + ' offered=' + offered + ' cleared=' + cleared + ' robot=' + !!robot + ' on-table=' + after.length + ' told=' + told + ')', ok ? 'pass' : 'fail');
    if (!ok) for (const l of said.slice(-6)) put('ERR   said: ' + l.slice(0, 140), 'dim');
    return ok;
  } finally { D.brain(null); D.help(help0); D.showStacks(false); }
}

// YOUR HAND, BY WORD (Ken, 21 Sep: "an alternative way of controlling one's
// hand" -- Marty not involved). A brain turns a sentence into steps and the
// hand makes them through the same clicks and keys a person would. The brain
// is a stand-in here: the check is of the hand, not the model. Only in the
// build that has it (toontalk-3d-next.html); elsewhere it is skipped.

  if (!D.hand) { put('SKIP the hand, by word: not in this build', 'dim'); return true; }
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [] });
  await slowSettle(D, 1500);
  D.showStacks(true);
  const PLANS = {
    'in a 3-hole box': { steps: [
      { do: 'take', from: 'boxes', as: 'b' }, { do: 'type', text: '3' }, { do: 'drop' },
      { do: 'take', from: 'numbers' }, { do: 'drop', on: 'b', hole: 1 } ], say: 'A 1 in a 3-hole box.' },
    'ToonTalk': { steps: [ { do: 'take', from: 'texts' }, { do: 'type', text: 'ToonTalk' }, { do: 'drop' } ], say: 'A pad saying ToonTalk.' },
    'a scale with 1 and 100': { steps: [
      { do: 'take', from: 'scales', as: 's' }, { do: 'drop' },
      { do: 'take', from: 'numbers' }, { do: 'drop', on: 's', hole: 1 },

// A ROBOT MAKING A VILLAGE: copies set down on a work spot it was shown
// empty go to the next free spot when that one is taken -- not inside the
// house already there -- and the spots keep clear of the stacks.
async function villageCheck(D, w) {
  const room = { kind: 'room' };
  const prog = [
    { type: 'take', at: { c: 'given', path: [] } }, { type: 'put', at: { c: 'in', path: [] } },
    { type: 'take', at: { c: 'out', path: [] } }, { type: 'put', at: { c: 's0', path: [], free: true } },
    { type: 'take', at: { c: 'in', path: [] } }, { type: 'put', at: { c: 'given', path: [] } }];
  D.worldIn({ kind: 'world', v: 4, stations: { stand: room }, active: { kind: 'robot', name: 'builder',
    condition: { kind: 'anyRoom' }, trainedOn: room, program: prog }, bench: [] });
  await slowSettle(D, 3000);
  D.speed('inf'); D.rounds(5); D.run();
  let gaps = 0, most = 0;
  for (let k = 0; k < 600; k++) {
    const n = D.settle(20);
    const sp = D.scratch();
    const occ = sp.filter(Boolean).length;
    most = Math.max(most, occ);
    if (sp.length - occ > 1) gaps++;
    if (n < 20) break;
  }
  await slowSettle(D, 3000);
  let houses = 0, nested = 0;
  for (let i = 0; i < 60; i++) {
    const b = D.bench(i); if (!b) break;
    if (b.userData.kind !== 'room') continue;
    houses++;
    b.traverse(o => { if (o !== b && o.userData?.kind === 'room') nested++; });
  }
  const stacks = ['rooms', 'texts', 'nests', 'scales', 'dice', 'sounds', 'minis', 'numbers', 'boxes']
    .map(id => D.stackAt(id)).filter(Boolean);
  let near = 0;
  for (let i = 0; i < 22; i++) {
    const p = D.spotPoint(i);
    for (const st of stacks) if (Math.hypot(p[0] - st[0], p[2] - st[2]) < 0.5) near++;
  }
  const ok = houses === 5 && nested === 0 && gaps === 0 && most >= 5 && near === 0;
  put((ok ? 'PASS' : 'FAIL') + ' a robot making a village  (houses=' + houses + ' nested=' + nested
    + ' empty-spot-gaps=' + gaps + ' most-on-spots=' + most + ' spots-in-stacks=' + near + ')', ok ? 'pass' : 'fail');
  return ok;
}

// A FINGER ON THE THING IN HAND DRAGS IT: touch pointer events on the held
// thing carry it and drop it where the finger lifts; the camera comes back.
async function touchCarryCheck(D, w) {
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null,
    bench: [{ thing: { kind: 'number', value: { n: '7', d: '1' }, op: '+' }, x: -0.6, z: 1.6 }] });
  await slowSettle(D, 1500);
  D.speed('inf');
  await slowSettle(D, 3000);
  const seven = D.bench(0).userData.kind === 'number' ? D.bench(0) : D.bench(1);
  D.clickThing(seven);
  await frames(D, 5);
  const el = D.renderer.domElement, r = el.getBoundingClientRect();
  const toScreen = (v) => { const p = v.clone().project(D.camera);
    return { x: r.left + (p.x + 1) / 2 * r.width, y: r.top + (1 - p.y) / 2 * r.height }; };
  const ev = (type, at, target = el) => target.dispatchEvent(new w.PointerEvent(type, {
    pointerType: 'touch', pointerId: 7, isPrimary: true, button: 0, buttons: type === 'pointerup' ? 0 : 1,
    clientX: at.x, clientY: at.y, bubbles: true, cancelable: true }));
  // a first touch anywhere tells the workshop this is a finger (the hand parks)
  el.dispatchEvent(new w.PointerEvent('pointerenter', { pointerType: 'touch', bubbles: false }));
  ev('pointerdown', { x: r.left + 20, y: r.top + 20 }); ev('pointerup', { x: r.left + 20, y: r.top + 20 });
  await frames(D, 3);
  const inHand = !!D.heldPos();
  const from = toScreen(new D.THREE.Vector3(...D.heldPos()));
  const ray0 = new D.THREE.Raycaster();
  ray0.setFromCamera(new D.THREE.Vector2(((from.x - r.left) / r.width) * 2 - 1, -((from.y - r.top) / r.height) * 2 + 1), D.camera);
  const hits = ray0.intersectObject(seven, true).length;
  const st0 = D.helperState();
  const dest = new D.THREE.Vector3(0.9, D.benchTop ?? 0.84, 1.9);
  const to = toScreen(dest);
  ev('pointerdown', from);
  const offDuring = !D.orbitOn();
  for (let i = 1; i <= 6; i++) ev('pointermove', { x: from.x + (to.x - from.x) * i / 6, y: from.y + (to.y - from.y) * i / 6 });
  await frames(D, 2);
  ev('pointerup', to);
  await slowSettle(D, 2000);
  const dropped = !D.heldPos();
  const near = Math.hypot(seven.position.x - dest.x, seven.position.z - dest.z) < 0.35;
  const back = D.orbitOn();
  const ok = inHand && offDuring && dropped && near && back;
  put((ok ? 'PASS' : 'FAIL') + ' a finger drags the thing in hand  (in-hand=' + inHand + ' camera-off-while=' + offDuring
    + ' dropped=' + dropped + ' near-finger=' + near + ' camera-back=' + back + ' hits=' + hits + ' busy=' + st0.busy + ' mode=' + st0.mode + ')', ok ? 'pass' : 'fail');
  return ok;
}

// CONTAGION: every operation with an approximate input answers with an
// approximation -- the root included, which used to come out exact when the
// root came out whole
async function contagionCheck(D, w) {
  const four = ['4', '1', true], two = ['2', '1', false], half = ['1', '2', false];
  const cases = [['+', two], ['-', two], ['*', two], ['/', two], ['mod', two], ['^', two], ['^', half], ['root', two], ['sin', two], ['cos', two]];
  const bad = [];
  for (const [op, b] of cases) {
    const r = D.arith(four, op, b);
    if (!r || !r.x) bad.push(op + (r ? '=' + r.n + '/' + r.d : '=null'));
  }
  const exactRoot = D.arith(['4', '1', false], 'root', two);
  const stillExact = exactRoot && !exactRoot.x && exactRoot.n === '2';
  const ok = bad.length === 0 && stillExact;
  put((ok ? 'PASS' : 'FAIL') + ' approximation is contagious through every operation  (loses-it=' + JSON.stringify(bad) + ' exact-root-still-exact=' + stillExact + ')', ok ? 'pass' : 'fail');
  return ok;
}

  put((ok ? 'PASS' : 'FAIL') + ' drop hints say what letting go will do  (' + JSON.stringify([m1, m2, m3, m4]) + ')', ok ? 'pass' : 'fail');
  return ok;
}

// THE MANUAL'S FIRST PROJECT, step for step: a robot taught to add a 1
// stops after one round; Ruby loosens its thought and it counts on
async function firstProjectCheck(D, w) {
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [
    { thing: { kind: 'number', value: { n: '1', d: '1' }, op: '+' }, x: -0.4, z: 1.7 },
    { thing: { kind: 'robot' }, x: 0.9, z: 1.5 } ] });
  await slowSettle(D, 1500);
  D.speed('inf');
  const one = [0, 1, 2].map(i => D.bench(i)).find(t => t?.userData.kind === 'number');
  const bot = [0, 1, 2].map(i => D.bench(i)).find(t => t?.userData.kind === 'robot');
  D.clickThing(one); await frames(D, 3);
  D.clickBot(bot); await slowSettle(D, 4000);                       // the lesson begins
  const teaching = D.helperState().mode === 'training';
  D.teach({ type: 'newNumber' }); await slowSettle(D, 4000);
  D.teach({ type: 'put', at: { c: 'given', path: [] } }); await slowSettle(D, 4000);
  D.exit(); await slowSettle(D, 4000);
  const rewound = String(D.mine()?.userData.value.n) === '1';
  D.rounds(20); D.run(); await slowSettle(D, 60000);
  const once = D.roundsNow().runCount === 1 && String(D.mine()?.userData.value.n) === '2';
  D.rubyOn(true); D.clickCond([]); await frames(D, 5); D.rubyOn(false);
  const loosened = D.condWords ? /any number|anything/i.test(String(D.condWords())) : true;
  D.rounds(6); D.run(); await slowSettle(D, 60000);
  const counted = D.roundsNow().runCount >= 5 && Number(D.mine()?.userData.value.n) >= 7;

  put((ok ? 'PASS' : 'FAIL') + ' the manual’s first project  (teaching=' + teaching + ' rewound=' + rewound + ' ran-once=' + once + ' loosened=' + loosened + ' counted=' + counted + ' value=' + String(D.mine()?.userData.value.n) + ')', ok ? 'pass' : 'fail');

}

// ZENO'S POSTMAN, TAUGHT BY HAND: the halver and the totaller trained step
// by step through the lesson path, then run -- after five deliveries the
// total is 31/32. (Astra's review: "how readily can a learner construct
// the same programs through demonstration?")
async function zenoByHandCheck(D, w) {
  const NID = 9901, GUID = 'zeno-post';
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [
    { thing: { kind: 'robot', name: 'the halver' }, x: -1.3, z: 1.4 },
    { thing: { kind: 'box', holes: [{ kind: 'bird', nestId: NID, nestGuid: GUID }, { kind: 'number', value: { n: '1', d: '2' }, op: '+' }] }, x: -0.6, z: 1.7 },
    { thing: { kind: 'robot', name: 'the totaller' }, x: 1.3, z: 1.4 },
    { thing: { kind: 'box', holes: [{ kind: 'nest', id: NID, guid: GUID, hasEgg: false, pile: [] }, { kind: 'number', value: { n: '0', d: '1' }, op: '+' }] }, x: 0.6, z: 1.7 } ] });
  await slowSettle(D, 1500);
  D.speed('inf');
  const all = []; for (let i = 0; i < 8; i++) { const t = D.bench(i); if (!t) break; all.push(t); }
  const halver = all.find(t => t.userData.kind === 'robot' && t.__bot?.name === 'the halver');
  const totaller = all.find(t => t.userData.kind === 'robot' && t.__bot?.name === 'the totaller');
  const hbox = all.find(t => t.userData.kind === 'box' && t.userData.holes[0]?.thing?.userData.kind === 'bird');
  const tbox = all.find(t => t.userData.kind === 'box' && t.userData.holes[0]?.thing?.userData.kind === 'nest');
  // the halver's lesson: give the bird a copy, then halve what is left
  D.clickThing(hbox); await frames(D, 3); D.clickBot(halver); await slowSettle(D, 4000);
  const teaching1 = D.helperState().mode === 'training';
  D.teach({ type: 'copy', at: { c: 'given', path: [1] } }); await slowSettle(D, 4000);
  D.teach({ type: 'put', at: { c: 'given', path: [0] } }); await slowSettle(D, 4000);
  D.teach({ type: 'newNumber' }); await slowSettle(D, 4000);
  D.clawNode()?.setValue(D.rat(1, 2), '*');
  D.teach({ type: 'put', at: { c: 'given', path: [1] } }); await slowSettle(D, 4000);
  D.exit(); await slowSettle(D, 4000);
  const steps1 = D.allBots().length ? 1 : 0;
  // a fresh lesson's thought is the exact 1/2; Ruby makes it any number
  D.rubyOn(true); D.clickCond([1]); await frames(D, 3); D.rubyOn(false);
  D.rounds(5); D.run(); await slowSettle(D, 60000);
  const delivered = tbox.userData.holes[0].thing.userData.pile.length;
  // the totaller's lesson: take the delivery off the nest, drop it on the total
  D.clickThing(tbox); await frames(D, 3); D.clickBot(totaller); await slowSettle(D, 4000);
  const teaching2 = D.helperState().mode === 'training';
  D.teach({ type: 'take', at: { c: 'given', path: [0], nest: true } }); await slowSettle(D, 4000);
  D.teach({ type: 'put', at: { c: 'given', path: [1] } }); await slowSettle(D, 4000);
  D.exit(); await slowSettle(D, 4000);
  // ...and the totaller's: any delivery on the nest, any total
  D.rubyOn(true); D.clickCond([0]); await frames(D, 3); D.clickCond([1]); await frames(D, 3); D.rubyOn(false);
  D.rounds(5); D.run(); await slowSettle(D, 60000);
  const total = D.mine()?.userData.holes?.[1]?.thing?.userData.value;
  const sum = total ? String(total.n) + '/' + String(total.d) : 'none';
  const ok = teaching1 && teaching2 && steps1 >= 1 && delivered === 5 && sum === '31/32';
  put((ok ? 'PASS' : 'FAIL') + ' Zeno’s postman taught by hand  (lessons=' + teaching1 + '/' + teaching2 + ' halver-steps=' + steps1 + ' delivered=' + delivered + ' total=' + sum + ')', ok ? 'pass' : 'fail');
  return ok;
}

// A ROBOT GIVES A THING A BEHAVIOUR: it takes out the behaviour's panel and
// the thing's panel, and drops one on the other; the behaviour then works
// on the thing. And a model in a hole shows itself, not its name plate.
async function panelStepCheck(D, w) {
  const zoo = await (await fetch('../examples/yard/🦁 zoo.world.json')).json();
  const gad = zoo.yard.bench.find(b => b.thing.gadget).thing;
  const croc = zoo.yard.bench.find(b => b.thing.label === 'crocodile').thing;
  const prog = [
    { type: 'take', at: { c: 'given', path: [0] } }, { type: 'panel' }, { type: 'put', at: { c: 'given', path: [0] } },
    { type: 'take', at: { c: 'given', path: [1] } }, { type: 'panel' }, { type: 'put', at: { c: 'given', path: [1] } },
    { type: 'take', at: { c: 's0', path: [] } }, { type: 'put', at: { c: 's1', path: [] } }];
  D.worldIn({ kind: 'world', v: 4, stations: { stand: { kind: 'box', holes: [gad, croc] } },
    active: { kind: 'robot', name: 'the fitter', condition: { kind: 'box', holes: [{ kind: 'wild' }, { kind: 'wild' }] },
      trainedOn: { kind: 'box', holes: [gad, croc] }, program: prog }, bench: [] });
  await slowSettle(D, 2000);
  D.speed('inf');
  const model = D.mine([1]);
  const plateHidden = model && model.__labelNode && model.__labelNode.visible === false;
  D.rounds(1); D.run(); await slowSettle(D, 60000);
  const m2 = D.mine([1]);
  const tray = m2 ? D.panelOf(m2) : null;
  let nested = false;
  if (tray?.__ctx?.root) tray.__ctx.root.traverse(o => { if (o.userData?.gadget) nested = true; });
  const bound = !!(m2?.userData.lid) && [0, 1, 2, 3, 4, 5].map(i => D.bench(i)).filter(Boolean).concat(tray ? [] : [])
    .some(t => t.userData.gadget && t.userData.boundTo === m2.userData.lid) || nested;
  const ok = plateHidden && !!tray && (nested || bound);
  put((ok ? 'PASS' : 'FAIL') + ' a robot gives a thing a behaviour by its panel  (model-plate-hidden-in-hole=' + plateHidden + ' panel-out=' + !!tray + ' behaviour-inside=' + nested + ' bound=' + bound + ')', ok ? 'pass' : 'fail');
  return ok;
}

// A PANEL AND A HOLE. In a lesson, the behaviour's panel dropped on the
// crocodile in its hole binds the behaviour to the crocodile and the tray
// lands on a work spot (not on the bench, where the lesson cannot see it).
// By hand, the same drop binds too; a panel dropped in an EMPTY hole is
// refused and set back on the table. And a model in a hole rests on the rim.
async function panelHoleCheck(D, w) {
  const zoo = await (await fetch('../examples/yard/🦁 zoo.world.json')).json();
  const gad = zoo.yard.bench.find(b => b.thing.gadget).thing;
  const croc = zoo.yard.bench.find(b => b.thing.label === 'crocodile').thing;
  const name = (o) => !o ? '.' : o.userData.panel ? 'P' : (o.userData.label || o.userData.text || o.userData.kind);
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null,
    bench: [{ thing: { kind: 'box', holes: [gad, croc, null] }, x: -0.4, z: 1.7 }, { thing: { kind: 'robot' }, x: 0.9, z: 1.5 }] });
  await slowSettle(D, 2000); D.speed('inf');
  const all = []; for (let i = 0; i < 6; i++) { const t = D.bench(i); if (!t) break; all.push(t); }
  const given = all.find(t => t.userData.kind === 'box'), bot = all.find(t => t.userData.kind === 'robot');
  // the crocodile rests on the rim of its hole
  const crocNode = given.userData.holes[1].thing;
  D.scene.updateMatrixWorld(true);
  const bb = new D.THREE.Box3().setFromObject(crocNode);
  const rim = given.userData.holes[1].anchor.getWorldPosition(new D.THREE.Vector3()).y + 0.045;
  const onRim = bb.min.y >= rim - 0.005;
  // the lesson: take the behaviour, take out its panel, drop the panel on the crocodile
  D.clickThing(given); await frames(D, 3); D.clickBot(bot); await slowSettle(D, 4000);
  D.teach({ type: 'take', at: { c: 'given', path: [0] } }); await slowSettle(D, 4000);
  D.openHeldPanel(); await slowSettle(D, 4000);
  const tray = D.scratch()[0];
  // the behaviour back in its hole; the tray off its spot; the tray onto the crocodile
  D.teach({ type: 'put', at: { c: 'given', path: [0] } }); await slowSettle(D, 4000);
  const traySpot = Object.values(D.stations).find(s2 => s2.kind === 'scratch' && s2.occupant === tray);
  D.clickRaw({ kind: 'station', id: traySpot.id }); await slowSettle(D, 4000);
  D.teach({ type: 'put', at: { c: 'given', path: [1] } }); await slowSettle(D, 6000);
  const gadNode = given.userData.holes[0].thing;
  const boundInLesson = !!gadNode?.userData.boundTo && gadNode.userData.boundTo === crocNode.userData.lid;
  const trayOnSpot = !!tray && Object.values(D.stations).some(s2 => s2.kind === 'scratch' && s2.occupant === tray);
  const trayOnBench = !!tray && tray.parent === D.benchRoot;
  D.exit(); await slowSettle(D, 4000);
  // by hand: the panel dropped on a thing in a hole binds; dropped in an empty hole it is refused
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null,
    bench: [{ thing: gad, x: -0.9, z: 1.7 }, { thing: { kind: 'box', holes: [croc, null] }, x: 0.4, z: 1.7 }] });
  await slowSettle(D, 2000);
  const all2 = []; for (let i = 0; i < 6; i++) { const t = D.bench(i); if (!t) break; all2.push(t); }
  const pad = all2.find(t => t.userData.gadget), box2 = all2.find(t => t.userData.kind === 'box');
  D.clickThing(pad); await frames(D, 3); D.openHeldPanel(); await slowSettle(D, 4000);
  const tray2 = all2.concat([0, 1, 2, 3, 4, 5, 6].map(i => D.bench(i))).filter(Boolean).find(t => t.userData.panel && t.__owner === pad);
  // the pad, still in hand, dropped on its OWN tray: refused, and it stays out of its panel
  D.clickThing(tray2); await slowSettle(D, 3000);
  const insideSelf = (() => { for (let q = pad.parent; q; q = q.parent) if (q === tray2) return true; return false; })();
  const ownPanelRefused = !insideSelf && pad.parent === D.benchRoot;
  if (pad.parent !== D.benchRoot) { D.clickBench(-1.2, 1.9); await slowSettle(D, 3000); }
  D.clickThing(tray2); await frames(D, 3);
  const hint0 = D.hintText ? D.hintText() : w.document.getElementById('hint').textContent;
  D.clickHole(box2, 1); await slowSettle(D, 3000);
  const hintEmpty = w.document.getElementById('hint').textContent;
  const refusedEmpty = /does not go in a hole/i.test(hintEmpty) && tray2.parent === D.benchRoot && !box2.userData.holes[1].thing;
  D.clickThing(tray2); await frames(D, 3); D.clickHole(box2, 0); await slowSettle(D, 3000);
  const croc2 = box2.userData.holes[0].thing;
  const boundByHand = !!pad.userData.boundTo && pad.userData.boundTo === croc2?.userData.lid && tray2.parent === D.benchRoot;
  const ok = onRim && boundInLesson && trayOnSpot && !trayOnBench && refusedEmpty && boundByHand && ownPanelRefused;
  put((ok ? 'PASS' : 'FAIL') + ' a panel and a hole  (crocodile-on-rim=' + onRim + ' lesson-bound=' + boundInLesson + ' tray-on-work-spot=' + trayOnSpot + ' tray-on-bench=' + trayOnBench + ' empty-hole-refused=' + refusedEmpty + ' bound-by-hand=' + boundByHand + ' own-panel-refused=' + ownPanelRefused + ')', ok ? 'pass' : 'fail');
  return ok;
}

// A LESSON SURVIVES A BINDING. Nesting one panel in another during a lesson
// used to end the lesson silently (bindGadget stashed the outer world's mode
// and hands into a context it was throwing away). Now the lesson goes on,
// the knob is a step that puts the panel away, the nested panel sits ON the
// host's floor, a bound panel has one world root (not a stale second one),
// and the trained robot repeats it all on a fresh box.
async function panelLessonCheck(D, w) {
  const zoo = await (await fetch('../examples/yard/🦁 zoo.world.json')).json();
  const gad = zoo.yard.bench.find(b => b.thing.gadget).thing;
  const croc = zoo.yard.bench.find(b => b.thing.label === 'crocodile').thing;
  const name = (o) => !o ? '.' : o.userData.panel ? 'P' : (o.userData.label || o.userData.text || o.userData.kind);
  const spots = () => Object.values(D.stations).filter(s2 => s2.kind === 'scratch');
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null,
    bench: [{ thing: { kind: 'box', holes: [gad, croc, { kind: 'bird' }] }, x: -0.4, z: 1.7 }, { thing: { kind: 'robot' }, x: 0.9, z: 1.5 }] });
  await slowSettle(D, 2000); D.speed('inf');
  const all = []; for (let i = 0; i < 6; i++) { const t = D.bench(i); if (!t) break; all.push(t); }
  const given = all.find(t => t.userData.kind === 'box'), bot = all.find(t => t.userData.kind === 'robot');
  D.clickThing(given); await frames(D, 3); D.clickBot(bot); await slowSettle(D, 4000);
  for (const i of [1, 0]) {
    D.teach({ type: 'take', at: { c: 'given', path: [i] } }); await slowSettle(D, 4000);
    D.openHeldPanel(); await slowSettle(D, 4000);
    D.teach({ type: 'put', at: { c: 'given', path: [i] } }); await slowSettle(D, 4000);
  }
  const crocSpot = spots().find(s2 => s2.occupant?.__owner?.userData.label === 'crocodile');
  const wandSpot = spots().find(s2 => s2.occupant?.__owner?.userData.text === 'wandering');
  const crocTray = crocSpot?.occupant, wandTray = wandSpot?.occupant;
  D.clickRaw({ kind: 'station', id: wandSpot.id }); await slowSettle(D, 4000);
  D.clickRaw({ kind: 'station', id: crocSpot.id }); await slowSettle(D, 6000);
  const stillTraining = D.helperState().mode === 'training' && w.getComputedStyle(w.document.getElementById('exitBtn')).display !== 'none';
  // the nested panel sits on the host's floor, inside its edges
  D.scene.updateMatrixWorld(true);
  // the CARD goes in and its tray folds: the group's floor shows cards, not trays
  const gadNode = given.userData.holes[0].thing ?? null;   // gone from the box...
  let card = null; crocTray.__ctx?.root?.traverse(o => { if (!card && o.userData?.gadget) card = o; });
  const local = card ? crocTray.worldToLocal(card.getWorldPosition(new D.THREE.Vector3())) : null;
  const onFloor = !!card && !gadNode && Math.abs(local.x) < crocTray.userData.pw / 2 && Math.abs(local.z) < crocTray.userData.pd / 2
    && (!wandTray.parent || wandTray.__closed === true || !wandTray.visible);
  const oneRoot = card.children.filter(c => c.name === 'worldRoot').length <= 1;
  // the knob in a lesson: a step
  D.clickRaw({ kind: 'panelClose', tray: crocTray }); await slowSettle(D, 6000);
  const folded = !crocSpot.occupant && stillTraining && D.helperState().mode === 'training';
  D.exit(); await slowSettle(D, 4000);
  const prog = D.activeProgram();
  const foldStep = prog.find(st => st.type === 'fold');
  const recorded = !!foldStep && prog.length >= 9;
  // a fresh copy of the box: run once, the crocodile ends up with the behaviour inside its panel
  D.worldIn({ kind: 'world', v: 4, stations: { stand: { kind: 'box', holes: [gad, croc, { kind: 'bird' }] } },
    active: { kind: 'robot', name: 'the fitter', condition: { kind: 'box', holes: [{ kind: 'wild' }, { kind: 'wild' }, { kind: 'wild' }] },
      trainedOn: { kind: 'box', holes: [gad, croc, { kind: 'bird' }] }, program: prog }, bench: [] });
  await slowSettle(D, 2000); D.speed('inf');
  D.rounds(1); D.run(); await slowSettle(D, 60000);
  const croc2 = D.mine([1]);
  // put away with work still inside, the panel is a hidden tray on the bench; idle, it is a record
  const tray2 = croc2 ? D.panelOf(croc2) : null;
  let inTray = false; tray2?.__ctx?.root?.traverse(o => { if (o.userData?.gadget) inTray = true; });
  const inside = inTray || JSON.stringify(croc2?.userData.panelWorld || {}).includes('"text":"wandering"');
  const noTrayOut = !spots().some(s2 => s2.occupant?.userData.panel);
  const ok = stillTraining && onFloor && oneRoot && folded && recorded && inside && noTrayOut;
  put((ok ? 'PASS' : 'FAIL') + ' a lesson survives a binding  (still-training=' + stillTraining + ' nested-on-floor=' + onFloor + ' one-root=' + oneRoot + ' knob-folded=' + folded + ' fold-recorded=' + recorded + ' run-behaviour-inside=' + inside + ' no-tray-left=' + noTrayOut + ')', ok ? 'pass' : 'fail');
  return ok;
}

// A PANEL ENTERED FROM THE YARD HAS A WAY BACK. The exit door was hidden
// whenever the yard was open, so a panel walked into from the grass had no
// door out (Ken). And Ruby comes out to the yard, since a robot can be
// trained there.
async function yardPanelDoorCheck(D, w) {
  const zoo = await (await fetch('../examples/yard/🦁 zoo.world.json')).json();

  const world = await (await fetch('../examples/numbers/❗ factorial.world.json')).json();
  D.worldIn(world); await slowSettle(D, 2000);

  bot.__bot.note = was;

  // the team at the desk: the box goes to the leader, the members stand by without a thought each

  for (let i = 0; i < 30; i++) { const t = D.bench(i); if (!t) break; if (t.userData.kind === 'box' && t.userData.holes.length === 2) { box = t; break; } }
  D.hold(box); D.giveRobot(); await slowSettle(D, 3000);
  const ids = new Set([bot.__bot, ...bot.__bot.team].map(b => b.id));

// behaviour's panel and the crocodile's, puts one inside the other, folds it
// back into the crocodile and gives the crocodile to the bird. Switched on,
// the card inside the crocodile's panel is a nested ticker -- and the inner
// search's free revisits gave it fifty rounds a turn: 700 ms a frame. It
// gets one turn per parent turn now, and the crocodile still wanders.
async function nestedTickerCheck(D) {
  const rec = await (await fetch('give-behavior-robot.thing.json')).json();
  const bot = rec.thing;
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [
    { thing: bot, x: -1.2, z: 1.4 }, { thing: JSON.parse(JSON.stringify(bot.trainedOn)), x: 0, z: 1.6 },
    { thing: { kind: 'nest', id: 1, guid: 'bc6160e9-4e69-4d94-8b74-34ccdf3205d5', hasEgg: false, pile: [] }, x: 1.2, z: 1.6 } ] });
  await slowSettle(D, 2500);
  D.hold(D.bench(1)); D.giveRobot(); await slowSettle(D, 1500);
  D.run(); await slowSettle(D, 9000);
  let nest = null; for (let i = 0; i < 30; i++) { const t = D.bench(i); if (!t) break; if (t.userData.kind === 'nest') { nest = t; break; } }
  const croc = nest?.userData.pile?.[0];
  const delivered = !!croc && croc.userData.kind === 'model';
  if (!delivered) { put('FAIL a ticker folded inside a thing keeps time  (the crocodile never reached the nest)', 'fail'); return false; }
  D.hold(croc); await frames(D, 3); D.clickBench(-0.3, 2.2); await slowSettle(D, 1500);
  const p0 = croc.position.clone();
  const pressed = D.press(croc, ' ');
  const tray = croc.__panelTray;
  const r0 = tray?.userData?.stepRounds || 0;
  const times = [];
  for (let i = 0; i < 60; i++) { const t0 = performance.now(); D.frame(1, fnow()); times.push(performance.now() - t0); }
  times.sort((a, b) => a - b);
  const median = +times[30].toFixed(1);
  const perFrame = +(((tray?.userData?.stepRounds || 0) - r0) / 60).toFixed(2);
  const moved = +croc.position.distanceTo(p0).toFixed(3);
  const ok = pressed && !!tray?.userData?.dirty && median < 80 && perFrame <= 3 && moved > 0.03;
  put((ok ? 'PASS' : 'FAIL') + ' a ticker folded inside a thing keeps time  (switched-on=' + (pressed && !!tray?.userData?.dirty) + ' ms-per-frame=' + median + ' rounds-per-frame=' + perFrame + ' wandered=' + moved + ')', ok ? 'pass' : 'fail');
  return ok;
}

// A HELD STEP, AND A NOTEBOOK THAT MOVES. The sequencer honours a step's
// hold(): the world waits until it says go, at 1x and at Instant. And a
// notebook -- any notebook, since the suite's app asks nobody's name and
// keeps no desk notebook -- is picked up by its spine, set down where it is
// dropped, and resized in the hand.
async function heldStepCheck(D, w) {
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [
    { thing: { kind: 'notebook', pages: [{ kind: 'number', value: { n: '7', d: '1' } }], page: 0 }, x: 0.4, z: 1.6 } ] });
  await slowSettle(D, 1500);
  let go = false;
  let ended = 0;
  D.enqueue({ __visual: true, dur: 0, hold: () => go, end() { ended = 1; } });
  D.enqueue({ __visual: true, dur: 0, end() { ended = 2; } });
  await frames(D, 30);
  const waited = ended === 0;
  go = true;
  await frames(D, 5);
  const went = ended === 2;
  D.speed('inf');
  go = false; ended = 0;
  D.enqueue({ __visual: true, dur: 0, hold: () => go, end() { ended = 1; } });
  await frames(D, 30);
  const waitedInstant = ended === 0;
  go = true; await frames(D, 5);
  const wentInstant = ended === 1;
  D.speed(1);
  const nb = D.bench(0);
  D.clickRaw({ kind: 'nbSpine', nb }); await frames(D, 5);
  const inHand = D.heldPos() !== null && !D.bench(0);
  w.document.getElementById('heldPlus').click(); await frames(D, 3);
  const grew = +nb.scale.x.toFixed(2) === 1.25;
  D.clickBench(-1.1, 2.1); await slowSettle(D, 1500);
  const placed = Math.abs(nb.position.x + 1.1) < 0.15 && Math.abs(nb.position.z - 2.1) < 0.15;
  const ok = waited && went && waitedInstant && wentInstant && inHand && grew && placed;
  put((ok ? 'PASS' : 'FAIL') + ' a held step, and a notebook that moves  (holds=' + waited + ' goes=' + went + ' holds-at-instant=' + waitedInstant + ' goes-at-instant=' + wentInstant + ' notebook-in-hand=' + inHand + ' resized=' + grew + ' set-down=' + placed + ')', ok ? 'pass' : 'fail');
  return ok;
}

// A ROBOT THAT TEACHES A ROBOT. Taught by a person: in the teacher's lesson
// the claw takes a box and is dropped on the little robot among its things;
// the pupil steps up to a desk of its own, the next steps are the pupil's
// (mirrored into the teacher as taught steps), Ruby's erasure too, and
// "Stop teaching it" ends the pupil's lesson. Leaving the teacher's bubble
// rewinds the pupil into the box, untrained. Run, the teacher does it for
// real: the pupil stands trained at its desk with its box, its thought
// loosened, and counts when started. And a pad given [speak] says its words.
async function teachCheck(D, w) {
  const doc = w.document;
  const num = (n) => ({ kind: 'number', value: { n: String(n), d: '1' }, op: '+' });
  const txt = (t) => ({ kind: 'text', text: t });
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [
    { thing: { kind: 'robot', name: 'the teacher', program: [], team: [] }, x: -1.2, z: 1.4 },
    { thing: { kind: 'box', holes: [txt('I will teach this little robot to count.'), { kind: 'robot', name: 'the pupil', program: [], team: [] }, { kind: 'box', holes: [num(1)] }, txt('Now it counts.')] }, x: 0.2, z: 1.6 },
    { thing: { kind: 'text', text: 'hello from a pad', lid: 'L777', evt: 'evt-L777' }, x: 1.1, z: 2.1 } ] });
  await slowSettle(D, 2000);
  // a pad speaks: [speak] to its bird puts its words on the card (and in the air, where there is a voice)
  D.post('L777', { kind: 'text', text: 'speak' }); await frames(D, 5);
  const spoke = doc.getElementById('hint').textContent === 'hello from a pad';
  D.hold(D.bench(1)); D.giveRobot(); await slowSettle(D, 2500);
  const lesson = D.state.mode === 'training';
  D.teach({ type: 'take', at: { c: 'given', path: [0] } }); await slowSettle(D, 2500);
  D.teach({ type: 'speak' }); await slowSettle(D, 2500);
  D.teach({ type: 'put', at: { c: 'given', path: [0] } }); await slowSettle(D, 2500);
  D.teach({ type: 'take', at: { c: 'given', path: [2] } }); await slowSettle(D, 2500);
  const pupil = D.mine([1])?.__bot;
  D.clickRaw({ kind: 'botThing', bot: pupil }); await slowSettle(D, 4000);
  const taught = D.teachingNow();
  const stepsUp = !!taught && !!pupil.stand && Math.abs(pupil.node.scale.x - 1) < 0.02
    && Math.abs(pupil.node.rotation.x) < 0.01 && Math.abs(pupil.node.rotation.z) < 0.01   // on its feet, not the hole's flat pose
    && doc.getElementById('exitBtn').textContent === 'Stop teaching it'
    && String(D.mine()?.userData?.holes?.[0]?.thing?.userData?.value?.n) === '1';
  D.teach({ type: 'newNumber' }); await slowSettle(D, 2500);
  D.teach({ type: 'put', at: { c: 'given', path: [0] } }); await slowSettle(D, 2500);
  const added = String(D.mine()?.userData?.holes?.[0]?.thing?.userData?.value?.n) === '2';
  D.rubyOn(true); D.clickCond([0]); await slowSettle(D, 2500); D.rubyOn(false);
  const pupilLearned = pupil.program.length === 2 && pupil.condition?.holes?.[0]?.kind === 'wildNumber';
  doc.getElementById('exitBtn').click(); await slowSettle(D, 2000);   // "Stop teaching it"
  const teacherSteps = D.activeProgram().map(s2 => s2.type + (s2.step ? '>' + s2.step.type : ''));
  const stopped = !D.teachingNow() && D.state.mode === 'training'
    && teacherSteps.join(',') === 'take,speak,put,take,teach,taught>newNumber,taught>put,taught>erase,endTeach';
  D.exit(); await slowSettle(D, 3000);
  const given = D.mine();
  const rewound = D.state.mode === 'world' && given?.userData?.holes?.[1]?.thing?.__bot?.program?.length === 0
    && String(given?.userData?.holes?.[2]?.thing?.userData?.holes?.[0]?.thing?.userData?.value?.n) === '1'
    && !D.allBots().some(b => b.aside);
  // run: the teacher teaches for real
  D.run(); await slowSettle(D, 30000);
  const bots = D.allBots();
  const pupilNow = bots.find(b => b.name === 'the pupil' && b.aside);
  const ranOnce = D.state.mode === 'world' && D.roundsNow().runCount === 1;
  let pupilNode = null; { let r = given; while (r && r.parent) r = r.parent; r?.traverse(o => { if (o.__bot && o.__bot.name === 'the pupil' && o.__bot.stand) pupilNode = o; }); }
  const boxNow = pupilNode?.__bot?.stand?.occupant;
  const taughtForReal = !!pupilNow && pupilNow.steps === 2 && pupilNode?.__bot?.condition?.holes?.[0]?.kind === 'wildNumber'
    && String(boxNow?.userData?.holes?.[0]?.thing?.userData?.value?.n) === '2';
  // AT ITS OWN DESK, SQUARE, AND CLEAR OF THE WORK SPOTS: it used to be left
  // wherever its last step took it, facing whichever way it had walked, on a
  // desk that stood inside a work spot's platform
  let atDesk = false;
  {
    const b2 = pupilNode?.__bot;
    const spots = [];
    for (let k = 0; k < 9; k++) { const q = D.spotPoint(k); if (q) spots.push(q); }
    const near = b2?.stand ? Math.min(...spots.map(q => Math.hypot(b2.stand.point.x - q[0], b2.stand.point.z - q[2]))) : 0;
    atDesk = !!b2?.home && Math.hypot(b2.root.position.x - b2.home.pos.x, b2.root.position.z - b2.home.pos.z) < 0.06
      && Math.abs(b2.root.rotation.y) < 0.02 && near > 0.5;
  }
  // ...and the pupil counts
  let counts = false;
  if (pupilNode) {
    D.clickBot(pupilNode); await slowSettle(D, 2000);
    D.rounds(3); D.run(); await slowSettle(D, 12000); D.rounds(ROUNDS);
    counts = String(D.mine()?.userData?.holes?.[0]?.thing?.userData?.value?.n) === '5';
  }
  const ok = lesson && stepsUp && added && pupilLearned && stopped && rewound && ranOnce && taughtForReal && atDesk && counts && spoke;
  put((ok ? 'PASS' : 'FAIL') + ' a robot that teaches a robot  (lesson=' + lesson + ' pupil-steps-up=' + stepsUp + ' pupil-adds=' + added + ' pupil-learned=' + pupilLearned + ' stop-teaching=' + stopped + ' rewound=' + rewound + ' teacher-ran-once=' + ranOnce + ' taught-for-real=' + taughtForReal + ' at-its-own-desk=' + atDesk + ' pupil-counts=' + counts + ' pad-speaks=' + spoke + (stopped ? '' : ' steps=' + teacherSteps.join(',')) + ')', ok ? 'pass' : 'fail');
  return ok;
}

// MARTY'S COMMENTARY, AND WHO WAITS FOR WHOM. His opening line -- what the
// robot is trying to achieve -- takes seconds to come and longer to read, and
// the robot used to stand still for every second of it (Ken: "that causes a
// very long pause before the first action. I think they should overlap"). Now
// it works while he talks, and a line he cannot say at that moment is not
// said at all. Commentary is for watching closely, too: 1x or 1/2x, and a run
// sped up mid-way stops being narrated then and there.
async function narrationCheck(D, w) {
  const doc = w.document;
  const num = (n) => ({ kind: 'number', value: { n: String(n), d: '1' }, op: '+' });
  const fresh = () => D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [
    { thing: { kind: 'robot', name: 'the counter',
               condition: { kind: 'box', holes: [{ kind: 'wildNumber' }] },
               program: [{ type: 'newNumber' }, { type: 'put', at: { c: 'given', path: [0] } }],
               trainedOn: { kind: 'box', holes: [num(0)] }, team: [] }, x: -1.2, z: 1.4 },
    { thing: { kind: 'box', holes: [num(0)] }, x: 0.2, z: 1.6 }] });
  const log = () => [...doc.getElementById('martyLog').children].map(c => c.textContent);
  const steps = () => log().filter(t => /A line for step/.test(t)).length;
  const asks = [], systems = [];
  let open = null;                       // the brain answers when this check says so
  const gate = new Promise(r => (open = r));
  let ok = false, part1 = '', part2 = '', part3 = '', part4 = '';
  try {
    D.brain(async (sys, q) => {
      asks.push(q); systems.push(sys);
      await gate;
      if (!/JSON array/.test(q)) return 'It counts.';
      const n = +(/its (\d+) steps/.exec(q)?.[1] ?? 2);
      return JSON.stringify(Array.from({ length: n }, (_, i) => 'A line for step ' + (i + 1) + '.'));
    });
    D.commentary(true);
    // 1. IT DOES NOT WAIT FOR HIM: the opening ask is still unanswered and the
    //    robot is already at work, with nothing said yet
    fresh(); await slowSettle(D, 2000);
    D.speed(1); D.rounds(20);
    D.hold(D.bench(1)); D.giveRobot(); await frames(D, 10);
    if (D.state.mode !== 'replay') D.run();
    await frames(D, 240);
    const overlapped = asks.length >= 1 && log().length === 0 && D.state.mode === 'replay'
      && (!!D.state.claw || D.state.busy);
    part1 = 'asked=' + asks.length + ' said=' + log().length + ' claw=' + D.state.claw + ' busy=' + D.state.busy;
    // 2. ...and once he is quiet again, every step gets its line
    open(); await frames(D, 60);
    const opened = log().some(t => /It counts/.test(t));
    await new Promise(r => setTimeout(r, 1700));        // his opening, read at a reading pace
    await frames(D, 400);
    const narrated = steps() >= 1;
    part2 = 'opening-said=' + opened + ' step-lines=' + steps();
    // 3. THE SAME LINE IS SAID AGAIN NEXT ROUND, so it must not name the value a
    //    hole happens to hold now (Ken: "the 0 is no longer a zero")
    const stepsAsk = asks.find(q => /JSON array/.test(q)) ?? '';
    const everyRound = /said again on EVERY round/.test(stepsAsk)
      && /never by a value it happens to hold/.test(stepsAsk);
    // ...and what a drop DOES, and who is who in a team: a number dropped on a
    // number is arithmetic (models called adding 1 to 0 "replacing" it), and
    // "it" among several robots is anybody (Ken)
    const sys0 = systems[0] ?? '';
    const plainlyTold = /number dropped on a number is ARITHMETIC/.test(sys0)
      && /never replaces/.test(sys0) && /say WHICH robot you mean by its name/.test(sys0)
      // ...and the robot he is to name is named to him: botFacts drops the name
      // of a robot with no team of its own, which is every member of one
      && /The robot “the counter”/.test(stepsAsk);
    part3 = 'every-round-in-the-ask=' + everyRound + ' drops-teams-and-names=' + plainlyTold;
    doc.getElementById('runBtn').click();               // stop
    await slowSettle(D, 8000);
    // 4. ABOVE 1x NOBODY IS WATCHING THAT CLOSELY: nothing is asked and nothing
    //    said; and a run sped up mid-way stops being narrated there and then
    await new Promise(r => setTimeout(r, 300)); await frames(D, 30);   // the stop comment, landed
    const asked0 = asks.length, said0 = log().length;
    fresh(); await slowSettle(D, 2000);
    D.speed(2); D.rounds(3);
    D.hold(D.bench(1)); D.giveRobot(); await frames(D, 10);
    if (D.state.mode !== 'replay') D.run();
    await slowSettle(D, 9000); await frames(D, 200);
    const quietFast = asks.length === asked0 && log().length === said0;
    fresh(); await slowSettle(D, 2000);
    D.speed(1); D.rounds(20);
    D.hold(D.bench(1)); D.giveRobot(); await frames(D, 10);
    if (D.state.mode !== 'replay') D.run();
    await new Promise(r => setTimeout(r, 1600));
    await frames(D, 400);
    const goingOn = steps();
    D.speed(4);                                          // the visitor speeds it up
    const saidAt = log().length;
    await frames(D, 600);
    const hushed = goingOn > 0 && log().length === saidAt;
    part4 = 'nothing-at-2x=' + quietFast + ' lines-before-speeding-up=' + goingOn
      + ' nothing-after=' + hushed;
    doc.getElementById('runBtn').click();
    await slowSettle(D, 8000);
    ok = overlapped && opened && narrated && everyRound && plainlyTold && quietFast && hushed;
  } finally {
    D.brain(null); D.commentary(false); D.speed(1); D.rounds(ROUNDS);
  }
  put((ok ? 'PASS' : 'FAIL') + ' the robot works while Marty talks  (' + part1 + '; ' + part2
      + '; ' + part3 + '; ' + part4 + ')', ok ? 'pass' : 'fail');
  return ok;
}

// EVERY FACE OF A TURNED CUBE READS. Turning a number lands the face you
// asked for upright and used to leave the other five wherever the turn put
// them -- the scientific notation reading bottom-to-top up the side of the
// block, the value on the lid upside down (Ken's picture). Each pane is
// rolled about its own normal by the quarter turn that reads best: up the
// screen for a pane seen side-on, away from the front of the table for one
// you look down on. The score below is that dot product: 1 is upright, 0 is
// sideways, -1 is upside down.
async function faceUpCheck(D, w) {
  const THREE = D.THREE;
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [
    { thing: { kind: 'number', value: { n: '123456789', d: '100000000' }, op: '+' }, x: 0.2, z: 1.6 } ] });
  await slowSettle(D, 2000);
  let cube = null;
  for (let i = 0; i < 8; i++) { const t = D.bench(i); if (t?.userData?.kind === 'number') cube = t; }
  if (!cube) { put('FAIL every face of a turned cube reads  (no cube)', 'fail'); return false; }
  const worst = () => {
    cube.updateMatrixWorld(true);
    let low = 2;
    for (const ch of cube.children) {
      if (ch.geometry?.type !== 'PlaneGeometry') continue;
      const q = new THREE.Quaternion(); ch.getWorldQuaternion(q);
      const n = new THREE.Vector3(0, 0, 1).applyQuaternion(q);
      const up = new THREE.Vector3(0, 1, 0).applyQuaternion(q);
      const want = Math.abs(n.y) < 0.6 ? new THREE.Vector3(0, 1, 0)
                                       : new THREE.Vector3(0, 0, n.y > 0 ? -1 : 1);
      low = Math.min(low, +up.dot(want).toFixed(2));
    }
    return low;
  };
  const key = (k) => w.dispatchEvent(new w.KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));
  const made = worst();                       // as made, every face already reads
  D.hold(cube); await slowSettle(D, 2500);    // ...and the flight to the hand is over
  key('ArrowUp'); await slowSettle(D, 2000);
  const tipped = worst();
  key('ArrowLeft'); await slowSettle(D, 2000);
  const turned = worst();
  D.clickBench(0.2, 1.6); await slowSettle(D, 3000);
  const down = worst();
  const ok = made > 0.99 && tipped > 0.99 && turned > 0.99 && down > 0.99;
  put((ok ? 'PASS' : 'FAIL') + ' every face of a turned cube reads  (as-made=' + made
      + ' tipped=' + tipped + ' turned=' + turned + ' set-down=' + down + ')', ok ? 'pass' : 'fail');
  return ok;
}

// THE VIEW GOES WITH THE WORLD, once the player has chosen one. A world saved
// after you set the camera up opens at that view; one whose camera you never
// touched carries none, so it opens at the workshop's own framing -- which is
// also what keeps the golden worlds byte-identical.
async function cameraSavedCheck(D) {
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [
    { thing: { kind: 'number', value: { n: '3', d: '1' }, op: '+' }, x: 0.2, z: 1.6 } ] });
  await slowSettle(D, 1500);
  const untouched = D.worldOut().camera ?? null;          // nobody moved it: nothing saved
  D.orbitStart();                                          // the player takes the camera...
  D.camPut([1.5, 2.4, 3.6], [0.2, 0.9, 1.1]);              // ...and puts it here
  await frames(D, 5);
  const rec = D.worldOut();
  const saved = rec.camera;
  const wrote = !!saved && saved.at.join(',') === '1.5,2.4,3.6' && saved.look.join(',') === '0.2,0.9,1.1';
  // somewhere else entirely, and then the world back again
  D.camPut([-3, 5, -4], [0, 0, 0]);
  await frames(D, 5);
  D.worldIn(rec); await slowSettle(D, 1500);
  const now = D.camNow();
  const came = now.at.join(',') === '1.5,2.4,3.6' && now.look.join(',') === '0.2,0.9,1.1';
  // ...and it is still the player's view, so saving it again keeps it
  const again = !!D.worldOut().camera;
  const ok = untouched === null && wrote && came && again;
  put((ok ? 'PASS' : 'FAIL') + ' the view goes with the world  (untouched-saves-none=' + (untouched === null)
      + ' saved=' + wrote + ' came-back=' + came + ' kept=' + again + ')', ok ? 'pass' : 'fail');
  return ok;
}

// WHAT DUSTY TOOK OFF A PAGE IS WHAT IS IN HIS BAG. The list of things drawn
// on an open notebook is [page number, entry, page number, entry], so counting
// into it by the page's own number found the numeral for a left-hand page and
// the neighbour's entry for a right-hand one: the page emptied and a little
// numeral went into the bag (Ken: "it didn't end up in Dusty's bag").
async function pageVacuumCheck(D) {
  const back = [];
  for (const slot of [0, 1]) {
    D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [
      { thing: { kind: 'notebook', page: 0, pages: [
        { kind: 'number', value: { n: '7', d: '1' }, op: '+' },
        { kind: 'text', text: 'hello' }] }, x: 0.2, z: 1.6 } ] });
    await slowSettle(D, 1500);
    let nb = null;
    for (let i = 0; i < 8; i++) { const t = D.bench(i); if (!t) break;
      if (t.userData.kind === 'notebook' && !t.userData.main) nb = t; }
    D.dustyOn(true);
    D.clickRaw({ kind: 'nbItem', nb, slot });
    await slowSettle(D, 4000);
    const emptied = nb.userData.pages[slot] === null && D.bagN === 1;
    D.dustyBag();                       // click his head: it comes back to the hand
    await slowSettle(D, 2500);
    back.push(emptied ? (D.state.hand ?? 'nothing') : 'not emptied');
    D.dustyOn(false);
  }
  // the left page held a 7, the right a pad
  const ok = back[0] === '7' && back[1] === 'text';
  put((ok ? 'PASS' : 'FAIL') + ' what Dusty takes off a page is what he gives back  (left-page=' + back[0]
      + ' right-page=' + back[1] + ')', ok ? 'pass' : 'fail');
  return ok;
}

// A MODEL OUT OF A FILE, and the pictures kept out of the voice. A .glb is
// read by the loader the workshop's own characters use, sized to the table,
// and saved inside the world -- so it comes back when the world does. And an
// emoji is for the eye: a voice that reads it says the word twice ("press the
// microphone microphone"), so what is spoken has the pictures taken out.
async function modelFileCheck(D, w) {
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [] });
  await slowSettle(D, 1500);
  const meshes = (m) => { let n = 0; m?.traverse(o => { if (o.isMesh) n++; }); return n; };
  const onBench = () => { for (let i = 0; i < 8; i++) { const t = D.bench(i); if (!t) break;
    if (t.userData.kind === 'model') return t; } return null; };
  const blob = await (await fetch('../mimi_v1.glb')).blob();
  // The meshes arrive when the loader has read them, as the workshop's own do
  // -- on REAL time, off the workshop's clock, so this waits on the wall and
  // not on frames (1200 frames go by in well under a second). And it waits
  // for a COUNT, not for "not none": a thing wears its own name, and a name
  // plate is a mesh, so the model has one before the loader has read a thing.
  const untilRead = async (want) => {
    for (let k = 0; k < 60 && meshes(onBench()) < want; k++) {
      await frames(D, 10);
      await new Promise(r => setTimeout(r, 60));
    }
  };
  D.readMedia(new w.File([blob], 'mimi_v1.glb', { type: 'model/gltf-binary' }));
  await untilRead(8);
  const m = onBench();
  // the BODY, not the name plate standing over it: the plate is a child, and
  // measuring the lot made a 0.34 m model 0.44 m tall
  const bb = m ? new D.THREE.Box3() : null;
  if (m) m.traverse(o => { if (o.isMesh && o !== m.__labelNode) bb.expandByObject(o); });
  const side = bb && !bb.isEmpty()
    ? Math.max(bb.max.x - bb.min.x, bb.max.y - bb.min.y, bb.max.z - bb.min.z) : 0;
  const arrived = !!m && meshes(m) > 8 && m.userData.label === 'mimi_v1'
    && Math.abs(side - 0.34) < 0.02;                  // sized to the table, whatever it was made in
  // ...and its NAME stands clear of it. Every thing but a box, a bird, a nest
  // and a field takes its plaque at a fixed (0, 0.27, 0.06) -- fine for the
  // workshop's own small models, and squarely inside an imported duck's head
  // (Ken). A model is whatever shape it came as, so the plate is measured
  // onto it -- and measured AGAIN when the loader has finished, since the
  // thing is named while it is still empty.
  const plate = m?.__labelNode ?? null;
  let named = false;
  if (plate && bb) {
    const pb = new D.THREE.Box3().setFromObject(plate);
    const body = new D.THREE.Box3();
    m.traverse(o => { if (o.isMesh && o !== plate) body.expandByObject(o); });
    named = !body.isEmpty() && (pb.min.y >= body.max.y - 0.005 || pb.min.z >= body.max.z - 0.005);
  }
  // ...and it goes into the saved world and comes back out of it
  const was = meshes(m);
  const rec = JSON.parse(JSON.stringify(D.worldOut()));
  const saved = rec.bench.find(b => b.thing.kind === 'model')?.thing ?? null;
  D.worldIn(rec);
  await untilRead(was);
  const back = onBench();
  const backNow = meshes(back);           // read ONCE, here, not at print time
  const kept = !!saved?.src && backNow === was && back?.userData.label === 'mimi_v1';
  // the voice, with the pictures taken out
  const said = D.spoken('press the microphone \u{1F3A4} and speak \u2014 the speaker \u{1F50A} '
                        + 'next to my name, in the \u22EE menu');
  const quiet = said === 'press the microphone and speak — the speaker next to my name, in the menu';
  const arrows = D.spoken('the \u2190 and \u2192 arrows turn it') === 'the ← and → arrows turn it';
  // ...and a model that CANNOT come in says why, and leaves nothing behind.
  // (Ken dropped the Khronos Duck's Draco variant: a 3.8 KB table of contents
  // that points at a .bin and a .png which did not come with it, and asks for
  // a squeezing we carry no unpacker for. All it said was that it could not
  // be read -- and it left the name plate standing over nothing.)
  const gltf = (o) => 'data:model/gltf+json;base64,' + w.btoa(JSON.stringify(o));
  const squeezed = { asset: { version: '2.0' }, extensionsRequired: ['KHR_draco_mesh_compression'],
                     buffers: [{ uri: 'Duck.bin' }] };
  const dr = D.modelTrouble(gltf(squeezed), 'Duck.gltf');
  const toc = D.modelTrouble(gltf({ asset: { version: '2.0' }, buffers: [{ uri: 'Duck0.bin' }],
                                    images: [{ uri: 'DuckCM.png' }] }), 'Duck.gltf');
  const page = D.modelTrouble('data:text/html;base64,'
    + w.btoa('<!DOCTYPE html><title>Duck.gltf at main</title>'), 'Duck.gltf');
  const whole = D.modelTrouble(gltf({ asset: { version: '2.0' },
    buffers: [{ uri: 'data:application/octet-stream;base64,AA==' }] }), 'ok.gltf');
  const told = /Draco/.test(dr || '') && /Duck0\.bin/.test(toc || '') && /DuckCM\.png/.test(toc || '')
    && /web page/.test(page || '') && whole === null;
  const count = () => { let n = 0; for (let i = 0; i < 10; i++) if (D.bench(i)) n++; return n; };
  const n0 = count();
  D.readMedia(new w.File([JSON.stringify(squeezed)], 'Duck.gltf', { type: 'model/gltf+json' }));
  await frames(D, 60);
  const nothingLeft = count() === n0;
  const ok = arrived && kept && quiet && arrows && told && nothingLeft && named;
  put((ok ? 'PASS' : 'FAIL') + ' a model out of a file, and pictures kept out of the voice  (meshes='
      + was + ' sized=' + side.toFixed(2) + ' saved-and-back=' + kept
      + (kept ? '' : ' [src-saved=' + !!saved?.src + ' src-bytes=' + (saved?.src || '').length
         + ' came-back=' + backNow + ' later=' + meshes(back) + ' same-node=' + (back === m)
         + ' named=' + JSON.stringify(back?.userData.label) + ']')
      + ' spoken=\u201c' + said + '\u201d arrows-kept=' + arrows
      + ' says-why=' + told + ' leaves-nothing=' + nothingLeft
      + ' name-stands-clear=' + named + ')', ok ? 'pass' : 'fail');
  return ok;
}

// OUT IN THE YARD THE GROUND IS A METRE LOWER THAN THE TABLE, and the hand
// has to come down with it: the plane a carried thing slides on was measured
// once, from the robot's reach at the table, so everything picked up outside
// floated 1.09 m over the grass -- which, seen from a camera looking down, is
// drawn a long way from the pointer (Ken's pad "appeared behind a house when
// I didn't move it there"). And the words have to follow the ground too: it
// is not a workbench out there.
async function yardHandCheck(D, w) {
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [] });
  await slowSettle(D, 1500);
  const el = D.renderer.domElement;
  const lead = async () => {                       // the pointer leads the hand
    const r = el.getBoundingClientRect();
    for (const [fx, fy] of [[0.45, 0.6], [0.5, 0.58]]) {
      el.dispatchEvent(new w.PointerEvent('pointermove', { clientX: r.left + r.width * fx,
        clientY: r.top + r.height * fy, bubbles: true, pointerId: 1, pointerType: 'mouse' }));
      await frames(D, 4);
    }
    return D.handPos();
  };
  D.click('numbers');                              // something to carry
  await frames(D, 20);
  const inTop = D.bounds().top, inHand = (await lead())[1];
  D.clickBench(0.3, 1.6);                          // put it down, then go outside
  await frames(D, 40);
  D.clickRaw({ kind: 'yardDoor' });
  await slowSettle(D, 3000);
  D.click('numbers');
  await frames(D, 20);
  const outTop = D.bounds().top, outHand = (await lead())[1];
  const over = (h, top) => +(h - top).toFixed(2);
  const rides = D.outside && Math.abs(over(inHand, inTop) - over(outHand, outTop)) < 0.05
    && over(outHand, outTop) < 0.5;
  // a world that keeps its things outside says so when it is opened
  const said = D.yardWords({ kind: 'world', bench: [], yard: { bench: [{}, {}, {}] } });
  const told = /3 things are out in the YARD/.test(said) && D.yardWords({ kind: 'world' }) === '';
  const ok = rides && told;
  put((ok ? 'PASS' : 'FAIL') + ' what you carry rides over the ground you are on  (indoors='
      + over(inHand, inTop) + ' yard=' + over(outHand, outTop) + ' outside=' + D.outside
      + ' yard-is-announced=' + told + ')', ok ? 'pass' : 'fail');
  return ok;
}

// A TOOLTIP HAS TWO HALVES, with a rule between them: what THIS thing is, and
// how anything of its kind is worked (Ken read the second half of a pad's tip
// for the hundredth time). A behaviour's half is the note somebody wrote on
// it. And a sine pad says "sine": the unary operations ignore the number they
// ride on, so a 0 on the face is a number that means nothing.
async function padTipCheck(D, w) {
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [] });
  await slowSettle(D, 1500);
  const RULE = D.tipRule;
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null,
              bench: [{ x: 0.3, z: 1.6, thing: { kind: 'text', text: 'THE ROW GOES ON' } }] });
  await slowSettle(D, 1500);
  const pad = D.bench(0);
  const padTip = D.tip(pad) ?? '';
  const [what, how] = padTip.split(RULE);
  const padOK = padTip.includes(RULE) && /^\u201cTHE ROW GOES ON\u201d/.test(what || '')
    && /^Click to pick the pad up/.test((how || '').trim());
  // a behaviour, with a note on it
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null,
              bench: [{ x: 0.3, z: 1.6, thing: { kind: 'text', text: 'the guests', gadget: true,
                        note: 'The resort\u2019s own machinery.',
                        panel: { kind: 'world', v: 3, bench: [], stations: {}, active: null } } }] });
  await slowSettle(D, 1500);
  const gad = D.bench(0);
  const gTip = D.tip(gad) ?? '';
  const gadOK = gTip.includes(RULE) && gTip.split(RULE)[0].includes('The resort\u2019s own machinery.')
    && /Drop it on a thing/.test(gTip.split(RULE)[1] || '');
  // ...and a bare operation wears its own name
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null,
              bench: [{ x: 0.3, z: 1.6, thing: { kind: 'number', value: { n: '0', d: '1' }, op: 'sin' } }] });
  await slowSettle(D, 1500);
  const sine = D.bench(0);
  const faces = [];
  sine.traverse(o => { if (o.material?.__text != null) faces.push(o.material.__text); });
  const sineOK = faces.length > 0 && faces.every(t => t === 'sine');
  const ok = padOK && gadOK && sineOK;
  put((ok ? 'PASS' : 'FAIL') + ' a tooltip says what THIS is, then what its kind does  (pad='
      + padOK + ' behaviour-note=' + gadOK + ' bare-operation=' + JSON.stringify(faces[0] ?? null)
      + ')', ok ? 'pass' : 'fail');
  return ok;
}

async function rebindCheck(D) {
  const beh = (lid, evt, toLid) => ({ kind: 'text', text: 'the pilot', gadget: true,
    lid, evt, boundTo: toLid,
    panel: { kind: 'world', v: 3, bench: [], stations: {},
             active: { kind: 'robot', name: 'the pilot',
                       condition: { kind: 'box', holes: [{ kind: 'anyBird' }] },
                       program: [], trainedOn: { kind: 'box', holes: [
                         { kind: 'bird', nestId: 0, nestGuid: null, liveId: toLid, label: 'my thing' }] } } } });
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [
    { x: -0.9, z: 1.6, thing: { kind: 'text', text: 'plane one', lid: 'P1', evt: 'evt-P1' } },
    { x: 0.9, z: 1.6, thing: { kind: 'text', text: 'plane two', lid: 'P2', evt: 'evt-P2' } },
    { x: 0, z: 2.2, thing: beh('G1', 'evt-G1', 'P1') } ] });
  await slowSettle(D, 2000);
  const find = (t) => { for (let i = 0; i < 8; i++) { const x = D.bench(i); if (!x) break;
    if ((x.userData.text || '') === t) return x; } return null; };
  const g = find('the pilot'), two = find('plane two');
  const was = g?.userData.boundTo ?? null;
  D.clickThing(g);
  await frames(D, 30);
  // ON THE PAD'S EDGE: the middle of a pad takes a behaviour aboard as
  // scenery, which is a different gesture entirely
  const p2 = two.getWorldPosition(new D.THREE.Vector3());
  p2.x -= 0.15;
  D.clickThing(two, p2);
  await frames(D, 60);
  const now = g.userData.boundTo;
  const rec = g.userData.panelWorld ?? (g.__panelTray?.userData?.world ?? null);
  const names = JSON.stringify(rec ?? {}).match(/"liveId":"[^"]*"/g) || [];
  const moved = was === 'P1' && now === 'P2' && names.length > 0
    && names.every(n => n.includes('P2'));
  put((moved ? 'PASS' : 'FAIL') + ' a behaviour moves from one thing to another  (was=' + was
      + ' now=' + now + ' panel-speaks-of=' + (names.join(',') || 'nothing') + ')',
      moved ? 'pass' : 'fail');
  return moved;
}

  'yard/🦓 zoo-keeper',
  'devices/🖥️ computer',
  'devices/⏱️ timer',
