  const made = D.makeFromReply(JSON.stringify({ name: 'a sailboat', parts: [
    { shape: 'box', size: [0.14, 0.035, 0.34], at: [0, 0.02, 0], color: '#8b5a2b' }] }), 'a sailboat');
  const model = made.thing;
  D.hold(model); D.openHeldPanel(); D.clickBench(0.4, 1.5);
  await slowSettle(D, 4000);
  const tray = D.panelOf(model);
  D.clickRaw({ kind: 'panelInfo', tray });
  await slowSettle(D, 4000);
  const handedOut = D.state.hand === 'notebook' && !!D.infoNbOf(model);
  D.clickBench(1.4, 1.5);                       // set it down on the table
  await slowSettle(D, 4000);
  const withNb = benchN();
  D.clickRaw({ kind: 'panelInfo', tray });      // ...and the same plaque takes it back
  await slowSettle(D, 4000);
  const givenBack = benchN() === withNb - 1 && !D.infoNbOf(model);

  // 2. the helpers watch you, and what you pick up
  const find = (kind) => { let n = null;
    D.scene.traverse(o => { if (!n && o.__pick?.kind === kind && o.children.length) n = o; });
    return n; };
  const aimAt = (n, tx, tz) => {
    if (!n) return null;
    const f = new D.V3(Math.sin(n.rotation.y), 0, Math.cos(n.rotation.y));
    const to = new D.V3(tx - n.position.x, 0, tz - n.position.z).normalize();
    return f.dot(to);
  };
  for (let i = 0; i < 200; i++) D.frame(1, fnow());
  const cam = D.cameraAt ? D.cameraAt() : { x: 0.40, z: 5.45 };
  // WHOEVER IS THERE. The suite drives the app with ?demo=1, and in demo mode
  // Dusty and Ruby are never built -- the load skips them -- so insisting on
  // all three would be asserting something about the harness rather than
  // about the workshop. Every helper that EXISTS must be looking at you, and
  // the count is printed so nobody reads more into a pass than it says.
  const watchers = ['dusty', 'ruby', 'marty'].map(k => find(k)).filter(Boolean);
  const idleDots = watchers.map(n => aimAt(n, cam.x, cam.z));
  const watchYou = watchers.length >= 1 && idleDots.every(d => d > 0.9);

  // 3. a saved thing is a document a person can edit
  const rec = { kind: 'thing', v: 4, thing: { kind: 'model', parts: [
    { shape: 'box', size: [0.16, 0.03, 0.34], at: [0, 0.015, 0], color: '#8b5a2b' },
    { shape: 'cone', size: [0.09, 0.26], at: [0, 0.16, 0.03], rot: [90, 0, 0], color: 'crimson' }] } };
  const txt = D.prettyJSON(rec);
  const lines = txt.split(String.fromCharCode(10));
  const partLines = lines.filter(l => /"shape"/.test(l));
  const readable = JSON.stringify(JSON.parse(txt)) === JSON.stringify(rec)
    && partLines.length === 2                        // one part to a line
    && /"size": \[0\.16, 0\.03, 0\.34\]/.test(txt);  // numbers kept together

  // 4. and Marty turns to his OWN panel while you are using it
  // The two places -- his panel and your face -- can lie close together when
  // the window is narrow, so this does not demand a number of degrees, which
  // would only be measuring the width of the test frame. It asks whether he
  // is aiming at the place the code says he should be aiming at, and prints
  // how far apart those places were, so a small turn is never mistaken for a
  // missing one.
  const marty = find('marty');
  const doc = D.doc, panel = doc && doc.getElementById('martyPanel');
  const inBox = doc && doc.getElementById('martyIn');
  let busyAim = null, backAim = null, apartDeg = null, typedAim = null;
  if (marty && panel && inBox) {
    const PE = doc.defaultView.PointerEvent;
    const wasDisp = panel.style.display;
    panel.style.display = 'block';
    const aimPt = (pt) => aimAt(marty, pt.x, pt.z);
    panel.dispatchEvent(new PE('pointerenter', { bubbles: true }));
    for (let i = 0; i < 260; i++) D.frame(1, fnow());
    const look = D.panelLookPoint();
    busyAim = aimPt(look);
    const a = Math.atan2(look.x - marty.position.x, look.z - marty.position.z);
    const b = Math.atan2(cam.x - marty.position.x, cam.z - marty.position.z);
    apartDeg = Math.abs(((a - b) * 180 / Math.PI + 540) % 360 - 180);
    panel.dispatchEvent(new PE('pointerleave', { bubbles: true }));
    for (let i = 0; i < 260; i++) D.frame(1, fnow());
    backAim = aimAt(marty, cam.x, cam.z);
    inBox.focus();                                 // typing counts as using it
    for (let i = 0; i < 260; i++) D.frame(1, fnow());
    typedAim = aimPt(D.panelLookPoint());
    inBox.blur();
    for (let i = 0; i < 260; i++) D.frame(1, fnow());
    panel.style.display = wasDisp;
  }
  const watchesPanel = busyAim != null && busyAim > 0.995
    && typedAim != null && typedAim > 0.995 && backAim != null && backAim > 0.995;

  const ok = handedOut && givenBack && watchYou && readable && watchesPanel;
  put((ok ? 'PASS' : 'FAIL') + ' they wait on you  (info-handed-out=' + handedOut
      + ' info-given-back=' + givenBack
      + ' helpers-face-you=' + watchers.length + ':'
      + idleDots.map(d => d == null ? '?' : d.toFixed(2)).join('/')
      + ' saved-json-editable=' + readable
      + ' marty-at-panel=' + (busyAim == null ? '?' : busyAim.toFixed(3))
      + '/typing=' + (typedAim == null ? '?' : typedAim.toFixed(3))
      + '/back-to-you=' + (backAim == null ? '?' : backAim.toFixed(3))
      + ' places-apart=' + (apartDeg == null ? '?' : apartDeg.toFixed(1)) + 'deg'
      + ')', ok ? 'pass' : 'fail');
  return ok;
}

async function runOne(D, spec) {
  const w = await (await fetch('../' + spec.name + '.world.json')).json();
  D.worldIn(w); await slowSettle(D, 2000);
  D.speed('inf'); D.rounds(ROUNDS);
  const things = [];
  for (let i = 0; i < 14; i++) { const t = D.bench(i); if (!t) break; things.push(t); }
  if (spec.drive === 'lever') {
    const src = things.find(t => t.userData.kind === 'room');
    D.clickRaw({ kind: 'roomLever', room: src });
  } else {
    const arg = things.find(t => ['box', 'scale'].includes(t.userData.kind));
    const bot = things.find(t => t.userData.kind === 'robot');
    D.clickThing(arg); await slowSettle(D, 2000); D.clickBot(bot);
  }
  await slowSettle(D, 120000);
  // LET THE SCHEDULER QUIESCE ITS FLAGS. A room can be left dirty by a pass
  // that ran out of budget for its "nothing more to do" turn; the live app
  // clears it on the very next frame, but a dump taken between passes caught
  // it and a one-flag diff failed a byte-identical world. A few frames give
  // every stale flag its clearing turn; content cannot change (no mail moves).
  // 40, not 4: a dozing room's sleep-cache lasts 30 scheduler frames, and a
  // final delivery that re-dirtied it clears only after the cache expires --
  // half a second in the live app, an eternity to a dump taken sooner.
  for (let i = 0; i < 40; i++) { D.frame(1, fnow()); if ((i & 7) === 7) await breathe(); }
  await slowSettle(D, 20000);
  return JSON.stringify(D.dump());
}

(async () => {
  // wait for the app to boot
  for (let i = 0; i < 300; i++) {
    if (ready(frame.contentWindow.__nano)) break;
    await new Promise(r => setTimeout(r, 100));
  }
  const D = frame.contentWindow.__nano;
  if (!ready(D)) {
    put('FAIL: the app never booted', 'fail');
    document.title = 'FAIL';
    window.__VERDICT = { ok: false, error: 'app never booted' };
    return;
  }
  // WHICH COPY OF THIS PAGE IS RUNNING. A tab keeps the JavaScript it loaded
  // with, so an old one can finish, say PASS, and write nothing to disk --
  // which looks exactly like a suite that ran and a sink that failed. The
  // stamp is printed first, so a stale tab is visible at a glance, and it
  // names the file the verdict will land in.
  put('suite loaded ' + new Date().toLocaleTimeString()
      + '  ->  captures/verdict-'
      + ((appURL || 'source').replace(/[^\w.-]/g, '_')) + '.json', 'dim');
  put('app booted: ' + frame.src, 'dim');
  // and SILENT. A suite drives thousands of rounds; every one of them chirped
  // through the speakers of whoever was in the room. Not setVolume -- that
  // would write the mute into the workshop's own saved preference.
  D.mute(true);
  // AND THE CLOCK IS OURS. The app steps itself sixty times a second; while
  // the suite blocked the thread that loop never ran, and every check was
  // deterministic by accident of that. Now that the drivers yield -- so the
  // page stays usable under the hand -- the app would run BETWEEN slices and
  // step worlds behind the checks' backs. Measured the moment it happened: "a
  // thing off the table is out of play" went still=false, because a thing the
  // check had left sitting was moved while the check was not looking.
  D.autoLoop(false);

  const make = new URLSearchParams(location.search).get('make');
  const dumps = {};
  const wantGoldens = want('goldens');
  if (!wantGoldens) put('skipped: the 13 golden worlds (?checks filter)', 'dim');
  for (const spec of wantGoldens ? WORLDS : []) {
    const t0 = performance.now();
    try {
      dumps[spec.name] = await runOne(D, spec);
      put(`ran  ${spec.name}  (${Math.round(performance.now() - t0)} ms)`, 'dim');
    } catch (e) {
      dumps[spec.name] = 'ERR ' + e.message;
      put(`ERR  ${spec.name}  ${e.message}`, 'fail');
    }

  if (make) {
    // hand the dumps to serve.js's capture sink, which writes

    // in a commit that says why the golden moved
    let saved = false;
    try {
      const r = await fetch('/capture?name=golden', {
        method: 'POST', body: JSON.stringify(dumps, null, 1) });

    put(saved
      ? '\nMAKE-GOLDENS MODE — wrote captures/golden.json; copy it to tests/golden.json'

  let golden;

  catch (e) {

    if (!t3dOK) put('the turtle could not fly', 'fail');
    if (!mtOK) put('a model would not fly, or a trail was not a thing', 'fail');
    if (!zenoOK) put('zeno\u2019s total was not exactly (2^k-1)/2^k', 'fail');
    if (!shapeOK) put('a dropped shape was lost', 'fail');
    if (!houseOK) put('a glass house showed the wrong furniture', 'fail');
    if (!flyOK) put('the airplane would not take off, or its loop was not round', 'fail');
    if (!postOK) put('a house posted to a house unseen, or a house stood idle', 'fail');
    if (!mdOK) put('an imported document was not rendered as a page', 'fail');
    if (!twinOK) put('undo minted a twin of a living thing', 'fail');
    if (!nbOK) put('a robot could not read the notebook, or locked it', 'fail');
    if (!paceOK) put('the postman ran ahead of her letters, or a lever would not stop', 'fail');
    if (!foldOK) put('a fold froze the live panel nested inside', 'fail');
    if (!reachOK) put('the robot\u2019s hand was not at the stack', 'fail');
    if (!makerOK) put('what Marty made was not a thing, or a bad answer got through', 'fail');
    if (!faceOK) put('a robot had its back to you when you walked in', 'fail');
    if (!pileOK) put('a busy nest cost more than it should', 'fail');
    if (!drawOK) put('the turtle would not draw, or drew what it should not', 'fail');
    if (!postOffOK) put('a delivery started a house nobody had switched on', 'fail');
    if (!waitOK) put('a notebook would not go back, a helper looked away, or a save was unreadable', 'fail');
    if (!turtleOK) put('the turtle lost its way', 'fail');
    if (!pgOK) put('pong from the shelf came apart', 'fail');
    for (const n of bad) {
      put(`\n--- ${n} ---`, 'dim');
      put('golden: ' + (golden[n] ?? '(missing)').slice(0, 400), 'dim');
      put('now:    ' + (dumps[n] ?? '(missing)').slice(0, 400), 'dim');
    }
    document.title = 'FAIL';
  } else {
    put(`all ${names.length} byte-identical`, 'pass');
    document.title = 'PASS';
  }
  window.__VERDICT = { ok: !bad.length && leakOK && playOK && pauseOK && copyOK && r28OK
                        && shelfOK && bindOK && inexOK && turtleOK && pgOK && stopOK && sceneOK
                        && deadOK && keepOK && spareOK && nestOK && picOK && wholeOK && t3dOK && mtOK
                        && zenoOK && shapeOK && houseOK && flyOK && postOK && mdOK
                        && twinOK && nbOK
                        // EVERY FLAG, not the ones that existed when this line was
                        // written: a run said ok:true over a FAIL line for a day
                        && waitOK && postOffOK && drawOK && faceOK && pileOK && makerOK
                        && paceOK && foldOK && reachOK && closeOK && copierOK && badgeOK
                        && teachOK && wordsOK && handOK && dreamOK && nanoOK && puzzleOK && setOK,
                       bad, leakOK, playOK, pauseOK, copyOK, r28OK, shelfOK, bindOK, inexOK,
                       turtleOK, pgOK, stopOK, sceneOK, deadOK, keepOK, spareOK, nestOK,
                       picOK, wholeOK, t3dOK, mtOK, zenoOK, shapeOK, houseOK, flyOK, postOK, mdOK, twinOK, nbOK, closeOK, copierOK, badgeOK, teachOK, wordsOK, handOK, dreamOK, nanoOK, puzzleOK, setOK, dumps };
  // AND ONTO DISK. Reading a verdict back out of the browser costs a round
  // trip through a channel that, on a loaded machine, times out more often
  // than it answers -- eight minutes of polling for one line of text. The
  // sink that takes the goldens takes this too, so `cat captures/verdict.json`
  // answers instead. Named after the build, so two runs at once do not
  // overwrite each other.
  try {
    const tag = (appURL || 'source').replace(/[^\w.-]/g, '_');
    await fetch('/capture?name=verdict-' + tag, { method: 'POST', body: JSON.stringify({
      filtered: CHECKS_FILTER.length ? CHECKS_FILTER : undefined,
      ok: window.__VERDICT.ok,
      app: frame.src,
      lines: [...logEl.querySelectorAll('span')].map(s2 => s2.textContent.trim())
        .filter(t => /^(PASS|FAIL|ERR|all )/.test(t)),
    }, null, 1) });
  } catch (e) {}
})();
</script>
