// AN INTRODUCTION IS NOT A PUZZLE. A world with a name and an intro and
// nothing wanted opens as itself: Marty says the intro, the idle line is the
// workshop's, the Puzzle game's bookmark is left alone, and Start over says
// "world". A world with a goal is a puzzle as ever.
async function introOnlyCheck(D, win) {
  const doc = win.document, ls = win.localStorage;
  const keyAt = Object.keys(ls).find(k => k.startsWith('tt3d.puzzle-at'));
  const before = keyAt ? ls.getItem(keyAt) : null;
  D.worldIn({ kind: 'world', v: 4, name: '05 \u2014 A step-and-turn planet', intro: 'Start the team.', stations: {}, active: null, bench: [] });
  await slowSettle(D, 1500);
  const info = D.puzzle;
  const notPuzzle = !!info && info.puzzle === false && info.intro === 'Start the team.';
  const idle = doc.getElementById('hint').textContent;
  const idleIsWorkshop = /Take a little robot/.test(idle) || !/Puzzle/.test(idle);
  const at = Object.keys(ls).filter(k => k.startsWith('tt3d.puzzle-at')).map(k => ls.getItem(k));
  const bookmarkKept = !at.includes('05 \u2014 A step-and-turn planet');
  const againWords = doc.getElementById('againBtn').textContent;
  // ...and Start this world over says the introduction ONCE, not on top of
  // itself (ChatGPT's gallery review: two copies after a reset)
  const said = () => [...doc.getElementById('martyLog').children].filter(c => c.textContent === 'Start the team.').length;
  const said1 = said();
  D.startOver(); await slowSettle(D, 1500);
  const said2 = said();
  const onceOnStartOver = said1 === 1 && said2 === 1;
  D.worldIn({ kind: 'world', v: 4, name: 'probe-pz', intro: 'Make a 4.', goal: 'a 4', stations: {}, active: null, bench: [] });
  await slowSettle(D, 1500);
  const isPuzzle = D.puzzle?.puzzle === true;
  const againPuzzle = doc.getElementById('againBtn').textContent;
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [] }); await slowSettle(D, 800);
  // the probe puzzle must not become where the Puzzle game continues from
  for (const k of Object.keys(ls).filter(k => k.startsWith('tt3d.puzzle-at'))) { if (k === keyAt && before != null) ls.setItem(k, before); else ls.removeItem(k); }
  const ok = notPuzzle && idleIsWorkshop && bookmarkKept && againWords === 'Start this world over' && isPuzzle && againPuzzle === 'Start this puzzle over' && onceOnStartOver;
  put((ok ? 'PASS' : 'FAIL') + ' an introduction is not a puzzle  (intro-only=' + notPuzzle + ' idle-is-workshop=' + idleIsWorkshop + ' bookmark-kept=' + bookmarkKept + ' said-once-on-start-over=' + said1 + '/' + said2
      + ' again=' + JSON.stringify(againWords) + ' with-goal-is-puzzle=' + isPuzzle + ' again-puzzle=' + JSON.stringify(againPuzzle) + (before ? ' had=' + before : '') + ')', ok ? 'pass' : 'fail');
  return ok;
}

// A ROUND IS THE UNIT OF A FRAME AT INSTANT. A robot adds one to each of
// two numbers every round; sampled at every frame of a long Instant run, the
// two are never seen apart. (The slice used to yield wherever its time ran
// out, between the two puts as often as not.)
async function roundAtomicCheck(D) {
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [
    { thing: { kind: 'box', holes: [{ kind: 'number', value: { n: '0', d: '1' }, op: '+' }, { kind: 'number', value: { n: '0', d: '1' }, op: '+' }] }, x: -0.4, z: 1.6 },
    { thing: { kind: 'robot', name: 'twice', condition: { kind: 'box', holes: [{ kind: 'wildNumber' }, { kind: 'wildNumber' }] },
      program: [{ type: 'newNumber' }, { type: 'put', at: { c: 'given', path: [0] } }, { type: 'newNumber' }, { type: 'put', at: { c: 'given', path: [1] } },
                { type: 'newNumber' }, { type: 'put', at: { c: 'given', path: [0] } }, { type: 'newNumber' }, { type: 'put', at: { c: 'given', path: [1] } }],
      trainedOn: null, team: [] }, x: 0.8, z: 1.5 } ] });
  await slowSettle(D, 1500);
  const box = D.bench(0)?.userData.kind === 'box' ? D.bench(0) : D.bench(1);
  D.hold(box); await frames(D, 5); D.speed('instant'); D.rounds(6000); D.giveRobot();
  let apart = 0, sampled = 0, maxSeen = 0;
  for (let i = 0; i < 4000; i++) {
    D.frame(1, fnow());
    const g = D.mine(); if (!g || g.userData.kind !== 'box') continue;
    const a = Number(g.userData.holes[0]?.thing?.userData.value?.n), b = Number(g.userData.holes[1]?.thing?.userData.value?.n);
    if (Number.isNaN(a) || Number.isNaN(b)) continue;
    sampled++; maxSeen = Math.max(maxSeen, a);
    if (a !== b) apart++;
    if (D.sched().mode === 'world' && !D.sched().busy && i > 10) break;
  }
  D.rounds(ROUNDS); D.speed(1);
  const ok = sampled > 20 && apart === 0 && maxSeen >= 12000;
  put((ok ? 'PASS' : 'FAIL') + ' a round is the unit of a frame at Instant  (frames-sampled=' + sampled + ' seen-apart=' + apart + ' reached=' + maxSeen + ')', ok ? 'pass' : 'fail');
  return ok;
}

// INVISIBLE INK. [set | pen | invisible] keeps the pen drawing unseen: a
// line, an unseen line and a red line are one run of three strokes, Dusty
// sweeps all three up as one trail, and the trail keeps its gap when saved
// and loaded. Ken's way of making a drawing with parts apart one thing.
async function invisibleInkCheck(D) {
  const txt = (t) => ({ kind: 'text', text: t }), num = (n, d = 1) => ({ kind: 'number', value: { n: String(n), d: String(d) } });
  const box = (...h) => ({ kind: 'box', holes: h });
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [
    { thing: { kind: 'text', text: 'P', lid: 'INK1', evt: 'evt-INK1' }, x: -0.8, z: 1.6 } ] });
  await slowSettle(D, 1500);
  const post = async (m) => { D.post('INK1', m); await frames(D, 12); };
  await post(box(txt('set'), txt('pen'), txt('down')));
  await post(box(txt('move'), txt('forward'), num(2, 10)));
  await post(box(txt('set'), txt('pen'), txt('invisible')));
  await post(box(txt('move'), txt('forward'), num(2, 10)));
  await post(box(txt('set'), txt('pen'), txt('red')));
  await post(box(txt('set'), txt('pen'), txt('down')));
  await post(box(txt('move'), txt('forward'), num(2, 10)));
  const marks = []; D.scene.traverse(o => { if (o.userData?.penMark) marks.push(o); });
  const runs = new Set(marks.map(m => m.userData.penRun)).size;
  const seen = marks.map(m => m.visible !== false && m.material.visible !== false);
  const drawn = marks.length === 3 && runs === 1 && seen.join() === 'true,false,true';
  const mark = marks[0];
  D.dusty(true); D.clickRaw({ kind: 'penMark', mark, owner: mark.userData.penMark }); await settle(D, 20000); D.dusty(false);
  const left = []; D.scene.traverse(o => { if (o.userData?.penMark) left.push(o); });
  const sweptAll = left.length === 0;
  D.clickRaw({ kind: 'dustyBag' }); await settle(D, 15000);
  if (D.state.held) { D.clickBench(0.6, 1.4); await settle(D, 20000); }
  D.worldIn(JSON.parse(JSON.stringify(D.worldOut()))); await slowSettle(D, 2000);
  let trail = null; for (let i = 0; i < 14; i++) { const t = D.bench(i); if (!t) break; if (t.userData.kind === 'trail') trail = t; }
  const segs = trail?.userData.segs ?? [];
  const meshes = []; trail?.traverse(o => { if (o.isMesh) meshes.push(o.visible !== false && o.material.visible !== false); });
  const kept = segs.length === 3 && segs[1].ink === -1 && meshes.join() === 'true,false,true';
  const ok = drawn && sweptAll && kept;
  put((ok ? 'PASS' : 'FAIL') + ' invisible ink keeps the trail one thing  (strokes=' + marks.length + ' runs=' + runs + ' seen=' + seen.join('/') + ' swept-all=' + sweptAll
      + ' saved-segs=' + segs.length + ' gap-kept=' + kept + ')', ok ? 'pass' : 'fail');
  return ok;
}

// THE LESSONS (ChatGPT's three, in examples/lessons): each runs to its
// finisher and draws what it says -- the planet's 36 steps in one ring, the
// flower's 24 sides and stalk on 11 spokes of invisible ink as ONE run, the
// spark's 20 dots -- and the flower helper card, dropped on a sphere of
// one's own, draws the same flower offstage.
async function lessonsCheck(D, win) {
  const strokes = () => { const m = []; D.scene.traverse(o => { if (o.userData?.penMark) m.push(o); }); return m; };
  const runOne = async (file) => {
    const w = await (await fetch('../examples/lessons/' + file + '.world.json')).json();
    D.worldIn(w); await slowSettle(D, 2000);
    D.speed('inf'); D.rounds(1000);
    const box = D.stations.stand.occupant;
    D.hold(box); await frames(D, 5); D.giveRobot();
    await slowSettle(D, 60000);
    for (let i = 0; i < 40; i++) D.frame(1, fnow());
    D.rounds(ROUNDS); D.speed(1);
    const m = strokes();
    return { n: m.length, unseen: m.filter(x => x.visible === false).length, runs: new Set(m.map(x => x.userData.penRun)).size, boxGone: !D.stations.stand.occupant,
             inks: new Set(m.map(x => x.userData.seg?.ink)).size };
  };
  const planet = await runOne('🪐 step-and-turn-planet');
  const flower = await runOne('🌸 easy-flower');
  // the card names the holes in brackets, after the numbers (Ken: numbers primary, labels parenthetically)
  const stepsText = win.document.getElementById('steps').textContent;
  const labelled = /hole 4\.12 \(letters › stalk ink\)/.test(stepsText);
  const spark = await runOne('✨ jumping-spark');
  const planetOK = planet.n === 36 && planet.unseen === 0 && planet.runs === 1 && planet.boxGone;
  const flowerOK = flower.n === 36 && flower.unseen === 11 && flower.runs === 1 && flower.boxGone && flower.inks === 7;   // six petals, the stalk, and the unseen
  const sparkOK = spark.n === 20 && spark.unseen === 0 && spark.runs === 1 && spark.boxGone;
  // the helper card on a sphere of one's own
  const card = await (await fetch('../examples/lessons/🌸 flower-helper.thing.json')).json();
  const g = JSON.parse(JSON.stringify(card.thing)); g.boundTo = 'ROSE1';
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [
    { thing: { kind: 'model', parts: [{ shape: 'sphere', size: [0.03, 0.03, 0.03], color: '#ff88aa' }], label: 'rose', lid: 'ROSE1', evt: 'evt-ROSE1', up: 0.35, facing: 0 }, x: 0.0, z: 1.55 },
    { thing: g, x: 0.7, z: 1.9 } ] });
  await slowSettle(D, 2000);
  const gad = (() => { for (let j = 0; j < 6; j++) { const t = D.bench(j); if (t?.userData.gadget) return t; } return null; })();
  D.switchGadget(gad, true, true); await frames(D, 120);
  const byCard = strokes().length;
  D.switchGadget(gad, false, true); await frames(D, 5);
  const cardOK = byCard === 36;
  const ok = planetOK && flowerOK && sparkOK && cardOK && labelled;
  put((ok ? 'PASS' : 'FAIL') + ' the lessons draw what they say, and the flower card draws on a sphere of your own  (labels-in-brackets=' + labelled + ' planet=' + JSON.stringify(planet) + ' flower=' + JSON.stringify(flower)
      + ' spark=' + JSON.stringify(spark) + ' by-card=' + byCard + ')', ok ? 'pass' : 'fail');
  return ok;
}

// KEN'S BOX ROUND, 19 September. A box answers [query | holes | bird] with
// its hole count; a box split on a work spot in a lesson leaves its halves
// in order, the first to the left of the second; Ruby aimed at a box's own
// frame makes the thought "any box" in one click; and the Ruby how-to wears
// out once a visitor has loosened a thought three times.
async function kenBoxesCheck(D, win) {
  const doc = win.document;
  const txt = (t) => ({ kind: 'text', text: t }), num = (n) => ({ kind: 'number', value: { n: String(n), d: '1' }, op: '+' });
  const box = (...h) => ({ kind: 'box', holes: h });
  const things = () => { const a = []; for (let i = 0; i < 20; i++) { const t = D.bench(i); if (!t) break; a.push(t); } return a; };
  // 1. how many holes
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [
    { thing: { kind: 'box', holes: [num(1), num(2), num(3), num(4)], lid: 'BX1', evt: 'evt-BX1' }, x: -0.6, z: 1.6 },
    { thing: { kind: 'nest', id: 9813, guid: 'holes-answers', label: 'answers', pile: [] }, x: 0.5, z: 1.7 } ] });
  await slowSettle(D, 1500);
  const nest = things().find(t => t.userData.kind === 'nest');
  D.post('BX1', box(txt('query'), txt('holes'), { kind: 'bird', nestId: 9813, nestGuid: 'holes-answers' })); await frames(D, 30);
  const top = nest.userData.pile?.[0];
  const holesOK = top?.userData.kind === 'number' && String(top.userData.value.n) === '4';
  // 2. the halves stand in order on the desk: [a|b|c|d] split at 2 in a lesson
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [
    { thing: { kind: 'box', holes: [txt('a'), txt('b'), txt('c'), txt('d')] }, x: -0.4, z: 1.6 },
    { thing: { kind: 'robot', name: 'splitter', condition: null, program: [], trainedOn: null, team: [] }, x: 0.8, z: 1.5 } ] });
  await slowSettle(D, 1500);
  const abcd = things().find(t => t.userData.kind === 'box');
  D.hold(abcd); await frames(D, 5); D.giveRobot(); await slowSettle(D, 3000);
  const lesson = D.helperState().mode === 'training';
  D.teach({ type: 'newNumber' }); await slowSettle(D, 2000);              // a 1 in hand
  D.teach({ type: 'setValue', value: D.rat(2), op: '+' }); await slowSettle(D, 1000);
  D.teach({ type: 'put', at: { c: 's0', path: [] } }); await slowSettle(D, 2000);   // the 2 on spot 1
  D.teach({ type: 'take', at: { c: 'given', path: [] } }); await slowSettle(D, 2000);
  D.teach({ type: 'put', at: { c: 's0', path: [] } }); await slowSettle(D, 3000);   // the box on the 2: split
  const st = D.stations;
  const first = (b) => b?.userData.holes?.[0]?.thing?.userData.text ?? null;
  const s0 = st.s0?.occupant, s1 = st.s1?.occupant;
  const halves = { s0: first(s0), s1: first(s1), s0x: st.s0?.point?.x, s1x: st.s1?.point?.x };
  const orderOK = halves.s0 === 'a' && halves.s1 === 'c' && halves.s0x < halves.s1x;
  // 3. Ruby on the box's own frame: any box
  D.rubyOn(true); D.clickCond([]); await slowSettle(D, 3000); D.rubyOn(false);
  const anyBox = D.condWords ? /any box/i.test(String(D.condWords())) : true;
  D.exit(); await slowSettle(D, 2000);
  // 4. the how-to wears out: three loosenings recorded -> no Ruby advice in the stop line
  const was = D.familiar('loosen');
  D.familiar('loosen', 3);
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [
    { thing: num(1), x: -0.4, z: 1.6 },
    { thing: { kind: 'robot', name: 'adder', condition: { kind: 'number', value: { n: '1', d: '1' }, op: '+' }, program: [{ type: 'newNumber' }, { type: 'put', at: { c: 'given', path: [] } }], trainedOn: num(1), team: [] }, x: 0.8, z: 1.5 } ] });
  await slowSettle(D, 1500);
  const one = things().find(t => t.userData.kind === 'number');
  D.hold(one); await frames(D, 5); D.giveRobot(); await slowSettle(D, 2500);
  D.speed('instant'); D.run(); await slowSettle(D, 4000); D.speed(1);
  const stopLine = doc.getElementById('hint').textContent;
  const noAdvice = /stopped|only runs/.test(stopLine) && !/Ruby/.test(stopLine);
  D.familiar('loosen', was);
  const ok = holesOK && lesson && orderOK && anyBox && noAdvice;
  put((ok ? 'PASS' : 'FAIL') + ' a box says its holes, halves stand in order, Ruby on the frame means any box, the how-to wears out  (holes=' + holesOK + ' lesson=' + lesson
      + ' halves=' + JSON.stringify(halves) + ' any-box=' + anyBox + ' no-advice-when-familiar=' + noAdvice + (noAdvice ? '' : ' line=' + JSON.stringify(stopLine.slice(0, 120))) + ')', ok ? 'pass' : 'fail');
  return ok;
}

// RANDOM COLOUR: the pad's robot rolls a die, picks the Nth [name | ink]
// pair by splitting the list, and paints the pad -- paper, words and a
// contrasting ink -- every round, and leaves its work spots clean.
async function randomColourCheck(D) {
  const w = await (await fetch('../examples/behaviours/🎨 random-colour.world.json')).json();
  D.worldIn(w); await slowSettle(D, 2000);
  let gad = null; for (let i = 0; i < 10; i++) { const t = D.bench(i); if (t?.userData.gadget) { gad = t; break; } }
  const PAIRS = { red: 'white', orange: 'black', yellow: 'black', green: 'white', blue: 'white', indigo: 'white', violet: 'white' };
  D.switchGadget(gad, true, true);
  const seen = new Map(); let matched = true;
  for (let k = 0; k < 120; k++) {
    await frames(D, 1);
    const name = gad.userData.text, bg = gad.userData.look?.bg, ink = gad.userData.look?.ink;
    if (!(name in PAIRS)) continue;
    seen.set(name, bg + '/' + ink);
    if (bg !== name || ink !== PAIRS[name]) matched = false;
  }
  D.switchGadget(gad, false, true); await frames(D, 5);
  const ctx = gad.__panelTray?.__ctx;
  const spots = ctx ? Object.entries(ctx.occ || {}).filter(([k, v]) => /^s\d+$/.test(k) && v?.occupant).map(([k]) => k) : ['?'];
  const ok = seen.size >= 4 && matched && spots.length === 0;
  put((ok ? 'PASS' : 'FAIL') + ' the random colour pad paints itself from its list  (colours-seen=' + seen.size + ' paper-and-ink-match=' + matched + ' spots-left=' + JSON.stringify(spots) + ')', ok ? 'pass' : 'fail');
  return ok;
}

// KEN'S ELLIPSE ON THE STAR'S PANEL (19 September): a panel tray set down
// on a work spot keeps being a panel across a save -- a ticker, one round a
// turn -- where it came back as a house of forty rounds a turn and the star
// jumped round its ellipse; and Mimi stands still while a behaviour on a
// panel copies its letters (she twitched sixty times a second).
// A PARENT'S STOP IS NOT AN ERROR (ChatGPT's gallery tests, 19 September):
// Fibonacci's fib robot stops as soon as its thought no longer fits while
// its houses work on, and the line said only "stopped: none recognises".
// The line counts the houses still at work now -- housesAtWork(): dirty,
// waiting on a nest, or not yet given a first turn; not done, folded or
// switched off. In the suite the houses finish inside the drop (Instant
// hydration), so what is measured is the count itself: Zeno's two houses
// at work once their levers are pulled, none once "." stops them.
async function housesAtWorkCheck(D) {
  const w = await (await fetch('../examples/infinity/📮 zeno.world.json')).json();
  D.worldIn(w); await slowSettle(D, 2000);
  D.speed(1); D.rounds(ROUNDS);
  const rooms = []; for (let i = 0; i < 20; i++) { const t = D.bench(i); if (!t) break; if (t.userData.kind === 'room') rooms.push(t); }
  const before = D.housesAtWork();
  for (const r of rooms) D.clickRaw({ kind: 'roomLever', room: r });
  await frames(D, 30);
  const running = D.housesAtWork();
  for (const r of rooms) D.clickRaw({ kind: 'roomLever', room: r });   // the lever again: off
  await frames(D, 30);
  const after = D.housesAtWork();

// OUT ON DELIVERY (ChatGPT's runtime review, 19 September): a thing given to
// a bird while she is away used to land in the hole behind her. A stand-in
// keeps her place and what is given it waits; she takes it when she is back.
// Here: a nest, a bird in a box's hole, two numbers. The first is given at

  const things = () => { const a = []; for (let i = 0; i < 20; i++) { const t = D.bench(i); if (!t) break; a.push(t); } return a; };
  const nest = things().find(t => t.userData.kind === 'nest');
  const box = things().find(t => t.userData.kind === 'box');

  D.hold(five); await frames(D, 10); D.clickThing(bird);
  await frames(D, 20);                                  // mid-flight
  const standIn = box.userData.holes[0].thing;
  const ghostThere = !!standIn && standIn !== bird && standIn.__ghostOf === bird && standIn.userData.kind === 'bird';
  const savedMid = D.worldOut();
  const birdsSaved = JSON.stringify(savedMid).split('"kind":"bird"').length - 1;
  D.hold(six); await frames(D, 10); D.clickThing(standIn);
  await frames(D, 10);
  const pending = (bird.__pending || []).length;
  for (let k = 0; k < 600 && (nest.userData.pile || []).length < 2; k++) await frames(D, 1);
  await frames(D, 80);

// CHATGPT'S PERFORMANCE AUDIT (19 September). Twelve solid houses, a
// counter robot in each, all switched on: (1) every house gets turns --
// the outer scheduler looked from the front of the table each entry, and
// with fifty counters forty never ran; (2) the numbers a counter makes
// where nobody can see them stay lite -- no canvases, no textures -- and
// are built when a house's walls go to glass; (3) room work spends at most
// one slice per rendered frame however many times the scheduler is entered.
async function fairHousesCheck(D) {
  const box = { kind: 'box', holes: [{ kind: 'number', value: { n: '0', d: '1' }, op: '+' }] };
  const inside = { kind: 'world', v: 3, bench: [], stations: { stand: box },
    active: { kind: 'robot', name: 'Counter', condition: { kind: 'box', holes: [{ kind: 'wildNumber' }] },
      program: [{ type: 'newNumber' }, { type: 'setValue', value: { n: '1', d: '1' }, op: '+' }, { type: 'put', at: { c: 'given', path: [0] } }],
      trainedOn: box, team: [] } };
  const N = 12;
  const w = { kind: 'world', v: 3, stations: {}, active: null,
    bench: Array.from({ length: N }, (_, i) => ({ thing: { kind: 'room', label: 'Counter ' + i, opaque: true, dirty: true, world: JSON.parse(JSON.stringify(inside)) }, x: -1.4 + (i % 6) * 0.5, z: 1.2 + Math.floor(i / 6) * 0.6 })) };
  // the limit and the speed BEFORE the world opens: a house that ran its
  // eight rounds during the settle (the last check's limit) has stopped for
  // good, and a limit raised afterwards does not wake it
  D.speed('inf'); D.rounds(1000000);
  const lit0 = D.numbersMade();          // how many numbers were made lite and built, before
  D.worldIn(w); await slowSettle(D, 2000);
  const rooms = []; for (let i = 0; i < 40; i++) { const t = D.bench(i); if (!t) break; if (t.userData.kind === 'room') rooms.push(t); }
  const count = (r) => { const b = r.__ctx?.standOcc; const t = b?.userData?.holes?.[0]?.thing; return t ? Number(t.userData.value.n) : -1; };
  let longest = 0;
  for (let k = 0; k < 60; k++) { const a = performance.now(); D.frame(1, fnow()); longest = Math.max(longest, performance.now() - a); if ((k & 7) === 7) await breathe(); }
  const counts = rooms.map(count);
  const everyRan = rooms.length === N && counts.every(c => c > 0);
  const fair = Math.min(...counts) * 4 >= Math.max(...counts);       // nobody starved: the least got a quarter of the most
  const lit = D.numbersMade();
  const liteInside = lit.lite - lit0.lite > 100 && lit.built - lit0.built <= 2;   // the counters' operands are data, not canvases
  // glass walls: what is inside can be seen now, and is built
  const liteNow = D.numbersLite();
  rooms[0].setOpaque(false); D.lodSweep(); D.frame(2, fnow());
  const lit2 = D.numbersLite();
  const builtWhenSeen = lit2.built > liteNow.built;
  // one slice a frame: a frame of room work never ran much past the slice (300 ms) plus one round
  const sliced = longest < 900;
  D.speed(1); D.rounds(ROUNDS);
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [] }); await slowSettle(D, 800);
  const ok = everyRan && fair && liteInside && builtWhenSeen && sliced;
  put((ok ? 'PASS' : 'FAIL') + ' twelve solid counters all get turns, their numbers stay lite until seen, one slice a frame  (counts=' + JSON.stringify(counts)
      + ' made-lite/built=' + (lit.lite - lit0.lite) + '/' + (lit.built - lit0.built) + ' in-view-before/after-glass=' + liteNow.built + '/' + lit2.built + ' longest-frame=' + Math.round(longest) + 'ms)', ok ? 'pass' : 'fail');
  return ok;
}

    const w = await (await fetch('../examples/lessons/' + file + '.world.json')).json();

    const box = D.stations.stand.occupant;
    D.hold(box); await frames(D, 5); D.giveRobot();
  };
  const finish = async () => {
    // until the team puts its box away: 667 rounds of 251 steps is minutes of frames, not seconds
    for (let k = 0; k < 40000 && D.stations.stand.occupant; k++) { D.frame(1, fnow()); if ((k & 63) === 63) await breathe(); }

    return gone;

  // the garden

  const gm = strokes();

                   inks: new Set(gm.map(x => x.userData.seg?.ink)).size, gone: gardenGone };
  const gardenOK = garden.runs === 3 && garden.n - garden.unseen >= 680 && garden.inks >= 5 && garden.gone;
  // the clockwork: the planets move, and after 120 ticks are back where they began
  const cw = await (await fetch('../examples/lessons/\ud83d\udd2d planetary-clockwork.world.json')).json();
  D.worldIn(cw); await slowSettle(D, 2000);
  const planet = (lid) => things().find(t => t.userData.lid === lid);
  const red0 = planet('red-planet').position.clone(), moon0 = planet('blue-moon').position.clone();
  D.speed('inf'); D.rounds(2000);

// A PICTURE ARRIVES. Ken dropped one file five times and two pads kept
// saying "(a picture, on its way)" over a picture that had loaded perfectly.
// The data was never the problem: a pad takes the picture's PROPORTIONS when
// it loads, which resizes its canvas -- and a resized canvas needs a fresh GL
// texture, as the number faces have always known. Without one the canvas held
// the picture while the screen went on showing what was uploaded before it.
// So: the canvas must really be resized, the texture must be a NEW one, and
// the canvas must hold the picture.
async function pictureCheck(D) {
  const src = (() => {
    const c = document.createElement('canvas');
    c.width = 900; c.height = 700;           // deliberately not a pad's shape
    const x = c.getContext('2d');
    x.fillStyle = '#2244ff'; x.fillRect(0, 0, 900, 700);
    return c.toDataURL('image/png');
  })();
  D.worldIn({ kind: 'world', v: 3, bench: [{ thing: { kind: 'text', text: '' }, x: 0, z: 1.5 }],
              stations: {}, active: null });
  await slowSettle(D, 2000);
  let pad = null;
  for (let i = 0; i < 8; i++) { const t = D.bench(i); if (!t) break;
    if (t.userData.kind === 'text') { pad = t; break; } }
  if (!pad) { put('FAIL a picture arrives  (no pad)', 'fail'); return false; }
  const faceMat = (t) => { const m = t.children[0].material; return Array.isArray(m) ? m[2] : m; };
  const was = { uuid: faceMat(pad).map.uuid, h: faceMat(pad).map.image.height };
  pad.setImage(src);
  await new Promise(r => setTimeout(r, 1500));
  const now = { uuid: faceMat(pad).map.uuid, h: faceMat(pad).map.image.height };
  const resized = now.h !== was.h;
  const freshTexture = now.uuid !== was.uuid;
  // ...and the face really carries the picture (cool blue, not warm paper)
  const im = faceMat(pad).map.image;
  let cool = 0, warm = 0;
  const d = im.getContext('2d').getImageData(0, 0, im.width, im.height).data;
  for (let j = 0; j < d.length; j += 400) { if (d[j + 2] > d[j]) cool++; else warm++; }
  const showsPicture = cool > warm;
  const ok = resized && freshTexture && showsPicture;
  put((ok ? 'PASS' : 'FAIL') + ' a picture arrives  (canvas-resized=' + resized
      + ' fresh-texture=' + freshTexture + ' shows-picture=' + showsPicture
      + ' ' + was.h + '->' + now.h + ')', ok ? 'pass' : 'fail');
  return ok;
}

// A WORLD IMPORTED MID-PROJECT ARRIVES WHOLE. Ken: "the idea of importing a

    .map(t => t.userData.lid).filter(Boolean);

    .filter(t => t.userData.boundTo)
    .every(t => lidsOf(b).includes(t.userData.boundTo));

// THE TURTLE IN THE AIR. move + yaw + pitch + roll, each about the turtle's
// OWN axes, and the frame is one quaternion rather than three angles kept
// side by side. Three things: it climbs when it is pitched up, the pen draws
// the climb, and four ninety-degree yaws bring it exactly back -- which is
// the property Ken warned about, since sequential Euler updates drift and
// quaternion multiplication does not.
async function turtle3dCheck(D) {
  const w = await (await fetch('../examples/behaviours/🐢 turtle3d.world.json')).json();
  D.worldIn(w); await slowSettle(D, 2000);
  const by = {}; let post = null, pd = null; const orders = {};
  for (let i = 0; i < 30; i++) {
    const t = D.bench(i); if (!t) break;
    if (t.userData.lid) by[t.userData.lid] = t;
    if (t.userData.kind === 'bird') post = t;
    if (t.userData.kind === 'text' && t.userData.text === 'pendown') pd = t;
    if (t.userData.kind === 'box' && t.userData.holes?.[0]?.thing?.userData?.text) {
      const v = t.userData.holes[1]?.thing?.userData?.value;
      if (v) orders[t.userData.holes[0].thing.userData.text + ' ' + String(v.n)] = t;
    }
  }
  const turtle = by.G918, shell = by.L9596;
  if (!turtle || !shell) { put('FAIL the turtle in the air  (world did not build)', 'fail'); return false; }
  D.clickThing(turtle); await settle(D, 9000);
  D.clickThing(shell); await settle(D, 9000);
  D.switchGadget(turtle, true);
  await frames(D, 60);
  const give = async (o) => {
    D.clickThing(o); await settle(D, 9000);
    D.clickThing(post); await settle(D, 9000);
    await frames(D, 400);
  };
  await give(pd);
  const y0 = shell.position.y;
  await give(orders['move 30']);
  const flatMove = Math.abs(shell.position.y - y0) < 0.001;   // level: no climb
  await give(orders['pitch 30']);
  await give(orders['move 30']);
  const climbed = Math.abs((shell.position.y - y0) - 0.15) < 0.005;   // 0.3 x sin 30
  // the pen came with it: two strokes, at two different heights
  const heights = [];
  D.scene.traverse(o => {
    if (o.userData?.penMark) heights.push(o.getWorldPosition(new D.V3()).y);
  });
  const drewInTheAir = heights.length === 2
    && Math.abs(Math.max(...heights) - Math.min(...heights)) > 0.02;
  // FOUR RIGHT-ANGLE YAWS COME BACK. A frame kept as one quaternion composes
  // exactly; three angles updated in turn do not.
  await give(orders['pitch -30']);          // level again first
  const before = shell.userData.aim ? shell.userData.aim.slice() : null;
  for (let i = 0; i < 4; i++) await give(orders['yaw 90']);
  const after = shell.userData.aim;
  const closes = !!before && !!after
    && [0, 1, 2, 3].every(i => Math.abs(Math.abs(after[i]) - Math.abs(before[i])) < 0.002);
  const ok = flatMove && climbed && drewInTheAir && closes;
  put((ok ? 'PASS' : 'FAIL') + ' the turtle in the air  (level-move-stays-level=' + flatMove
      + ' climbs=' + climbed + ' draws-in-the-air=' + drewInTheAir
      + ' four-yaws-close=' + closes + ')', ok ? 'pass' : 'fail');
  return ok;
}

// ZENO'S POSTMAN. One robot halves and posts, the other totals; the numbers
// are exact, so the invariant is not "close to 1" but EXACTLY (2^k - 1)/2^k:
// the denominator a power of two and the numerator one less than it, every
// single delivery, forever.
async function zenoCheck(D) {
  const w = await (await fetch('../examples/infinity/📮 zeno.world.json')).json();
  D.worldIn(w); await slowSettle(D, 2000);
  D.speed('inf');
  const rooms = [];
  for (let i = 0; i < 10; i++) { const t = D.bench(i); if (!t) break;
    if (t.userData.kind === 'room') rooms.push(t); }
  // BOTH LEVERS, THE TOTALLER'S FIRST, THEN THE WAIT -- the world's own
  // instructions ("pull the lever on each house"). Started alone, the halver
  // posted at Instant into a house whose lever was still down: a lever pull
  // is a whole 1.2 s slice of room work, so the pile grew by the hundred
  // before the totaller was switched on, and the 2,200 frames that followed
  // -- eighty halver rounds each, the total a fraction of thousands of
  // digits -- took twenty minutes on their own. Together they keep pace,
  // the pile stays at nothing, and the invariant is read off the first few
  // deliveries: it holds for every single one, so eight are as good as a
  // hundred thousand. (The world itself is not capped: a dropped delivery
  // would break the very exactness it teaches.)
  const tot = rooms.find(r => r.userData.label === 'the totaller');
  const halver = rooms.find(r => r.userData.label === 'the halver');
  D.clickRaw({ kind: 'roomLever', room: tot });
  D.clickRaw({ kind: 'roomLever', room: halver });
  await settle(D, 9000);
  // YOUR HAND IS YOURS WHILE THEY RUN. A house's robots call noteHeld for
  // their own claw, from inside a pushed world where inHand() is the INNER
  // world's hand -- so picking up a pad lost the card that reads it, and the
  // Read button with it, within a second of these two starting.
  let padUp = null;
  for (let i = 0; i < 20; i++) { const t = D.bench(i); if (!t) break;
    if (t.userData.kind === 'text') { padUp = t; break; } }
  // ...at walking pace: at Instant every frame is eighty halver rounds, and a
  // hundred frames of that is minutes of fractions thousands of digits long.
  D.speed(1);
  D.clickThing(padUp);
  await frames(D, 60);
  const card = D.doc ? D.doc.getElementById('held') : null;
  const holdsPad = !!padUp && !!card && card.classList.contains('pad');
  D.clickBench(0.4, 1.6);
  await frames(D, 20);
  D.speed('inf');
  const value = () => tot.__ctx?.standOcc?.userData?.holes?.[1]?.thing?.userData?.value;
  let used = 0;
  for (; used < 60; used += 5) { const v0 = value(); if (v0 && BigInt(v0.d) >= 8n) break; await frames(D, 5); }
  const pile = tot.__ctx?.standOcc?.userData?.holes?.[0]?.thing?.userData?.pile?.length ?? -1;
  const v = value();
  if (!v) { put('FAIL zeno  (no total found)', 'fail'); return false; }
  const num = BigInt(v.n), den = BigInt(v.d);
  const grew = den >= 8n;                       // at least three deliveries landed
  const exact = (den & (den - 1n)) === 0n && (den - num) === 1n;
  const ok = grew && exact && holdsPad;
  D.speed(1);      // Instant is this check's, not the suite's -- pong broke at it
  const digits = String(v.d).length;
  put((ok ? 'PASS' : 'FAIL') + ' zeno\u2019s postman  (total=' + (digits > 40 ? '(2^k-1)/2^k with ' + digits + ' digits' : String(v.n) + '/' + String(v.d))
      + ' power-of-two=' + ((den & (den - 1n)) === 0n) + ' one-behind=' + ((den - num) === 1n)
      + ' frames=' + used + ' pile=' + pile + ' your-hand-stays-yours=' + holdsPad + ')', ok ? 'pass' : 'fail');
  return ok;
}

// SHAPE DROPS. [drop | sphere | 1/10] sets a solid down at the thing's
// position and orientation, in the pen's colour; shapes and lines belong to
// one trail, sweep up as ONE thing, and the whole sculpture survives a save.
async function shapeDropCheck(D) {
  const mkN = (v2, w2, nu, de) => ({ kind: 'box', holes: [{ kind: 'text', text: v2 },
    { kind: 'text', text: w2 }, { kind: 'number', value: { n: String(nu), d: String(de) } }] });
  const mkT = (v2, w2, t2) => ({ kind: 'box', holes: [{ kind: 'text', text: v2 },
    { kind: 'text', text: w2 }, { kind: 'text', text: t2 }] });
  D.worldIn({ kind: 'world', v: 4, bench: [
    { thing: { kind: 'text', text: 'S', lid: 'SD1', evt: 'evt-SD1' }, x: -0.8, z: 1.5 },
    { thing: { kind: 'bird', liveId: 'SD1', label: 'to S' }, x: -0.2, z: 1.5 },
    { thing: mkT('set', 'pen', 'down'), x: 0.3, z: 2.1 },
    { thing: mkN('drop', 'sphere', 1, 10), x: 0.3, z: 2.3 },
    { thing: mkN('move', 'forward', 2, 10), x: 0.8, z: 2.3 },
    { thing: mkN('drop', 'cube', 1, 10), x: 1.3, z: 2.3 },
  ], stations: {}, active: null });
  await slowSettle(D, 2000);
  const all = [];
  for (let i = 0; i < 12; i++) { const t = D.bench(i); if (!t) break; all.push(t); }
  const bird = all.find(t => t.userData.kind === 'bird');
  const boxes = all.filter(t => t.userData.kind === 'box');
  const find = (v2, w2) => boxes.find(t => t.userData.holes[0]?.thing?.userData?.text === v2
    && t.userData.holes[1]?.thing?.userData?.text === w2);
  const give = async (b) => { D.clickThing(b); await settle(D, 9000);
    D.clickThing(bird); await settle(D, 20000); };
  await give(find('set', 'pen'));
  await give(find('drop', 'sphere'));
  await give(find('move', 'forward'));
  await give(find('drop', 'cube'));
  let mark = null;
  D.scene.traverse(o => { if (!mark && o.userData?.penMark) mark = o; });
  if (!mark) { put('FAIL shape drops  (nothing deposited)', 'fail'); return false; }
  D.dusty(true);
  D.clickRaw({ kind: 'penMark', mark, owner: mark.userData.penMark });
  await settle(D, 20000);
  D.dusty(false);
  D.clickRaw({ kind: 'dustyBag' }); await settle(D, 15000);
  if (D.state.held) { D.clickBench(1.0, 1.3); await settle(D, 20000); }
  D.worldIn(JSON.parse(JSON.stringify(D.worldOut()))); await slowSettle(D, 2000);
  let trail = null;
  for (let i = 0; i < 14; i++) { const t = D.bench(i); if (!t) break;
    if (t.userData.kind === 'trail') trail = t; }
  const pieces = trail ? trail.userData.segs.map(sg => sg.shape || 'line').sort().join(',') : '';
  const ok = pieces === 'cube,line,sphere';
  put((ok ? 'PASS' : 'FAIL') + ' shape drops  (sculpture-after-save=' + (pieces || 'gone')
      + ')', ok ? 'pass' : 'fail');
  return ok;
}

// A GLASS HOUSE SHOWS WHAT ITS ROBOT NEEDS, AND NOTHING ELSE. activity1 is
// the perfect witness: Add 1 and Doubler both make fresh numbers, so each
// gets a number stack; Split only swaps birds, makes nothing, and gets no
// props at all. An opaque house shows none of it, and the robot's walk
// actually reaches the stack it fetches from.
async function houseFurnitureCheck(D) {
  const w = await (await fetch('../examples/infinity/♾️ activity1-even-numbers.world.json')).json();
  D.worldIn(w); await slowSettle(D, 2000);
  await frames(D, 120);
  const rooms = [];
  for (let i = 0; i < 14; i++) { const t = D.bench(i); if (!t) break;
    if (t.userData.kind === 'room') rooms.push(t); }
  const by = {};
  for (const r of rooms) by[r.userData.label] = Object.keys(r.__props || {});
  const onlyWhatItNeeds = by['Add 1']?.join() === 'numbers'
    && by.Doubler?.join() === 'numbers'
    && (by.Split || []).length === 0;
  // an opaque house builds none of it
  const a1 = rooms.find(r => r.userData.label === 'Add 1');
  a1.setOpaque(true);
  const bareWhenOpaque = Object.keys(a1.__props || {}).length === 0
    && (a1.__contents || []).length === 0;
  a1.setOpaque(false);
  // the NAME is off the lever wall (x > 0.2) and on the roof (y > 0.4)
  const plates = a1.__labelPlates || [];
  const offLever = !plates.some(pl => pl.position.x > 0.2);
  const onRoof = plates.some(pl => pl.position.y > 0.4);
  // ...and the walk really reaches the stack. AT SPEED 8, not 1: a glass
  // house is paced in REAL seconds now -- about a round a second at speed 1 --
  // and a check that only needs the walk to happen should not spend a minute
  // of the suite waiting for it. The pace itself is asserted in "a house posts
  // to a house", where it belongs.
  D.speed(8);
  D.clickRaw({ kind: 'roomLever', room: a1 });
  await settle(D, 6000);
  const prop = a1.__props?.numbers;
  let mini = a1.__ctx?.activeBot?.node;
  if (!mini) a1.__ctx?.root.traverse(o => { if (!mini && o.userData?.kind === 'robot') mini = o; });
  let closest = 1e9;
  for (let i = 0; i < 900; i++) {
    D.frame(1, fnow());
    await maybeBreathe();
    if (!mini || !prop || !mini.parent) continue;
    const lp = mini.parent.worldToLocal(prop.getWorldPosition(new D.V3()).clone());
    closest = Math.min(closest, Math.hypot(lp.x - mini.position.x, lp.z - mini.position.z));
  }
  const reachesIt = closest < 0.07;
  const ok = onlyWhatItNeeds && bareWhenOpaque && offLever && onRoof && reachesIt;
  put((ok ? 'PASS' : 'FAIL') + ' a glass house shows what it needs  (props='
      + JSON.stringify(by) + ' bare-when-opaque=' + bareWhenOpaque
      + ' name-off-lever-wall=' + offLever + ' name-on-roof=' + onRoof
      + ' robot-reaches-stack=' + closest.toFixed(3) + ')', ok ? 'pass' : 'fail');
  return ok;
}

// THE AIRPLANE TAKES OFF AND LOOPS. One SPACE on the airplane starts BOTH
// behaviours bound to it -- the 3D turtle that gives it the vocabulary, and
// the pilot that speaks it -- and the loop needs no counting: a constant
// pitch with a constant stride IS a circle. The proof is the drawn path,
// which must be as tall as it is deep, and the plane must come back DOWN.
async function flightCheck(D) {
  const w = await (await fetch('../examples/models/✈️ airplane-flight.world.json')).json();
  D.worldIn(w); await slowSettle(D, 2000);
  const all = [];
  for (let i = 0; i < 20; i++) { const t = D.bench(i); if (!t) break; all.push(t); }
  const plane = all.find(t => t.userData.kind === 'model');
  const bound = all.filter(t => t.userData.boundTo === plane?.userData.lid);
  if (!plane || bound.length !== 2) {
    put('FAIL the airplane loops  (world did not build)', 'fail'); return false;
  }
  const started = D.press(plane, ' ');
  const bothRunning = bound.every(g => !!g.__panelTray?.userData?.dirty);
  // EVERY frame, not every thirty-fifth. The pilot's round is three orders and
  // the loop is twelve rounds, so sampling every 35 frames aliased against a
  // 36-frame period: the check read almost the same point of the loop each
  // time and whether it ever saw the bottom was luck. It passed, then failed
  // on an unrelated change that shifted the phase by a frame.
  const ups = [];
  for (let i = 0; i < 350; i++) {
    D.frame(1, fnow()); ups.push(plane.userData.up || 0);
    await maybeBreathe();
  }
  const tookOff = Math.max(...ups) > 0.6;          // over the top of the loop
  const cameDown = Math.min(...ups) < 0.05;        // and back to the table
  // the flight path it drew: a circle stands as tall as it is deep
  const segs = [];
  D.scene.traverse(o => {
    if (o.userData?.penMark && o.userData.seg && !o.userData.seg.shape) segs.push(o.userData.seg);
  });
  const ys = segs.map(g => g.y0), zs = segs.map(g => g.z0);
  const tall = segs.length ? Math.max(...ys) - Math.min(...ys) : 0;
  const deep = segs.length ? Math.max(...zs) - Math.min(...zs) : 0;
  const round = tall > 0.5 && Math.abs(tall - deep) < 0.12;
  // ...and it stayed on the table: no wall clipped the back of the loop
  const onTheTable = plane.position.z > 1.2 && plane.position.z < 2.2;
  const ok = started && bothRunning && tookOff && cameDown && round && onTheTable;
  put((ok ? 'PASS' : 'FAIL') + ' the airplane loops  (both-behaviours=' + bothRunning
      + ' climbed=' + Math.max(...ups).toFixed(2) + ' landed=' + cameDown
      + ' path ' + tall.toFixed(2) + ' tall x ' + deep.toFixed(2) + ' deep'
      + ' on-the-table=' + onTheTable + ')', ok ? 'pass' : 'fail');
  return ok;
}

// A HOUSE POSTS TO A HOUSE, AND EVERY HOUSE WORKS. activity1 is three houses
// in a row: Add 1 posts to the letterbox INSIDE Doubler and the one inside
// Split (both nests answer to the same name), and those two post out to the
// nests on the desk. Two things a watcher must see, and neither was checked:
// the bird crossing the table between the houses, and all three robots doing
// their rounds -- the two woken by mail stood still for weeks because their
// round runs in checkWaiting, below where the performance was built.
async function postAcrossCheck(D) {
  const w = await (await fetch('../examples/infinity/♾️ activity1-even-numbers.world.json')).json();
  D.worldIn(w); await slowSettle(D, 2000);
  const rooms = [];
  for (let i = 0; i < 14; i++) { const t = D.bench(i); if (!t) break;
    if (t.userData.kind === 'room') rooms.push(t); }
  D.speed(1);
  // START WHAT IS OFF -- and "off" is not "not dirty". A house woken by post is
  // dirty only for the instant its round takes, so a house that has run once
  // and gone quiet reads as not-dirty while being very much switched ON. This
  // loop used to pull ITS lever too, which since the lever learned to mean
  // stop is a press that stops it: activity1's Doubler and Split were switched
  // off before the first letter and stood there with eight waiting (measured:
  // d0 s1 w0 r1 p8 apiece). The house itself was right; the test was asking
  // the old question.
  for (const r of rooms) {
    if (!r.userData.dirty && !r.__switched) D.clickRaw({ kind: 'roomLever', room: r });
  }
  await settle(D, 4000);
  const walk = new Map(rooms.map(r => [r, 0]));
  const last = new Map();
  const trips = new Map();
  let mostInTheAir = 0;
  // REAL seconds, not virtual frames: the houses pace themselves by the wall
  // clock (about a round a second at speed 1), so the watch must last real
  // time. Driven by frame count, the loop's wall-clock was whatever the
  // yields happened to cost -- it PASSED while breathe() was slow and failed
  // the moment breathe() got fast, with walks of 0.0 because no round fit.
  const tWatch = performance.now();
  for (let k = 0; performance.now() - tWatch < 8000; k++) {
    D.frame(1, performance.now());
    await maybeBreathe();
    for (const r of rooms) {
      let mini = r.__ctx?.activeBot?.node;
      if (!mini) r.__ctx?.root?.traverse(o => {
        if (!mini && o.userData?.kind === 'robot') mini = o; });
      if (!mini) continue;
      const p0 = last.get(r);
      if (p0) walk.set(r, walk.get(r) + Math.hypot(mini.position.x - p0.x, mini.position.z - p0.z));
      last.set(r, { x: mini.position.x, z: mini.position.z });
    }
    // birds ON THE DESK -- outside every house -- and how far each travelled
    let air = 0;
    D.scene.traverse(o => {
      if (o.userData?.kind !== 'bird' || !o.__flying) return;
      air++;
      for (let q = o.parent; q; q = q.parent) if (q.userData?.kind === 'room') return;
      const wp = o.getWorldPosition(new D.V3());
      const seen = trips.get(o) ?? { x0: wp.x, z0: wp.z, d: 0 };
      seen.d = Math.max(seen.d, Math.hypot(wp.x - seen.x0, wp.z - seen.z0));
      trips.set(o, seen);
    });
    mostInTheAir = Math.max(mostInTheAir, air);
  }
  const walks = rooms.map(r => walk.get(r));
  const allWork = walks.every(d => d > 1);
  // Add 1 stands at x -1.20 and Split at x 0.60: a courier between them
  // crosses most of the table
  const crossings = [...trips.values()].filter(t2 => t2.d > 0.8).length;
  // and the piles say the activity itself ran: odds and evens, one each
  const piles = {};
  D.scene.traverse(o => { if (o.userData?.kind === 'nest' && o.userData.label)
    piles[o.userData.label] = (o.userData.pile || []).length; });
  // eight rounds, because the suite leaves the Rounds limit at 8 and a house
  // stops there like any robot: four odds and four evens is the whole run
  // A HOUSE YOU CAN SEE INTO RUNS AT A PACE YOU CAN WATCH -- about a round a
  // second at speed 1 -- so nine hundred frames is a handful of rounds, not a
  // thousand. That pace IS the assertion: Ken watched two glass houses tear
  // through 20 rounds a second because a house running its own inner houses
  // also found its neighbours on the desk and pumped them, cooldown ignored.
  const sorted = ((piles['A: odds'] ?? 0) + (piles['B: evens'] ?? 0)) > 0;
  const rounds = rooms.reduce((n, r) => n + (r.userData.stepRounds || 0), 0);
  const paced = rounds < 60;
  // no unbounded queue in the air: letters land in order, so a fast sender
  // could pile them up for ever
  const bounded = mostInTheAir <= 40;
  // OFF IS A DECISION. A "." typed while a house's turn was running was
  // undone by the turn's own answer to "is there more to do" -- so a house
  // Ken had switched off carried straight on.
  const one = rooms[0];
  D.press(one, '.');
  const roundsAtStop = one.userData.stepRounds || 0;
  await frames(D, 400);
  const staysStopped = !one.userData.dirty && !!one.userData.stopped
    && (one.userData.stepRounds || 0) === roundsAtStop;
  const ok = allWork && crossings > 0 && sorted && bounded && paced && staysStopped;

  put((ok ? 'PASS' : 'FAIL') + ' a house posts to a house  (walks='
      + walks.map(d => d.toFixed(1)).join('/') + ' desk-crossings=' + crossings
      + ' odds=' + (piles['A: odds'] ?? 0) + ' evens=' + (piles['B: evens'] ?? 0)
      + ' most-in-the-air=' + mostInTheAir + ' rounds-in-900-frames=' + rounds
      + ' stop-sticks=' + staysStopped + ')', ok ? 'pass' : 'fail');
  return ok;
}

// A DOCUMENT ARRIVES AS A PAGE. Measured off the pad's own canvas, not off a
// flag: a rendered page is laid out from the left margin, while the plain pad
// centres every line -- so the same words, imported as .md and as .txt, must
// have their ink starting in different places. And the mark has to survive a
// save, which is exactly what the first cut got wrong: the import rendered
// and came back from a load as centred grey.
const MD_DOC = ['# Zeno\'s postman', '',
  'A halver posts **1/2**, then *1/4*, then `1/8`.', '',
  '## What to watch', '', '- the bird carries the post', '- the total is exact',
  '  - even at 1/1024', '', '1. pull the halver', '2. pull the totaller', '',
  '> An empty nest puts the totaller to sleep.', '', '---', '',
  '```', 'total = (2^k - 1) / 2^k', '```', '', 'Plain last line.'].join('\n');
async function markdownCheck(D) {
  // where the ink starts, and how far down the page it reaches
  const inkOf = (pad) => {
    let cv = null;
    pad?.traverse(o => {
      const ms = o.isMesh ? [].concat(o.material) : [];
      for (const m of ms) if (!cv && m?.map?.image?.getContext) cv = m.map.image;
    });
    if (!cv) return null;
    const px = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data;
    let left = cv.width, top = cv.height, bottom = 0, dark = 0;
    for (let y = 0; y < cv.height; y++) {
      for (let x = 0; x < cv.width; x++) {
        const i = (y * cv.width + x) * 4;
        // ink, not paper: the paper is cream, the writing is dark
        if (px[i] + px[i + 1] + px[i + 2] > 330) continue;
        dark++;
        if (x < left) left = x;
        if (y < top) top = y;
        if (y > bottom) bottom = y;
      }
    }
    return { left: left / cv.width, top: top / cv.height,
             bottom: bottom / cv.height, dark, w: cv.width };
  };
  const bring = async (name, type, body) => {
    D.worldIn({ kind: 'world', v: 4, bench: [], stations: {}, active: null });
    await slowSettle(D, 2000);
    D.readMedia(new File([body ?? MD_DOC], name, { type }), null, { x: 0, z: 1.6 });
    await frames(D, 200);
    await new Promise(r => setTimeout(r, 350));
    await frames(D, 120);
    for (let i = 0; i < 8; i++) { const t = D.bench(i); if (!t) break;
      if (t.userData.kind === 'text') return t; }
    return null;
  };
  const page = await bring('notes.md', 'text/markdown');
  const inkA = inkOf(page);
  // it must survive a save: the mark is on the pad, not on the file
  const rec = D.worldOut();
  D.worldIn(rec); await slowSettle(D, 2000);
  let back = null;
  for (let i = 0; i < 8; i++) { const t = D.bench(i); if (!t) break;
    if (t.userData.kind === 'text') { back = t; break; } }
  await frames(D, 60);
  const inkB = inkOf(back);
  // A DOCUMENT TOO LONG FOR ONE PAGE HAS PAGES. Ken imported the behaviours
  // README -- eighteen thousand characters -- and got two hundred lines of
  // grey thread, because the page shrank its type until the whole of it fitted.
  const gap = String.fromCharCode(10, 10);
  const long = await bring('long.md', 'text/markdown',
    MD_DOC + gap + MD_DOC + gap + MD_DOC + gap + MD_DOC);
  const pages = long?.__mdPages ?? 1;
  const inkP1 = inkOf(long);
  long.userData.mdPage = 1;
  long.setText(long.userData.text);
  await frames(D, 40);
  const inkP2 = inkOf(long);
  const turns = pages > 1 && !!inkP1 && !!inkP2 && Math.abs(inkP1.dark - inkP2.dark) > 50;
  const plain = await bring('notes.txt', 'text/plain');
  const inkC = inkOf(plain);
  const rendered = !!page?.userData.md && !!inkA;
  const survives = !!back?.userData.md
    && !!inkB && Math.abs(inkB.left - inkA.left) < 0.03;
  // a page starts at its margin; a poem is centred, so its ink starts further in
  const fromTheMargin = !!inkA && !!inkC && inkA.left < 0.12 && inkC.left > inkA.left + 0.05;
  // and it fills the page from the top rather than floating in the middle
  const fillsThePage = !!inkA && inkA.top < 0.2 && inkA.bottom > 0.7;
  const ok = rendered && survives && fromTheMargin && fillsThePage && turns;
  put((ok ? 'PASS' : 'FAIL') + ' a document arrives as a page  (md=' + !!page?.userData.md
      + ' ink-from-left=' + (inkA ? inkA.left.toFixed(3) : '-')
      + ' plain-from-left=' + (inkC ? inkC.left.toFixed(3) : '-')
      + ' top=' + (inkA ? inkA.top.toFixed(2) : '-')
      + ' bottom=' + (inkA ? inkA.bottom.toFixed(2) : '-')
      + ' survives-save=' + survives + ' pages=' + pages
      + ' page-turns=' + turns + ')', ok ? 'pass' : 'fail');
  return ok;
}

// UNDO NEVER MINTS A TWIN. Drop a gadget into another gadget's open tray,
// undo: the pilot must come back OUT of the tray -- the same node, name and
// binding intact -- not be rebuilt on the bench while the original lives on
// inside the tray with the same live name.
async function undoTwinCheck(D) {
  const w = await (await fetch('../examples/models/✈️ airplane-flight.world.json')).json();
  D.worldIn(w); await settle(D, 4000);
  const find = (lid) => { for (let i = 0; i < 30; i++) { const t = D.bench(i); if (!t) break;
    if (t.userData.lid === lid) return t; } return null; };
  const pilots = () => { let n = 0;
    D.scene.traverse(o => { if (o.userData?.lid === 'A903') n++; }); return n; };
  const pilot = find('A903'), turtle = find('A902');
  if (!pilot || !turtle) { put('FAIL undo never twins  (world did not build)', 'fail'); return false; }
  D.clickThing(turtle); await settle(D, 9000);
  D.openHeldPanel(); await settle(D, 9000);
  D.clickBench(1.4, 1.25); await settle(D, 9000);
  const tray = D.panelOf(turtle);
  D.clickThing(pilot); await settle(D, 9000);
  D.clickThing(tray); await settle(D, 20000);
  const inTray = pilots() === 1;
  D.undo(); await settle(D, 20000);
  const after = pilots();
  const back = find('A903');
  const ok = inTray && after === 1 && !!back && back.userData.boundTo === 'A901';
  put((ok ? 'PASS' : 'FAIL') + ' undo never twins  (into-tray=' + inTray
      + ' pilots-after-undo=' + after + ' back-on-bench=' + !!back
      + ' binding-kept=' + (back?.userData.boundTo === 'A901') + ')', ok ? 'pass' : 'fail');
  return ok;
}

// THE ROBOT READS ITS OWN NOTEBOOK. A round snapshots the pages at its first
// read, so the user can be HOLDING the notebook mid-run and the robot still
// works -- where it used to abort with "there is no notebook here".
async function notebookCheck(D) {
  D.worldIn({ kind: 'world', v: 4,
    bench: [{ thing: { kind: 'notebook', page: 0,
                       pages: [{ kind: 'number', value: { n: '7', d: '1' } }] },
              x: 0.9, z: 1.3 }],
    stations: { stand: { kind: 'box', holes: [null] } },
    active: { kind: 'robot', name: 'reader',
      condition: { kind: 'anyBox', n: 1 },
      program: [
        { type: 'take', at: { c: 'notebook', path: [0] } },
        { type: 'put', at: { c: 'given', path: [0] } }],
      trainedOn: { kind: 'box', holes: [null] }, team: [] } });
  await settle(D, 4000);
  let nb = null;
  D.scene.traverse(o => { if (o.userData?.kind === 'notebook') nb = o; });
  if (!nb) { put('FAIL the robot reads its own notebook  (no notebook)', 'fail'); return false; }
  nb.userData.main = true;
  D.hold(nb); await settle(D, 9000);
  D.rounds(5);
  D.run(); await settle(D, 60000);
  D.rounds(ROUNDS);
  const given = D.mine([0]);
  const total = given?.userData?.kind === 'number'
    ? given.userData.value.n + '/' + given.userData.value.d : '-';
  const stillHeld = D.state.hand === 'notebook';
  const ok = total === '35/1' && stillHeld;
  put((ok ? 'PASS' : 'FAIL') + ' the robot reads its own notebook  (five sevens='
      + total + ' notebook-stayed-in-hand=' + stillHeld + ')', ok ? 'pass' : 'fail');
  return ok;
}

// A LETTER AT A TIME, AND THE LEVER MEANS STOP. zeno behind glass at speed
// 1: a house that has posted a courier is not offered another turn until the
// letter is on the nest, so no backlog can build behind the watcher's back --
// and stopping the sender stops the arrivals within one flight. The lever of
// the mail-driven totaller must STOP it: it is dirty only for the instant a
// letter lands, and judged by dirty the press used to take the start branch
// instead ("the totaller robot ignored the stop button").
async function paceAndLeverCheck(D) {
  const w = await (await fetch('../examples/infinity/📮 zeno.world.json')).json();
  D.worldIn(w); await slowSettle(D, 2000);
  D.speed(1);
  const rooms = [];
  for (let i = 0; i < 10; i++) { const t = D.bench(i); if (!t) break;
    if (t.userData.kind === 'room') rooms.push(t); }
  const halver = rooms.find(r => r.userData.label !== 'the totaller');
  const tot = rooms.find(r => r.userData.label === 'the totaller');
  D.clickRaw({ kind: 'roomLever', room: halver });
  D.clickRaw({ kind: 'roomLever', room: tot });
  const denOf = () => {
    const v = tot.__ctx?.standOcc?.userData?.holes?.[1]?.thing?.userData?.value;
    return v ? BigInt(v.d) : null;
  };
  // REAL seconds -- the pace is wall-clock
  let most = 0;
  const t0 = performance.now();
  while (performance.now() - t0 < 7000) {
    D.frame(1, performance.now());
    most = Math.max(most, D.sizes.flights);
    await maybeBreathe();
  }
  const den1 = denOf();
  const delivered = den1 != null && den1 >= 4n;   // at least two letters landed
  const paced = most <= 3;                        // one letter at a time, not a swarm
  // the lever stops the mail-driven house
  D.clickRaw({ kind: 'roomLever', room: tot });
  const totStopped = !!tot.userData.stopped && !tot.userData.dirty;
  D.clickRaw({ kind: 'roomLever', room: tot });   // and starts it again
  const totRestarts = !tot.userData.stopped;
  // stopping the SENDER stops the arrivals within about one flight
  D.clickRaw({ kind: 'roomLever', room: halver });
  const halverStopped = !!halver.userData.stopped;
  const t1 = performance.now();
  while (performance.now() - t1 < 2500) { D.frame(1, performance.now()); await maybeBreathe(); }
  const den2 = denOf();
  const t2 = performance.now();
  while (performance.now() - t2 < 3000) { D.frame(1, performance.now()); await maybeBreathe(); }
  const den3 = denOf();
  const drains = den2 != null && den3 === den2;   // nothing more once the air is clear
  const ok = delivered && paced && totStopped && totRestarts && halverStopped && drains;
  put((ok ? 'PASS' : 'FAIL') + ' a letter at a time, and the lever means stop  (total-den='
      + String(den1) + ' most-in-air=' + most + ' lever-stops=' + totStopped
      + ' lever-restarts=' + totRestarts + ' sender-stops=' + halverStopped
      + ' drains=' + drains + ' den-after=' + String(den3) + ')', ok ? 'pass' : 'fail');
  D.speed(1);
  return ok;
}

// FOLDING A PANEL NEVER FREEZES THE LIVE PANEL NESTED INSIDE IT. The knob
// used to judge the plane's panel by its own work -- no robot, not dirty --
// and serialized the whole world, taking the switched-on turtle panel with
// it: its letterbox left the scene and Ken's hand-flown orders had nowhere
// to land. A fold over live nested work keeps the tray on the bench, closed.
async function foldAliveCheck(D) {
  const w = await (await fetch('../examples/models/✈️ airplane-flight.world.json')).json();
  D.worldIn(w); await slowSettle(D, 2000);
  D.speed(1);
  const all = [];
  for (let i = 0; i < 20; i++) { const t = D.bench(i); if (!t) break; all.push(t); }
  const plane = all.find(t => t.userData.kind === 'model');
  const turtleG = all.find(t => t.userData.lid === 'A902');
  if (!plane || !turtleG) { put('FAIL a fold keeps nested work alive  (world did not build)', 'fail'); return false; }
  const at = { x: plane.position.x, z: plane.position.z };
  D.switchGadget(turtleG, true); await slowSettle(D, 2000);
  const turtleTray = D.panelOf(turtleG);
  const letterbox = turtleTray?.__ctx?.standOcc?.userData?.holes?.map(h => h.thing)
    .find(t => t?.userData?.kind === 'nest') ?? null;
  D.hold(plane); D.openHeldPanel(); D.clickBench(at.x, at.z);
  await slowSettle(D, 2000);
  const planeTray = D.panelOf(plane);
  if (!planeTray || !turtleTray || !letterbox) {
    put('FAIL a fold keeps nested work alive  (no trays)', 'fail'); return false;
  }
  turtleTray.visible = true; turtleTray.__closed = false;
  D.hold(turtleTray); D.clickRaw({ kind: 'thing', thing: planeTray });
  await slowSettle(D, 2000);
  let nested = false;
  for (let q = turtleTray.parent; q; q = q.parent) if (q === planeTray) { nested = true; break; }
  D.clickRaw({ kind: 'panelClose', tray: planeTray });
  await slowSettle(D, 2000);
  const keptLive = plane.__panelTray === planeTray && !!planeTray.__closed;
  const boxInScene = (() => { let q = letterbox; while (q && q.parent) q = q.parent;
    return q?.type === 'Scene'; })();
  const f0 = turtleTray.__frame || 0;
  for (let i = 0; i < 90; i++) { D.frame(1, fnow()); if ((i & 31) === 31) await maybeBreathe(); }
  const stillTicks = (turtleTray.__frame || 0) > f0;
  const ok = nested && keptLive && boxInScene && stillTicks;
  put((ok ? 'PASS' : 'FAIL') + ' a fold keeps nested work alive  (nested=' + nested
      + ' tray-kept-live=' + keptLive + ' letterbox-in-scene=' + boxInScene
      + ' nested-panel-still-ticks=' + stillTicks + ')', ok ? 'pass' : 'fail');
  return ok;
}

// THE ROBOT MOVES OVER SO ITS HAND IS AT THE STACK. One decision picks the
// grab pose by the pile-top's height and stands where that pose's claw lands
// on the pile -- so the horizontal claw-to-top distance at the closest
// approach is ~0, for the take AND for the drop onto the target. The lerp
// this replaced could be a cube's width off ("reaching to the wrong place").
async function reachAtPileCheck(D) {
  const pile = [];
  for (let i = 0; i < 12; i++) pile.push({ kind: 'number', value: { n: String(i + 1), d: '1' }, op: '+' });
  D.worldIn({ kind: 'world', v: 4, bench: [],
    stations: { stand: { kind: 'box', holes: [
      { kind: 'nest', id: 7701, guid: 'reach-post', hasEgg: false, pile },
      { kind: 'number', value: { n: '0', d: '1' }, op: '+' }] } },
    active: { kind: 'robot', name: 'reader',
      condition: { kind: 'box', holes: [{ kind: 'wildNumber' }, { kind: 'wildNumber' }] },
      program: [{ type: 'take', at: { c: 'given', path: [0] } },
                { type: 'put',  at: { c: 'given', path: [1] } }],
      trainedOn: { kind: 'box', holes: [{ kind: 'number', value: { n: '1', d: '1' }, op: '+' },
                                        { kind: 'number', value: { n: '0', d: '1' }, op: '+' }] },
      team: [] } });
  await slowSettle(D, 4000);
  const nests = [];
  D.scene.traverse(o => { if (o.userData?.kind === 'nest') nests.push(o); });
  const nest = nests.find(n => (n.userData.pile || []).length);
  if (!nest) { put('FAIL the hand is at the stack  (no pile built)', 'fail'); return false; }
  const topOf = () => { const p2 = nest.userData.pile; return p2.length ? p2[p2.length - 1] : null; };
  D.speed(1); D.rounds(2);
  D.run();
  let minTake = 99, minPut = 99, takeDy = 99;
  // AND IT CAN BE SEEN ON THE WAY. The nest remembers the ten it showed last
  // so that a restack stays cheap, and the top of the pile -- the one a robot
  // takes -- was in that list, so the number crossed the desk invisibly and
  // appeared only where it landed. Every frame the claw holds something, that
  // something must be visible.
  let carried = 0, seenCarried = 0;
  for (let i = 0; i < 60 * 40 && (D.state.busy || D.state.queued || D.state.current); i++) {
    D.frame(1, fnow());
    const ch = D.clawThing();
    if (ch) { carried++; if (ch.visible) seenCarried++; }
    const c = D.claw();
    const top = topOf();
    if (top && c.y != null) {
      const tp = top.getWorldPosition(new D.V3());
      const d = Math.hypot(c.x - tp.x, c.z - tp.z);
      if (d < minTake) { minTake = d; takeDy = c.y - tp.y; }
    }
    const targ = D.mine ? D.mine([1]) : null;
    if (targ && c.y != null) {
      const tp2 = targ.getWorldPosition(new D.V3());
      minPut = Math.min(minPut, Math.hypot(c.x - tp2.x, c.z - tp2.z));
    }
    await maybeBreathe();
  }
  await slowSettle(D, 30000);
  D.rounds(ROUNDS);
  const total = D.mine([1]);
  const sum = total?.userData?.value ? total.userData.value.n + '/' + total.userData.value.d : '-';
  const ok = minTake < 0.15 && minPut < 0.15 && sum === '23/1'
    && nest.userData.pile.length === 10
    && carried > 60 && seenCarried === carried;
  put((ok ? 'PASS' : 'FAIL') + ' the hand is at the stack  (take-off-by='
      + minTake.toFixed(3) + ' take-dy=' + takeDy.toFixed(2)
      + ' put-off-by=' + minPut.toFixed(3) + ' sum=' + sum
      + ' pile-left=' + nest.userData.pile.length
      + ' carried-frames=' + carried + ' seen=' + seenCarried + ')', ok ? 'pass' : 'fail');
  return ok;
}

// A PUZZLE IS A WORLD FILE. Nothing new is needed to make one: a constrained
// world (rules say which stacks and tools exist), a goal in plain sight that
// cannot be taken, a bird to give the answer to, and a judge -- a robot team
// in an opaque house, dozing on the post nest -- that decides with its own
// thought bubble and answers by bird. The judge's last step opens the next
// world by name, which is the one robot step that did not exist. This drives
// puzzle 1 from the original tutorial end to end: a wrong answer comes back,
// the right one is judged and puzzle 2 arrives, Marty gives the author's
// hints in order, and Start over puts the puzzle back.
async function puzzleCheck(D, w) {
  let stage = 'load';
  try { return await puzzleCheckBody(D, w, (s2) => { stage = s2; }); }
  catch (e) { throw new Error('at stage "' + stage + '": ' + e.message); }
}
async function puzzleCheckBody(D, w, at) {
  const rec = await (await fetch('../examples/puzzles/p1.world.json')).json();
  D.worldIn(rec);
  await slowSettle(D, 3000);
  const find = (pred) => { for (let i = 0; i < 14; i++) { const t = D.bench(i); if (t && pred(t)) return t; } return null; };
  const line = [];
  const must = (x, what) => { if (!x) throw new Error('no ' + what + ' on the table: '
    + (() => { const k = []; for (let i = 0; i < 14; i++) { const t = D.bench(i); if (!t) break; k.push(t.userData.kind); } return k.join(','); })()); return x; };
  // 1. the rules of the place
  at('rules');
  const constrained = D.worldName === 'p1'
    && D.stations.numbers.__plinth.visible === false
    && D.stations.copyOut.__node?.visible === false
    && w.document.getElementById('againBtn').style.display !== 'none';
  line.push('constrained=' + constrained);
  // 2. the goal stays put
  at('goal');
  const goal = must(find(t => t.userData.fixed && !t.userData.ghost), 'goal');
  D.clickThing(goal); await frames(D, 30);
  const goalStays = !!goal && D.state.hand === null;
  line.push('goal-stays=' + goalStays);
  // 3. hints, in the author's order, no brain needed
  at('hints');
  const h1 = D.nextHint('hint'), h2 = D.nextHint('I am stuck'), h3 = D.nextHint('hint'), h4 = D.nextHint('hint');
  const hinted = /pick up numbers/.test(h1) && /first hole/.test(h2) && /what I/.test(h3) && h4 === h3;
  line.push('hints-in-order=' + hinted);
  // 4. a wrong answer comes back
  at('wrong answer');
  const bird = must(find(t => t.userData.kind === 'bird'), 'bird');
  const reply = must(find(t => t.userData.kind === 'nest'), 'reply nest');
  const one = must(find(t => t.userData.kind === 'number' && t.userData.value.n === 1n), 'a 1');
  const two = must(find(t => t.userData.kind === 'number' && t.userData.value.n === 2n), 'a 2');
  const emptyBox = must(find(t => t.userData.kind === 'box' && !t.userData.fixed), 'an empty box');
  D.hold(one); D.clickThing(bird);
  const heard = []; const hintEl2 = w.document.getElementById('hint');
  const seen2 = () => { const t = hintEl2?.textContent || ''; if (t && heard[heard.length - 1] !== t) heard.push(t.slice(0, 70)); };
  // A WRONG ANSWER COMES BACK WITH A NOTE: the judge sends a copy of its "not
  // quite" pad -- Mimi is the workshop's, so a robot in a house can copy --
  // and then the answer itself. Two deliveries, the pad first.
  for (let i = 0; i < 200 && reply.userData.pile.filter(t => t.userData.kind === 'number').length === 0; i++) { await frames(D, 20); await maybeBreathe(); seen2(); }
  for (let i = 0; i < 60 && !reply.userData.pile.some(t => t.userData.kind === 'text'); i++) { await frames(D, 20); await maybeBreathe(); seen2(); }
  const back = must(reply.userData.pile.find(t => t.userData.kind === 'number'), 'answer back on the reply nest (judge: '
    + JSON.stringify(D.ctxInfo(find(t => t.userData.kind === 'room'))) + ')');
  const noted = reply.userData.pile.some(t => /Not quite/.test(t.userData.text || ''));
  const wrongBack = !!back && back.userData.kind === 'number' && noted;
  line.push('wrong-comes-back=' + wrongBack + '/with-a-note=' + noted
    + (noted ? '' : ' pile=' + reply.userData.pile.map(t => t.userData.kind).join(',') + ' heard=' + JSON.stringify(heard.slice(-4))));
  // ...and the note is a COPY: the judge still holds its own
  const judgeRoom = find(t => t.userData.kind === 'room');
  const keeps = D.ctxInfo(judgeRoom).standOcc === 'box';
  line.push('judge-keeps-its-note=' + keeps);
  // TAKING A THING OUT OF A BOX ON A NEST strikes it off the hole. It did not:
  // the hole went on pointing at a number now in the hand, so a number
  // dropped elsewhere changed the box too, and undo doubled everything.
  const note = reply.userData.pile.find(t => t.userData.kind === 'text');
  if (note) { D.clickThing(note); await frames(D, 30); D.clickBench(0.9, 2.2); await frames(D, 60); }
  const holeBefore = null;
  line.push('hole-struck-off=' + (() => { return 'n/a'; })());
  at('taking it back');
  D.clickThing(back); await frames(D, 60);
  const one2 = D.state.hand === 'number' ? back : one;
  const struck = !reply.userData.pile.includes(back);
  line[line.length - 1] = 'taken-off-the-nest=' + struck;
  D.clickBench(-0.6, 1.6); await frames(D, 120);
  // 5. the right answer is judged, and the next puzzle arrives
  at('right answer');
  D.hold(one2); D.clickHole(emptyBox, 0); await frames(D, 90);
  D.hold(two); D.clickHole(emptyBox, 1); await frames(D, 90);
  D.hold(emptyBox); D.clickThing(bird);
  // THE JUDGE OFFERS, THE PLAYER PRESSES. Ken never saw the note for solving
  // puzzle 1 -- it was in the air when the table changed under it. So the
  // right answer must leave the note ON the reply nest, the table still on
  // puzzle 1, and the Next button armed; Next is what brings puzzle 2.
  for (let i = 0; i < 120 && !D.nextWorld; i++) { await frames(D, 20); await maybeBreathe(); }
  // the offer is made the moment the judge's last step runs; the note is
  // still in the bird's beak for a second after that
  for (let i = 0; i < 150 && !reply.userData.pile.some(t => /Well done/.test(t.userData.text || '')); i++) { await frames(D, 20); await maybeBreathe(); }
  const offered = D.nextWorld === 'p2' && D.worldName === 'p1'
    && reply.userData.pile.some(t => /Well done/.test(t.userData.text || ''))
    && w.document.getElementById('nextBtn').style.display !== 'none';
  line.push('offered=' + offered);
  D.goNext();
  for (let i = 0; i < 120 && D.worldName !== 'p2'; i++) { await frames(D, 20); await maybeBreathe(); }
  const next = D.worldName === 'p2' && !!find(t => t.userData.fixed && t.userData.kind === 'number')
    && w.document.getElementById('nextBtn').style.display === 'none';
  line.push('next-puzzle=' + next);
  // 6. start over puts THIS puzzle back exactly as it began
  at('start over');
  const twos = () => { let n = 0; for (let i = 0; i < 14; i++) { const t = D.bench(i);
    if (t?.userData.kind === 'number' && !t.userData.fixed && t.userData.value.n === 2n) n++; } return n; };
  const a = find(t => t.userData.kind === 'number' && !t.userData.fixed);
  D.hold(a); D.clickBench(0.2, 1.9); await frames(D, 120);       // move one, so restart has something to undo
  D.startOver(); await slowSettle(D, 3000);
  const again = D.worldName === 'p2' && twos() === 2;
  line.push('start-over=' + again);

  const panel = w.document.getElementById('martyPanel'); if (panel) panel.style.display = 'none';
  w.document.activeElement?.blur?.();
  const ok = constrained && goalStays && hinted && wrongBack && keeps && struck && offered && next && again;
  put((ok ? 'PASS' : 'FAIL') + ' a puzzle is a world file  (' + line.join(' ') + ')', ok ? 'pass' : 'fail');
  return ok;
}

// EVERY PUZZLE FILE JUDGES ITS OWN GOAL. Five files, each with a goal on the
// table and a judge in a house whose leader's thought is meant to BE that
// goal -- so the thing the author put on the table to be copied must be a
// thing the judge would accept. Asked from outside the house, through the
// hydrated robot's condition, for each file in turn; and each file's rules
// must have taken effect (no number stack on a puzzle that lists none).
async function puzzleSetCheck(D) {
  const line = [];
  let ok = true;
  for (const name of ['p1', 'p2', 'p3', 'p4', 'p5', 'p6', 'p7', 'p8', 'p9', 'p10', 'p11', 'p13', 'p14', 'p15', 'p16', 'p17', 'p18', 'p19', 'p20', 'p21', 'p22', 'p23', 'p24', 'p25', 'p26', 'p27', 'p28', 'p29', 'p30', 'p31', 'p32', 'p33', 'p34', 'p35', 'p12', 'p36', 'p37', 'p38', 'p39']) {
    const rec = await (await fetch('../examples/puzzles/' + name + '.world.json')).json();
    D.worldIn(rec);
    await slowSettle(D, 3000);
    let goal = null, judge = null;
    for (let i = 0; i < 16; i++) { const t = D.bench(i); if (!t) break;
      if (t.userData.fixed && !t.userData.ghost) goal = t;   /* the ship is fixed too, and ghost */ if (t.userData.kind === 'room' && t.userData.judge) judge = t; }
    const cond = judge?.__ctx?.activeBot?.condition;
    const stacksOff = rec.rules.stacks.includes('numbers') === (D.stations.numbers.__plinth.visible !== false);
    const nameOK = D.worldName === name;      // before a sign's answer world replaces it
    // A SIGN IS NOT THE ANSWER. Puzzles 26 and 27 show a pad saying what is
    // wanted rather than the thing itself, so the answer is built here and
    // held up to the judge's thought instead.
    const SIGN_ANSWERS = {
      p27: { kind: 'number', value: { n: '8', d: '11' }, op: '+' },
      p28: { kind: 'box', holes: [{ kind: 'number', value: { n: '5', d: '9' }, op: '+' },
                                  { kind: 'number', value: { n: '7', d: '12' }, op: '+' }] },
      // the second arc: the judge ASKS the lion (or the yard) and reads its answer
      p36: { kind: 'box', holes: [{ kind: 'number', value: { n: '1', d: '2' }, op: '+' },
                                  { kind: 'number', value: { n: '3', d: '2' }, op: '+' }] },
      p37: { kind: 'number', value: { n: '0', d: '1' }, op: '+' },
      p38: { kind: 'box', holes: [{ kind: 'number', value: { n: '1', d: '5' }, op: '+' },
                                  { kind: 'number', value: { n: '223', d: '100' }, op: '+' }] },
      p39: { kind: 'box', holes: [{ kind: 'box', holes: [{ kind: 'bird', nestId: 0, nestGuid: null, liveId: 'LION39' },
                                                         { kind: 'text', text: 'lion' },
                                                         { kind: 'box', holes: [{ kind: 'number', value: { n: '1', d: '2' }, op: '+' }, { kind: 'number', value: { n: '5', d: '1' }, op: '+' }] },
                                                         { kind: 'text', text: 'model' }] }] },
    };
    if (goal?.userData.kind === 'text' && SIGN_ANSWERS[name]) {
      D.worldIn({ kind: 'world', v: 4, stations: {}, active: null,
                  bench: [{ thing: SIGN_ANSWERS[name], x: 0, z: 2.0 }] });
      await slowSettle(D, 2000);
      goal = D.bench(0)?.userData.kind === 'notebook' ? D.bench(1) : D.bench(0);
      for (let i = 0; i < 6; i++) { const t = D.bench(i); if (t && t.userData.kind === SIGN_ANSWERS[name].kind) { goal = t; break; } }
    }
    const accepts = cond && goal ? D.matchOf(cond.holes[0], goal) : 'no judge';
    const good = accepts === 'yes' && stacksOff && nameOK;
    if (!good) ok = false;
    line.push(name + '=' + accepts + (stacksOff ? '' : '/stacks?'));
  }
  put((ok ? 'PASS' : 'FAIL') + ' every puzzle judges its own goal  (' + line.join(' ') + ')', ok ? 'pass' : 'fail');
  return ok;
}

// A DAYDREAM LEAVES NOTHING BEHIND. Ken watched a robot copy a unicorn until
// the work spots were full, stopped it, and found the herd on the desk -- and
// read that as a lesson that had failed to rewind. It was a RUN, whose work is
// real and is meant to be kept; but the two look identical at the moment the
// robot stops, so the workshop now says which just happened. This pins the
// half that must never change: whatever you do inside the bubble -- copies on
// the table, copies on fresh work spots, something left on Mimi, something
// still in the claw -- is gone when you leave.
async function daydreamCheck(D, w) {
  const models = () => { let m = 0;
    D.scene.traverse(o => { if (o.userData?.kind === 'model') m++; }); return m; };
  const spots = () => Object.values(D.stations)
    .filter(s2 => s2.kind === 'scratch').length;
  const start = async () => {
    D.worldIn({ kind: 'world', v: 4, stations: {}, bench: [],
      active: { kind: 'robot', name: 'copier', program: [], team: [] } });
    await slowSettle(D, 3000);
    const m = D.makeFromReply(JSON.stringify({ name: 'a unicorn', parts: [
      { shape: 'sphere', size: [0.09], at: [0, 0.08, 0], color: '#ffffff' }] }), 'a unicorn')?.thing;
    await slowSettle(D, 2000);
    D.hold(m);
    D.clickActive();                       // the lesson begins
    await slowSettle(D, 4000);
    return m;
  };
  const copyOnto = async (model, where) => {
    D.clickThing(model); await slowSettle(D, 4000);
    D.clickRaw({ kind: 'station', id: 'copyIn' }); await slowSettle(D, 5000);
    D.clickRaw({ kind: 'station', id: 'copyOut' }); await slowSettle(D, 4000);
    if (where === 'bench') D.clickBench(-0.5, 1.9);
    else D.clickRaw({ kind: 'station', id: where });
    await slowSettle(D, 4000);
  };
  const line = [];
  let ok = true;
  for (const [tag, run2] of [
    ['work spots', async (m) => { await copyOnto(m, 's0'); await copyOnto(m, 's1'); }],
    ['the table', async (m) => { await copyOnto(m, 'bench'); }],
    ['on Mimi', async (m) => { D.clickThing(m); await slowSettle(D, 4000);
      D.clickRaw({ kind: 'station', id: 'copyIn' }); await slowSettle(D, 5000); }],
    ['in the claw', async (m) => { D.clickThing(m); await slowSettle(D, 4000); }],
  ]) {
    const model = await start();
    if (!model) { put('FAIL a daydream leaves nothing behind  (no model)', 'fail'); return false; }
    const base = models();                 // the given one, and the bubble's picture
    await run2(model);
    const during = models();
    w.document.getElementById('exitBtn').click();
    await slowSettle(D, 6000);
    const after = models();
    const clean = after === base && D.state.mode === 'world';
    if (!clean) ok = false;
    line.push(tag + '=' + during + '->' + after + (clean ? '' : ' LEAK'));
  }

  // ...and the two robots on the table are described differently, since what
  // dropping something on one MEANS depends on whether it has been taught
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [
    { thing: { kind: 'robot', name: 'green', program: [], team: [] }, x: -0.7, z: 1.5 },
    { thing: { kind: 'robot', name: 'taught', team: [],
        condition: { kind: 'box', holes: [{ kind: 'wildNumber' }] },
        program: [{ type: 'take', at: { c: 'given', path: [0] } }],
        trainedOn: { kind: 'box', holes: [{ kind: 'number', value: { n: '1', d: '1' }, op: '+' }] } },
      x: 0.7, z: 1.5 },
    { thing: { kind: 'number', value: { n: '5', d: '1' }, op: '+' }, x: 0, z: 2.0 }] });
  await slowSettle(D, 3000);
  const bots = [];
  for (let i = 0; i < 10; i++) { const t = D.bench(i); if (!t) break;
    if (t.userData.kind === 'robot') bots.push(t); }
  let num = null;
  for (let i = 0; i < 10; i++) { const t = D.bench(i);
    if (t?.userData.kind === 'number') { num = t; break; } }
  D.hold(num); await frames(D, 60);
  const cv = D.renderer.domElement, r = cv.getBoundingClientRect();
  const tipOver = (node) => {
    const pt = node.getWorldPosition(new D.V3()); pt.y += 0.15; pt.project(D.camera);
    cv.dispatchEvent(new w.PointerEvent('pointermove', { bubbles: true,
      clientX: r.left + (pt.x * 0.5 + 0.5) * r.width,
      clientY: r.top + (-pt.y * 0.5 + 0.5) * r.height }));
    return w.document.getElementById('tip')?.textContent || '';
  };
  const green = tipOver(bots[0]), taught = tipOver(bots[1]);
  const tips = /lesson/.test(green) && /work/.test(taught) && green !== taught;
  if (!tips) ok = false;

  put((ok ? 'PASS' : 'FAIL') + ' a daydream leaves nothing behind  (' + line.join(' ')
      + ' untrained-tip=' + /lesson/.test(green) + ' trained-tip=' + /work/.test(taught)
      + ')', ok ? 'pass' : 'fail');
  return ok;
}
