async function overlapCheck(D) {
  const name = (t) => (t.userData.label || (t.userData.text || '').split('\n')[0].slice(0, 14)
                       || t.userData.kind);
  // the footprint on the ground, the name plate left out: a plate lies on the
  // face of its box or flat in front of its nest by design
  const foot = (t) => {
    // the suite owns the clock and nothing has been drawn: a thing just set
    // down still wears the identity matrix, and measured that way every
    // thing in a world stood at the origin on top of every other
    t.updateMatrixWorld(true);
    const bb = new D.THREE.Box3();
    // solid parts only: a house wears a faint cone of light a metre wide,
    // and light does not flicker against a pad
    t.traverse(o => { if (o.isMesh && o !== t.__labelNode && o.visible
      && !(o.material?.transparent && (o.material.opacity ?? 1) < 0.5)) bb.expandByObject(o, true); });   // precise: a roof is a cone turned 45 degrees, and its loose box is a metre wide
    return bb;
  };
  const clashes = (things) => {
    const out = [];
    const boxes = things.map(t => [t, foot(t)]).filter(([, b]) => !b.isEmpty());
    for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++) {
      const [a, A] = boxes[i], [b, B] = boxes[j];
      const dx = Math.min(A.max.x, B.max.x) - Math.max(A.min.x, B.min.x);
      const dz = Math.min(A.max.z, B.max.z) - Math.max(A.min.z, B.min.z);
      if (dx > 0.012 && dz > 0.012) {
        const sz = (B2) => (B2.max.x - B2.min.x).toFixed(2) + 'x' + (B2.max.z - B2.min.z).toFixed(2);
        const at = (B2) => ((B2.min.x + B2.max.x) / 2).toFixed(2) + ',' + ((B2.min.z + B2.max.z) / 2).toFixed(2);
        out.push(name(a) + '[' + sz(A) + '@' + at(A) + '] x ' + name(b) + '[' + sz(B) + '@' + at(B) + '] ('
          + Math.min(dx, dz).toFixed(2) + ' m)');
      }
    }
    return out;
  };
  const bench = () => { const o = []; for (let i = 0; i < 80; i++) { const t = D.bench(i); if (!t) break;
    if (!t.userData.main && !t.userData.panel && !t.userData.ghost) o.push(t); } return o; };   // a ghost stands IN things by design: a pen in its pot, a planet on its stand
  let bad = 0;
  for (const w of EXAMPLE_WORLDS) {
    const rec = await (await fetch('../examples/' + w + '.world.json')).json();
    D.worldIn(rec); await slowSettle(D, 1500);
    let found = clashes(bench());
    if (rec.yard?.bench?.length) {
      D.clickRaw({ kind: 'yardDoor' }); await slowSettle(D, 2500);
      found = found.concat(clashes(bench()).map(c => 'yard: ' + c));
    }
    if (found.length) { bad++; put('FAIL things overlap in ' + w + ':  ' + found.join('; '), 'fail'); }
  }
  D.speed(1);
  const ok = bad === 0;
  put((ok ? 'PASS' : 'FAIL') + ' nothing in an example stands on anything else  (worlds='
      + EXAMPLE_WORLDS.length + ' with-overlaps=' + bad + ')', ok ? 'pass' : 'fail');
  return ok;
}

// THE YARD AS A THING. It has a node with a name, a panel of its own, and two
// things to say: [query | things | bird] answers with what stands on the
// grass -- a bird to each, its name, its place -- and [listen | things | bird]
// hears things arrive and leave. Asked from indoors it still answers (the
// list is the ground's own); the listening only runs outside, because only
// the place you are in runs.
async function yardPanelCheck(D, w) {
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [],
    yard: { bench: [
      { x: -2, z: 5, thing: { kind: 'text', text: 'a lion', label: 'Leo' } },
      { x: 0, z: 5, thing: { kind: 'number', value: { n: '7', d: '1' } } },
      { x: 2, z: 6.5, thing: { kind: 'nest', id: 9901, guid: 'yard-probe', label: 'probe', hasEgg: false } } ] } });
  await slowSettle(D, 1500);
  // 1. from indoors: the report, and the filter by name or words
  const rep0 = D.yardReport();
  const entry = rep0.userData.holes[0].thing;
  const reported = rep0.userData.holes.length === 3
    && rep0.userData.holeLabels.join(',') === 'Leo,number,probe'
    && entry.userData.holes.map(h => h.thing.userData.kind).join(',') === 'bird,text,box,text'
    && entry.userData.holes[3].thing.userData.text === 'text';      // ...and its kind, so a keeper can tell a pad from an animal
  const filtered = D.yardReport('lion').userData.holeLabels.join(',') === 'Leo';
  // 2. the panel opens only outside, and its owner is the yard
  D.worldIn(JSON.parse(JSON.stringify(D.worldOut())));   // a fresh start, indoors
  await slowSettle(D, 1200);
  D.clickRaw({ kind: 'yardDoor' }); await slowSettle(D, 2500);
  const tray = D.openYardPanel();
  const opened = !!tray && tray.__owner?.userData.kind === 'yard' && !!tray.__perchBird;
  // 3. listen: the event nest, carried onto the grass, hears a number arrive and leave
  let probe = null; for (let i = 0; i < 20; i++) { const t = D.bench(i); if (!t) break; if (t.userData.kind === 'nest' && t.userData.label === 'probe') probe = t; }
  const yn = D.yardNode();
  D.post(yn.userData.lid, { kind: 'box', holes: [{ kind: 'text', text: 'listen' }, { kind: 'text', text: 'things' },
    { kind: 'bird', nestId: 9901, nestGuid: 'yard-probe', label: 'answer' }] });
  await frames(D, 10);
  const ev = probe.userData.pile[probe.userData.pile.length - 1];
  const gotNest = ev?.userData.kind === 'nest' && ev.userData.label === 'things';
  D.clickThing(ev); await frames(D, 20);
  D.clickBench(0.5, 6.5); await frames(D, 30);
  // Leo leaves the grass (into your hand) and comes back: the nest hears both
  const words = (b) => b ? b.userData.holes.map(h => h.thing?.userData.kind === 'text' ? h.thing.userData.text : h.thing?.userData.kind).join(',') : '';
  const heard = () => ev.userData.pile.map(words).join(' | ');
  let leo = null; for (let i = 0; i < 40; i++) { const t = D.bench(i); if (!t) break; if (t.userData.label === 'Leo') { leo = t; break; } }
  D.clickThing(leo); await frames(D, 30);
  const left = words(ev.userData.pile[0]) === 'left,Leo';
  const heard1 = heard();
  D.clickBench(-1.5, 5.5); await frames(D, 30);
  const arrived = words(ev.userData.pile[0]) === 'arrived,Leo,bird';
  const heard2 = heard();
  // 4. saved with the world: the yard's name and its panel come back
  const rec = JSON.parse(JSON.stringify(D.worldOut()));
  const saved = !!rec.yard?.lid;                      // an empty open panel has no record to keep
  D.worldIn(rec); await slowSettle(D, 1500);
  const back = D.yardNode();
  const kept = back.userData.lid === rec.yard.lid;
  const ok = reported && filtered && opened && gotNest && arrived && left && saved && kept;
  put((ok ? 'PASS' : 'FAIL') + ' the yard is a thing: it reports and it listens  (report=' + reported
      + ' by-name=' + filtered + ' panel=' + opened + ' event-nest=' + gotNest + ' arrived=' + arrived
      + ' left=' + left + ' saved=' + saved + ' kept=' + kept + ' heard=[' + heard1 + '] then [' + heard2 + '])', ok ? 'pass' : 'fail');
  return ok;
}

// AN AIRPLANE THAT FLIES: its turtle and its pilot grouped inside its own
// panel, so SPACE on the airplane flies it and "." lands it (Ken: "another
// one where the behaviors are all local to the object").
async function airplanePilotCheck(D) {
  const w = await (await fetch('../examples/models/✈️ airplane-with-pilot.world.json')).json();
  D.worldIn(w); await slowSettle(D, 2000);
  let plane = null; for (let i = 0; i < 20; i++) { const t = D.bench(i); if (!t) break; if (t.userData.kind === 'model') { plane = t; break; } }
  const p0 = plane.position.clone();
  const started = D.switchBound(plane, true);
  await frames(D, 240);
  const p1 = plane.position.clone();
  const moved = p0.distanceTo(p1) > 0.05;
  const stopped = D.switchBound(plane, false);
  await frames(D, 60);
  const p2 = plane.position.clone();
  await frames(D, 120);
  const still = p2.distanceTo(plane.position) < 0.001;
  const aboard = D.allBots().filter(b => b.name === 'the pilot').length === 1;
  const ok = started && moved && stopped && still && aboard;
  put((ok ? 'PASS' : 'FAIL') + ' an airplane with its pilot aboard  (started=' + started + ' flew='
      + p0.distanceTo(p1).toFixed(2) + 'm stopped=' + stopped + ' lands=' + still + ' pilot-aboard=' + aboard + ')',
      ok ? 'pass' : 'fail');
  return ok;
}

// THE KEEPER'S ROUND: SPACE on a pad in the zoo asks the yard for every
// thing on the grass, one at a time, and gives each ANIMAL a wiggle by mail
// ([bind | behaviour]) -- and lets the welcome sign go by. Seven animals,
// seven wigglers, each bound to its own animal and turning it.
async function zooKeeperCheck(D, win) {
  const w = await (await fetch('../examples/yard/🦓 zoo-keeper.world.json')).json();
  D.worldIn(w); await slowSettle(D, 2000);
  D.clickRaw({ kind: 'yardDoor' }); await slowSettle(D, 2500);
  const grass = () => { const o = []; for (let i = 0; i < 60; i++) { const t = D.bench(i); if (!t) break; o.push(t); } return o; };
  const animals = grass().filter(t => t.userData.kind === 'model');
  const yaw0 = animals.map(t => t.rotation.y);
  let btn = null; for (const t of grass()) if (t.userData.text === 'wiggle the animals') btn = t;
  D.switchGadget(btn, true, true);
  D.speed(8);
  let bound = 0;
  for (let k = 0; k < 40; k++) {
    await frames(D, 60);
    bound = grass().filter(t => t.userData.gadget && t.userData.text === 'wiggle'
      && animals.some(a => a.userData.lid && a.userData.lid === t.userData.boundTo)).length;
    if (bound >= animals.length) break;
  }
  // a wiggle is 25 degrees one round and 25 back the next, so it is sampled
  // over many rounds rather than read once
  // ...and for as long as it takes every animal to show one turn: a panel
  // gets a turn a frame at best, and after thirteen golden worlds in the
  // same tab the frames come slower, so a fixed window read four of seven
  // ...in WALL time: a panel's turns are paced by a wall-clock cooldown, so
  // a thousand frames run in a second give it one turn, and after thirteen
  // golden worlds in the same tab the frames come at a different rate again
  // ...SAMPLED EVERY FRAME. A wiggle flips once a frame here (a panel's
  // round is instant in the suite), and a sample every twenty frames -- an
  // even period -- saw the same side every time: the crocodile read as
  // still for 45 s while its letters arrived as fast as the elephant's
  // (2633 to 2650). Aliasing, not a stuck panel.
  const maxd = animals.map(() => 0);
  // how many letters each animal gets PER FRAME: 0, 1, or 2 and more (two in
  // one frame is a turn and its undoing, invisible)
  const hist = animals.map(() => [0, 0, 0]), lastMsg = animals.map(a => a.__msgN || 0);
  const t0 = performance.now();
  while (performance.now() - t0 < 45000 && maxd.filter(d => d > 0.01).length < animals.length) {
    for (let k = 0; k < 20; k++) {
      D.frame(1, fnow());
      animals.forEach((a, i) => { maxd[i] = Math.max(maxd[i], Math.abs(a.rotation.y - yaw0[i]));
        const d = (a.__msgN || 0) - lastMsg[i]; lastMsg[i] = a.__msgN || 0; hist[i][Math.min(2, d)]++; });
    }
    await breathe();
    await new Promise(r => setTimeout(r, 60));
  }
  D.speed(1);
  const each = animals.map(a => a.userData.lid
    ? grass().filter(t => t.userData.gadget && t.userData.boundTo === a.userData.lid).length : 0);
  const oneEach = each.every(n => n === 1);
  const turned = maxd.filter(d => d > 0.01).length;
  const signSpared = !grass().some(t => t.userData.gadget && t.userData.boundTo
    && grass().some(o => o.userData.lid === t.userData.boundTo && o.userData.kind === 'text'));
  const ok = animals.length === 7 && bound === 7 && oneEach && turned === 7 && signSpared;
  const why = ok ? '' : ' still=[' + animals.map((a, i) => {
    if (maxd[i] > 0.01) return null;
    const wg = grass().find(t => t.userData.gadget && t.userData.boundTo === a.userData.lid);
    const tr = wg?.__panelTray, c = tr?.__ctx;
    const holes = c?.standOcc ? c.standOcc.userData.holes.map(h => h.thing ? (h.thing.userData.kind === 'text' ? 'tick' : h.thing.userData.kind[0]) : '-').join('') : '?';
    const ab = c?.activeBot;
    const states = ab && c.standOcc ? [ab, ...ab.team].map(m => D.matchState(m.condition, D.specOf(c.standOcc))).join('/') : '?';
    return a.userData.label + ':' + holes + ' per-frame[0,1,2+]=' + hist[i].join('/') + ' yaw=' + a.rotation.y.toFixed(3) + ' frames=' + (tr?.__frame ?? '?') + ' dirty=' + tr?.userData?.dirty
      + ' busy=' + c?.busy + ' q=' + (c?.queue?.length ?? '?') + ' cur=' + !!c?.current + ' active=' + ab?.name
      + ' waiting=' + ab?.waiting + ' states=' + states + ' gates=' + JSON.stringify(tr ? D.roomGates(tr) : null)
      + ' sched=' + JSON.stringify(D.sched()) + ' vigil=' + JSON.stringify(D.vigil ? D.vigil() : null)
      + ' guard=' + JSON.stringify(tr ? D.turnGuard(tr) : null)
;
  }).filter(Boolean).join('; ') + ']';
  put((ok ? 'PASS' : 'FAIL') + ' the keeper gives every animal a wiggle  (animals=' + animals.length
      + ' wigglers-bound=' + bound + ' one-each=' + oneEach + ' turning=' + turned
      + ' sign-spared=' + signSpared + why + ')', ok ? 'pass' : 'fail');
  // THE SECOND ROUND (Ken): every wiggle has a face; "." on the keeper rests
  // every wiggle it handed out and SPACE sets them going again; a panel
  // brought out on the grass comes out of its thing, beside it, and folds
  // back into it. Measured in wall time at speed 1, the app's own clock.
  // the suite holds the clock (autoLoop off): waiting is DRIVING frames, 17 ms each
  const sleep = (ms) => frames(D, Math.ceil(ms / 17));
  const wigs = () => grass().filter(t => t.userData.gadget && t.userData.text === 'wiggle');
  const blankFace = (p) => { const m = p.children[0]?.material; const mm = Array.isArray(m) ? m[2] : m;
    const im = mm?.map?.image; return !im || im.width <= 1; };
  await sleep(600);
  const blank = wigs().filter(blankFace).length;
  // every frame, for the same reason as above: a flip a frame aliases
  // against any even sampling period
  const changes = async (ms) => {
    const y = animals.map(a => a.rotation.y), n = animals.map(() => 0);
    for (let t = 0; t < ms; t += 17) { await frames(D, 1);
      animals.forEach((a, i) => { if (Math.abs(a.rotation.y - y[i]) > 0.001) { n[i]++; y[i] = a.rotation.y; } }); }
    return n;
  };
  D.press(btn, '.'); await sleep(400);
  const stopped = wigs().filter(p => p.__panelTray?.userData.stopped).length;
  await sleep(2500);                                   // a round in flight finishes
  const stillTurning = (await changes(2000)).filter(n => n > 0).length;
  D.press(btn, ' '); await sleep(400);
  const going = wigs().filter(p => p.__panelTray?.userData.dirty && !p.__panelTray?.userData.stopped).length;
  // woken and turning again, not a cadence: one turn within five seconds each
  const msg0 = animals.map(a => a.__msgN || 0);
  const again = await changes(5000);
  const turningAgain = again.filter(n => n >= 1).length;
  const stillWhy = turningAgain === 7 ? '' : ' not-again=[' + animals.map((a, i) => {
    if (again[i]) return null;
    const wg = grass().find(t => t.userData.gadget && t.userData.boundTo === a.userData.lid);
    return a.userData.label + ' msgs+' + ((a.__msgN || 0) - msg0[i]) + ' gates=' + JSON.stringify(wg?.__panelTray ? D.roomGates(wg.__panelTray) : null)
      + ' guard=' + JSON.stringify(wg?.__panelTray ? D.turnGuard(wg.__panelTray) : null);
  }).filter(Boolean).join('; ') + ']';
  // out of the hand, beside it, growing; the knob takes it home and hides it
  const gw = wigs().find(p => p.userData.boundTo === animals[1].userData.lid);
  D.hold(gw); await sleep(300);
  const hand = D.handPos();
  win.dispatchEvent(new KeyboardEvent('keydown', { key: 'p', ctrlKey: true, bubbles: true, cancelable: true }));
  await sleep(60);
  const tr = gw.__panelTray;
  const growing = !!tr && tr.visible && tr.scale.x < 0.5;
  await sleep(1200);
  const near = !!tr && Math.hypot(tr.position.x - hand[0], tr.position.z - hand[2]) < 1.4 && Math.abs(tr.scale.x - 1) < 0.01;
  D.place(gw, animals[1].position.x + 0.4, animals[1].position.z + 0.5); await sleep(400);
  D.clickRaw({ kind: 'panelClose', tray: tr }); await sleep(150);
  const goingHome = !!tr && tr.__closed && tr.visible && tr.scale.x < 0.95;
  await sleep(1000);
  const home = !!tr && !tr.visible && Math.abs(tr.scale.x - 1) < 0.01 && tr.userData.dirty;
  const ok2 = blank === 0 && stopped === 7 && stillTurning === 0 && going === 7 && turningAgain === 7
    && growing && near && goingHome && home;
  put((ok2 ? 'PASS' : 'FAIL') + ' the keeper rests and wakes what it handed out, and a panel on the grass comes out of its thing  (blank-faces=' + blank
      + ' rested=' + stopped + ' still-turning=' + stillTurning + ' woken=' + going + ' turning-again=' + turningAgain
      + ' grows-from-hand=' + growing + ' beside-hand=' + near + ' folds-home=' + goingHome + ' hidden-working=' + home + stillWhy + ')', ok2 ? 'pass' : 'fail');
  return ok && ok2;
}

// A BEHAVIOUR IN HAND IS SWITCHED, NOT WRITTEN ON (Ken clicked "the guests"
// -- which picks it up -- and pressed SPACE; the key went into its name).
// Also from that round: a box's tip starts with its name, a house's tip says
// its name, its walls and how to switch it, the lever stands on the front
// beside the door, the Read button speaks once, and a pad's hand-wrapped
// lines are read as one sentence.
async function heldSwitchCheck(D, win) {
  const w = await (await fetch('../examples/infinity/🏨 resort-infinity.world.json')).json();
  D.worldIn(w); await slowSettle(D, 2000);
  D.clickRaw({ kind: 'yardDoor' }); await slowSettle(D, 2500);
  const grass = () => { const o = []; for (let i = 0; i < 80; i++) { const t = D.bench(i); if (!t) break; o.push(t); } return o; };
  const guests = grass().find(t => t.userData.text === 'the guests');
  const desk = grass().find(t => t.userData.kind === 'box');
  const nest = desk && desk.userData.holes.map(h => h.thing).find(t => t?.userData.kind === 'nest');
  D.hold(guests); await frames(D, 20);
  win.document.activeElement && win.document.activeElement.blur();
  win.dispatchEvent(new KeyboardEvent('keydown', { key: ' ', bubbles: true, cancelable: true }));
  await frames(D, 20);
  const nameKept = guests.userData.text === 'the guests';
  const setDown = D.state.hand == null && !!guests.parent;
  const switched = !!guests.__panelTray?.userData.dirty;
  let pile = 0;
  for (let k = 0; k < 60 && pile < 6; k++) { await frames(D, 30); pile = nest?.userData.pile?.length ?? 0; }
  const pads = grass().filter(t => t.userData.kind === 'text' && !t.userData.gadget).map(t => t.userData.text || '');
  const fits = pads.every(t => t.length <= 600) && pads.some(t => t.startsWith('PROBLEM 1')) && pads.some(t => t.startsWith('HOW TO TRAIN'));
  // read aloud once, in one breath: the hint reader is told the words were said
  const spoken = D.spoken('THE ROW GOES ON\n\nEleven cottages wait at the\ngate.\n\nThat row goes on.');
  const oneBreath = spoken === 'THE ROW GOES ON. Eleven cottages wait at the gate. That row goes on.';
  // a box says its name, a house says what it is, the lever is on the front
  const w2 = await (await fetch('../examples/infinity/♾️ activity8-counting-sequences.world.json')).json();
  D.worldIn(w2); await slowSettle(D, 2000);
  const seq1 = grass().find(t => t.userData.kind === 'box' && t.userData.holes[0]?.thing?.userData.label === 'Sequence 1');
  const boxNamed = !!seq1 && D.tip(seq1).startsWith('A box with 2 holes, holding a nest \u201cSequence 1\u201d, a bird \u201cmore\u201d');
  const numbers = grass().find(t => t.userData.kind === 'room' && t.userData.label === 'Numbers');
  const tip0 = numbers ? D.tip(numbers) : '';
  D.clickRaw({ kind: 'roomLever', room: numbers }); await frames(D, 5);
  const tip1 = numbers ? D.tip(numbers) : '';
  const houseTip = tip0.startsWith('\u201cNumbers\u201d') && tip0.includes('glass walls') && tip0.includes('It is stopped')
    && tip1.includes('It is running') && tip0.includes('Click the roof for solid walls');
  const lever = numbers?.__lever?.parent;
  const leverFront = !!lever && lever.position.z > 0.2 && Math.abs(lever.position.x) < 0.25;
  const ok = nameKept && setDown && switched && pile >= 6 && fits && oneBreath && boxNamed && houseTip && leverFront;
  put((ok ? 'PASS' : 'FAIL') + ' a behaviour in hand is switched, and things say what they are  (name-kept=' + nameKept
      + ' set-down=' + setDown + ' switched=' + switched + ' letters=' + pile + ' pads-fit=' + fits + ' one-breath=' + oneBreath
      + ' box-named=' + boxNamed + ' house-tip=' + houseTip + ' lever-front=' + leverFront
      + (boxNamed ? '' : ' box-tip=' + JSON.stringify(seq1 ? D.tip(seq1) : null) + ' boxes=' + JSON.stringify(grass().filter(t => t.userData.kind === 'box').map(t => [t.userData.label ?? null, t.userData.name ?? null]))) + ')', ok ? 'pass' : 'fail');
  return ok;
}

// ACTIVITY 8 ON DEMAND: a sequence room sends a term only when the diagonal
// team asks for one, so the levers can be pulled before the boxes are handed
// over (the order Ken tried) and no tower of terms ever forms. The diagonal
// of 1,2,3,4 / 1,3,5,7 / 1,2,4,8 reads 1, 3, 4.
async function diagonalCheck(D) {
  const w = await (await fetch('../examples/infinity/♾️ activity8-counting-sequences.world.json')).json();
  D.worldIn(w); await slowSettle(D, 2000);
  const things = () => { const o = []; for (let i = 0; i < 40; i++) { const t = D.bench(i); if (!t) break; o.push(t); } return o; };
  const rooms = things().filter(t => t.userData.kind === 'room');
  const nestsNamed = () => { const o = []; for (const t of things()) t.traverse(x => { if (x.userData?.kind === 'nest') o.push(x); }); return o; };
  let maxSeqPile = 0;
  const watch = () => { for (const n of nestsNamed()) if (/^Sequence/.test(n.userData.label || '')) maxSeqPile = Math.max(maxSeqPile, n.userData.pile?.length ?? 0); };
  // levers FIRST -- the order that used to grow towers
  for (const name of ['Numbers', 'Odd Numbers', 'Doubling']) {
    const r = rooms.find(t => t.userData.label === name);
    D.clickRaw({ kind: 'roomLever', room: r });
  }
  D.speed('instant');
  for (let k = 0; k < 120; k++) { await frames(D, 1); watch(); }
  const quiet = maxSeqPile;                       // nothing asked for, nothing made
  // then the boxes, one by one, to the All Sequences bird
  const bird = things().find(t => t.userData.kind === 'bird' && t.userData.label === 'All Sequences');
  for (const nm of ['Sequence 1', 'Sequence 2', 'Sequence 3']) {
    const bx = things().find(t => t.userData.kind === 'box' && t.userData.holes[0]?.thing?.userData.label === nm);
    D.hold(bx); await frames(D, 10);
    D.clickThing(bird); await frames(D, 30);
  }
  const diag = things().find(t => t.userData.kind === 'nest' && t.userData.label === 'the diagonal');
  for (let k = 0; k < 900 && (diag.userData.pile?.length ?? 0) < 3; k++) { await frames(D, 1); watch(); }
  for (let k = 0; k < 60; k++) { await frames(D, 1); watch(); }
  D.speed(1);
  const vals = (diag.userData.pile || []).map(t => t.userData.value ? Number(t.userData.value.n) / Number(t.userData.value.d) : NaN);
  const got = vals.slice().reverse().join(',');   // the pile is newest first
  const ok = quiet === 0 && got === '1,3,4' && maxSeqPile <= 2;
  put((ok ? 'PASS' : 'FAIL') + ' the diagonal, with the rooms answering only when asked  (before-asking=' + quiet
      + ' diagonal=' + got + ' tallest-sequence-pile=' + maxSeqPile + ')', ok ? 'pass' : 'fail');
  return ok;
}

// RESORT INFINITY, GUESTS THAT WALK. Eleven cottages stand in a fixed row;
// the guests are pads at the gate. Problem 1: the trained clerk houses the
// six guests at cottages 1 to 6, guest 1 FIRST (the courier's own letter used
// to land after its companions). Problem 2: the mover joins the clerk, the
// bell moves everybody five along, and five more guests take cottages 1 to
// 5 -- eleven guests, eleven distinct cottages. A [set | position] on the
// grass glides rather than jumps.
async function resortCheck(D, win) {
  const w = await (await fetch('../examples/infinity/🏨 resort-infinity.world.json')).json();
  D.worldIn(w); await slowSettle(D, 2000);
  D.clickRaw({ kind: 'yardDoor' }); await slowSettle(D, 2500);
  const grass = () => { const o = []; for (let i = 0; i < 90; i++) { const t = D.bench(i); if (!t) break; o.push(t); } return o; };
  const guests = grass().filter(t => t.userData.kind === 'model' && /^(new )?guest \d/.test(t.userData.label || ''));
  const cottages = grass().filter(t => t.userData.kind === 'room' && /^cottage/.test(t.userData.label || ''));
  const find = (k, lbl) => grass().find(t => t.userData.kind === k && (t.userData.label || t.userData.text || '') === lbl);
  const toDesk = find('bird', 'to the front desk'), toOffice = find('bird', 'to the moving office');
  const fd = find('room', 'the front desk'), mo = find('room', 'the moving office');
  const bots = D.benchBots();
  const addr = bots.find(b => /address/i.test(b.__bot?.name || '')), mover = bots.find(b => /move up/i.test(b.__bot?.name || ''));
  const cottageX = (n) => n * 0.6 - 4.5;
  const atCottage = (g, n) => Math.abs(g.position.x - cottageX(n)) < 0.05 && Math.abs(g.position.z - 5.2) < 0.05;
  // THE ORIGINAL'S SHAPE: a robot on a plain letter, given to a bird; the
  // shipped answers are such robots, and the two houses are the machinery
  const shape = !!toDesk && !!toOffice && !!fd && !!mo && addr.__bot.program.length === 2
    && JSON.stringify(addr.__bot.condition) === JSON.stringify({ kind: 'box', holes: [{ kind: 'wildNumber' }, { kind: 'anyBird' }] });
  D.speed('instant');
  const macro1 = grass().find(t => t.userData.text === 'the guests');
  D.switchGadget(macro1, true, true);
  const post = fd.__ctx.standOcc.userData.holes[0].thing;
  for (let k = 0; k < 300 && (post.userData.pile || []).length < 6; k++) await frames(D, 1);
  // the letters land together, oldest on top: guest 1's
  const order = (post.userData.pile || []).slice().reverse().map(b => String(b.userData.holes?.[0]?.thing?.userData?.value?.n ?? '?')).join(',');
  D.hold(addr); await frames(D, 5); D.clickThing(toDesk); await frames(D, 30);
  const walked = [];
  for (let k = 0; k < 4000 && walked.length < 6; k++) {
    await frames(D, 1);
    guests.slice(0, 6).forEach((g, i) => { if (!walked.includes(i + 1) && atCottage(g, i + 1)) walked.push(i + 1); });
  }
  const housed1 = guests.slice(0, 6).every((g, i) => atCottage(g, i + 1));
  const firstWalk = walked[0] === 1;
  const taken = fd.__ctx.standOcc.userData.holes[2].thing?.userData.kind === 'robot' && fd.__ctx.standOcc.userData.holes[1].thing.userData.pile.length === 0;
  // problem 2: the mover to the office, which rings the bell itself
  D.hold(mover); await frames(D, 5); D.clickThing(toOffice); await frames(D, 30);
  for (let k = 0; k < 6000 && !guests.slice(0, 6).every((g, i) => atCottage(g, i + 6)); k++) await frames(D, 1);
  const movedUp = guests.slice(0, 6).every((g, i) => atCottage(g, i + 6));
  const macro2 = grass().find(t => t.userData.text === 'five more guests');
  D.switchGadget(macro2, true, true);
  let midway = false;
  for (let k = 0; k < 6000 && !guests.slice(6).every((g, i) => atCottage(g, i + 1)); k++) {
    await frames(D, 1);
    if (!midway) midway = guests.slice(6).some(g => g.position.z > 5.4 && g.position.z < 7.2);
  }
  const newcomers = guests.slice(6).every((g, i) => atCottage(g, i + 1));
  const xs = guests.map(g => Math.round(g.position.x * 100));
  const distinct = new Set(xs).size === 11;
  // the runner houses have folded away, and nothing of the machinery is on the grass
  let left = 0; fd.__ctx.root.traverse(o => { if (o !== fd && o.userData?.kind === 'room') left++; });
  const grassRooms = grass().filter(t => t.userData.kind === 'room' && !t.__owner).length;   // houses, not the guests' folded trays
  const tidy = left === 0 && grassRooms === 16;   // 14 cottages (three in the mist) and the two desks
  D.speed(1);
  const mist = grass().find(t => t.userData.kind === 'model' && t.userData.label === 'the mist');
  const misty = !!mist && mist.userData.ghost === true && mist.userData.stuck === true && mist.userData.parts.every(pt => pt.opacity < 0.5)
    && cottages.filter(c => c.position.x > 2.4).length === 3;          // 12, 13 and 14 stand in it
  const ok = cottages.length === 14 && misty && guests.length === 11 && shape && order === '1,2,3,4,5,6' && housed1 && firstWalk
    && taken && movedUp && newcomers && distinct && midway && tidy;
  put((ok ? 'PASS' : 'FAIL') + ' Resort Infinity: the guests walk, guest 1 first, and eleven find eleven cottages  (cottages=' + cottages.length
      + ' guests=' + guests.length + ' original-shape=' + shape + ' letters=' + order + ' housed-1-to-6=' + housed1 + ' first-to-walk=' + walked[0]
      + ' robot-taken-in=' + taken + ' moved-up-five=' + movedUp + ' newcomers-1-to-5=' + newcomers + ' distinct=' + distinct + ' glides=' + midway
      + ' tidy=' + tidy + ' runners-left=' + left + ' grass-rooms=' + grassRooms + ' mist-over-12-and-up=' + misty + ')', ok ? 'pass' : 'fail');
  return ok;
}

// A BIRD TO THE COMPUTER: three letters answered, the rest refused with the
// list; a number told its value; the timer built from one robot climbs and
// rests on "."; and the year puzzle's judge, which asks the computer what
// year it is, refuses last year and accepts this one.
async function computerCheck(D) {
  const things = () => { const o = []; for (let i = 0; i < 80; i++) { const t = D.bench(i); if (!t) break; o.push(t); } return o; };
  const numOf = (t) => t?.userData?.kind === 'number' ? Number(t.userData.value.n) / Number(t.userData.value.d) : NaN;
  let w = await (await fetch('../examples/devices/🖥️ computer.world.json')).json();
  D.worldIn(w); await slowSettle(D, 2000);
  const answers = things().find(t => t.userData.kind === 'nest');
  const ask = (what) => D.post('COMPUTER', { kind: 'box', holes: [{ kind: 'text', text: 'query' }, { kind: 'text', text: what },
    { kind: 'bird', nestId: 9811, nestGuid: 'computer-answers' }] });
  ask('time'); await frames(D, 60);
  const t1 = numOf(answers.userData.pile?.[0]);
  ask('date'); await frames(D, 60);
  const date = answers.userData.pile?.[0];
  const now = new Date();
  const dateOK = date?.userData.kind === 'box' && numOf(date.userData.holes[0].thing) === now.getFullYear()
    && numOf(date.userData.holes[1].thing) === now.getMonth() + 1 && numOf(date.userData.holes[2].thing) === now.getDate();
  ask('clock'); await frames(D, 60);
  const clock = answers.userData.pile?.[0];
  const clockOK = clock?.userData.kind === 'box' && clock.userData.holes.length === 3 && numOf(clock.userData.holes[0].thing) === new Date().getHours();
  const before = answers.userData.pile.length;
  ask('weather'); await frames(D, 30);
  const refused = answers.userData.pile.length === before;
  const timeOK = Number.isFinite(t1) && t1 >= 0;
  // the timer
  w = await (await fetch('../examples/devices/⏱️ timer.world.json')).json();
  D.worldIn(w); await slowSettle(D, 2000);
  const num = things().find(t => t.userData.kind === 'number');
  D.post('TIMER1', { kind: 'box', holes: [{ kind: 'text', text: 'set' }, { kind: 'text', text: 'value' }, { kind: 'number', value: { n: '42', d: '1' } }] });
  await frames(D, 10);
  const told = numOf(num) === 42;
  // the timer is the number's OWN panel now: SPACE on the number starts it
  D.switchBound(num, true);
  const v0 = numOf(num);
  await frames(D, 240);
  const v1 = numOf(num);
  const climbs = v1 > v0 && v1 > 42;
  D.switchBound(num, false); await frames(D, 60);
  const v2 = numOf(num); await frames(D, 120);
  const rests = numOf(num) === v2;
  // the year puzzle
  const year = now.getFullYear();
  const play = async (answer) => {
    const pw = await (await fetch('../examples/puzzles/p12.world.json')).json();
    pw.bench.push({ thing: { kind: 'number', value: { n: String(answer), d: '1' } }, x: 1.4, z: 2.2 });
    D.worldIn(pw); await slowSettle(D, 2000);
    D.speed('instant');
    const n = things().find(t => t.userData.kind === 'number' && !t.userData.fixed && String(t.userData.value.n) === String(answer));
    const bird = things().find(t => t.userData.kind === 'bird' && t.userData.label === 'give me your answer');
    const reply = things().find(t => t.userData.kind === 'nest' && t.userData.label === 'from the judge');
    D.hold(n); await frames(D, 10); D.clickThing(bird);
    for (let k = 0; k < 900 && !(reply.userData.pile || []).length; k++) await frames(D, 1);
    await frames(D, 60);
    D.speed(1);
    return { pile: (reply.userData.pile || []).map(t => t.userData.kind === 'number' ? String(t.userData.value.n) : t.userData.kind), next: D.nextWorld };
  };
  const wrong = await play(year - 1);
  const right = await play(year);
  const wrongOK = wrong.pile.includes(String(year - 1)) && wrong.pile.includes('text') && !wrong.next;
  const rightOK = right.pile.length === 1 && right.pile[0] === 'text' && right.next === 'p13';
  const ok = timeOK && dateOK && clockOK && refused && told && climbs && rests && wrongOK && rightOK;
  put((ok ? 'PASS' : 'FAIL') + ' a bird to the computer, a timer from robots, and the year puzzle  (time=' + timeOK + ' date=' + dateOK
      + ' clock=' + clockOK + ' refuses-weather=' + refused + ' told-42=' + told + ' timer-climbs=' + climbs + ' rests-on-dot=' + rests
      + ' last-year-refused=' + wrongOK + ' this-year-accepted=' + rightOK + ')', ok ? 'pass' : 'fail');
  return ok;
}

// THE PERCH. Ken: "a user should be able to test such a robot without
// entering a panel by placing any bird on that pedestal." Inside the timer's
// panel the perch holds a bird to "my thing" -- the number -- and another is
// there the moment she is taken; on the bench the timer's second robot is
// refused when the perch is empty, and with a bird of your own there its
// [set | value | 5] lands on her nest.
async function perchCheck(D) {
  const things = () => { const o = []; for (let i = 0; i < 80; i++) { const t = D.bench(i); if (!t) break; o.push(t); } return o; };
  const numOf = (t) => t?.userData?.kind === 'number' ? Number(t.userData.value.n) / Number(t.userData.value.d) : NaN;
  const J = (o) => JSON.stringify(o);
  const hint = () => D.doc.getElementById('hint').textContent;
  const w = await (await fetch('../examples/devices/⏱️ timer.world.json')).json();
  D.worldIn(JSON.parse(J(w))); await slowSettle(D, 2000);
  const num = things().find(t => t.userData.kind === 'number');
  D.switchBound(num, true); await frames(D, 20);     // its panel comes out to work
  D.switchBound(num, false); await frames(D, 20);
  const tray = num.__panelTray;
  D.clickRaw({ kind: 'roomDoor', room: tray }); await slowSettle(D, 4000);
  const p1 = D.perch();
  const fixture = p1.occ === 'bird' && p1.liveId === 'MYTHING' && p1.myThing === 'stopwatch';
  const tipOK = /perch/.test(D.tipStation('perch') || '') && /my thing/.test(D.tip(D.at('perch')) || '');
  D.clickStation('perch'); await frames(D, 20);       // take her: another is there
  const p2 = D.perch();
  const refilled = p2.occ === 'bird' && p2.liveId === 'MYTHING';
  D.clickStation('perch'); await frames(D, 20);       // give her back
  const back = /Back on the perch/.test(hint());
  D.clickRaw({ kind: 'exitDoor' }); await slowSettle(D, 4000);
  const p3 = D.perch();
  const emptyOut = p3.occ === null && p3.myThing === null;
  // the timer's second robot on the bench, given a reading and the go pad in hole 7
  const pw = w.bench[0].thing.panel;
  // the stopwatch's team is Started, Ask, Zero, Tell: the teller is last
  const tell = JSON.parse(J(pw.active.team[2])); tell.team = [];
  const work = JSON.parse(J(pw.stations.stand));
  work.holes[1].pile = [{ kind: 'number', value: { n: '5', d: '1' } }];
  work.holes[5] = null; work.holes[6] = { kind: 'text', text: 'go' };
  work.holes[7] = { kind: 'number', value: { n: '0', d: '1' }, op: '+' };    // a start of 0: it tells the reading itself
  const bw = { kind: 'world', v: pw.v ?? 3,
    bench: [{ thing: { kind: 'nest', id: 7001, guid: 'perch-test', hasEgg: false, pile: [], label: 'mine' }, x: 1.2, z: 2.0 },
            { thing: { kind: 'bird', nestId: 7001, nestGuid: 'perch-test', label: 'my bird' }, x: 1.6, z: 2.0 }],
    stations: { stand: work }, active: tell };
  D.worldIn(JSON.parse(J(bw))); await slowSettle(D, 2500);
  D.speed('instant');
  D.doc.getElementById('runBtn').click(); await slowSettle(D, 4000);
  let nest = things().find(t => t.userData.kind === 'nest');
  const refused = (nest?.userData.pile.length ?? -1) === 0 && /no bird on the perch/.test(hint());
  D.speed(1);
  D.worldIn(JSON.parse(J(bw))); await slowSettle(D, 2500);
  D.speed('instant');
  const bird = things().find(t => t.userData.kind === 'bird');
  D.hold(bird); await frames(D, 10);
  D.clickStation('perch'); await frames(D, 30);
  const set = D.perch().label === 'my bird';
  D.doc.getElementById('runBtn').click(); await slowSettle(D, 5000);
  nest = things().find(t => t.userData.kind === 'nest');
  const top = nest?.userData.pile[nest.userData.pile.length - 1];
  const told = nest?.userData.pile.length === 1 && top?.userData.kind === 'box' && numOf(top.userData.holes[2]?.thing) === 5;
  D.speed(1);
  const ok = fixture && tipOK && refilled && back && emptyOut && refused && set && told;
  put((ok ? 'PASS' : 'FAIL') + ' the perch: a bird to my thing on a panel, any bird on the bench  (fixture=' + fixture
      + ' tips=' + tipOK + ' another-when-taken=' + refilled + ' back=' + back + ' empty-outside=' + emptyOut
      + ' empty-perch-refused=' + refused + ' my-bird-set=' + set + ' told-5=' + told + ')', ok ? 'pass' : 'fail');
  return ok;
}

// A ROBOT TEACHES ROBOTS TO WRITE TO THE PERCH. meta/telling: the teacher
// trains Tell to put a reading in a [set | value | _] letter and give it to
// the bird on the perch -- for real, so the letter lands on "what it told".
// meta/timer-teacher: it trains Ask (which really asks the computer) and
// Tell, one after the other, each on a box in the state that robot works in.
async function metaTeachCheck(D) {
  const things = () => { const o = []; for (let i = 0; i < 80; i++) { const t = D.bench(i); if (!t) break; o.push(t); } return o; };
  const numOf = (t) => t?.userData?.kind === 'number' ? Number(t.userData.value.n) / Number(t.userData.value.d) : NaN;
  const load = async (name) => {
    const w = await (await fetch('../examples/meta/' + name + '.world.json')).json();
    D.worldIn(w); await slowSettle(D, 2000);
    D.speed('instant');
    const bx = things().find(t => t.userData.kind === 'box');
    D.hold(bx); await frames(D, 5); D.giveRobot(); await slowSettle(D, 40000);
  };
  const botsNow = () => {
    const o = {};
    let r = D.mine(); while (r && r.parent) r = r.parent;
    r?.traverse(n => { if (n.__bot?.stand && n.__bot.name) o[n.__bot.name] = n.__bot; });
    return o;
  };
  const steps = (b) => (b?.program || []).map(s2 => s2.type + (s2.at ? ':' + s2.at.c + (s2.at.path?.length ? '.' + s2.at.path.join('.') : '') : '')).join(',');
  const toldOK = () => {
    const told = things().find(t => t.userData.kind === 'nest');
    const top = told?.userData.pile[0];
    return told?.userData.pile.length === 1 && top?.userData.kind === 'box' && numOf(top.userData.holes[2]?.thing) === 5;
  };
  await load('🎓 telling');
  const ran1 = D.state.mode === 'world' && D.roundsNow().runCount === 1;
  let bots = botsNow();
  const tellTaught = steps(bots.Tell) === 'copy:given.1,put:s0,take:given.0,put:s0.2,take:s0,put:perch';
  const told1 = toldOK();
  D.speed(1);
  await load('🎓 timer-teacher');
  const ran2 = D.state.mode === 'world' && D.roundsNow().runCount === 1;
  // THE STOPWATCH: the teacher taught the four robots of devices/timer, step for step
  const tw = await (await fetch('../examples/devices/⏱️ timer.world.json')).json();
  const want = [tw.bench[0].thing.panel.active, ...tw.bench[0].thing.panel.active.team];   // Started, Ask, Zero, Tell
  const stepsOf = (b) => (b?.program || []).map(s2 => s2.type + (s2.at ? ':' + s2.at.c + (s2.at.path?.length ? '.' + s2.at.path.join('.') : '') + (s2.at.nest ? '^' : '') : '')).join(',');
  const num = D.mine([9]);
  const tray = num?.__panelTray;
  const c = tray?.__ctx;
  const got = c ? [c.activeBot, ...(c.activeBot?.team ?? [])] : [];
  const taughtAll = got.length === 4 && got.every((b, i2) => b.name === want[i2].name && stepsOf(b) === stepsOf(want[i2]));
  const askTaught = taughtAll, tellTaught2 = taughtAll;
  // Ask's box went back into hole 5 after Ask really asked: an answer on its nest, the token in hole 7
  const askBox = D.mine([4]);
  const asked = Number.isFinite(numOf(askBox?.userData.holes[1]?.thing?.userData.pile?.[0]))
    && !!askBox?.userData.holes[6]?.thing?.userData.text && !askBox?.userData.holes[5]?.thing;
  // Zero told 3 and Tell told 1000 during their lessons, by the bird on the perch
  const toldPile = (things().find(t => t.userData.kind === 'nest')?.userData.pile ?? []);
  const toldVals = toldPile.filter(t => t.userData.kind === 'box' && t.userData.holes[0]?.thing?.userData.text === 'set').map(t => numOf(t.userData.holes[2]?.thing));
  const told2 = toldVals.includes(3) && toldVals.includes(1000);
  const built = !!c && c.standOcc?.userData.kind === 'box' && D.sched().stands === 1;       // no desk left aside
  const builtWhy = JSON.stringify({ ctx: !!c, got: got.map(b => b.name + ':' + (b.program?.length ?? '?')), conds: got.map(b => (b.condition?.holes || []).map(h => h ? h.kind + (h.text ? ':' + h.text : '') : '_').join(' ')), extra: got.map((b, i2) => stepsOf(b).replace(stepsOf(want[i2]), '*')), stand: c?.standOcc?.userData.kind ?? null,
    waiters: c?.waiters?.length ?? null, stands: D.sched().stands, told: toldVals });
  D.hold(num); await frames(D, 5); D.clickBench(0.9, 1.0); await slowSettle(D, 2000);
  D.switchBound(num, true);
  await frames(D, 30);
  const v0 = numOf(num);
  await frames(D, 240);
  const v1 = numOf(num);
  const climbs = v1 > v0 && v0 < 5000;          // from about zero, not from the workshop's clock
  const holesNow = JSON.stringify(c?.standOcc?.userData.holes.map(h => h.thing ? (h.thing.userData.kind === 'nest' ? 'nest[' + h.thing.userData.pile.map(t => t.userData.text ?? String(t.userData.value?.n)).join('/') + ']' : h.thing.userData.kind === 'number' ? String(h.thing.userData.value.n) : h.thing.userData.text ?? h.thing.userData.kind) : '-'));
  const statesNow = got.map(b => b.name + '=' + D.matchState(b.condition, D.specOf(c.standOcc))).join(' ');
  D.switchBound(num, false); await frames(D, 60);
  const v2 = numOf(num); await frames(D, 120);
  const rests = numOf(num) === v2;
  D.speed(1);
  const ok = ran1 && tellTaught && told1 && ran2 && taughtAll && asked && told2 && built && climbs && rests;
  put((ok ? 'PASS' : 'FAIL') + ' a robot teaches robots to write to the perch  (telling: ran-once=' + ran1 + ' tell-taught=' + tellTaught
      + ' told-5=' + told1 + '; timer-teacher: ran-once=' + ran2 + ' four-taught=' + taughtAll
      + ' ask-really-asked=' + asked + ' told-3-and-1000=' + told2 + ' stopwatch-built=' + built + (built && taughtAll ? '' : ' ' + builtWhy) + ' climbs-from-zero=' + climbs + ' v0=' + v0 + ' v1=' + v1 + (climbs ? '' : ' holes=' + holesNow + ' states=' + statesNow + ' dirty=' + tray?.userData.dirty + ' gates=' + JSON.stringify(D.roomGates(tray))) + ' rests=' + rests + ')', ok ? 'pass' : 'fail');
  return ok;
}

// A LESSON WAITING. Ken dropped a box on a number's panel, then a fresh
// robot, went in and copied a letter, gave it to the bird on the perch, and
// dropped a 1 on the number -- and only the last was learned. Entering a
// panel whose robot is untrained, with a thing on its desk, begins the
// lesson; the copier, the perch and the number stack are all learned.
async function lessonWaitingCheck(D) {
  const things = () => { const o = []; for (let i = 0; i < 80; i++) { const t = D.bench(i); if (!t) break; o.push(t); } return o; };
  const steps = () => D.activeProgram().map(s2 => s2.type + (s2.at ? ':' + s2.at.c + (s2.at.path?.length ? '.' + s2.at.path.join('.') : '') : '')).join(',');
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [
    { thing: { kind: 'number', value: { n: '0', d: '1' }, label: 'count' }, x: -0.4, z: 1.6 },
    { thing: { kind: 'box', holes: [{ kind: 'box', holes: [{ kind: 'text', text: 'set' }, { kind: 'text', text: 'value' }, { kind: 'number', value: { n: '7', d: '1' } }] }, { kind: 'number', value: { n: '3', d: '1' } }] }, x: 0.5, z: 1.7 },
    { thing: { kind: 'robot', name: 'fresh', program: [], team: [] }, x: 1.2, z: 1.5 } ] });
  await slowSettle(D, 2000);
  const num = things().find(t => t.userData.kind === 'number');
  const box = things().find(t => t.userData.kind === 'box');
  const bot = things().find(t => t.userData.kind === 'robot');
  const tray = D.panelOut(num); await slowSettle(D, 2000);
  D.hold(box); D.clickThing(tray); await slowSettle(D, 3000);
  D.hold(bot); D.clickThing(tray); await slowSettle(D, 3000);
  const waiting = /go in to train it/.test(D.doc.getElementById('hint').textContent);
  D.clickRaw({ kind: 'roomDoor', room: tray }); await slowSettle(D, 4000);
  const lesson = D.state.mode === 'training' && D.doc.getElementById('exitBtn').style.display !== 'none';
  D.clickThing(D.mine([0])); await slowSettle(D, 4000);
  D.clickRaw({ kind: 'station', id: 'copyIn' }); await slowSettle(D, 6000);
  D.clickRaw({ kind: 'station', id: 'copyOut' }); await slowSettle(D, 4000);
  D.clickStation('perch'); await slowSettle(D, 4000);
  const toldInDream = String(num.userData.value.n) === '7';
  D.click('numbers'); await slowSettle(D, 4000);
  D.clickThing(D.mine([1])); await slowSettle(D, 4000);
  const learned = steps() === 'take:given.0,put:in,take:out,put:perch,newNumber,put:given.1';
  D.exit(); await slowSettle(D, 3000);
  const rewound = D.state.mode === 'world' && String(num.userData.value.n) === '0' && String(D.mine([1])?.userData.value.n) === '3';
  D.speed('inf');
  D.rounds(1); D.run(); await slowSettle(D, 30000);
  const ran = String(num.userData.value.n) === '7' && String(D.mine([1])?.userData.value.n) === '4';
  D.rounds(ROUNDS); D.speed(1);
  D.clickRaw({ kind: 'exitDoor' }); await slowSettle(D, 4000);
  const out = D.worldsDeep() === 0;
  const ok = waiting && lesson && toldInDream && learned && rewound && ran && out;
  put((ok ? 'PASS' : 'FAIL') + ' a lesson waiting on a panel begins on entering  (drop-says-train=' + waiting + ' lesson-on-entering=' + lesson
      + ' perch-tells-in-dream=' + toldInDream + ' learned=' + learned + ' rewound=' + rewound + ' ran=' + ran + ' back-out=' + out + ')', ok ? 'pass' : 'fail');
  return ok;
}

// THE LITTLE ROBOT IT TAUGHT STAYS AMONG ITS THINGS. By hand: a teacher is
// given [a little robot | a box with a 1 | a number]; it teaches the pupil to
// drop a fresh 1 on the count, stops teaching, takes the number's panel out,
// takes the pupil's box and the pupil off the pupil's desk and sets them on
// the panel, folds it, and leaves the thought. The dream rewinds the pupil to
// its hole; the run does it all for real, and the number counts.
async function taughtBackCheck(D) {
  const num = (n) => ({ kind: 'number', value: { n: String(n), d: '1' }, op: '+' });
  const things = () => { const o = []; for (let i = 0; i < 80; i++) { const t = D.bench(i); if (!t) break; o.push(t); } return o; };
  const steps = () => D.activeProgram().map(s2 => s2.type + (s2.at ? ':' + s2.at.c + (s2.at.path?.length ? '.' + s2.at.path.join('.') : '') + (s2.at.bot ? '!' : '') : '') + (s2.step ? '>' + s2.step.type : '')).join(',');
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [
    { thing: { kind: 'robot', name: 'the teacher', program: [], team: [] }, x: -1.2, z: 1.4 },
    { thing: { kind: 'box', holes: [{ kind: 'robot', name: 'the pupil', program: [], team: [] }, { kind: 'box', holes: [num(1)] }, Object.assign(num(0), { label: 'count' })] }, x: 0.2, z: 1.6 } ] });
  await slowSettle(D, 2000);
  D.hold(D.bench(1)); D.giveRobot(); await slowSettle(D, 2500);
  D.teach({ type: 'take', at: { c: 'given', path: [1] } }); await slowSettle(D, 2500);
  const pupil = D.mine([0])?.__bot;
  D.clickRaw({ kind: 'botThing', bot: pupil }); await slowSettle(D, 4000);
  D.teach({ type: 'newNumber' }); await slowSettle(D, 2500);
  D.teach({ type: 'put', at: { c: 'given', path: [0] } }); await slowSettle(D, 2500);
  D.doc.getElementById('exitBtn').click(); await slowSettle(D, 2000);   // "Stop teaching it"
  D.teach({ type: 'take', at: { c: 'given', path: [2] } }); await slowSettle(D, 2500);
  D.teach({ type: 'panel' }); await slowSettle(D, 2500);
  D.teach({ type: 'put', at: { c: 'given', path: [2] } }); await slowSettle(D, 2500);
  // the pupil's box, then the pupil, by clicking them where they stand
  D.clickThing(pupil.stand?.occupant); await slowSettle(D, 3000);
  D.clickRaw({ kind: 'station', id: 's0' }); await slowSettle(D, 3000);
  const boxTaken = pupil.stand?.occupant == null && !!D.at('s0')?.userData.panel;
  D.clickRaw({ kind: 'botThing', bot: pupil }); await slowSettle(D, 3000);
  const pupilTaken = D.queueInfo().clawHeld === 'robot' && D.sched().stands === 1;   // its desk went with it
  D.clickRaw({ kind: 'station', id: 's0' }); await slowSettle(D, 3000);
  D.teach({ type: 'fold', at: { c: 's0', path: [] } }); await slowSettle(D, 3000);
  const taught = steps() === 'take:given.1,teach:given.0,taught>newNumber,taught>put,endTeach,take:given.2,panel,put:given.2,take:t1,put:s0,take:t1!,put:s0,fold:s0';
  D.exit(); await slowSettle(D, 3000);
  const given = D.mine();
  const p0 = given?.userData.holes[0]?.thing?.__bot;
  const rewound = D.state.mode === 'world' && p0?.name === 'the pupil' && p0.program.length === 0
    && given?.userData.holes[1]?.thing?.userData.kind === 'box' && D.sched().stands === 1;
  const rewoundWhy = JSON.stringify({ mode: D.state.mode, h0: given?.userData.holes[0]?.thing?.userData.kind ?? null, p0: p0 ? { name: p0.name, steps: p0.program.length } : null,
    h1: given?.userData.holes[1]?.thing?.userData.kind ?? null, h2: given?.userData.holes[2]?.thing?.userData.kind ?? null, stands: D.sched().stands, s0: D.at('s0')?.userData.kind ?? null });
  D.speed('inf');
  D.rounds(1); D.run(); await slowSettle(D, 30000);
  const count = D.mine([2]);
  const tray = count?.__panelTray, c = tray?.__ctx;
  const built = !!c && c.activeBot?.name === 'the pupil' && c.activeBot.program.length === 2 && c.standOcc?.userData.kind === 'box'
    && !given.userData.holes[0]?.thing && !given.userData.holes[1]?.thing && D.sched().stands === 1;
  const builtWhy = JSON.stringify({ ctx: !!c, active: c?.activeBot?.name ?? null, steps: c?.activeBot?.program?.length ?? null, stand: c?.standOcc?.userData.kind ?? null,
    h0: given.userData.holes[0]?.thing?.userData.kind ?? null, h1: given.userData.holes[1]?.thing?.userData.kind ?? null, stands: D.sched().stands, said: D.doc.getElementById('hint').textContent.slice(0, 100) });
  D.rounds(ROUNDS); D.speed(1);
  const ok = boxTaken && pupilTaken && taught && rewound && built;
  put((ok ? 'PASS' : 'FAIL') + ' a robot takes back the little robot it taught  (box-taken=' + boxTaken + ' pupil-taken=' + pupilTaken
      + ' taught=' + taught + ' rewound=' + rewound + (rewound ? '' : ' ' + rewoundWhy) + ' built-on-the-panel=' + built + (built ? '' : ' ' + builtWhy) + ')', ok ? 'pass' : 'fail');
  return ok;
}

// THE STOPWATCH, and a copy of it. Ken: "You can turn off the stop watch and
// edit its value (e.g. to zero) but then starting it again resumes its old
// value"; "I made a copy of the stopwatch and it did nothing (visible) when I
// started it... a stack of unprocessed responses". A thing announces its
// switch on a channel; the stopwatch's Started robot hears "on" and starts
// from whatever the number shows. A copy's panel gets nests of its own.
// TOOLTIPS THAT KNOW WHO. Ken: "the tooltip could be better given that the
// robots have names. And if there are no names either 'the robot' or 'the
// robots' is better than 'it'"; and the little thought's line for a full hand
// "is appropriate for an empty hand but not one holding something".
async function robotTipCheck(D) {
  const mk = (name, n, team = []) => ({ name, team, program: Array.from({ length: n }, () => ({ type: 'noop' })), note: '', condition: null });
  const named = mk('Next address', 5), five = mk('Move up five', 3), anon = mk(null, 4), anon2 = mk(null, 2);
  const team = mk('Next address', 5, [five]), mixed = mk('Ann', 1, [anon2]), twoAnon = mk(null, 2, [anon2]);
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [{ thing: { kind: 'text', text: 'a pad' }, x: 0.2, z: 1.7 },
    { thing: { kind: 'bird', nestId: 9909, nestGuid: 'tip-probe', label: 'to the desk' }, x: -0.6, z: 1.7 },
    { thing: { kind: 'nest', id: 9909, guid: 'tip-probe', hasEgg: false, pile: [], label: 'the desk' }, x: -1.2, z: 1.7 }] });
  await slowSettle(D, 1500);
  // a named thing is introduced by its name (Ken, over a bird "to the moving office")
  const bird = D.bench(1), nest = D.bench(2);
  const namedTip = D.tip(bird).startsWith('\u201cto the desk\u201d \u2014 a bird') && D.tip(nest).startsWith('\u201cthe desk\u201d \u2014 an empty nest');
  const pad = D.bench(0); D.hold(pad); await frames(D, 5);
  const t = {
    named: D.tipBot(named), team: D.tipBot(team), mixed: D.tipBot(mixed), anon: D.tipBot(anon), twoAnon: D.tipBot(twoAnon),
    fresh: D.tipBot(mk('Bob', 0)), thoughtNamed: D.tipThought(named), thoughtAnon: D.tipThought(anon),
  };
  const ok = t.named.startsWith('Drop that on \u201cNext address\u201d: it wakes')
    && t.team.startsWith('Drop that on \u201cNext address\u201d and \u201cMove up five\u201d: they wake') && /8 steps between them/.test(t.team)
    && t.mixed.startsWith('Drop that on \u201cAnn\u201d and its team of 2: they wake')
    && t.anon.startsWith('Drop that on the robot: it wakes') && !/on it:/.test(t.anon)
    && t.twoAnon.startsWith('Drop that on the robots: they wake')
    && /Drop that on \u201cBob\u201d: it wakes, grows, and watches you/.test(t.fresh)
    && t.thoughtNamed.startsWith('The little thought of \u201cNext address\u201d \u2014 empty your hand first')

  D.place(pad, 0.2, 1.7); await frames(D, 5);

  return ok;
}

// THE SLIDER REACHES THE VOICES. Ken: "The volume control slider doesn't
// affect text-to-speech". Speech does not pass through the gain node, so each
// utterance is made at the slider's setting.
async function voiceVolumeCheck(D, W) {
  const sv = W.document.getElementById('sndVol');
  if (!sv || !W.speechSynthesis) { put('FAIL the volume slider sets the voices too  (no slider or speech engine here)', 'fail'); return false; }
  const at = async (v) => { sv.value = String(v); sv.dispatchEvent(new W.Event('input')); await frames(D, 2); return D.utter('a line').volume; };
  const a = await at(0.3), b = await at(1), c = await at(0), d = await at(0.5);
  D.mute(true);
  // and every speaking site makes its utterance that way: the app's source
  // has the constructor once, inside utterance()
  const src = await (await fetch(frame.src)).text();
  const sites = (src.match(/new SpeechSynthesisUtterance\(/g) || []).length;
  const ok = Math.abs(a - 0.3) < 0.01 && b === 1 && c === 0 && Math.abs(d - 0.5) < 0.01 && sites === 1;
  put((ok ? 'PASS' : 'FAIL') + ' the volume slider sets the voices too  (0.3→' + a + ' 1→' + b + ' 0→' + c + ' 0.5→' + d + ' utterance-sites=' + sites + ')', ok ? 'pass' : 'fail');
  return ok;
}

// AN EMPTY HAND ON AN EMPTY HOLE. Ken: "an empty hand pointing to an empty

// A HOUSE DOES NOT GO INSIDE ITSELF. A held house dropped on its own door
// made a parent its own descendant and every frame after overflowed the
// stack -- found while scripting the office, the shape of a hang.
async function selfHouseCheck(D) {
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [{ thing: { kind: 'room', label: 'a house', opaque: false, dirty: false,
    world: { kind: 'world', v: 3, bench: [], stations: {}, active: null } }, x: 0.2, z: 1.7 }] });

  let room = null; for (let i = 0; i < 6; i++) { const t = D.bench(i); if (t?.userData.kind === 'room') room = t; }
  D.hold(room); await frames(D, 5);
  let threw = false;
  try { D.clickRaw({ kind: 'roomDoor', room }); await frames(D, 30); } catch (e) { threw = true; }
  const refused = /does not go inside itself/.test(D.doc.getElementById('hint').textContent);
  const down = !D.heldPos() && room.parent != null && D.worldsDeep() === 0;
  const ok = !threw && refused && down;
  put((ok ? 'PASS' : 'FAIL') + ' a house dropped on its own door is refused  (threw=' + threw + ' refused=' + refused + ' set-down=' + down + ')', ok ? 'pass' : 'fail');

}

// THE RESORT BY HAND, THE ORIGINAL'S WAY. "The point of this activity is the

  const w = await (await fetch('../examples/infinity/🏨 resort-infinity.world.json')).json();

  const grass = () => { const o = []; for (let i = 0; i < 90; i++) { const t = D.bench(i); if (!t) break; o.push(t); } return o; };
  const guests = grass().filter(t => t.userData.kind === 'model' && /^(new )?guest \d/.test(t.userData.label || ''));
  const find = (k, lbl) => grass().find(t => t.userData.kind === k && (t.userData.label || t.userData.text || '') === lbl);
  const toDesk = find('bird', 'to the front desk'), toOffice = find('bird', 'to the moving office'), pnest = find('nest', 'the practice nest');
  const letters = () => grass().filter(t => t.userData.kind === 'box' && t.userData.label === 'a practice letter');
  const A = D.benchBots().find(b => b.__bot?.name === 'fresh A'), B = D.benchBots().find(b => b.__bot?.name === 'fresh B');
  const runBtn = win.document.getElementById('runBtn');
  const cottageX = (n) => n * 0.6 - 4.5;
  const atCottage = (g, n) => Math.abs(g.position.x - cottageX(n)) < 0.05 && Math.abs(g.position.z - 5.2) < 0.05;
  const t0 = performance.now();
  const slow = CHECKS_FILTER.some(w2 => 'resortslow'.includes(w2) && w2.length > 6);   // named: at 4x, as the ABOUT pad advises
  D.speed(slow ? 4 : 'instant');
  const prog = async (at, k) => { if (k % 300) return; try { await fetch('/capture?name=suiteprog', { method: 'POST',
    body: JSON.stringify({ at, k, guests: guests.slice(0, 6).map(g => [Math.round(g.position.x * 100) / 100, Math.round(g.position.z * 100) / 100]),
      run: runBtn.textContent, hint: win.document.getElementById('hint')?.textContent?.slice(0, 120), t: Math.round(performance.now() / 1000) }) }); } catch (e2) {} };
  const macro1 = grass().find(t => t.userData.text === 'the guests');
  D.switchGadget(macro1, true, true); await frames(D, 60);
  const T = async (st, n = 40) => { D.teach(st); await slowSettle(D, n * 17 + 1500); };
  // the clerk: two clicks, then Ruby

  const lesson1 = D.helperState().mode === 'training';
  await T({ type: 'take', at: { c: 'given', path: [0] } });
  await T({ type: 'put', at: { c: 'given', path: [1] } }, 80);
  D.rubyOn(true); D.clickCond([0]); await slowSettle(D, 2000); D.rubyOn(false);
  const loosened1 = /any number and a bird\.$/.test(win.document.getElementById('hint').textContent.trim());
  D.exit(); await slowSettle(D, 2000);
  D.hold(A); await frames(D, 5); D.clickThing(toDesk); await frames(D, 30);
  for (let k = 0; k < (slow ? 20000 : 4000) && !guests.slice(0, 6).every((g, i) => atCottage(g, i + 1)); k++) { await frames(D, 1); await prog('resort-house', k); }
  const housed1 = guests.slice(0, 6).every((g, i) => atCottage(g, i + 1));
  // the mover: a +5 dropped on the number, then the number to the bird
  D.hold(letters()[0]); await frames(D, 5); D.clickBot(B); await slowSettle(D, 3000);
  const lesson2 = D.helperState().mode === 'training';
  const n0 = String(D.mine([0])?.userData.value?.n);
  await T({ type: 'newNumber' });
  await T({ type: 'setValue', value: D.rat(5), op: '+' });
  await T({ type: 'put', at: { c: 'given', path: [0] } });

  D.exit(); await slowSettle(D, 2000);

  return ok;
}

// THE RESORT TEACHER. Ken: "I still find infinity resort very confusing -
// can you make a meta example that solves it." One robot at the yard's
// table, given a ten-hole box, does the whole of it the original's way:
// seats the guests, teaches a little robot the clerk's job on a practice
// letter and gives it to the bird to the front desk, teaches another the
// mover's job (+5) and gives it to the bird to the moving office, welcomes
// five more. Measured: six at 6 to 11, five at 1 to 5, the two pupils taught
// the very programs of the resort's answers and taken in by the two desks.
async function resortTeacherCheck(D, win) {
  const w = await (await fetch('../examples/meta/🎓 resort-teacher.world.json')).json();
  D.worldIn(w); await slowSettle(D, 2000);
  D.clickRaw({ kind: 'yardDoor' }); await slowSettle(D, 2500);
  const grass = () => { const o = []; for (let i = 0; i < 90; i++) { const t = D.bench(i); if (!t) break; o.push(t); } return o; };
  const guests = grass().filter(t => t.userData.kind === 'model' && /^(new )?guest \d/.test(t.userData.label || ''));
  const box = grass().find(t => t.userData.kind === 'box' && t.userData.holes.length >= 10);   // eleven since the teacher reads a last pad
  const teacher = D.benchBots().find(b => b.__bot?.name === 'the teacher');
  const fd = grass().find(t => t.userData.label === 'the front desk'), mo = grass().find(t => t.userData.label === 'the moving office');
  const cottageX = (n) => n * 0.6 - 4.5;
  const atCottage = (g, n) => Math.abs(g.position.x - cottageX(n)) < 0.05 && Math.abs(g.position.z - 5.2) < 0.05;
  const slow = CHECKS_FILTER.some(w2 => 'teacherslow'.includes(w2) && w2.length > 7);   // named teacherSlow: at 4x
  D.speed(slow ? 4 : 'instant');
  D.hold(box); await frames(D, 30); D.clickBot(teacher);
  let wentToWork = false;                                 // the drop set it to work
  for (let k = 0; k < 200 && !wentToWork; k++) { await frames(D, 1); wentToWork = D.helperState().mode === 'replay'; }
  const done = () => guests.slice(0, 6).every((g, i) => atCottage(g, i + 6)) && guests.slice(6).every((g, i) => atCottage(g, i + 1));
  for (let k = 0; k < (slow ? 30000 : 8000) && !done(); k++) await frames(D, 1);
  const solved = done();
  for (let k = 0; k < 4000 && D.helperState().mode !== 'world'; k++) await frames(D, 1);   // the teacher looks once more, and stops
  const ended = D.helperState().mode === 'world';
  // the pupils learned the very robots of the resort's answers, and the desks took them in
  const R = await (await fetch('../examples/infinity/🏨 resort-infinity.world.json')).json();
  const answers = Object.fromEntries(R.yard.bench.filter(e => e.thing.kind === 'robot').map(e => [e.thing.name, e.thing.program]));
  const strip = (p) => JSON.stringify(p.map(st => ({ ...st, value: undefined })));
  const inDesk = (r) => r?.__ctx?.standOcc?.userData.holes[2].thing?.__bot ?? null;
  const clerk = inDesk(fd), mover = inDesk(mo);
  const learned = !!clerk && !!mover && strip(clerk.program) === strip(answers['Next address']) && strip(mover.program) === strip(answers['Move up five']);
  D.speed(1);
  const ok = wentToWork && solved && ended && learned;
  const at = (gs) => gs.map(g => Math.round((g.position.x + 4.5) / 0.6 * 10) / 10).join(',');
  put((ok ? 'PASS' : 'FAIL') + ' the resort teacher solves the resort  (went-to-work=' + wentToWork + ' solved=' + solved + ' ended=' + ended
      + ' pupils-in-the-desks-learned-the-answers=' + learned + ' guests-at=' + at(guests.slice(0, 6)) + ' newcomers-at=' + at(guests.slice(6)) + ')', ok ? 'pass' : 'fail');
  return ok;
}

// CODEX'S REPORT (17 September 2026). A fresh 1 off the stack typed 2 gives
// 12, and stays so (Ken: fix the manual, not the number). A robot no
// longer sets itself going when Ruby's loosening makes its thought fit (Ken:
// "the user may intend to erase multiple things"); Start runs it. The
// loading overlay is out of the accessibility tree once the scene is up.
async function codexCheck(D, win) {
  const doc = win.document;
  const key = (k) => { doc.activeElement?.blur?.(); win.dispatchEvent(new win.KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true })); };
  const heldValue = () => { const h = D.heldNode?.(); return h?.userData?.value ? String(h.userData.value.n) + (h.userData.value.d === 1n ? '' : '/' + h.userData.value.d) : null; };
  const loading = doc.getElementById('loading');
  await new Promise(r => setTimeout(r, 800));            // the overlay's fade, then it is gone for good
  const loadingGone = !!loading && loading.getAttribute('aria-hidden') === 'true' && win.getComputedStyle(loading).display === 'none';
  const loadingWhy = loading ? (loading.getAttribute('aria-hidden') + '/' + loading.className + '/' + win.getComputedStyle(loading).display) : 'none';
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [
    { thing: { kind: 'number', value: { n: '1', d: '1' }, op: '+' }, x: -0.4, z: 1.6 },
    { thing: { kind: 'robot', name: 'fresh', program: [], team: [] }, x: 0.8, z: 1.5 } ] });
  await slowSettle(D, 1500);
  // 1. a fresh number: the first digit IS the number, then digits add on
  D.fromStack('numbers'); await frames(D, 5);
  const isFresh = !!D.heldPos() && heldValue() === '1';
  key('2'); await frames(D, 3);
  const after2 = heldValue();
  key('5'); await frames(D, 3);
  const after25 = heldValue();
  key('Backspace'); await frames(D, 3);
  const afterBack = heldValue();
  D.clickBench(0.2, 2.0); await frames(D, 10);
  // ...and a number that is not fresh appends, as it always did
  const one = D.bench(0); D.hold(one); await frames(D, 5); key('2'); await frames(D, 3);
  const notFresh = heldValue();
  D.clickBench(-0.4, 1.6); await frames(D, 10);
  // 2. a loosening does not set the robot going: teach it to add a fresh 1 to the given,
  // run once (it stops: the 2 no longer fits its thought of a 1), loosen, and see it wait
  const given = D.bench(1) ?? one;
  D.hold(one); await frames(D, 5); D.giveRobot(); await slowSettle(D, 2500);
  D.teach({ type: 'newNumber' }); await slowSettle(D, 2000);
  D.teach({ type: 'put', at: { c: 'given', path: [] } }); await slowSettle(D, 2000);
  D.exit(); await slowSettle(D, 2000);
  D.speed('instant'); D.run(); await slowSettle(D, 4000);
  const stopped1 = D.helperState().mode === 'world';
  D.rubyOn(true); D.clickCond([]); await slowSettle(D, 3000); D.rubyOn(false);
  const hintAfter = doc.getElementById('hint').textContent;
  for (let k = 0; k < 120; k++) await frames(D, 1);
  const waits = D.helperState().mode === 'world' && /Start runs it/.test(hintAfter);
  const v0 = Number(D.mine()?.userData.value?.n);
  D.rounds(3); D.run(); await slowSettle(D, 6000);
  const finalV = String(D.mine()?.userData.value?.n), finalHint = doc.getElementById('hint').textContent.slice(0, 80);
  const ranOnStart = Number(finalV) === v0 + 3;             // three rounds of adding a fresh 1
  D.rounds(ROUNDS); D.speed(1);
  const ok = loadingGone && isFresh && after2 === '12' && after25 === '125' && afterBack === '12' && notFresh === '12' && stopped1 && waits && ranOnStart;   // digits go on the end (Ken kept it so; the manual says it)
  put((ok ? 'PASS' : 'FAIL') + ' digits go on the end, a loosening waits for Start, the loading overlay is gone  (loading-gone=' + loadingGone + ' [' + loadingWhy + ']'
      + ' fresh=' + isFresh + ' typed-2=' + after2 + ' then-5=' + after25 + ' backspace=' + afterBack + ' not-fresh-2=' + notFresh
      + ' stopped-after-one=' + stopped1 + ' waits-after-loosening=' + waits + ' ran-on-start=' + ranOnStart + ' [' + finalV + ' ' + JSON.stringify(finalHint) + '])', ok ? 'pass' : 'fail');
  return ok;
}

// FOUR OF KEN'S, 17 September. A 3D turtle's trail set down after Dusty had
// it ran into the table (its aim is a quarter turn; its rest assumed it lay
// flat); Enter in a pad's close-up writes a new line and Ctrl+Enter comes
// back; Pause stops the robots and nothing else; and a letter a thing did not
// understand is said so even when a robot inside a panel sent it.
async function kenRoundCheck(D, win) {
  const doc = win.document;
  const key = (k, mods = {}) => { doc.activeElement?.blur?.(); win.dispatchEvent(new win.KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true, ...mods })); };
  const top = D.bounds().top;
  // 1. the trail stands on the table, however it is turned

  await slowSettle(D, 1500);

  const minY = () => { trail.updateMatrixWorld(true); const bb = new D.THREE.Box3(); trail.traverse(o => { if (o.isMesh) bb.expandByObject(o, true); }); return bb.min.y; };
  const loaded = minY() >= top - 0.002;
  D.hold(trail); await frames(D, 5); D.clickBench(-0.5, 1.9); await frames(D, 40);

  // 2. Enter in the close-up writes; Ctrl+Enter comes back

  await slowSettle(D, 1500);

// THE FIRST PROJECT IN THE WORKSHOP, THE HOME VIEW, THE FIT BUTTON'S NAME.
// The guide watches what you do: each step is said when the one before is
// seen to be done, with a ring on the thing to reach for, and it ends when
// the robot counts. The home view puts the camera back where it starts, out
// of a close-up first. "As big as the ground" is "As big as the table" indoors.
async function guideCheck(D, win) {
  const doc = win.document, hint = () => doc.getElementById('hint').textContent;
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [] }); await slowSettle(D, 1500);
  const at = []; const step = (i, re) => { at.push([D.guide()?.i, hint().slice(0, 40)]); return D.guide()?.i === i && re.test(hint()); };
  D.guideStart('count'); await frames(D, 3);
  const s0 = step(0, /Take a little robot/) && D.guide().ring;
  D.fromStack('minis'); await frames(D, 5); D.clickBench(0.6, 1.7); await frames(D, 20);
  const s1 = step(1, /number stack/);
  // the ring follows what you hold: on the stack, then on the robot once the number is in hand
  const ringOnStack = D.guide().ringAt;
  D.fromStack('numbers'); await frames(D, 5);
  const ringOnRobot = D.guide().ringAt;
  const follows = !!ringOnStack && !!ringOnRobot && Math.hypot(ringOnStack[0] - ringOnRobot[0], ringOnStack[2] - ringOnRobot[2]) > 0.3
    && Math.hypot(ringOnRobot[0] - 0.6, ringOnRobot[2] - 1.7) < 0.35;
  D.giveRobot(); await slowSettle(D, 3000);
  const s2 = step(2, /show it one step/);
  D.teach({ type: 'newNumber' }); await slowSettle(D, 2000); D.teach({ type: 'put', at: { c: 'given', path: [] } }); await slowSettle(D, 2000);
  const s3 = step(3, /Leave the bubble/) && D.guide().glow === 'exitBtn';   // the button glows
  D.exit(); await slowSettle(D, 2000);
  const s4 = step(4, /Press Run what it learned/) && D.guide().glow === 'runBtn';
  D.speed('instant'); D.run(); await slowSettle(D, 4000);
  const s5 = step(5, /Wake Ruby/) && D.guide().ring;
  D.rubyOn(true); D.clickCond([]); await slowSettle(D, 3000); D.rubyOn(false); await frames(D, 5);
  const s6 = step(6, /Press Run again/);
  D.rounds(5); D.run(); await slowSettle(D, 4000); D.rounds(ROUNDS); D.speed(1);
  const over = D.guide() === null && D.projectsCard();   // ...and the other projects are offered
  doc.getElementById('projectsCard')?.remove();
  // the home view: out of a close-up and back where it starts
  const pad = D.bench(0);
  const p0 = D.camera.position.clone();
  D.hold(pad ?? D.mine()); await frames(D, 5);
  const num = D.heldNode();
  if (num) { D.lookAt(num, true); }
  const inClose = !!D.straightOn;
  D.homeView(); for (let k = 0; k < 60; k++) { D.holdLook(0.1); await frames(D, 1); }
  const home = !D.straightOn && D.camera.position.z > 4.5 && D.camera.position.y > 2.5;   // back at the front of the table, out of the close-up
  const homeWhy = ' cam=' + D.camera.position.toArray().map(v => +v.toFixed(2)).join(',') + ' straight=' + !!D.straightOn;
  const fitName = doc.getElementById('heldFit').textContent === 'As big as the table';
  D.clickBench(-0.5, 1.9); await frames(D, 5);
  // the second project, a box of two numbers, end to end
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [] }); await slowSettle(D, 1500);
  D.guideStart('box'); await frames(D, 3);
  const b0 = step(0, /Take a box/);
  D.fromStack('boxes'); await frames(D, 5); D.clickBench(0.0, 1.7); await frames(D, 20);
  const b1 = step(1, /first hole/);
  const bx = (() => { for (let i = 0; i < 5; i++) { const t = D.bench(i); if (t?.userData.kind === 'box') return t; } return null; })();
  D.fromStack('numbers'); await frames(D, 5); D.clickHole(bx, 0); await frames(D, 20);
  const b2 = step(2, /type 2/);
  D.fromStack('numbers'); await frames(D, 5); D.type(2, '+'); D.clickHole(bx, 1); await frames(D, 20);
  const b3 = step(3, /Pick it up/);
  D.hold(bx); await frames(D, 10);
  const boxDone = D.guide() === null && D.projectsCard();
  doc.getElementById('projectsCard')?.remove();
  D.clickBench(0.0, 1.9); await frames(D, 5);
  const ok = s0 && s1 && follows && s2 && s3 && s4 && s5 && s6 && over && b0 && b1 && b2 && b3 && boxDone && inClose && home && fitName;
  put((ok ? 'PASS' : 'FAIL') + ' the projects guide step by step, the home view comes home, the fit button names the table  (steps=' + [s0, s1, s2, s3, s4, s5, s6].map(Number).join('') + ' ring-follows-the-hand=' + follows + ' box-project=' + [b0, b1, b2, b3, boxDone].map(Number).join('') + ' over=' + over
      + ' close-up=' + inClose + ' home=' + home + (home ? '' : homeWhy) + ' fit-name=' + fitName + (ok ? '' : ' seen=' + JSON.stringify(at)) + ')', ok ? 'pass' : 'fail');
  return ok;
}

// A SAVED ARRANGEMENT LOADS EXACTLY. Two things a file puts at one spot
// stand at that spot (ChatGPT's pens in their pots were shoved a row back);
// a hand's near-miss is still kept clear, and undo puts things back where
// they were, not where the shove would have them.
async function exactLoadCheck(D) {
  D.worldIn({ kind: 'world', v: 4, stations: {}, active: null, bench: [
    { thing: { kind: 'number', value: { n: '1', d: '1' } }, x: 0.2, z: 1.7 },
    { thing: { kind: 'number', value: { n: '2', d: '1' } }, x: 0.2, z: 1.7 },
    { thing: { kind: 'text', text: 'pad' }, x: 0.5, z: 1.7 } ] });
  await slowSettle(D, 1500);
  const at = []; for (let i = 0; i < 5; i++) { const t = D.bench(i); if (!t) break; if (t.userData.kind !== 'notebook') at.push([t.position.x, t.position.z]); }
  const near = (a, x, z) => Math.abs(a[0] - x) < 1e-3 && Math.abs(a[1] - z) < 1e-3;
  const exact = at.length === 3 && near(at[0], 0.2, 1.7) && near(at[1], 0.2, 1.7) && near(at[2], 0.5, 1.7);
  // a hand's drop beside the pad still keeps clear of it
  D.fromStack('numbers'); await frames(D, 5);
  const dropped = D.heldNode();
  D.clickBench(0.36, 1.7); await frames(D, 20);
  const shoved = !!dropped && dropped.parent && Math.hypot(dropped.position.x - 0.36, dropped.position.z - 1.7) > 0.08;
  const ok = exact && shoved;
  put((ok ? 'PASS' : 'FAIL') + ' a saved arrangement loads exactly; a hand\u2019s near-miss is kept clear  (exact=' + exact
      + ' at=' + JSON.stringify(at.map(a => a.map(v => +v.toFixed(2)))) + ' hand-shoved=' + shoved + (dropped ? ' dropped-at=' + [dropped.position.x, dropped.position.z].map(v => +v.toFixed(2)) : '') + ')', ok ? 'pass' : 'fail');
  return ok;
}

// A MODEL'S PLAQUE IS MEASURED TO THE MODEL: a pea-sized planet's name
