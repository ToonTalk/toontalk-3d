<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nano-ToonTalk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b8241a'/%3E%3Crect x='5' y='11' width='22' height='9' rx='3' fill='%23141821'/%3E%3Ccircle cx='11.5' cy='15.5' r='3' fill='%237fe9ff'/%3E%3Ccircle cx='20.5' cy='15.5' r='3' fill='%237fe9ff'/%3E%3Crect x='14.6' y='2' width='2.8' height='6' rx='1.4' fill='%23efe2c6'/%3E%3Ccircle cx='16' cy='3' r='3' fill='%23ffb01f'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #eef1f6; --dim: #97a2b3; --panel: rgba(15, 19, 27, 0.86);
    --edge: rgba(255,255,255,.12); --accent: #ff7a5c; --go: #6ee7a8; --think: #7fd4ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #12151b; color: var(--ink);
         font: 14px/1.5 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  .card { position: fixed; background: var(--panel); border: 1px solid var(--edge);
          border-radius: 12px; backdrop-filter: blur(8px); padding: 12px 14px; }
  #title { top: 14px; left: 14px; max-width: 300px; }
  #title h1 { margin: 0 0 3px; font-size: 15px; font-weight: 650; }
  #title h1 .badge { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase;
                     padding: 2px 7px; border-radius: 999px; margin-left: 6px;
                     background: rgba(255,255,255,.1); color: var(--dim); vertical-align: 2px; }
  #title h1 .badge.training { background: rgba(127,212,255,.2); color: var(--think); }
  #title p { margin: 0; font-size: 12px; color: var(--dim); }
  #hint { margin-top: 8px !important; color: var(--accent) !important; }
  #title.attn { animation: attn 0.65s ease 3; }
  @keyframes attn {
    0%, 100% { background: var(--panel); }
    50% { background: rgba(127, 212, 255, 0.28); }
  }

  #prog { top: 14px; right: 14px; width: 232px; max-height: 60vh; overflow: auto; }
  #prog h2 { margin: 0 0 4px; font-size: 11px; letter-spacing: .09em;
             text-transform: uppercase; color: var(--dim); font-weight: 650; }
  #trainedOn { margin: 0 0 8px; font-size: 11.5px; color: var(--think); }
  #trainedOn:empty { display: none; }
  #steps { margin: 0; padding: 0; list-style: none; font-size: 12.5px; }
  #steps li { display: flex; gap: 8px; padding: 3px 0; border-top: 1px solid rgba(255,255,255,.06); }
  #steps li:first-child { border-top: 0; }
  #steps .n { color: var(--dim); font-variant-numeric: tabular-nums; min-width: 14px; }
  #steps li.now { color: var(--go); }
  #steps .empty { color: var(--dim); font-style: italic; }
  #library { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--edge); }
  #library .row { display: flex; gap: 5px; }
  #library .row + .row { margin-top: 5px; }
  #library input, #library select { flex: 1; min-width: 0; font: inherit; font-size: 12px;
    color: var(--ink); background: rgba(255,255,255,.07);
    border: 1px solid var(--edge); border-radius: 7px; padding: 4px 7px; }
  #library button { padding: 4px 9px; font-size: 12px; }
  #library option { background: #171b23; }

  #bar { left: 50%; bottom: 16px; transform: translateX(-50%);
         display: flex; align-items: center; gap: 8px; padding: 9px 10px; }
  button { font: inherit; font-size: 12.5px; color: var(--ink);
           background: rgba(255,255,255,.07); border: 1px solid var(--edge);
           border-radius: 8px; padding: 6px 11px; cursor: pointer; }
  button:hover:not(:disabled) { background: rgba(255,255,255,.15); }
  /* the generic hover above out-specifies the colour classes, which turned the
     coloured buttons grey on hover -- restore their colour and just brighten */
  button.go:hover:not(:disabled) { background: var(--go); filter: brightness(1.1); }
  button.think:hover:not(:disabled) { background: var(--think); filter: brightness(1.1); }
  button.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.1); }
  button:disabled { opacity: .35; cursor: default; }
  button.think { background: var(--think); border-color: var(--think); color: #06212e; font-weight: 650; }
  button.go { background: var(--go); border-color: var(--go); color: #06301e; font-weight: 650; }
  .sep { width: 1px; height: 20px; background: var(--edge); margin: 0 2px; }
  label[for=speed], label[for=rounds] { font-size: 12px; color: var(--dim); }
  #rounds { width: 64px; font: inherit; font-size: 12.5px; color: var(--ink);
            background: rgba(255,255,255,.07); border: 1px solid var(--edge);
            border-radius: 8px; padding: 5px 7px; }
  select { font: inherit; font-size: 12.5px; color: var(--ink);
           background: rgba(255,255,255,.07); border: 1px solid var(--edge);
           border-radius: 8px; padding: 5px 7px; }
  select option { background: #171b23; }

  #held { left: 50%; bottom: 74px; transform: translateX(-50%); padding: 7px 13px;
          display: none; align-items: center; gap: 9px; }
  #held.on { display: flex; }
  #held .v { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums;
             color: var(--accent); min-width: 24px; text-align: center; }
  #held .k { font-size: 11.5px; color: var(--dim); }

  #loading { position: fixed; inset: 0; display: grid; place-items: center;
             background: #12151b; z-index: 10; color: var(--dim); font-size: 13px;
             transition: opacity .4s ease; }
  #loading.gone { opacity: 0; pointer-events: none; }

  #tip { position: fixed; z-index: 20; pointer-events: none; display: none;
         max-width: 260px; padding: 6px 9px; font-size: 12px; line-height: 1.4;
         white-space: pre-line;
         color: var(--ink); background: rgba(10, 13, 19, 0.92);
         border: 1px solid var(--edge); border-radius: 8px; }
</style>
</head>
<body>
<div id="app"></div>

<div id="title" class="card">
  <h1>nano-ToonTalk<span class="badge" id="badge">your workshop</span></h1>
  <p>You move things yourself. The robot only acts inside its thought bubble —
     or when repeating what it learned.</p>
  <p id="hint">Click a stack to have the robot fetch something.</p>
</div>

<div id="prog" class="card">
  <h2 title="What the active robot learned, step by step. Steps only ever name the robot's own things, never places on your bench.">Trained actions</h2>
  <p id="trainedOn" title="The robot's condition: what it must be given before it will run. Dusty can vacuum parts of it away."></p>
  <ul id="steps"><li class="empty">not trained yet</li></ul>
  <div id="library">
    <div class="row"><input id="robotName" placeholder="name this robot" maxlength="28"
        title="A name to save the active robot's training under.">
      <button id="saveBtn" title="Save the active robot's program and condition in this browser.">Save</button></div>
    <div class="row"><select id="robotList" title="Robots saved in this browser."></select>
      <button id="loadBtn" title="Load this saved training into the robot at the bench (waking one if needed).">Load</button><button id="delBtn" title="Delete this saved robot.">×</button></div>
    <div class="row"><button id="exportBtn" title="Download the selected robot as a file, to share or move to another computer.">Export file</button>
      <button id="importBtn" title="Add a robot file to this browser's library.">Import file</button>
      <input id="importFile" type="file" accept=".json,application/json" style="display:none"></div>
  </div>
</div>

<div id="held" class="card">
  <span class="k" title="What your invisible hand is carrying. It follows your pointer.">holding</span><span class="v" id="heldVal">–</span>
  <span class="k" id="heldTip">type digits to change it</span>
</div>

<div id="bar" class="card">
  <button id="exitBtn" class="think" style="display:none"
    title="End the lesson. The daydream rewinds; the robot keeps only what it learned.">Leave thought bubble</button>
  <button id="runBtn" class="go"
    title="The robot repeats its training on whatever it was given, and keeps going while its condition still matches.">Run what it learned</button>
  <button id="dustyBtn"
    title="Dusty vacuums things away, and vacuums parts of a robot's thought into wildcards so more things match.">Dusty: asleep</button>
  <span class="sep"></span>
  <label for="speed" title="How fast robots move. Instant skips the animation entirely.">Speed</label>
  <select id="speed">
    <option value="0.5">½×</option>
    <option value="1" selected>1×</option>
    <option value="2">2×</option>
    <option value="4">4×</option>
    <option value="8">8×</option>
    <option value="inf">Instant</option>
  </select>
  <label for="rounds">Rounds</label>
  <input id="rounds" type="number" min="1" max="10000" value="100" title="How many times a running robot may repeat before stopping">
  <span class="sep"></span>
  <button id="undoBtn"
    title="Undo the last move — picking up, putting down, typing, joining, vacuuming, erasing. Ctrl+Z works too.">Undo</button>
</div>

<div id="loading">Loading…</div>
<div id="tip"></div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.185.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.185.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const DEG = Math.PI / 180;
const ease = t => t * t * (3 - 2 * t);
const lerp = (a, b, t) => a + (b - a) * t;
const shortAngle = (a, b) => a + Math.atan2(Math.sin(b - a), Math.cos(b - a));

// ---------------------------------------------------------------- renderer
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;   // PCFSoft is deprecated in r185
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.32;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141821);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 200);
camera.position.set(0.40, 3.05, 5.45);
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.enableDamping = true; orbit.dampingFactor = 0.06;
orbit.minDistance = 1.5; orbit.maxDistance = 16;
orbit.maxPolarAngle = Math.PI * 0.495;
orbit.target.set(0, 0.68, 0.95);
orbit.update();

// The bench is wide, so frame it from the aspect ratio rather than hard-coding
// a camera spot that only suits one window shape. Backs off once the user
// orbits, so we never yank the view out from under them.
let userMoved = false;
orbit.addEventListener('start', () => { userMoved = true; });
function frameScene() {
  if (userMoved) return;
  // wide enough for Dusty's mat at one end, tall enough for the thought bubble
  // riding above the robot's head
  const centre = new THREE.Vector3(-0.72, 1.10, 0.8), halfW = 3.65, halfH = 1.78;
  const vFov = camera.fov * DEG;
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
  const d = Math.max(halfH / Math.tan(vFov / 2), halfW / Math.tan(hFov / 2)) + 1.15;
  camera.position.copy(centre).addScaledVector(new THREE.Vector3(0.07, 0.44, 1).normalize(), d);
  orbit.target.copy(centre);
  orbit.update();
}

scene.add(new THREE.HemisphereLight(0x9fb4d8, 0x2a3038, 1.05));
const key = new THREE.DirectionalLight(0xfff2e6, 3.5);
key.position.set(4.6, 6.4, 5.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.radius = 3; key.shadow.bias = -0.0009;
Object.assign(key.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: .5, far: 24 });
scene.add(key);
const fill = new THREE.DirectionalLight(0xbcd2ff, 0.85); fill.position.set(-5, 2.6, 3.0); scene.add(fill);
const rim = new THREE.DirectionalLight(0xcfe2ff, 1.35); rim.position.set(-2.2, 3.4, -5.0); scene.add(rim);

const ground = new THREE.Mesh(new THREE.CircleGeometry(30, 64).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: 0x1b1f28, roughness: 0.92 }));
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(30, 60, 0x2c3341, 0x232935);
grid.material.transparent = true; grid.material.opacity = 0.45; grid.position.y = 0.002;
scene.add(grid);

// ---------------------------------------------------------------- thought bubble
// Additive only: with no environment map a physical/clearcoat bubble reflects
// black and smears a dark disc over the floor.
const BUBBLE_OPACITY = 0.11;
const bubbleMat = new THREE.MeshBasicMaterial({
  color: 0x9fd8ff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending,
  side: THREE.DoubleSide, depthWrite: false });
const bubble = new THREE.Group();
{
  const dome = new THREE.Mesh(
    new THREE.SphereGeometry(3.35, 48, 32, 0, Math.PI * 2, 0, Math.PI * 0.66), bubbleMat);
  dome.position.set(0, 0.95, 0.75);
  bubble.add(dome);
  for (const [x, y, z, r] of [[2.85, 0.6, 2.5, 0.24], [3.25, 0.32, 2.85, 0.15], [3.55, 0.15, 3.1, 0.09]]) {
    const b = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), bubbleMat);
    b.position.set(x, y, z);
    bubble.add(b);
  }
}
scene.add(bubble);

// ---------------------------------------------------------------- things
// A "thing" is a number or a box. Boxes have holes; holes hold things, boxes
// included, so the whole structure is a tree rooted at a station.
const HOLES = 2, HOLE_W = 0.19, MAX_HOLES = 8, BOX_MAX_W = 0.62;
const CUBE = 0.24;
const cubeGeo = new THREE.BoxGeometry(CUBE, CUBE, CUBE);
const faceGeo = new THREE.PlaneGeometry(CUBE * 0.86, CUBE * 0.86);
let nextId = 1;

function setPick(obj, data) { obj.__pick = data; }

// --- exact rational arithmetic --------------------------------------------
// Division has to produce something honest, so numbers are BigInt fractions
// kept in lowest terms rather than floats.
const OPS = ['+', '-', '*', '/', '^'];
// Each operation gets its own colour and badge so what a number will *do* is
// readable at a glance, not just from a small corner glyph.
const OP_STYLE = {
  '+': { ink: '#8f1c14', edge: '#b8241a', face: '#f3e8d0', shell: 0xefe2c6, glyph: '+' },
  '-': { ink: '#14468f', edge: '#1f63c4', face: '#dde8f7', shell: 0xd2ddf0, glyph: '−' },
  '*': { ink: '#5b1a8f', edge: '#8028c0', face: '#e9ddf7', shell: 0xdccff0, glyph: '×' },
  '/': { ink: '#0e6b50', edge: '#14957c', face: '#d9f0e5', shell: 0xcdead9, glyph: '÷' },
  '^': { ink: '#8a5410', edge: '#c08a1a', face: '#f7ecd2', shell: 0xf0e0b8, glyph: '^' },
};
// Numbers are unbounded BigInts as in ToonTalk; the only limit is a guard so a
// runaway `^` cannot lock the browser building a million-digit result. The
// display handles any length, so this is generous rather than tight.
const MAX_DIGITS = 20000;

function bgcd(a, b) {
  if (a < 0n) a = -a;
  if (b < 0n) b = -b;
  while (b) { const t = a % b; a = b; b = t; }
  return a;
}
function rat(n, d = 1n) {
  n = BigInt(n); d = BigInt(d);
  if (d === 0n) return null;
  if (d < 0n) { n = -n; d = -d; }
  const g = bgcd(n, d) || 1n;
  return { n: n / g, d: d / g };
}
const ratEq = (a, b) => !!a && !!b && a.n === b.n && a.d === b.d;
const tooBig = (r) => !r || String(r.n < 0n ? -r.n : r.n).length > MAX_DIGITS
                       || String(r.d).length > MAX_DIGITS;

function applyOp(a, op, b) {
  let r = null;
  if (op === '+') r = rat(a.n * b.d + b.n * a.d, a.d * b.d);
  else if (op === '-') r = rat(a.n * b.d - b.n * a.d, a.d * b.d);
  else if (op === '*') r = rat(a.n * b.n, a.d * b.d);
  else if (op === '/') r = rat(a.n * b.d, a.d * b.n);          // null if b is 0
  else if (op === '^') {
    if (b.d !== 1n) return null;                                // integer powers only
    let e = b.n;
    const neg = e < 0n;
    if (neg) e = -e;
    // size the result *before* computing it, so we never start a calculation
    // that would hang
    const widest = Math.max(String(a.n < 0n ? -a.n : a.n).length, String(a.d).length);
    if (e > 1000000n || Number(e) * widest > MAX_DIGITS) return null;
    r = neg ? rat(a.d ** e, a.n ** e) : rat(a.n ** e, a.d ** e);
  }
  return tooBig(r) ? null : r;
}
const ratText = (r) => !r ? '?' : (r.d === 1n ? String(r.n) : `${r.n}/${r.d}`);
// for panels and hints, where a 20000-digit string would be useless
const shortNum = (s) => s.length <= 26 ? s : `${s.slice(0, 11)}…${s.slice(-11)} (${s.length} digits)`;
const ratShort = (r) => !r ? '?' : (r.d === 1n ? shortNum(String(r.n))
                                              : `${shortNum(String(r.n))}/${shortNum(String(r.d))}`);

// --- numbers --------------------------------------------------------------
function fitFont(c, text, maxW, startPx) {
  let px = startPx;
  for (;;) {
    c.font = `bold ${px}px Georgia, serif`;
    if (c.measureText(text).width <= maxW || px <= 8) return px;
    px = Math.floor(px * 0.9);
  }
}
// Numbers draw at a uniform size while they fit. Once they don't, they render
// the way ToonTalk does: both ends stay full size and legible, the digits taper
// down towards the middle, and an ellipsis stands for everything omitted. That
// keeps the most *and* least significant ends readable at any length.
const FULL_DIGITS = 2;                    // full-size digits at each end
const TAPER = [0.70, 0.45, 0.26];         // shrinking run inwards from those
function drawNum(c, s, cx, cyMid, maxW, maxH) {
  const cap = Math.min(176, Math.floor(maxH * 0.98));
  const shown = 2 * (FULL_DIGITS + TAPER.length);
  if (s.length <= shown) {
    const uni = fitFont(c, s, maxW, cap);
    c.font = `bold ${uni}px Georgia, serif`;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(s, cx, cyMid);
    return c.measureText(s).width;
  }
  // sizes as multiples of the full size, left half then mirrored right half
  const half = [...Array(FULL_DIGITS).fill(1), ...TAPER];
  const weights = [...half, ...half.slice().reverse()];
  c.font = 'bold 100px Georgia, serif';
  const unit = c.measureText('8').width / 100;          // advance per px of size
  const ellipsisW = 1.15;                               // in units of one full digit
  const sum = weights.reduce((a, b) => a + b, 0) + ellipsisW;
  const F = Math.min(cap, maxW / (unit * sum));
  const total = unit * F * sum;

  const head = s.slice(0, half.length);
  const tail = s.slice(-half.length);
  let x = cx - total / 2;
  const baseline = cyMid + F * 0.35;
  c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  const put = (ch, mult) => {
    const size = F * mult;
    c.font = `bold ${size}px Georgia, serif`;
    c.fillText(ch, x, baseline);
    x += unit * size;
  };
  head.split('').forEach((ch, i) => put(ch, half[i]));
  c.font = `bold ${F * 0.5}px Georgia, serif`;
  c.fillText('…', x, baseline);
  x += unit * F * ellipsisW;
  tail.split('').forEach((ch, i) => put(ch, half[half.length - 1 - i]));
  c.textAlign = 'center'; c.textBaseline = 'middle';
  return total;
}

function makeNumber(value, op = '+') {
  const g = new THREE.Group();
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 256;
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;

  const shellMat = new THREE.MeshStandardMaterial({ color: 0xefe2c6, roughness: 0.5 });
  const shell = new THREE.Mesh(cubeGeo, shellMat);
  shell.castShadow = true; shell.receiveShadow = true;
  g.add(shell);
  const faceMat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.45 });
  const p = CUBE / 2 + 0.0015;
  for (const [px, pz, ry] of [[0, p, 0], [0, -p, Math.PI], [p, 0, Math.PI / 2], [-p, 0, -Math.PI / 2]]) {
    const q = new THREE.Mesh(faceGeo, faceMat);
    q.position.set(px, 0, pz); q.rotation.y = ry;
    g.add(q);
  }
  Object.assign(g.userData, { id: nextId++, kind: 'number', op, width: CUBE, rest: CUBE / 2 });

  function draw() {
    const st = OP_STYLE[g.userData.op] || OP_STYLE['+'];
    shellMat.color.setHex(st.shell);
    const c = canvas.getContext('2d');
    c.fillStyle = st.face; c.fillRect(0, 0, 256, 256);
    c.strokeStyle = st.edge; c.lineWidth = 12; c.strokeRect(16, 16, 224, 224);
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = st.ink;

    const label = g.userData.label;
    const v = g.userData.value;
    if (label != null) {
      c.font = `bold ${fitFont(c, label, 176, 176)}px Georgia, serif`;
      c.fillText(label, 128, 140);
    } else if (v && v.d === 1n) {
      drawNum(c, String(v.n), 128, 142, 190, 168);
    } else if (v) {
      const wn = drawNum(c, String(v.n), 128, 96, 182, 76);
      const wd = drawNum(c, String(v.d), 128, 190, 182, 76);
      c.strokeStyle = st.ink; c.lineWidth = 9;
      const w = Math.max(wn, wd) / 2 + 12;
      c.beginPath(); c.moveTo(128 - w, 143); c.lineTo(128 + w, 143); c.stroke();
    }
    // badge showing what this number does when dropped on another
    c.beginPath(); c.arc(54, 54, 30, 0, Math.PI * 2);
    c.fillStyle = st.ink; c.fill();
    c.fillStyle = st.face;
    c.font = 'bold 42px Georgia, serif';
    c.fillText(st.glyph, 54, 57);
    tex.needsUpdate = true;
  }

  g.setValue = (v, o) => { g.userData.value = v; if (o) g.userData.op = o; draw(); };
  g.setOp = (o) => { g.userData.op = o; draw(); };
  g.setLabel = (t) => { g.userData.label = t; draw(); };
  g.setValue(value);
  setPick(g, { kind: 'thing', thing: g });

function makeBox(n = HOLES) {

// The bird carries the gift home, drops it on the pile, and flies back to

  const nest = bird.__nest;

  clearUndo();                // deliveries change a pile no snapshot describes
  busy = true;
  const thing = held; held = null;
  const wasAt = bird.getWorldPosition(new THREE.Vector3());
  const originHole = holeContaining(bird);
  const originSt = Object.values(stations).find(st2 => st2.occupant === bird);
  detach(bird);
  scene.attach(bird);
  bird.add(thing);
  thing.position.set(0, -0.02, 0.16);
  thing.quaternion.identity();
  thing.scale.setScalar(0.5);
  const npos = () => nest.getWorldPosition(new THREE.Vector3());
  // enqueueNext, not enqueue: during a replay the next condition check is

    dur: 0.9,
    update(t) {
      const e = ease(t), np = npos();
      bird.position.set(lerp(wasAt.x, np.x, e),
        lerp(wasAt.y, np.y + 0.3, e) + 0.45 * Math.sin(Math.PI * e),
        lerp(wasAt.z, np.z, e));
    },
  }, doNow(() => {
    bird.remove(thing);
    nest.add(thing);
    thing.scale.setScalar(1);
    nest.userData.pile.push(thing);
    restackNest(nest);
    flash(npos());
    refreshUI();
  }), {
    dur: 0.8,
    update(t) {

      bird.position.set(lerp(np.x, wasAt.x, e),
        lerp(np.y + 0.3, wasAt.y, e) + 0.45 * Math.sin(Math.PI * e),
        lerp(np.z, wasAt.z, e));

    end() {

      else if (originSt && !originSt.occupant) putOnStation(originSt, bird);

      refreshUI();
    },

}

// Everything the user can touch, as roots of object trees.
const roots = () => Object.values(stations)
  .map(s => s.occupant).concat(benchThings).filter(Boolean);

// chain of hole indices into that, and [] means the thing itself. Nothing a
// robot does is ever expressed as a place.

const myThing = () => stations.stand?.occupant ?? null;
function thingAt(at) {

      if (!hs) return null;
      for (const h of hs) { const r = walk(h.thing, path.concat(h.index)); if (r) return r; }

// --- things as plain data -------------------------------------------------
// Needed for three separate jobs: snapshotting the world before the robot
// daydreams, rebuilding it afterwards, and comparing what the robot was trained
// on against what it is later given.

  // birds, nests and robots inside boxes go by reference: their identity (a
  // bird's pairing, a robot's training) has no data form
  if (kind === 'nest' || kind === 'bird' || kind === 'robot') return { kind: 'ref', node: thing };

    if (cond.kind === 'anyNest') return k === 'nest';

  }
  if (cond.kind === 'anyBird' || cond.kind === 'anyNest') return false;
  if (cond.kind === 'wildNumber') return spec.kind === 'number';
  if (cond.kind === 'wildBox') return spec.kind === 'box' && spec.holes.length === cond.n;

  const bar = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.028, 0.10),
    new THREE.MeshStandardMaterial({ color: 0x0b3d4d, roughness: 0.2,
      emissive: 0x2fd3ff, emissiveIntensity: 2.6, toneMapped: false }));
  bar.position.set(0, height + COPY_LIFT + 0.36, 0);
  g.add(bar);
  st.scanBar = bar;
  st.scanTop = height + COPY_LIFT + 0.36;
  st.scanBottom = height + COPY_LIFT + 0.06;
  return g;
}

const stackY = (st, c, i) => st.plinth + c.userData.rest + i * st.pitch;

// New stock joins at the *bottom*; with `animate` the whole column then rises
// one place, so taking the top one reads as the stack restoring itself rather
// than everything blinking into new positions.
function refillStack(st, animate = false) {
  const added = [];
  while (st.cubes.length < st.stackN) {
    const t = st.id === 'numbers' ? makeNumber(rat(1))
            : st.id === 'minis' ? makeMiniRobot()
            : st.id === 'scales' ? makeScale()
            : st.id === 'nests' ? makeNest()
            : makeBox();
    scene.add(t);
    setPick(t, { kind: 'station', id: st.id });
    st.cubes.unshift(t);
    added.push(t);
    t.position.set(st.point.x, stackY(st, t, 0) - st.pitch, st.point.z);
    t.quaternion.identity();
    t.scale.setScalar(t.userData.kind === 'robot' ? MINI : 1);
  }
  if (!animate) {
    st.cubes.forEach((c, i) => {
      c.position.set(st.point.x, stackY(st, c, i), st.point.z);
      c.quaternion.identity();
      c.scale.setScalar(c.userData.kind === 'robot' ? MINI : 1);
    });
    return;
  }
  const from = st.cubes.map(c => c.position.y);
  const to = st.cubes.map((c, i) => stackY(st, c, i));
  enqueueNext({
    dur: 0.38,
    update(t) {
      const e = ease(t);
      st.cubes.forEach((c, i) => { c.position.y = lerp(from[i], to[i], e); });
    },
    end() { st.cubes.forEach((c, i) => { c.position.y = to[i]; }); },
  });
}

// ---------------------------------------------------------------- robot
const POSE = {
  rest:      { sh: 0,         el: 0 },
  reach:     { sh: -38 * DEG, el:  33 * DEG },
  reachHigh: { sh: -82 * DEG, el:  55 * DEG },   // up toward the copier platform
  carry:     { sh:  -8 * DEG, el: -30 * DEG },
};
const JAW_CLOSED = 0.103, JAW_OPEN = 0.200;
const WALK_SPEED = 1.25, STRIDE = 0.55;

let robot, root, shoulder, elbow, jawA, jawB, grip;
let hipL, hipR, kneeL, kneeR;
const initQ = new Map(), jawBase = {};
let jawSign = 1, armPose = { ...POSE.rest }, jawNow = JAW_CLOSED;
let reachLocal = null, reachR = 0, reachBeta = 0;
const _qd = new THREE.Quaternion(), _axisX = new THREE.Vector3(1, 0, 0);

function remember(n) { if (n) initQ.set(n, n.quaternion.clone()); }
function setJoint(node, a) {
  if (!node) return;
  _qd.setFromAxisAngle(_axisX, a);
  node.quaternion.copy(initQ.get(node)).multiply(_qd);
}
function applyArm(sh, el) { armPose = { sh, el }; setJoint(shoulder, sh); setJoint(elbow, el); }
function applyJaw(open) {
  jawNow = open;
  jawA.position.x = jawBase.a - jawSign * open;
  jawB.position.x = jawBase.b + jawSign * open;
}
function setLegs(phase, amount) {
  const s = Math.sin(phase) * amount;
  setJoint(hipL, 22 * DEG * s);
  setJoint(hipR, -22 * DEG * s);
  setJoint(kneeL, -18 * DEG * Math.max(0, -s));
  setJoint(kneeR, -18 * DEG * Math.max(0, s));
  root.position.y = 0.022 * Math.abs(Math.sin(phase * 2)) * amount;
}

const HOME = { pos: new THREE.Vector3(0, 0, 0), yaw: 0 };
// Where the robot must stand for its claw to land on a given point.
function standForPoint(p) {
  return { pos: new THREE.Vector3(p.x, 0, p.z - reachR), yaw: -reachBeta };
}

// ---------------------------------------------------------------- state
let held = null, mode = 'world', program = [], busy = false;
let valueAtPickup = null, opAtPickup = '+', holesAtPickup = 0;
let condition = null;      // what it must be given before it will run
let preTraining = null;    // world snapshot taken when the daydream began
let condDisplay = null, dusty = null, dustyActive = false, dustyHome = null;
let runCount = 0;
let speed = 1;             // Infinity == run everything inside a single frame
let maxIter = 100;         // user-settable: a robot whose condition never fails would loop forever
let worldReady = false;    // scene built; there may or may not be a robot yet

// --- the robot population ---------------------------------------------------
// Robots come off a stack as miniatures. One at a time works at the bench,
// full size; the rest wait as minis, each carrying its own training. `program`
// and `condition` always mirror the active robot's.
const MINI = 0.24;
let template = null;       // pristine model every robot is cloned from
let activeBot = null;
let nextBotId = 1;

function makeBot(node) {
  const N = (n) => node.getObjectByName(n);
  const parts = { shoulder: N('shoulderP_R'), elbow: N('elbowP_R'),
    jawA: N('jaw_R_a'), jawB: N('jaw_R_b'), grip: N('grip_R'),
    hipL: N('hip_L'), hipR: N('hip_R'), kneeL: N('knee_L'), kneeR: N('knee_R') };
  [parts.shoulder, parts.elbow, parts.hipL, parts.hipR, parts.kneeL, parts.kneeR].forEach(remember);
  const bot = { id: nextBotId++, node, root: N('ROBOT_root') || node, parts,
                program: [], condition: null, team: [] };
  node.userData.kind = 'robot';
  node.__bot = bot;   // expando, not userData: clone() JSON-copies userData and the record is circular
  node.userData.rest = 0;            // stands on its feet
  node.userData.width = 0.55;
  return bot;
}
function makeMiniRobot() {
  const node = template.clone(true);
  const bot = makeBot(node);
  node.scale.setScalar(MINI);
  setPick(node, { kind: 'botThing', bot });
  return node;
}
function bindBot(bot) {
  activeBot = bot;
  robot = bot.node; root = bot.root;
  shoulder = bot.parts.shoulder; elbow = bot.parts.elbow;
  jawA = bot.parts.jawA; jawB = bot.parts.jawB; grip = bot.parts.grip;
  hipL = bot.parts.hipL; hipR = bot.parts.hipR; kneeL = bot.parts.kneeL; kneeR = bot.parts.kneeR;
  program = bot.program; condition = bot.condition;
}
// condition gets reassigned (not mutated), so write it back whenever it changes
function syncBot() {
  if (activeBot) { activeBot.condition = condition; activeBot.program = program; }
}

// ---------------------------------------------------------------- sequencer
const queue = [];
let current = null, tCur = 0;
function enqueue(...steps) { queue.push(...steps); }
// Steps spawned from inside a running step (settling into a hole, combining)
// must happen *now*, not after the retract-and-walk-home already in the queue.
function enqueueNext(...steps) { queue.unshift(...steps); }
function tick(dt) {
  if (!current) {
    current = queue.shift(); tCur = 0;
    if (!current) { if (busy) { busy = false; afterQueue(); } return; }
    current.start && current.start();
  }
  tCur += dt;
  const t = Math.min(1, tCur / (current.dur || 0.0001));
  current.update && current.update(t);
  if (t >= 1) { current.end && current.end(); current = null; }
}
let pendingAfter = null;
function afterQueue() { const f = pendingAfter; pendingAfter = null; if (f) f(); refreshUI(); }

// Instant speed: snap each step straight to its finished state instead of
// simulating every frame of it. Stepping through the animation at a big dt
// still cost seconds of blocking for a 20-round loop.
function fastForward(maxSteps = 100000) {
  let n = 0;
  while ((current || queue.length) && n++ < maxSteps) {
    if (!current) {
      current = queue.shift();
      if (!current) break;
      current.start && current.start();
    }
    current.update && current.update(1);
    current.end && current.end();
    current = null;
  }
  if (busy && !current && !queue.length) { busy = false; afterQueue(); }
}

// `target` may be a function, resolved when the step starts -- stand positions
// depend on where a hole is, which is only known once earlier steps have run.
const walkTo = (target) => {
  let p0, y0, y1, dist, tgt;
  return {
    dur: 0.01,
    start() {
      tgt = typeof target === 'function' ? target() : target;
      p0 = root.position.clone(); p0.y = 0;
      y0 = root.rotation.y;
      y1 = shortAngle(y0, tgt.yaw);
      dist = p0.distanceTo(tgt.pos);
      // already standing there: don't burn a beat shuffling in place
      this.dur = (dist < 0.02 && Math.abs(y1 - y0) < 0.02)
        ? 0.0001 : Math.max(0.4, dist / WALK_SPEED, Math.abs(y1 - y0) * 0.42);
    },
    update(t) {
      const e = ease(t);
      root.position.x = lerp(p0.x, tgt.pos.x, e);
      root.position.z = lerp(p0.z, tgt.pos.z, e);
      root.rotation.y = lerp(y0, y1, e);
      const travelled = dist * e;
      setLegs((travelled / STRIDE) * Math.PI * 2, dist > 0.12 ? Math.sin(Math.PI * t) : 0);
    },
    end() { setLegs(0, 0); root.position.y = 0; },
  };
};
const armTo = (pose, jaw, dur = 0.8) => {
  let a0, j0;
  return {
    dur,
    start() { a0 = { ...armPose }; j0 = jawNow; },
    update(t) {
      const e = ease(t);
      applyArm(lerp(a0.sh, pose.sh, e), lerp(a0.el, pose.el, e));
      applyJaw(lerp(j0, jaw, e));
    },
  };
};
const doNow = (fn) => ({ dur: 0.0001, end: fn });
const pause = (d) => ({ dur: d });

function abort(msg) {
  queue.length = 0;
  pendingAfter = null;
  if (mode === 'replay') mode = 'world';
  highlight(-1);
  stowHeld();
  say(msg);
}

// ---------------------------------------------------------------- actions
// The robot stands at its own stand and never walks: everything it can do is
// reaching into the thing it was given, or conjuring a new number or box.

// A brand new number or box appears in the claw.
function actionNew(kind) {
  enqueue(armTo(POSE.reach, JAW_OPEN, 0.5));
  let made = null;
  enqueue({
    dur: 0.4,
    start() {
      made = kind === 'box' ? makeBox() : kind === 'scale' ? makeScale() : makeNumber(rat(1));
      scene.add(made);
      const p = grip.getWorldPosition(new THREE.Vector3());
      made.position.copy(p);
      made.scale.setScalar(0.01);
      flash(p);
    },
    update(t) { made.scale.setScalar(0.01 + 0.99 * ease(t)); },
  });
  enqueue(doNow(() => {
    grip.attach(made);
    held = made;
    noteHeld();
    enqueueNext(graspSettle(made));
  }));
  enqueue(armTo(POSE.carry, JAW_CLOSED, 0.5));
  enqueue(doNow(refreshUI));
}

// Where the robot stands to work on a container. The copier's two surfaces
// share one stance; the stand is worked from home.
const walkTargetFor = (c) =>
  c === 'given' ? HOME
  : (c === 'in' || c === 'out') ? () => standForPoint(stations.copyOut.point)
  : () => standForPoint(stationOf(c).point);

// Take whatever the address names, into the claw.
function actionTake(at) {
  const reach = at.c === 'in' ? POSE.reachHigh : POSE.reach;
  enqueue(walkTo(walkTargetFor(at.c)));
  enqueue(armTo(reach, JAW_OPEN, 0.7));
  enqueue(doNow(() => {
    const obj = thingAt(at);
    if (!obj) return abort(`The robot expected something in ${holeName(at)} and found nothing.`);
    detach(obj);
    held = obj;
    setPick(held, { kind: 'thing', thing: held });
    noteHeld();
    grip.attach(held);
    // fetching from the raised platform is a long reach -- let it be seen
    enqueueNext(graspSettle(held, at.c === 'in' ? 0.5 : 0.2));
  }));
  enqueue(armTo(reach, JAW_CLOSED, 0.35));
  enqueue(armTo(POSE.carry, JAW_CLOSED, 0.6));
  enqueue(doNow(refreshUI));
}

// Put what the robot holds at the address. A hole takes it (or combines);
// a bare container places it (or combines with what sits there); placing on
// the copier platform sets the machine going.
function actionPut(at, side) {
  const reach = at.c === 'in' ? POSE.reachHigh : POSE.reach;
  enqueue(walkTo(walkTargetFor(at.c)));
  enqueue(armTo(reach, JAW_CLOSED, 0.6));
  enqueue(armTo(reach, JAW_OPEN, 0.35));
  enqueue(doNow(() => {
    const dropped = held; held = null;
    if (!dropped) return;
    const from = dropped.getWorldPosition(new THREE.Vector3());
    if (at.path.length) {
      const hole = holeAt(at);
      if (!hole) return abort(`The robot expected ${holeName(at)} and there is no such hole.`);
      if (hole.thing?.userData.kind === 'bird') { held = dropped; return birdDeliver(hole.thing); }
      if (hole.thing) combine(hole, dropped, true, from, side);
      else { putInHole(hole, dropped); enqueueNext(settleInto(dropped, from)); }
    } else {
      const st = stationOf(at.c);
      if (st.occupant?.userData.kind === 'bird') { held = dropped; return birdDeliver(st.occupant); }
      if (st.occupant) combine(st, dropped, false, from, side);
      else {
        putOnStation(st, dropped);
        // the platform sits above the claw, so let the rise be seen
        enqueueNext(settleInto(dropped, from, at.c === 'in' ? 0.55 : 0.22));
        if (at.c === 'in') runDuplicate();
      }
    }
    refreshUI();
  }));
  enqueue(armTo(POSE.rest, JAW_CLOSED, 0.7));
}

const scanStep = (st) => ({
  dur: 0.7,
  update(t) {
    const e = Math.sin(Math.PI * t);
    st.scanBar.position.y = lerp(st.scanTop, st.scanBottom, e);
    st.scanBar.material.emissiveIntensity = 2.6 + 3.4 * e;
  },
  end() { st.scanBar.position.y = st.scanTop; st.scanBar.material.emissiveIntensity = 2.6; },
});

// Scan whatever is on the upper platform and lower a duplicate into the tray.
// The original never moves, so the machine is ready again immediately.
function runDuplicate() {
  const inSt = stations.copyIn, outSt = stations.copyOut;
  let copy = null, from = null;
  // enqueueNext: when a robot triggers this mid-action, the duplicate has to be
  // made before the following step (typically "take the copy") runs.
  enqueueNext(scanStep(inSt), {
    dur: 0.45,
    start() {
      copy = buildThing(specOf(inSt.occupant));
      scene.add(copy);
      from = inSt.occupant.getWorldPosition(new THREE.Vector3());
      copy.position.copy(from);
      copy.scale.setScalar(0.01);
      flash(from);
    },
    update(t) {
      const s = 0.01 + 0.99 * ease(t);
      copy.scale.setScalar(s);
      copy.position.y = inSt.point.y + inSt.occupant.userData.rest + copy.userData.rest * s;
    },
  }, {
    dur: 0.5,
    update(t) {
      const e = ease(t);
      copy.position.y = lerp(inSt.point.y + 0.3, outSt.topY + copy.userData.rest, e);
      copy.position.x = lerp(from.x, outSt.point.x, e);
      copy.position.z = lerp(from.z, outSt.point.z, e);
    },
    end() { putOnStation(outSt, copy); refreshUI(); },
  });
}

// The robot's wand-style duplicating: it names an address, not a machine. The
// original stays put and the copy arrives in the claw.
function actionCopy(at) {
  enqueue(walkTo(walkTargetFor(at.c)));
  enqueue(armTo(POSE.reach, JAW_OPEN, 0.6));
  let copy = null, src = null;
  enqueue({
    dur: 0.5,
    start() {
      src = thingAt(at);
      if (!src) return abort(`The robot expected something in ${holeName(at)} and found nothing.`);
      copy = buildThing(specOf(src));
      scene.add(copy);
      const p = src.getWorldPosition(new THREE.Vector3());
      copy.position.copy(p);
      copy.scale.setScalar(0.01);
      flash(p);
    },
    update(t) {
      if (!copy) return;
      const e = ease(t);
      copy.scale.setScalar(0.01 + 0.99 * e);
      copy.position.y = src.getWorldPosition(new THREE.Vector3()).y + 0.34 * e;
    },
  });
  enqueue(doNow(() => {
    if (!copy) return;
    grip.attach(copy);
    held = copy;
    noteHeld();
    enqueueNext(graspSettle(copy));
  }));
  enqueue(armTo(POSE.carry, JAW_CLOSED, 0.5));
  enqueue(doNow(refreshUI));
}

// Typing a number on a held box gives it that many holes. Rebuilt rather than
// reshaped, since hole width depends on the count.
function resizeHeldBox(n) {
  n = Math.max(1, Math.min(MAX_HOLES, n));
  const old = held;
  const oldHoles = old.userData.holes;
  if (n === oldHoles.length) return;
  for (let i = n; i < oldHoles.length; i++) {
    if (oldHoles[i].thing) return say(`Hole ${i + 1} still has something in it.`);
  }
  const nb = makeBox(n);
  for (let i = 0; i < Math.min(n, oldHoles.length); i++) {
    const t = oldHoles[i].thing;
    if (t) { oldHoles[i].thing = null; putInHole(nb.userData.holes[i], t); }
  }
  const parent = old.parent;
  nb.position.copy(old.position);
  nb.quaternion.copy(old.quaternion);
  nb.scale.copy(old.scale);
  parent.add(nb);
  parent.remove(old);
  held = nb;
  refreshUI();
}

// Draw a just-grasped thing into the claw, and a just-released one into its
// slot, instead of snapping. Both animate local position so the parenting is
// already final and nothing can drift.
function graspSettle(thing, dur = 0.2) {
  const p0 = thing.position.clone(), s0 = thing.scale.x;
  const to = new THREE.Vector3(0, 0, 0);
  return {
    dur,
    update(t) {
      const e = ease(t);
      thing.position.lerpVectors(p0, to, e);
      thing.scale.setScalar(lerp(s0, 1, e));
    },
    end() { thing.position.copy(to); thing.scale.setScalar(1); },
  };
}
function settleInto(thing, fromWorld, dur = 0.22) {
  const to = thing.position.clone();
  const from = thing.parent.worldToLocal(fromWorld.clone());
  return {
    dur,
    update(t) { thing.position.lerpVectors(from, to, ease(t)); },
    end() { thing.position.copy(to); },
  };
}

// The joined box replaces the target wherever it sits -- bench, station or
// hole -- and the dropped box's holes are appended after the target's.
function joinBoxes(target, incoming, refuse, side) {
  const nA = target.userData.holes.length, nB = incoming.userData.holes.length;
  const nb = makeBox(nA + nB);
  const move = (srcHoles, offset) => srcHoles.forEach((h, i) => {
    const t = h.thing;
    if (t) { h.thing = null; putInHole(nb.userData.holes[offset + i], t); }
  });
  // which side you drop on decides where the new holes go
  if (side === 'L') { move(incoming.userData.holes, 0); move(target.userData.holes, nB); }
  else { move(target.userData.holes, 0); move(incoming.userData.holes, nA); }
  const hole = holeContaining(target);
  const st = Object.values(stations).find(s => s.occupant === target);
  const bi = benchThings.indexOf(target);
  const at = { x: target.position.x, z: target.position.z };
  detach(target);
  target.removeFromParent();
  incoming.removeFromParent();
  if (hole) putInHole(hole, nb);
  else if (st) putOnStation(st, nb);
  else if (bi >= 0) putOnBench(nb, at);
  else scene.add(nb);
  flash(nb.getWorldPosition(new THREE.Vector3()));
  refreshUI();
}

// Where Bammer will eventually fly in with his hammer. Only numbers combine.
function sideOf(target, point) {
  if (!point) return 'R';
  return target.worldToLocal(point.clone()).x < 0 ? 'L' : 'R';
}
function combine(slot, incoming, isHole, fromWorld, side) {
  const target = isHole ? slot.thing : slot.occupant;
  // The old fallback parked refused things on a free pillar; pillars are gone,
  // so a refused thing lands on the bench instead of being lost.
  const refuse = (msg) => {
    putOnBench(incoming, { x: (BENCH.x0 + BENCH.x1) / 2, z: (BENCH.z0 + BENCH.z1) / 2 });
    say(msg);
  };
  // Boxes join: dropping one box on another concatenates their holes, contents
  // and all, exactly as in ToonTalk.
  if (target.userData.kind === 'bird' || target.userData.kind === 'nest') {
    return refuse('Give things to the bird herself — she delivers to her nest.');
  }
  if (target.userData.kind === 'box' && incoming.userData.kind === 'box') {
    return joinBoxes(target, incoming, refuse, side);
  }
  if (target.userData.kind !== 'number' || incoming.userData.kind !== 'number') {
    return refuse('Only numbers combine — a box joins a box, a number adds to a number.');
  }
  // The arriving number's own operation is what gets applied -- that is what
  // typing "*" on a number before dropping it means.
  const op = incoming.userData.op;
  const result = applyOp(target.userData.value, op, incoming.userData.value);
  if (!result) {
    return refuse(op === '/' && incoming.userData.value.n === 0n
      ? 'Nothing can be divided by zero.'
      : `That ${op} makes a number too big to hold.`);
  }
  scene.attach(incoming);
  const dest = target.getWorldPosition(new THREE.Vector3());
  const base = isHole ? fitScale(target, slot) : 1;
  // Rest on top of the number it landed on for a beat before merging, rather
  // than the two occupying the same spot.
  const tScale = new THREE.Vector3(), iScale = new THREE.Vector3();
  target.getWorldScale(tScale); incoming.getWorldScale(iScale);
  const perch = dest.clone();
  perch.y += target.userData.rest * tScale.y + incoming.userData.rest * iScale.y;
  const start = fromWorld ? fromWorld.clone() : incoming.position.clone();
  // enqueueNext, not enqueue: otherwise the merge waits until after the robot
  // has retracted and walked home, leaving the number hanging in mid-air.
  enqueueNext({
    dur: 0.22,
    start() { incoming.position.copy(start); },
    update(t) { incoming.position.lerpVectors(start, perch, ease(t)); },
    end() { incoming.position.copy(perch); },
  }, pause(0.3), {
    dur: 0.4,
    update(t) {
      const e = ease(t);
      incoming.position.lerpVectors(perch, dest, e);
      incoming.scale.setScalar(iScale.y * (1 - 0.85 * e));
    },
    end() { incoming.removeFromParent(); },
  }, {
    dur: 0.4,
    start() { target.setValue(result); flash(dest); },
    update(t) { target.scale.setScalar(base * (1 + 0.3 * Math.sin(Math.PI * t))); },
    end() { target.scale.setScalar(base); refreshUI(); },
  });
}

const flashes = [];
function flash(pos) {
  if (speed === Infinity) return;      // nothing to see at instant speed
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.15, 20, 12),
    new THREE.MeshBasicMaterial({ color: 0xffd27a, transparent: true, opacity: 0.55,
      blending: THREE.AdditiveBlending, depthWrite: false }));
  m.position.copy(pos); scene.add(m); flashes.push({ m, t: 0 });
}

// ---------------------------------------------------------------- interaction
function resolve(ev) {
  const ndc = new THREE.Vector2((ev.clientX / innerWidth) * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  // things created earlier in this same tick still have stale world matrices,
  // and the raycaster works off those
  scene.updateMatrixWorld();

    const isCopier = st.kind === 'copyIn' || st.kind === 'copyOut';

    f.m.emissiveIntensity = f.intensity;
  }
  flagged = [];
}
function flagMismatch(paths) {
  clearFlags();
  for (const p of paths) {
    condNodeAt(p)?.traverse(o => {
      if (!o.isMesh || !o.material?.emissive) return;
      flagged.push({ m: o.material, emissive: o.material.emissive.clone(),
                     intensity: o.material.emissiveIntensity });
      o.material.emissive.setHex(0xff3b2f);
      o.material.toneMapped = false;
    });
  }
  flagTime = 0;
}
function condNodeAt(path) {
  let found = null;
  condDisplay?.traverse(o => {
    if (!found && o.__pick?.kind === 'cond' && o.__pick.path.join() === path.join()) found = o;
  });
  return found;
}

// --- Dusty ----------------------------------------------------------------
function dustyErase(path) {
  const node = condNodeAt(path);
  if (!node || !dusty) return;
  pushUndo();
  busy = true;
  const dest = node.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0, -0.12, 0.34));
  const from = dusty.position.clone();
  enqueue({ dur: 0.45, update(t) { dusty.position.lerpVectors(from, dest, ease(t)); } });
  enqueue({
    dur: 0.5,
    start() { flash(node.getWorldPosition(new THREE.Vector3())); },
    update(t) { dusty.position.z = dest.z - 0.05 * Math.sin(Math.PI * t * 3); },
    end() { condition = eraseAt(condition, path); syncBot(); rebuildCondition(); },
  });
  enqueue({
    dur: 0.45,
    update(t) { dusty.position.lerpVectors(dest, dustyHome, ease(t)); },
    end() { dusty.position.copy(dustyHome); refreshUI(); },
  });
}

// Dusty removes things too: fly to the victim, suck it into the nozzle, fly
// home. `getVictim` resolves at flight time so replays find the current thing.
function dustySuck(getVictim) {
  if (!dusty) return;
  busy = true;
  let victim = null, dest = null, from0 = null, scale0 = 1;
  enqueue({
    dur: 0.45,
    start() {
      victim = getVictim();
      if (!victim) { busy = false; return; }
      dest = victim.getWorldPosition(new THREE.Vector3());
      dest.y = 0; dest.z += 0.36;
    },
    update(t) { if (victim) dusty.position.lerpVectors(dustyHome, dest, ease(t)); },
  });
  enqueue({
    dur: 0.5,
    start() {
      if (!victim) return;
      flash(victim.getWorldPosition(new THREE.Vector3()));
      detach(victim);
      scene.attach(victim);
      from0 = victim.position.clone();
      scale0 = victim.scale.x;
    },
    update(t) {
      if (!victim) return;
      const e = ease(t);
      const nozzle = dusty.position.clone().add(new THREE.Vector3(0, 0.1, -0.28));
      victim.position.lerpVectors(from0, nozzle, e);
      victim.scale.setScalar(scale0 * (1 - 0.97 * e));
      dusty.position.z = dest.z - 0.04 * Math.sin(Math.PI * t * 4);
    },
    end() {
      if (victim) {
        if (victim.userData.kind === 'nest') {
          victim.userData.pile.forEach(t => t.removeFromParent());
          victim.userData.pile.length = 0;
        }
        victim.removeFromParent();
      }
      refreshUI();
    },
  });
  enqueue({
    dur: 0.45,
    update(t) { if (dest) dusty.position.lerpVectors(dest, dustyHome, ease(t)); },
    end() { dusty.position.copy(dustyHome); refreshUI(); },
  });
}
// The trainable form: vacuum whatever the address names.
function actionVacuum(at) {
  dustySuck(() => {
    const v = thingAt(at);
    if (!v) abort(`Dusty found nothing in ${holeName(at)}.`);
    return v;
  });
}

// --- saving trained robots -------------------------------------------------
// BigInt has no JSON representation, so rationals go to and from strings.
const STORE_KEY = 'nano-toontalk.robots';
const ratOut = (r) => r ? { n: String(r.n), d: String(r.d) } : null;
const ratIn = (o) => o ? { n: BigInt(o.n), d: BigInt(o.d) } : null;

function condOut(c) {
  if (!c) return null;
  if (/^(wild|any)/.test(c.kind)) return { ...c };
  if (c.kind === 'number') return { kind: 'number', value: ratOut(c.value), op: c.op };
  return { kind: c.kind, holes: c.holes.map(condOut) };
}
function condIn(o) {
  if (!o) return null;
  if (o.kind === 'wild') return WILD;
  if (/^(wild|any)/.test(o.kind)) return { ...o };
  if (o.kind === 'number') return { kind: 'number', value: ratIn(o.value), op: o.op };
  return { kind: o.kind, holes: o.holes.map(condIn) };
}
const stepOut = (s) => s.type === 'setValue' ? { ...s, value: ratOut(s.value) } : s;
const stepIn = (s) => {
  if (s.type === 'setValue') return { ...s, value: ratIn(s.value) };
  // migrate saves that predate {c, path} addresses
  if (s.type === 'putScratch') return { type: 'put', at: { c: 's' + s.i, path: [] } };
  if (s.type === 'takeScratch') return { type: 'take', at: { c: 's' + s.i, path: [] } };
  if (s.type === 'putCopier') return { type: 'put', at: { c: 'in', path: [] } };
  if (s.type === 'takeCopy') return { type: 'take', at: { c: 'out', path: [] } };
  if ((s.type === 'take' || s.type === 'put' || s.type === 'copy') && !s.at)
    return { ...s, at: { c: 'given', path: s.path || [] } };
  return s;
};

function loadLibrary() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); }
  catch { return {}; }
}
function saveLibrary(lib) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(lib)); }
  catch (e) { say('Could not save: ' + e.message); }
}
function saveRobot(name) {
  if (!name) return say('Give the robot a name first.');
  if (!program.length) return say('Train it before saving it.');
  const lib = loadLibrary();
  lib[name] = { program: program.map(stepOut), condition: condOut(condition) };
  saveLibrary(lib);
  refreshLibrary(name);
  say(`Saved “${name}”.`);
}
function applyLoaded(rec, name) {
  clearUndo();
  program = rec.program.map(stepIn);
  condition = condIn(rec.condition);
  syncBot();
  rebuildCondition(); renderProgram(); refreshUI();
  say(`Loaded “${name}” — give it ${condText(condition)} and run it.`);
}
function loadRobot(name) {
  const rec = loadLibrary()[name];
  if (!rec) return say('No robot by that name.');
  if (mode === 'training') leaveTraining();
  if (activeBot) return applyLoaded(rec, name);
  // no robot at the bench: wake one -- a bench mini if there is one, else a
  // fresh one straight off the stack
  const miniNode = benchThings.find(t => t.userData.kind === 'robot')
    ?? stations.minis.cubes.pop();
  if (!miniNode) return say('No robot to load into.');
  refillStack(stations.minis, true);
  activateBot(miniNode.__bot, () => applyLoaded(rec, name));
}
function deleteRobot(name) {
  const lib = loadLibrary();
  if (!lib[name]) return;
  delete lib[name];
  saveLibrary(lib);
  refreshLibrary();
  say(`Deleted “${name}”.`);
}
function refreshLibrary(select) {
  const names = Object.keys(loadLibrary()).sort();
  const sel = $('robotList');
  sel.innerHTML = names.length
    ? names.map(n => `<option${n === select ? ' selected' : ''}>${n}</option>`).join('')
    : '<option value="">(none saved)</option>';
  $('loadBtn').disabled = !names.length;
  $('delBtn').disabled = !names.length;
  $('exportBtn').disabled = !names.length;
}

function snapshotWorld() {
  const snap = Object.fromEntries(Object.values(stations)
    .filter(s => s.kind !== 'stack')
    .map(s => [s.id, specOf(s.occupant)]));
  // robots on the bench are kept by reference -- they carry training that a
  // spec could not describe, and nothing in a daydream can touch them
  snap.bench = benchThings.map(t =>
    ['robot', 'nest', 'bird'].includes(t.userData.kind)
    ? { bot: t, at: { x: t.position.x, z: t.position.z } }
    : { spec: specOf(t), at: { x: t.position.x, z: t.position.z } });
  snap.piles = allNests.filter(n => n.parent)
    .map(n => ({ nest: n, items: n.userData.pile.map(specOf) }));
  return snap;
}
function restoreWorld(snap) {
  queue.length = 0; current = null; busy = false; pendingAfter = null;
  // removeFromParent, not scene.remove: while held its parent is the claw
  if (held) { held.removeFromParent(); held = null; }
  benchThings.forEach(t => t.removeFromParent());
  benchThings.length = 0;
  (snap.bench || []).forEach(b => putOnBench(b.bot ?? buildThing(b.spec), b.at));
  (snap.piles || []).forEach(p => {
    p.nest.userData.pile.forEach(t => t.removeFromParent());
    p.nest.userData.pile = p.items.map(buildThing).filter(Boolean);
    p.nest.userData.pile.forEach(t => p.nest.add(t));
    restackNest(p.nest);
  });
  for (const st of Object.values(stations)) {
    if (st.kind === 'stack') continue;
    if (st.occupant) { st.occupant.removeFromParent(); st.occupant = null; }
    if (snap[st.id]) putOnStation(st, buildThing(snap[st.id]));
  }
  parkRobot();
}

function enterTraining() {
  const given = stations.stand.occupant;
  if (!given) return;
  condition = condFromSpec(specOf(given));   // exact at first; Dusty loosens it
  clearUndo();
  clearScratch();
  preTraining = snapshotWorld();     // the daydream must not disturb the world
  mode = 'training';
  program = [];
  syncBot();                          // after program is replaced, not before
  rebuildCondition();
  bubbleTarget = 1;
  renderProgram(); refreshUI();
  say('The robot is imagining. Everything you do now, it learns.');
}
// Leaving the bubble rewinds the world: what happened in the daydream was never
// real. The robot keeps only the actions it learned.
function leaveTraining(restore = true) {
  clearUndo();
  mode = 'world';
  bubbleTarget = 0;
  clearScratch();
  if (restore && preTraining) restoreWorld(preTraining);
  // The given thing stays on the robot's stand, rewound: it is set up to Run
  // immediately. (A finished RUN is different -- the result goes to the table.)
  preTraining = null;
  parkRobot();
  renderProgram(); refreshUI();
  if (stations.stand.occupant) say('It keeps what it was given — press Run to watch it work.');
}
// Outside its thought bubble the robot just stands there, so send it back to
// its spot rather than leaving it mid-bench.
function parkRobot() {
  if (!root) return;
  root.position.set(0, 0, 0);
  root.rotation.y = 0;
  setLegs(0, 0);
  applyArm(POSE.rest.sh, POSE.rest.el);
  applyJaw(JAW_CLOSED);
}

// --- undo -------------------------------------------------------------------
// Snapshot-based, scoped to the current mode: object moves, typing, joins,
// vacuums and condition erasures undo; mode boundaries (training, running,
// robot changes) clear the stack, since a snapshot from the other side of one
// would restore an inconsistent world.
const undoStack = [];
function pushUndo() {
  if (undoStack.length >= 40) undoStack.shift();
  undoStack.push({
    mode,
    world: snapshotWorld(),
    heldBot: held && ['robot', 'nest', 'bird'].includes(held.userData.kind) ? held : null,
    heldSpec: held && !['robot', 'nest', 'bird'].includes(held.userData.kind) ? specOf(held) : null,
    program: program.slice(),
    condition,
  });
  refreshUI();
}
function clearUndo() { undoStack.length = 0; }
function undo() {
  const e = undoStack[undoStack.length - 1];
  if (!e || e.mode !== mode) return say('Nothing to undo here.');
  undoStack.pop();
  restoreWorld(e.world);
  program = e.program;
  condition = e.condition;
  syncBot();
  if (e.heldBot) takeIntoHand(e.heldBot);
  else if (e.heldSpec) takeIntoHand(buildThing(e.heldSpec));
  renderProgram(); rebuildCondition(); refreshUI();
  say('Undone.');
}

function resetWorld() {
  // robots, nests and birds on the bench survive a reset -- they carry state a
  // rebuild could not restore
  const bots = benchThings.filter(t => ['robot', 'nest', 'bird'].includes(t.userData.kind));
  benchThings.forEach(t => t.removeFromParent());
  benchThings.length = 0;
  bots.forEach(b => putOnBench(b, { x: b.position.x, z: b.position.z }));
  for (const st of Object.values(stations)) {
    if (st.occupant) { st.occupant.removeFromParent(); st.occupant = null; }
    if (st.kind === 'stack') { st.cubes.forEach(c => c.removeFromParent()); st.cubes = []; refillStack(st); }
  }
  // removeFromParent, not scene.remove: while held its parent is the claw
  if (held) { held.removeFromParent(); held = null; }
  parkRobot();
  queue.length = 0; current = null; busy = false; pendingAfter = null;
  refreshUI();
}

function runProgram() {
  if (!activeBot) return say('No robot is at the bench.');
  if (!program.length) return say('The robot has not been trained yet.');
  const given = stations.stand.occupant;
  if (!given) return say('Give it something to work on first.');
  syncBot();
  const members = [activeBot, ...activeBot.team];
  if (!members.some(m => matches(m.condition, specOf(given)))) {
    flagMismatch(mismatchPaths(condition, specOf(given)));
    return sayAttn(members.length > 1
      ? 'No robot on the team recognises what it was given.'
      : `It only runs when given ${condText(condition)} — the red parts don’t match. Wake Dusty and click a red part to vacuum it away, so anything fits there.`);
  }
  clearFlags();
  clearUndo();
  // No world reset, but the robot's own area always starts empty so a replay
  // cannot depend on leftovers from a previous run.
  clearScratch();
  mode = 'replay'; busy = true; runCount = 0;
  nextIteration();
  refreshUI();
}

// The team keeps going as long as some member recognises what is on the stand.
// The first robot whose condition matches takes the pass -- that is ToonTalk's
// team rule, and it is also how a loop is expressed.
function nextIteration() {
  // A pass never ends with something still in the claw: put it down first, so
  // the condition is judged against a settled world.
  stowHeld();
  const given = specOf(stations.stand.occupant);
  const members = [activeBot, ...activeBot.team];
  const member = members.find(m => matches(m.condition, given));
  if (!member) {
    if (members.length === 1) flagMismatch(mismatchPaths(condition, given));
    finishRun();
    return sayAttn(runCount
      ? `Ran ${runCount}× — stopped: the red parts of its thought no longer match. Dusty can vacuum them away.`
      : 'Nothing recognises what it was given — Dusty can vacuum the red parts of its thought.');
  }
  if (runCount >= maxIter) {
    return finishRun(`Stopped after ${maxIter} rounds — the “Rounds” limit, not its condition.`);
  }
  runCount++;
  renderProgram(member.program);         // show the program actually running
  member.program.forEach((step, i) => {
    enqueue(doNow(() => highlight(i)));
    runStep(step);
  });
  enqueue(pause(0.25), doNow(nextIteration));
}
// A run must never end with something stuck in the claw: it would sit there
// invisible to the next run and make the pad look empty.
function stowHeld() {
  if (!held) return;
  const t = held; held = null;
  const stand = stations.stand;
  if (!stand.occupant) putOnStation(stand, t);
  else putOnBench(t, { x: BENCH.x0 + 0.3, z: (BENCH.z0 + BENCH.z1) / 2 });
}
function finishRun(msg) {
  highlight(-1);
  mode = 'world';
  stowHeld();
  clearScratch();
  returnGivenToTable();     // the result goes back on the table, possibly changed
  parkRobot();
  renderProgram();          // back to the lead robot's own list
  if (msg) say(msg);
  refreshUI();
}

// ---------------------------------------------------------------- UI
const $ = (id) => document.getElementById(id);
let hintTimer = null;
function say(msg, hold = 2800) { $('hint').textContent = msg; clearTimeout(hintTimer); hintTimer = setTimeout(() => { hintTimer = null; refreshUI(); }, hold); }
// For messages worth looking up for: flash the message card a few times.
function sayAttn(msg) {
  say(msg, 7000);
  const t = $('title');
  t.classList.remove('attn');
  void t.offsetWidth;              // restart the animation
  t.classList.add('attn');
}
function highlight(i) { [...$('steps').children].forEach((li, k) => li.classList.toggle('now', k === i)); }
// Steps only ever name holes of the robot's own object, never places.
const holeName = (at) => at.path.length
  ? `hole ${at.path.map(i => i + 1).join('.')} of ${CONTAINER_TEXT[at.c]}`
  : CONTAINER_TEXT[at.c];
function describe(s) {
  return s.type === 'newNumber' ? 'take a new number'
       : s.type === 'newBox' ? 'take a new box'
       : s.type === 'newScale' ? 'take a new scale'
       : s.type === 'vacuum' ? `have Dusty vacuum ${holeName(s.at)}`
       : s.type === 'take' ? (s.at.path.length ? `take what is in ${holeName(s.at)}`
           : s.at.c === 'out' ? 'take the copy'
           : s.at.c === 'in' ? 'take back the original'
           : s.at.c === 'given' ? 'pick up what it was given'
           : `pick up ${CONTAINER_TEXT[s.at.c]}`)
       : s.type === 'copy' ? (s.at.path.length ? `copy what is in ${holeName(s.at)}`
           : `make a copy of ${CONTAINER_TEXT[s.at.c]}`)
       : s.type === 'put' ? (s.at.path.length ? `put it in ${holeName(s.at)}`
           : s.at.c === 'in' ? 'put it on the copier'
           : s.at.c === 'given' ? 'drop it on what it was given'
           : `set it down on ${CONTAINER_TEXT[s.at.c]}`)
       : s.type === 'setHoles' ? `give it ${s.n} hole${s.n > 1 ? 's' : ''}`
       : `make it ${ratShort(s.value)}${s.op && s.op !== '+' ? ` (${s.op})` : ''}`;
}
function renderProgram(list = program) {

    + (activeBot?.team.length ? ` · leads ${activeBot.team.length} more` : '');

      : activeBot ? 'not trained yet' : 'no robot at the bench'}</li>`;

  }
  ul.innerHTML = list.map((s, i) =>
    `<li><span class="n">${i + 1}</span><span>${describe(s)}</span></li>`).join('');
}
function refreshUI() {
  const training = mode === 'training';
  $('badge').textContent = mode === 'replay' ? 'repeating' : training ? 'inside the thought' : 'your workshop';
  $('badge').className = 'badge' + (training ? ' training' : '');

  $('runBtn').style.display = training ? 'none' : '';

  $('dustyBtn').textContent = dustyActive ? 'Dusty: awake' : 'Dusty: asleep';

      : kind === 'robot' ? (held.__bot.program.length ? 'a trained robot' : 'a robot')

    holdingBot ? 'Set the little robot on the table, or drop it on another robot to team up.' :
    held ? (activeBot ? (program.length ? 'Click the robot to give it this to work on, or the bench to put it down.'
