  parkRobot();
  renderProgram(); refreshUI();
  if (stations.stand.occupant) say('It keeps what it was given — press Run to watch it work.');
}
// Outside its thought bubble the robot just stands there, so send it back to
// its spot rather than leaving it mid-bench.
function parkRobot() {
  if (!root) return;
  const h = homeFor(activeBot);
  root.position.set(h.pos.x, 0, h.pos.z);
  root.rotation.y = h.yaw;
  setLegs(0, 0);
  applyArm(POSE.rest.sh, POSE.rest.el);
  applyJaw(JAW_CLOSED);
}

// --- undo -------------------------------------------------------------------
// Snapshot-based, scoped to the current mode: object moves, typing, joins,
// vacuums and condition erasures undo; mode boundaries (training, running,
// robot changes) clear the stack, since a snapshot from the other side of one
// would restore an inconsistent world.
const undoStack = [];
function pushUndo() {
  if (undoStack.length >= 40) undoStack.shift();
  undoStack.push({
    mode,
    world: snapshotWorld(),
    heldBot: held && ['robot', 'nest', 'bird'].includes(held.userData.kind) ? held : null,
    heldSpec: held && !['robot', 'nest', 'bird'].includes(held.userData.kind) ? specOf(held) : null,
    program: program.slice(),
    condition,
  });
  refreshUI();
}
function clearUndo() { undoStack.length = 0; }
function undo() {
  const e = undoStack[undoStack.length - 1];
  if (!e || e.mode !== mode) return say('Nothing to undo here.');
  undoStack.pop();
  restoreWorld(e.world);
  program = e.program;
  condition = e.condition;
  syncBot();
  if (e.heldBot) takeIntoHand(e.heldBot);
  else if (e.heldSpec) takeIntoHand(buildThing(e.heldSpec));
  renderProgram(); rebuildCondition(); refreshUI();
  say('Undone.');
}

function resetWorld() {
  // robots, nests and birds on the bench survive a reset -- they carry state a
  // rebuild could not restore
  const bots = benchThings.filter(t => ['robot', 'nest', 'bird', 'notebook', 'room'].includes(t.userData.kind));
  benchThings.forEach(t => t.removeFromParent());
  benchThings.length = 0;
  bots.forEach(b => putOnBench(b, { x: b.position.x, z: b.position.z }));
  for (const st of Object.values(stations)) {
    if (st.occupant) { st.occupant.removeFromParent(); st.occupant = null; }
    if (st.kind === 'stack') { st.cubes.forEach(c => c.removeFromParent()); st.cubes = []; refillStack(st); }
  }
  // removeFromParent, not scene.remove: while held its parent is the claw
  if (held) { held.removeFromParent(); held = null; }
  parkRobot();
  queue.length = 0; current = null; busy = false; pendingAfter = null;
  refreshUI();
}

function runProgram() {
  cancelWaiting();
  if (!activeBot) return say('No robot is at the bench.');
  if (!program.length) return say('The robot has not been trained yet.');
  const given = stations.stand.occupant;
  if (!given) return say('Give it something to work on first.');
  syncBot();
  const members = [activeBot, ...activeBot.team];
  const states0 = members.map(m => matchState(m.condition, specOf(given)));
  if (!states0.includes('yes') && !states0.includes('wait')) {
    flagMismatch(mismatchPaths(condition, specOf(given)));
    return sayAttn(members.length > 1
      ? 'No robot on the team recognises what it was given.'
      : `It only runs when given ${condText(condition)} — the red parts don’t match. Wake Dusty and click a red part to vacuum it away, so anything fits there.`);
  }
  clearFlags();
  clearUndo();
  // No world reset, but the robot's own area always starts empty so a replay
  // cannot depend on leftovers from a previous run.
  clearScratch();
  mode = 'replay'; busy = true; runCount = 0;
  nextIteration();
  refreshUI();
}

// The team keeps going as long as some member recognises what is on the stand.
// The first robot whose condition matches takes the pass -- that is ToonTalk's
// team rule, and it is also how a loop is expressed.
function nextIteration() {
  // A pass never ends with something still in the claw: put it down first, so
  // the condition is judged against a settled world.
  stowHeld();
  const given = specOf(stations.stand.occupant);
  const members = [activeBot, ...activeBot.team];
  const states = members.map(m => matchState(m.condition, given));
  const member = members[states.indexOf('yes')];
  if (!member) {
    if (states.includes('wait')) return enterWaiting();
    if (members.length === 1) flagMismatch(mismatchPaths(condition, given));
    finishRun();
    return sayAttn(runCount
      ? `Ran ${runCount}× — stopped: the red parts of its thought no longer match. Dusty can vacuum them away.`
      : 'Nothing recognises what it was given — Dusty can vacuum the red parts of its thought.');
  }
  if (runCount >= maxIter) {
    return finishRun(`Stopped after ${maxIter} rounds — the “Rounds” limit, not its condition.`);
  }
  runCount++;
  renderProgram(member.program);         // show the program actually running
  member.program.forEach((step, i) => {
    enqueue(doNow(() => highlight(i)));
    runStep(step);
  });
  enqueue(pause(0.25), doNow(nextIteration));
}
// A run must never end with something stuck in the claw: it would sit there
// invisible to the next run and make the pad look empty.
// A gently spread series of bench spots, so repeated automatic placements do
// not stack invisibly on one point.
function benchSpot() {
  const i = benchThings.length;
  return { x: (BENCH.x0 + BENCH.x1) / 2 + ((i % 5) - 2) * 0.22,
           z: (BENCH.z0 + BENCH.z1) / 2 + (((i * 7) % 3) - 1) * 0.16 };
}
function stowHeld() {
  if (!held) return;
  const t = held; held = null;
  const from = t.getWorldPosition(new THREE.Vector3());
  const fromQ = t.getWorldQuaternion(new THREE.Quaternion());
  const stand = stations.stand;
  if (!stand.occupant) putOnStation(stand, t);
  else putOnBench(t, benchSpot());
  enqueueNext(settleInto(t, from, 0.3, fromQ));
}
function finishRun(msg) {
  highlight(-1);
  mode = 'world';
  stowHeld();
  clearScratch();
  // the given STAYS on the desk -- as in ToonTalk, a robot that stops just
  // stops; loosen a red part or raise Rounds and it can go again. It returns
  // to the table only when the robot itself leaves the bench.
  parkRobot();
  renderProgram();          // back to the lead robot's own list
  if (msg) say(msg);
  refreshUI();
}

// --- waiting on a nest ------------------------------------------------------
// When the only thing between the robot and a match is an empty nest, it does
// not give up: it shrinks and dozes until a bird delivers something that fits,
// then springs back up and carries on with the rounds it had left.
const WAIT_SCALE = 0.45;
const waiters = new Set();        // robots dozing over an empty nest
// A walk animated on one robot's own body rather than the bound globals, so it
// stays correct even after another robot has taken the floor.
function glideRoot(bot, to, dur = 0.6) {
  const r = bot.root, p0 = r.position.clone();
  return {
    dur,
    update(t) {
      const e = ease(t);
      r.position.x = lerp(p0.x, to.x, e);
      r.position.z = lerp(p0.z, to.z, e);
      r.position.y = 0.03 * Math.abs(Math.sin(Math.PI * 3 * t));
    },
    end() { r.position.set(to.x, 0, to.z); },
  };
}
// The body scales, not the node: walking targets are world places, and a
// scaled node would bend them.
function setBotScale(bot, v) { bot.root.scale.setScalar(v); }
function enterWaiting() {
  const bot = activeBot;
  bot.waiting = true;
  bot.rounds = runCount;          // it resumes with the rounds it had left
  waiters.add(bot);
  mode = 'world'; busy = false;
  highlight(-1);
  enqueueNext(glideRoot(bot, homeFor(bot).pos, 0.5), {
    dur: 0.5,
    update(t) { setBotScale(bot, lerp(1, WAIT_SCALE, ease(t))); },
    end() { setBotScale(bot, WAIT_SCALE); },
  });
  say('The nest is empty — the robot shrinks and waits for a bird to deliver something.');
  refreshUI();
}
function cancelWaiting(bot = activeBot) {
  if (!bot?.waiting) return;
  bot.waiting = false;
  waiters.delete(bot);
  setBotScale(bot, 1);
}
// A delivery may have satisfied any robot keeping a vigil, not just the one
// being worked with. Whoever it is takes the floor to run its round.
function checkWaiting() {
  if (!waiters.size || busy || mode !== 'world') return;
  for (const bot of waiters) {
    if (!bot.node.parent) { waiters.delete(bot); continue; }
    const given = specOf(bot.stand?.occupant);
    if (!given) continue;
    const members = [bot, ...bot.team];
    if (!members.some(m => matchState(m.condition, given) === 'yes')) continue;
    wakeWaiter(bot);
    return;
  }
}
function wakeWaiter(bot) {
  bot.waiting = false;
  waiters.delete(bot);
  if (bot !== activeBot) {        // it takes the floor, wherever it is standing
    syncBot();
    bindBot(bot);
    renderProgram(); rebuildCondition();
  }
  runCount = bot.rounds;
  mode = 'replay'; busy = true;
  enqueue({
    dur: 0.4,
    update(t) { setBotScale(bot, lerp(WAIT_SCALE, 1, ease(t))); },
    end() { setBotScale(bot, 1); },
  });
  enqueue(doNow(nextIteration));
  say(`A delivery! ${bot.name ? `“${bot.name}”` : 'The robot'} springs back to work.`);
  refreshUI();
}
// Step out of the middle without breaking the vigil: the robot, its desk and
// whatever it was given all move together.
function stepAside(bot) {
  const slot = freeAsideSlot();
  const old = bot.stand ?? defaultStand;
  const st = makeStandStation(slot.dx, slot.dz);
  bot.stand = st;
  bot.home = { pos: new THREE.Vector3(slot.dx, 0, slot.dz), yaw: 0 };
  const given = old.occupant;
  if (given) {
    const from = given.getWorldPosition(new THREE.Vector3());
    old.occupant = null;
    putOnStation(st, given);
    enqueue(settleInto(given, from, 0.6));
  }
  dropStand(old);                 // the middle desk itself stays; extras go
  enqueue(glideRoot(bot, bot.home.pos, 0.7));
}

// ---------------------------------------------------------------- UI
const $ = (id) => document.getElementById(id);

// Steps only ever name holes of the robot's own object, never places.
const holeName = (at) => {

    ? `hole ${at.path.map(i => i + 1).join('.')} of ${containerText(at.c)}`
    : containerText(at.c);

};
function describe(s) {

           : s.at.c === 'in' ? 'take back the original'
           : s.at.c === 'given' ? 'pick up what it was given'
           : `pick up ${containerText(s.at.c)}`)

           : `make a copy of ${containerText(s.at.c)}`)
       : s.type === 'put' ? (s.at.path.length ? `put it in ${holeName(s.at)}`
           : s.at.c === 'in' ? 'put it on the copier'
           : s.at.c === 'given' ? 'drop it on what it was given'

}
function renderProgram(list = program) {

    + (activeBot?.team.length ? ` · leads ${activeBot.team.length} more` : '');

    `<li><span class="n">${i + 1}</span><span>${describe(s)}</span></li>`).join('');
}
function refreshUI() {

      : kind === 'notebook' ? 'a notebook'
      : kind === 'scale' ? 'a scale'
      : kind === 'nest' ? (held.userData.pile.length
          ? `a nest with ${held.userData.pile.length} deliver${held.userData.pile.length > 1 ? 'ies' : 'y'}`
          : held.userData.label ? `the nest “${held.userData.label}”`
          : held.userData.hasEgg ? 'a nest with an egg' : 'a nest')
      : kind === 'bird' ? (held.userData.label ? `the bird “${held.userData.label}”` : 'a bird')
      : `${held.userData.label ? `“${held.userData.label}” — ` : ''}a box with ${held.userData.holes.length} hole${held.userData.holes.length > 1 ? 's' : ''}`;
    $('heldTip').textContent = kind === 'number' ? 'digits set it, − negates, * / ^ set what it does'
      : kind === 'robot' ? 'put it on the table, or on another robot'
      : kind === 'box' ? (held.userData.holes.length <= 9
          ? 'a digit sets its holes; letters name it'
          : 'letters name it; drop it on a box to join')
      : kind === 'room' ? 'set it down; drop a robot in, then things for it to work on'
      : kind === 'notebook' ? 'set it down and drop things on its pages'
      : kind === 'text' ? 'type to write on it; drop it on a pad’s left or right edge to join'

async function importRobotFile(file) {
  try {
    const rec = JSON.parse(await file.text());
    if (rec.kind === 'world') {
      if (busy || mode === 'replay') return say('Wait for the robot to finish first.');
      worldIn(rec);
      return say('Workshop loaded from the file.');
    }
    if (rec.kind === 'thing') {
      if (busy || mode !== 'world') return say('Leave the thought bubble first.');
      nestGroupPending = [];
      const nests = new Map(), birds = [];
      const t = thingIn(rec.thing, nests, birds);
      birds.forEach(b => {
  b.node.__nest = nests.get(b.nestId) ?? null;
  b.node.__nestId = b.nestId ?? null;
  if (!b.node.userData.nestGuid && b.node.__nest) {
    b.node.userData.nestGuid = b.node.__nest.userData.guid;
  }
});
      const groupMap = new Map();
      for (const r2 of nestGroupPending) {
        const gkey = r2.ids.slice().sort((a, b) => a - b).join(',');
        if (!groupMap.has(gkey)) groupMap.set(gkey, []);
        const arr = groupMap.get(gkey);
        arr.push(r2.node);
        r2.node.__group = arr;
      }
      nestGroupPending = null;
      if (!t) throw new Error('the file holds no thing');
      // a full hand puts what it held on the table first, so you SEE the swap
      if (held) {
        const h = held; held = null;
        const from = h.getWorldPosition(new THREE.Vector3());
        putOnBench(h, benchSpot());
        enqueueNext(settleInto(h, from, 0.3));
      }
      scene.add(t);
      t.position.set((BENCH.x0 + BENCH.x1) / 2, BENCH_TOP + 0.6, (BENCH.z0 + BENCH.z1) / 2);
      userTake(t);
      return say('Here it is — in your hand.');
    }
    if (!Array.isArray(rec.program) || !('condition' in rec)) throw new Error('not a robot or world file');
    const name = rec.name || file.name.replace(/\.robot\.json$|\.json$/i, '');
    const node = botIn({ kind: 'robot', name, program: rec.program,
      condition: rec.condition, trainedOn: rec.trainedOn ?? null, team: rec.team || [] });
    if (held) { const h = held; held = null; putOnBench(h, benchSpot()); }
    scene.add(node);
    node.position.set(0, BENCH_TOP + 0.6, 1.6);
    userTake(node);
    say(`Here is “${name}” — set it on the table.`);
  } catch (e) {
    sayAttn('Could not import that file: ' + e.message);
  }
}

let bubbleTarget = 0, bubbleNow = 0;

addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
    e.preventDefault();
    if (!busy && mode !== 'replay') undo();
    return;
  }
  if (!held || busy || mode === 'replay') return;
  const labelKey = e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey;
  // Ctrl/Cmd+C copies the text being edited, Ctrl/Cmd+V pastes onto its end
  const clip = (get, set) => {
    if (!(e.ctrlKey || e.metaKey)) return false;
    const k2 = e.key.toLowerCase();
    if (k2 === 'c') {
      try { navigator.clipboard.writeText(get() || ''); say('Copied.'); } catch {}
      e.preventDefault(); return true;
    }
    if (k2 === 'v') {
      navigator.clipboard.readText().then(txt => {
        if (txt) { pushUndo(); set((get() || '') + txt.replace(/\r/g, '')); refreshUI(); }
      }).catch(() => {});
      e.preventDefault(); return true;
    }
    return false;
  };
  if (held.userData.kind === 'robot') {
    // typing names the robot in your hand; the name shows on its chest
    const bot = held.__bot;
    if (clip(() => bot.name, t2 => { bot.name = t2 || null; paintBotName(bot); })) return;
    if (e.key === 'Backspace') bot.name = (bot.name || '').slice(0, -1);
    else if (labelKey) bot.name = (bot.name || '') + e.key;
    else return;
    if (!bot.name) bot.name = null;
    paintBotName(bot);
    sfx('type');
    e.preventDefault();
    refreshUI();
    return;
  }
  const editLabel = () => {
    if (clip(() => held.userData.label, t2 => setThingLabel(held, t2))) return;
    if (e.key === 'Backspace') {
      if (held.userData.label) { pushUndo(); setThingLabel(held, held.userData.label.slice(0, -1)); }
      e.preventDefault(); refreshUI(); return;
    }
    if (labelKey) { pushUndo(); setThingLabel(held, (held.userData.label || '') + e.key); refreshUI(); }
  };
  if (held.userData.kind === 'text') {
    if (clip(() => held.userData.text, t2 => held.setText(t2))) return;
    if (e.key === 'Backspace') { pushUndo(); held.setText(held.userData.text.slice(0, -1)); e.preventDefault(); }
    else if (e.key === 'Enter') { pushUndo(); held.setText(held.userData.text + '\n'); }
    else if (labelKey) { pushUndo(); held.setText(held.userData.text + e.key); sfx('type'); }
    refreshUI();
    return;
  }
  if (held.userData.kind === 'box') {
    if (/^[1-9]$/.test(e.key)) {
      pushUndo();
      resizeHeldBox(+e.key);
      say(`A box with ${held.userData.holes.length} hole${held.userData.holes.length > 1 ? 's' : ''}.`);
      return;
    }
    if (!/^[0-9]$/.test(e.key)) editLabel();   // digits mean holes; letters name it
    return;
  }
  if (held.userData.kind === 'bird' || held.userData.kind === 'nest'
      || held.userData.kind === 'room') { editLabel(); return; }
  if (held.userData.kind !== 'number') return;
  const v = held.userData.value;
  if (/^[0-9]$/.test(e.key)) {
    // typing digits builds a whole number, keeping its sign; it replaces a
    // fraction outright
    pushUndo();
    const sign = v.n < 0n ? -1n : 1n;
    const mag = v.d === 1n ? (v.n < 0n ? -v.n : v.n) : 0n;
    held.setValue(rat(sign * (mag * 10n + BigInt(e.key))));
    sfx('type');
    refreshUI();
  } else if (e.key === 'Backspace') {
    pushUndo();
    held.setValue(v.d === 1n ? rat(v.n / 10n) : rat(0));
    refreshUI(); e.preventDefault();
  } else if (e.key === '-') {
    // minus makes the number negative -- and adding a negative IS subtraction,
    // so there is no separate subtract operation to type any more
    pushUndo();
    held.setValue(rat(-v.n, v.d));
    say(v.n > 0n ? 'Negative now — dropping it on a number subtracts.' : 'Positive again.');
    refreshUI();
  } else if (['+', '*', '/', '^'].includes(e.key) || e.key === 'x' || e.key === 'X') {
    pushUndo();
    const op = (e.key === 'x' || e.key === 'X') ? '*' : e.key;
    held.setOp(op);
    say(`This number will ${ {'+':'add','*':'multiply by','/':'divide by','^':'raise to the power of'}[op] } when you drop it on another.`);
    refreshUI();
  }
});

function tipFor(t) {

  if (dustyActive && !held && (t.kind === 'thing'
      || (t.kind === 'botThing' && t.bot !== activeBot))) {

  }
  if (t.kind === 'thing' && held?.userData.kind === 'text'
      && t.thing?.userData.kind === 'text') {
    return 'Drop to join the pads — left edge reads first, right edge last.';
  }
  if (t.kind === 'station') {
    const st = stations[t.id];
    if (st.kind === 'stack') {
      if (t.id === 'minis') return training ? null
        : 'The robot stack — take a little robot and set it on the table.';
      if (t.id === 'numbers') return training
        ? 'Click to have the robot take a fresh number.'
        : 'The number stack — click to take a 1, then type digits to change it.';
      if (t.id === 'rooms') return training ? null
        : 'The room stack — each holds a whole workshop. Drop a robot in, then things for it to work on; click its door to step inside.';
      if (t.id === 'texts') return training
        ? 'Click to have the robot take a fresh text pad.'
        : 'The text stack — take a blank pad and type on it.';
      if (t.id === 'nests') return training
        ? 'Click to have the robot take a fresh nest.'
        : 'The nest stack — each nest holds an egg. Set one on the table and watch.';
      if (t.id === 'scales') return training
        ? 'Click to have the robot take a fresh scale.'
        : 'The scale stack — a scale tips toward the larger of the numbers in its two holes.';
      return training ? 'Click to have the robot take a fresh box.'
        : 'The box stack — click to take a box; type a digit to change its holes.';
    }
    if (st.kind === 'copyIn' || st.kind === 'copyOut') {
      const who = training ? 'the robot' : 'you';
      return held ? `The copier — click to have ${who} set that on the platform; a copy drops into the tray.`
        : stations.copyOut.occupant ? 'The copier — click to take the copy from the tray.'
        : stations.copyIn.occupant ? 'The copier — click to take the original back.'
        : 'The copier — put something on it and an exact copy drops into the tray.';
    }
    if (st.kind === 'stand') {
      return held && activeBot ? 'The robot’s stand — click to give that to the robot.'
        : 'The robot’s stand — whatever it is given sits here while it works.';
    }
    if (st.kind === 'scratch') return `${st.label[0].toUpperCase()}${st.label.slice(1)} — the robot’s own work spot, swept clean when it finishes.`;
    return null;
  }
  if (t.kind === 'bench') {
    if (held?.userData.kind === 'text' && t.point) {
      const near = benchThings.find(t2 => t2 !== held && t2.userData.kind === 'text'
        && Math.abs(t.point.x - t2.position.x) < 0.45 && Math.abs(t.point.z - t2.position.z) < 0.36);
      if (near) return 'Drop to join the pads — this side decides the order.';
    }
    return held ? 'Your workbench — click to put that down.'
                : 'Your workbench — build here. Robots cannot reach it.';
  }
  if (t.kind === 'dusty') {
    return dustyActive
      ? 'Dusty is awake — click a part of the robot’s thought to vacuum it away.'
      : 'Dusty the vacuum — click to wake him, then click parts of a robot’s thought to erase them.';
  }
  if (t.kind === 'miniCond') {
    return 'Its little thought — click to take a copy of the very thing it was first shown.';
  }
  if (held && (t.kind === 'roomDoor' || t.kind === 'roomRoof'
      || (t.kind === 'thing' && t.thing?.userData.kind === 'room'))) {
    return 'Drop to send that inside — it lands on the desk, and the room’s robot gets to work.';
  }
  if (t.kind === 'roomDoor') {
    return 'The door — click to step inside: the room becomes the world around you, and this one shrinks onto its table.';
  }
  if (t.kind === 'roomRoof') {
    return 'The roof — click to switch between solid walls (works instantly, unseen) and glass (you can watch). A robot stopped at the Rounds limit also picks its work back up.';
  }
  if (t.kind === 'ruby') {
    return rubyActive
      ? 'Ruby is awake — click things or thought parts to erase them one step more general.'
      : 'Ruby the eraser — click to wake her; she erases things in place and loosens robot thoughts.';
  }
  if (t.kind === 'cond') {
    return 'The robot’s thought: the shape it must be given before it will run. '
      + (!held && activeBot?.trainedOn
          ? 'Click to take a copy of the very thing it was first shown. '
          : 'Red parts didn’t match. ')
      + 'Dusty can vacuum any part into an anything.';

  if (t.kind === 'botThing') {
    const bot = t.bot, trained = bot.program.length;
    const teamNote = bot.team.length ? ` It leads a team of ${bot.team.length + 1}.` : '';
    const who = bot.name ? `“${bot.name}”` : 'The robot';
    if (bot === activeBot) {
      return held
        ? (trained ? 'Click to give it that to work on.' : 'Click to give it that — that starts its training.')
        : `${who} at the bench${trained ? ` (${trained} steps trained).` : ' — untrained.'} Click to shrink it into your hand.${teamNote}`;
    }
    if (held?.userData.kind === 'robot') {
      return 'Drop to form a team — each pass, the first member that recognises the thing runs.';
    }
    if (held) return activeBot ? 'Another robot is already at the bench.'
      : 'Drop that on it: it wakes, grows, and takes it — training if it is untrained.';
    if (trained) {
      const lines = bot.program.slice(0, 8).map((st2, i) => `${i + 1}. ${describe(st2)}`);
      if (bot.program.length > 8) lines.push(`… and ${bot.program.length - 8} more`);
      return `${bot.name ? `“${bot.name}” — runs` : 'Runs'} on ${condText(bot.condition)}:\n${lines.join('\n')}${teamNote ? '\n' + teamNote.trim() : ''}\nClick to pick it up.`;
    }
    return 'A little robot, untrained — click to pick it up.';
  }
  if (t.kind === 'thing') {
    const ud = t.thing.userData;
    if (ud.kind === 'number') {
      if (held?.userData.kind === 'number') {
        const o = held.userData.op, hv = ratShort(held.userData.value), tv = ratShort(ud.value);
        return 'Drop to ' + (o === '+' ? `add ${hv} to ${tv}` : o === '-' ? `subtract ${hv} from ${tv}`
          : o === '*' ? `multiply ${tv} by ${hv}` : o === '/' ? `divide ${tv} by ${hv}`
          : `raise ${tv} to the power ${hv}`) + '.';
      }
      const OPW = { '+': 'adds itself to', '-': 'subtracts itself from', '*': 'multiplies',
                    '/': 'divides', '^': 'raises the power of' };
      return `${ratShort(ud.value)} — dropped on a number, it ${OPW[ud.op]} it. Click to pick it up; then type digits or + − * / ^.`;
    }
    if (ud.kind === 'box') {
      return `A box with ${ud.holes.length} hole${ud.holes.length > 1 ? 's' : ''} — holes hold numbers or boxes.`
        + (held ? ' Click a hole to fill it.' : ' Click to pick it up.');

    if (ud.kind === 'scale') {

    }
    if (ud.kind === 'nest') {
      if (ud.hasEgg) return 'A nest with an egg — set it on the table and watch.';
      if (ud.pile.length) return `A nest with ${ud.pile.length} deliver${ud.pile.length > 1 ? 'ies' : 'y'} — the top is the oldest; click to take it.`;
      return 'An empty nest — its bird delivers here.';

    if (ud.kind === 'bird') {

                  : 'A bird — drop something on her to send it to her nest, or click to pick her up.';
    }
    return null;
  }
  if (t.kind === 'hole') {
    const pan = t.box?.userData.kind === 'scale';

    const what = !occ ? 'empty'

// small canvas painters, one per material family
function speckTexture(w, base, marks, n, mk) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = w;
  const c = cv.getContext('2d');
  c.fillStyle = base; c.fillRect(0, 0, w, w);
  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < n; i++) mk(c, rnd, w, marks);
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}
function metalTexture(base, streak) {
  return speckTexture(128, base, streak, 90, (c, rnd, w, sk) => {
    c.strokeStyle = `rgba(${sk},${(0.05 + rnd() * 0.12).toFixed(2)})`;
    c.lineWidth = 0.5 + rnd();
    const y = rnd() * w;
    c.beginPath(); c.moveTo(0, y); c.lineTo(w, y + (rnd() - 0.5) * 3); c.stroke();
  });
}
function strawTexture() {
  return speckTexture(128, '#8a6a3b', null, 240, (c, rnd, w) => {
    c.strokeStyle = rnd() > 0.5 ? 'rgba(201,162,90,0.5)' : 'rgba(90,64,30,0.4)';
    c.lineWidth = 0.8 + rnd() * 1.2;
    const x = rnd() * w, y = rnd() * w, a = rnd() * Math.PI;
    const l = 6 + rnd() * 14;
    c.beginPath(); c.moveTo(x, y);
    c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
  });
}
function leatherTexture() {
  return speckTexture(128, '#7a1f16', null, 500, (c, rnd, w) => {
    c.fillStyle = rnd() > 0.5 ? 'rgba(0,0,0,0.12)' : 'rgba(255,190,170,0.07)';
    c.fillRect(rnd() * w, rnd() * w, 1 + rnd() * 2, 1 + rnd() * 2);
  });
}
function stuccoTexture() {
  return speckTexture(128, '#d8cfae', null, 420, (c, rnd, w) => {
    c.fillStyle = rnd() > 0.5 ? 'rgba(120,110,80,0.10)' : 'rgba(255,255,255,0.25)';
    c.fillRect(rnd() * w, rnd() * w, 1 + rnd() * 2.5, 1 + rnd() * 2.5);
  });
}
function woodTexture() {
  const cv = document.createElement('canvas');
  cv.width = 256; cv.height = 256;
  const c = cv.getContext('2d');
  c.fillStyle = '#6b5636'; c.fillRect(0, 0, 256, 256);
  let seed = 5;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 70; i++) {
    c.strokeStyle = `rgba(${40 + rnd() * 44 | 0},${30 + rnd() * 26 | 0},16,${0.10 + rnd() * 0.22})`;
    c.lineWidth = 0.6 + rnd() * 2.6;
    c.beginPath();
    const y = rnd() * 256;
    c.moveTo(0, y);
    for (let x = 0; x <= 256; x += 32) {
      c.lineTo(x, y + Math.sin(x * 0.04 + i * 2.1) * 3 + rnd() * 2);
    }
    c.stroke();
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}
function buildBench() {
  benchParts.forEach(p => p.removeFromParent());
  benchParts.length = 0;
  const w = BENCH.x1 - BENCH.x0, d = BENCH.z1 - BENCH.z0;
  const cx = (BENCH.x0 + BENCH.x1) / 2, cz = (BENCH.z0 + BENCH.z1) / 2;
  woodTex ??= woodTexture();
  woodTex.repeat.set(Math.max(1, w / 1.3), Math.max(1, d / 1.3));
  const topMat = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.72 });
  const top = new THREE.Mesh(new THREE.BoxGeometry(w, 0.07, d), topMat);
  top.position.set(cx, BENCH_TOP - 0.035, cz);
  top.castShadow = true; top.receiveShadow = true;
  setPick(top, { kind: 'bench' });
  scene.add(top);
  benchParts.push(top);
  const legMat = new THREE.MeshStandardMaterial({ color: 0x33383f, roughness: 0.6, metalness: 0.4 });
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.045, BENCH_TOP - 0.07, 16), legMat);
    leg.position.set(cx + sx * (w / 2 - 0.1), (BENCH_TOP - 0.07) / 2, cz + sz * (d / 2 - 0.1));
    leg.castShadow = true;
    scene.add(leg);
    benchParts.push(leg);
  }
  benchHandles.forEach((h, i) => h.position.copy(cornerOf(i)));
}
function showHandles(on) {
  if (on && !benchHandles.length) {
    for (let i = 0; i < 4; i++) {
      const h = new THREE.Mesh(new THREE.SphereGeometry(0.07, 18, 14),
        new THREE.MeshStandardMaterial({ color: 0x9fd8ff, roughness: 0.3,
          emissive: 0x2c6f8c, emissiveIntensity: 1.2, toneMapped: false }));
      h.position.copy(cornerOf(i));
      setPick(h, { kind: 'benchHandle', corner: i });
      scene.add(h);
      benchHandles.push(h);
    }
  }
  benchHandles.forEach(h => { h.visible = on; });
}
function dragCorner(hit) {
  const i = grabbedCorner;
  const MIN = 0.8;
  // each corner owns one x edge and one z edge; clamps keep the table sane
  // and out of the robot's row of stacks
  if (i % 2) BENCH.x1 = Math.min(4.2, Math.max(BENCH.x0 + MIN, hit.x));
  else BENCH.x0 = Math.max(-3.0, Math.min(BENCH.x1 - MIN, hit.x));
  if (i < 2) BENCH.z0 = Math.max(0.9, Math.min(BENCH.z1 - MIN, hit.z));
  else BENCH.z1 = Math.min(3.4, Math.max(BENCH.z0 + MIN, hit.z));
  buildBench();
}
function releaseCorner() {
  grabbedCorner = null;
  // anything the shrink left overboard slides back onto the top
  for (const t of benchThings) {
    t.position.x = Math.min(BENCH.x1 - 0.12, Math.max(BENCH.x0 + 0.12, t.position.x));
    t.position.z = Math.min(BENCH.z1 - 0.12, Math.max(BENCH.z0 + 0.12, t.position.z));
  }
  try { localStorage.setItem(TABLE_KEY, JSON.stringify(BENCH)); } catch {}
  say('The table keeps this shape.');
  refreshUI();
}

// ---------------------------------------------------------------- loop
let last = performance.now();
renderer.setAnimationLoop((now) => {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (worldReady) {
    if (speed === Infinity) { fastForward(); advanceWorldClocks(dt); }
    else tick(dt * speed);
  }
  if (condDisplay) {
    condDisplay.position.lerp(condAnchor(), Math.min(1, dt * 7));
    // the red mismatch marks pulse until something actually changes -- fading
    // them on a timer left the user with a message about parts they could no
    // longer see
    if (flagged.length) {
      flagTime += dt;
      const pulse = 0.7 + 0.9 * Math.abs(Math.sin(flagTime * 5));
      for (const f of flagged) f.m.emissiveIntensity = pulse;
    }
  }
  // numbers near the camera redraw with more digits and a finer canvas
  lodClock += dt;
  if (lodClock > 0.5) {
    lodClock = 0;
    for (let i = allNumbers.length - 1; i >= 0; i--) {
      const nmb = allNumbers[i];
      if (!nmb.parent) { allNumbers.splice(i, 1); continue; }
      const dist = camera.position.distanceTo(nmb.getWorldPosition(_lodV));
      const tier = dist < 3.6 ? 2 : 1;
      if (tier !== nmb.__lod) { nmb.__lod = tier; nmb.__redraw(); }
    }
  }
  // scales tip toward the larger number, pans staying level
  for (let i = allScales.length - 1; i >= 0; i--) {
    const sc = allScales[i];
    if (!sc.parent) { allScales.splice(i, 1); continue; }
    const [a, b] = sc.userData.holes.map(h => h.thing);
    let targetTilt = 0;
    if (a?.userData.kind === 'number' && b?.userData.kind === 'number') {
      const d = a.userData.value.n * b.userData.value.d - b.userData.value.n * a.userData.value.d;
      targetTilt = d > 0n ? SCALE_TILT : d < 0n ? -SCALE_TILT : 0;
    }
    const piv = sc.__pivot;
    piv.rotation.z += (targetTilt - piv.rotation.z) * Math.min(1, dt * 5);
    sc.__pans.forEach(p => { p.rotation.z = -piv.rotation.z; });
  }
  // Dusty visibly awake: he sways and breathes until he is put back to sleep
  if (dusty) {
    if (dustyActive) {
      dustyBase ??= { y: dusty.rotation.y, s: dusty.scale.x };
      dustyT += dt;
      dusty.rotation.z = Math.sin(dustyT * 5) * 0.09;
      dusty.rotation.y = dustyBase.y + Math.sin(dustyT * 3.3) * 0.28;
      dusty.scale.setScalar(dustyBase.s * (1 + 0.035 * Math.sin(dustyT * 7)));
    } else if (dustyBase) {
      dusty.rotation.z = 0;
      dusty.rotation.y = dustyBase.y;
      dusty.scale.setScalar(dustyBase.s);
      dustyBase = null; dustyT = 0;
    }
  }
  // rooms with pending work run the moment the outer world goes quiet
  if (worldReady && !busy && !held && !queue.length && !current && mode === 'world') {
    processDirtyRooms();
  }
  if (ruby) {
    if (rubyActive) {
      rubyBase ??= { y: ruby.rotation.y, s: ruby.scale.x };
      rubyT += dt;
      ruby.rotation.z = Math.sin(rubyT * 6) * 0.14;
      ruby.rotation.y = rubyBase.y + Math.sin(rubyT * 2.8) * 0.3;
      ruby.scale.setScalar(rubyBase.s * (1 + 0.04 * Math.sin(rubyT * 8)));
    } else if (rubyBase) {
      ruby.rotation.z = 0;
      ruby.rotation.y = rubyBase.y;
      ruby.scale.setScalar(rubyBase.s);
      rubyBase = null; rubyT = 0;
    }
  }
  bubbleNow += (bubbleTarget - bubbleNow) * Math.min(1, dt * 4);
  bubbleMat.opacity = BUBBLE_OPACITY * bubbleNow;
  bubble.visible = bubbleNow > 0.01;
  for (let i = flashes.length - 1; i >= 0; i--) {
    const f = flashes[i];
    f.t += dt / 0.45;
    f.m.scale.setScalar(1 + f.t * 1.7);
    f.m.material.opacity = 0.55 * (1 - f.t);
    if (f.t >= 1) { scene.remove(f.m); flashes.splice(i, 1); }
  }
  orbit.update();
  renderer.render(scene, camera);
});

// dev hook -- lets the whole thing be driven headlessly (see serve.js /capture)
window.__nano = {
  THREE, scene, camera, renderer, stations,
  worldOut, worldIn, setThingLabel,
  get ready() { return worldReady; },
  get state() { return { mode, busy, program, queued: queue.length,
    held: held ? (held.userData.kind === 'number'
      ? ratText(held.userData.value) + (held.userData.op === '+' ? '' : ` ${held.userData.op}`)
      : held.userData.kind) : null }; },
  get active() { return activeBot ? { id: activeBot.id, steps: activeBot.program.length,
    team: activeBot.team.length } : null; },
  benchBots() { return benchThings.filter(t => t.userData.kind === 'robot'); },
  clickBot(node) { handleClick({ kind: 'botThing', bot: node.__bot }); },
  clickActive() { if (activeBot) handleClick({ kind: 'botThing', bot: activeBot }); },
  step(dt, n = 1) { for (let i = 0; i < n; i++) tick(dt); },
  settle(max = 9000) { let i = 0; while ((current || queue.length || busy) && i++ < max) tick(1 / 60); return i; },
  draw() { renderer.render(scene, camera); },
  pick(station, path = []) { handleClick({ kind: 'station', id: station }); if (path.length) throw new Error('use pickAt'); },
  click(station) { handleClick({ kind: 'station', id: station }); },
  giveRobot() {
    const bot = activeBot ?? benchThings.find(t => t.userData.kind === 'robot')?.__bot;
    if (bot) handleClick({ kind: 'botThing', bot });
  },
  clickThing(t) { handleClick({ kind: 'thing', thing: t }); },
  clickHole(box, index) { handleClick({ kind: 'hole', box, index }); },
  clickBench(x = 0.3, z = ROW_Z) { handleClick({ kind: 'bench', point: new THREE.Vector3(x, BENCH_TOP, z) }); },
  scratch() { return Object.values(stations).filter(s2 => s2.kind === 'scratch').map(s2 => s2.occupant); },
  handPos() { return handNode.position.toArray().map(n => +n.toFixed(2)); },
  heldPos() { return held ? held.getWorldPosition(new THREE.Vector3()).toArray().map(n => +n.toFixed(2)) : null; },
  mine(path = []) { return thingAt({ c: 'given', path }); },
  at(c, path = []) { return thingAt({ c, path }); },
  bench(i = 0) { return benchThings[i]; },
  type(v, op) { if (held) { held.setValue(rat(v), op); refreshUI(); } },
  setOp(op) { if (held) { held.setOp(op); refreshUI(); } },
  speed(s) { speed = s === 'inf' ? Infinity : s; document.getElementById('speed').value = s; },
  rounds(n) { maxIter = n; document.getElementById('rounds').value = n; },
  reset() { clearUndo(); if (mode === 'training') leaveTraining(false); resetWorld(); },
  exit() { leaveTraining(); },
  run() { runProgram(); },
  dusty(on = true) { dustyActive = on; if (on) rubyActive = false; refreshUI(); },
  rubyOn(on = true) { rubyActive = on; if (on) dustyActive = false; refreshUI(); },
  erase(path) { dustyErase(path); },
  clickCond(path = []) { handleClick({ kind: 'cond', path }); },
  clickRaw(target) { handleClick(target); },
  get hatchN() { return hatching.length; },
  get flagged() { return flagged.length; },
  save(name) { saveRobot(name); },
  load(name) { loadRobot(name); },
  library() { return Object.keys(loadLibrary()); },
  holes(n) { if (held?.userData.kind === 'box') resizeHeldBox(n); },
  get condition() { return condition; },
  get condText() { return condText(condition); },
  get hint() { return document.getElementById('hint').textContent; },
  dump() {
    const d = (t) => !t ? null
      : t.userData.kind === 'number'
        ? ratText(t.userData.value) + (t.userData.op === '+' ? '' : ` ${t.userData.op}`)
      : t.userData.kind === 'robot' ? 'robot'
      : t.userData.kind === 'text' ? { text: t.userData.text }
      : t.userData.kind === 'notebook' ? { notebook: t.userData.pages.length }
      : t.userData.kind === 'room' ? { room: { has: !!t.userData.world, dirty: !!t.userData.dirty } }
      : t.userData.kind === 'bird' ? 'bird'
      : t.userData.kind === 'nest' ? { nest: t.userData.pile.map(d) }
      : { [t.userData.kind]: t.userData.holes.map(h => d(h.thing)) };
    return { stand: d(stations.stand.occupant), bench: benchThings.map(d),
             copyIn: d(stations.copyIn.occupant), copyOut: d(stations.copyOut.occupant) };
  },
};
</script>
