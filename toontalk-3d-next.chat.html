<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ToonTalk 3D</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b8241a'/%3E%3Crect x='5' y='11' width='22' height='9' rx='3' fill='%23141821'/%3E%3Ccircle cx='11.5' cy='15.5' r='3' fill='%237fe9ff'/%3E%3Ccircle cx='20.5' cy='15.5' r='3' fill='%237fe9ff'/%3E%3Crect x='14.6' y='2' width='2.8' height='6' rx='1.4' fill='%23efe2c6'/%3E%3Ccircle cx='16' cy='3' r='3' fill='%23ffb01f'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #eef1f6; --dim: #97a2b3; --panel: rgba(15, 19, 27, 0.86);
    --edge: rgba(255,255,255,.12); --accent: #ff7a5c; --go: #6ee7a8; --think: #7fd4ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #12151b; color: var(--ink);
         font: 14px/1.5 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  /* The world ends above the bottom bar rather than running under it: a bar
     floating over the table stole every drop aimed at the wood beneath it,
     and the carried thing had to dodge the pointer on its way there. */
  #app { position: fixed; left: 0; right: 0; top: 0; bottom: var(--barh, 0px); }
  canvas { display: block; }

  .card { position: fixed; background: var(--panel); border: 1px solid var(--edge);
          border-radius: 12px; backdrop-filter: blur(8px); padding: 12px 14px; }
  #title { top: 14px; left: 14px; max-width: 300px; }
  /* YOUR HAND, BY WORD: one line at the top, centre, where nothing else sits */
  #handBar { position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
             display: none; align-items: center; gap: 6px; z-index: 39;
             padding: 6px 8px; max-width: calc(100vw - 660px); }
  #handBar.on { display: flex; }
  #handIn { font: inherit; font-size: 13px; color: var(--ink); width: min(460px, 60vw);
            background: rgba(255,255,255,.07); border: 1px solid var(--edge);
            border-radius: 8px; padding: 6px 10px; }
  #handIn:disabled { opacity: .6; }
  #handStatus { font-size: 12px; color: var(--dim); white-space: nowrap; }
  #handLog { display: none; position: absolute; left: 0; right: 0; top: 100%; margin-top: 4px;
             max-height: 150px; overflow: auto; font-size: 12px; line-height: 1.4;
             padding: 6px 10px; background: rgba(18,22,30,.94); border: 1px solid var(--edge);
             border-radius: 8px; color: var(--ink); }
  #handLog.on { display: block; }
  #handLog .you { color: var(--dim); margin-top: 4px; }
  #handLog .you:first-child { margin-top: 0; }
  #handLog .no { color: #f0a091; }
  #handLog .ok { color: #9ddc9d; }
  #handLog .ws { color: var(--dim); font-style: italic; }
  #handLog .ws.attn { color: var(--accent); }
  #handLog { position: fixed; top: 74px; left: auto; right: 14px; transform: none; width: min(420px, 92vw); max-height: 40vh; z-index: 41; }
  #handLog.free { left: 14px; top: auto; bottom: calc(var(--barh, 0px) + 10px); transform: none; width: min(520px, 92vw); max-height: 45vh; }
  @media (max-width: 1000px) { #handLog:not(.free) { top: auto; bottom: calc(var(--barh, 0px) + 62px); } }
  #handMic.on { filter: drop-shadow(0 0 4px #f66); }
  @media (max-width: 1000px) { #handBar { top: auto; bottom: calc(var(--barh, 0px) + 10px);
                                          max-width: calc(100vw - 28px); } }
  /* FOLDED: the first line and the hint only. On a short viewport the whole
     card covered the back door (ChatGPT, 800x450); it folds itself there. */
  #title.min > :not(h1):not(#hint):not(#titleMin) { display: none; }
  #title.min h1 { padding-right: 24px; }
  #title h1 { margin: 0 0 3px; font-size: 15px; font-weight: 650; }
  #title h1 .badge { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase;
                     padding: 2px 7px; border-radius: 999px; margin-left: 6px;
                     background: rgba(255,255,255,.1); color: var(--dim); vertical-align: 2px; }
  #title h1 .badge.training { background: rgba(127,212,255,.2); color: var(--think); }
  #title p { margin: 0; font-size: 12px; color: var(--dim); }
  #hint { margin-top: 8px !important; color: var(--accent) !important; }
  .guideGlow { box-shadow: 0 0 0 3px #ffd27a, 0 0 16px #ffd27a !important; animation: guidePulse 1.2s ease-in-out infinite; }
  @keyframes guidePulse { 0%, 100% { box-shadow: 0 0 0 3px #ffd27a, 0 0 10px #ffd27a; } 50% { box-shadow: 0 0 0 5px #ffd27a, 0 0 22px #ffd27a; } }
  #title.attn { animation: attn 0.65s ease 3; }
  @keyframes attn {
    0%, 100% { background: var(--panel); }
    50% { background: rgba(127, 212, 255, 0.28); }
  }

  #prog { top: 14px; right: 14px; width: 232px; max-height: 60vh;
          display: flex; flex-direction: column; }
  /* only the step list scrolls: Save and Import stay in view however long a
     robot's program grows */
  #steps { overflow: auto; min-height: 0; }
  #prog h2 { margin: 0 0 4px; font-size: 11px; letter-spacing: .09em;
             text-transform: uppercase; color: var(--dim); font-weight: 650; }
  #trainedOn { margin: 0 0 8px; font-size: 11.5px; color: var(--think); }
  #trainedOn:empty { display: none; }
  /* the robot's note: a quiet line under its thought that becomes a field
     when you click it, and grows with what is written */
  #botNote { display: none; width: 100%; box-sizing: border-box; margin: 0 0 8px; padding: 4px 7px;
    font: inherit; font-size: 11.5px; line-height: 1.35; color: var(--ink);
    background: rgba(255,255,255,.05); border: 1px solid transparent; border-radius: 7px;
    resize: none; overflow: hidden; flex-shrink: 0; }   /* the step list is what scrolls, not the note */
  #botNote.on { display: block; }
  #botNote:hover, #botNote:focus { border-color: var(--edge); background: rgba(255,255,255,.08); outline: none; }
  #botNote::placeholder { color: var(--dim); font-style: italic; }
  #steps { margin: 0; padding: 0; list-style: none; font-size: 12.5px; }
  #steps li { display: flex; gap: 8px; padding: 3px 0; border-top: 1px solid rgba(255,255,255,.06); }
  #steps li:first-child { border-top: 0; }
  #steps .n { color: var(--dim); font-variant-numeric: tabular-nums; min-width: 14px; }
  #steps li.now { color: var(--go); }
  #steps .empty { color: var(--dim); font-style: italic; }
  #library { margin-bottom: 10px; padding-bottom: 9px; border-bottom: 1px solid var(--edge); }
  #library .row { display: flex; gap: 5px; }
  #library .row + .row { margin-top: 5px; }
  #library input, #library select { flex: 1; min-width: 0; font: inherit; font-size: 12px;
    color: var(--ink); background: rgba(255,255,255,.07);
    border: 1px solid var(--edge); border-radius: 7px; padding: 4px 7px; }
  #library button { padding: 4px 9px; font-size: 12px; }
  #library option { background: #171b23; }

  /* On a tablet held upright the row is wider than the screen, and its last
     buttons -- undo, full screen -- were simply off the edge. The two bottom
     cards live in one column now: the row wraps to as many lines as it needs
     and the holding card rides on top of it, so no arithmetic anywhere has to
     know how tall either of them turned out. */
  #bottom { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            max-width: calc(100vw - 24px); }
  /* width:max-content is what keeps it on ONE row wherever one row fits. A
     wrapping flex box asked for its shrink-to-fit width answers with the
     NARROWER wrapped layout, so the row broke in two while there was still
     half a screen of room beside it. */
  #bar { position: relative; display: flex; align-items: center; justify-content: center;
         flex-wrap: wrap; width: max-content; max-width: 100%;
         gap: 8px; padding: 9px 10px; }
  button { font: inherit; font-size: 12.5px; color: var(--ink);
           background: rgba(255,255,255,.07); border: 1px solid var(--edge);
           border-radius: 8px; padding: 6px 11px; cursor: pointer; }
  button:hover:not(:disabled) { background: rgba(255,255,255,.15); }
  /* the generic hover above out-specifies the colour classes, which turned the
     coloured buttons grey on hover -- restore their colour and just brighten */
  button.go:hover:not(:disabled) { background: var(--go); filter: brightness(1.1); }
  button.think:hover:not(:disabled) { background: var(--think); filter: brightness(1.1); }
  button.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.1); }
  button:disabled { opacity: .35; cursor: default; }
  button.think { background: var(--think); border-color: var(--think); color: #06212e; font-weight: 650; }
  button.go { background: var(--go); border-color: var(--go); color: #06301e; font-weight: 650; }
  .sep { width: 1px; height: 20px; background: var(--edge); margin: 0 2px; }
  label[for=speed], label[for=rounds] { font-size: 12px; color: var(--dim); }
  #rounds { width: 64px; font: inherit; font-size: 12.5px; color: var(--ink);
            background: rgba(255,255,255,.07); border: 1px solid var(--edge);
            border-radius: 8px; padding: 5px 7px; }
  select { font: inherit; font-size: 12.5px; color: var(--ink);
           background: rgba(255,255,255,.07); border: 1px solid var(--edge);
           border-radius: 8px; padding: 5px 7px; }
  select option { background: #171b23; }

  /* top centre, clear of the bench where drops land -- at the bottom it sat
     exactly where a click meant to put the held thing down */
  #held { position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
          z-index: 25; max-width: min(92vw, 680px); padding: 7px 13px;
          display: none; align-items: center; gap: 9px; }
  #held.on { display: flex; }
  #held .v { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums;
             color: var(--accent); min-width: 24px; text-align: center; }
  #held .k { font-size: 11.5px; color: var(--dim); }
  /* the keyboard is a touch screen's only way in; a machine with keys of its
     own has no use for the button and does not show it */
  #heldKeys, #heldTurn, #heldPanel, #heldPlus, #heldMinus, #heldRead { display: none; padding: 3px 9px; font-size: 15px; line-height: 1.2; }
  #held.pad #heldRead, #held.pad #heldFit { display: block; font-size: 12px; }
  #heldFit { display: none; padding: 3px 9px; line-height: 1.2; }
  body.touching #heldKeys, body.touching #heldTurn { display: block; }
  /* the turn button is worth having with a mouse too -- the arrow keys are
     not a thing anybody guesses; the panel button is the door to the whole
     panels feature, so it shows everywhere as well */
  #heldTurn, #heldPanel, #heldPlus, #heldMinus { display: block; }
  #heldKeys.on { background: var(--accent); border-color: var(--accent); color: #06212e; }
  /* The row only has room for what is reached often. The rest lives behind
     the three dots: the table's shape, the manual, sound, reporting a bug. */
  #moreBtn { font-size: 16px; line-height: 1; padding: 4px 9px; }
  /* Playing: looking straight at a pad is a game, and the workshop's own
     cards, tooltips and pointer are not part of it. The bar stays -- Pause
     lives there -- and Escape comes back. */
  body.playing #title, body.playing #prog, body.playing #held,
  body.playing #tip { display: none !important; }
  body.playing canvas { cursor: none; }
  #moreMenu { display: none; position: absolute; right: 0; bottom: calc(100% + 8px);
              flex-direction: column; align-items: stretch; gap: 6px;
              min-width: 190px; padding: 8px; z-index: 30;
              background: var(--panel); border: 1px solid var(--edge);
              border-radius: 12px; backdrop-filter: blur(8px);
              box-shadow: 0 10px 30px rgba(0,0,0,.45); }
  #moreMenu.on { display: flex; }
  #moreMenu button { text-align: left; }
  #moreMenu .sndrow { display: flex; align-items: center; gap: 8px; }
  #moreMenu .sndrow input { flex: 1; min-width: 0; }
  /* SMALL SCREENS (Codex's report: at 390 wide the actions card lay over the
     title card, and in a short landscape Marty's panel ran off the top, close
     button and all). Every card keeps inside the window and scrolls inside
     itself; Marty's panel stands above the bar, not on it; and below 600px
     the two top cards share the width in one column, the actions card under
     the title, so neither covers the other. */
  #prog { max-height: min(60vh, calc(100vh - var(--barh, 0px) - 28px)); }
  #martyPanel { bottom: calc(var(--barh, 0px) + 10px) !important;
             max-height: calc(100vh - var(--barh, 0px) - 24px); box-sizing: border-box;
             overflow: auto; }
  #martyLog { max-height: min(240px, 38vh) !important; }
  @media (max-width: 600px) {
    #title { max-width: calc(100vw - 28px); right: 14px; }
    #prog { top: auto; bottom: calc(var(--barh, 0px) + 10px); right: 14px; left: 14px; width: auto;
            max-height: min(40vh, calc(100vh - var(--barh, 0px) - 120px)); }
    #held { max-width: calc(100vw - 28px); }
    #martyPanel { left: 14px !important; right: 14px !important; width: auto !important; max-width: none !important; }
  }
  @media (max-height: 460px) and (min-width: 601px) {
    /* a short landscape: the title left, the actions right, Marty between */
    #title { max-width: 250px; max-height: calc(100vh - var(--barh, 0px) - 28px); overflow: auto; }
    #martyPanel { left: 50% !important; transform: translateX(-50%); width: 290px !important; }
    #martyLog { max-height: 30vh !important; }
  }
  #softKeys { position: fixed; left: 50%; bottom: 108px; width: 1px; height: 1px;
              opacity: 0; border: 0; padding: 0; margin: 0; resize: none;
              pointer-events: none; }

  #loading { position: fixed; inset: 0; display: grid; place-items: center;
             background: #12151b; z-index: 10; color: var(--dim); font-size: 13px;
             transition: opacity .4s ease; }
  #loading.gone { opacity: 0; pointer-events: none; }
  #loading.done { display: none; }   /* off the page, and out of the accessibility tree */

  #tip { position: fixed; z-index: 20; pointer-events: none; display: none;
         max-width: 260px; padding: 6px 9px; font-size: 12px; line-height: 1.4;
         white-space: pre-line;
         color: var(--ink); background: rgba(10, 13, 19, 0.92);
         border: 1px solid var(--edge); border-radius: 8px; }
  #tip hr { border: none; border-top: 1px solid var(--edge); margin: 6px 0 5px; opacity: 0.7; }
</style>
</head>
<body>
<div id="app"></div>

<div id="title" class="card">
  <h1>ToonTalk 3D<span class="badge" id="badge">your workshop</span></h1>
  <p>You move things yourself. The robot only acts inside its thought bubble —
     or when repeating what it learned.</p>
  <p id="hint">Click a stack to have the robot fetch something.</p>
  <p id="sayRow" style="margin-top:6px;font-size:11.5px;color:var(--dim);
     display:flex;align-items:center;gap:6px"></p>
  <p id="whoLine" style="margin-top:6px;font-size:11.5px;color:var(--dim)"></p>
  <button id="titleMin" title="Fold this card to its first line, or open it again."
    style="position:absolute;top:8px;right:8px;padding:0 8px;line-height:1.3">–</button>
  <button id="saidLogBtn" title="Everything said so far: the workshop's lines under the table, and what your hand was told and answered. Scroll for older ones."
    style="margin-top:8px">&#x1F4DC; What was said</button>
  <button id="againBtn" style="display:none;margin-top:8px"
    title="Put this puzzle back exactly as it began.">Start this puzzle over</button>
  <button id="nextBtn" class="go" style="display:none;margin-top:8px"
    title="The judge has accepted your answer: on to the next puzzle.">Next puzzle ▸</button>
</div>

<div id="prog" class="card">
  <button id="progMin" title="Tuck this panel away."
    style="float:right;padding:0 8px;line-height:1.3;">–</button>
  <h2 title="What the active robot learned, step by step. Steps only ever name the robot's own things, never places on your bench.">Trained actions</h2>
  <p id="trainedOn" title="The robot's condition: what it must be given before it will run. Dusty can vacuum parts of it away."></p>
  <textarea id="botNote" rows="1" spellcheck="false" placeholder="a note about this robot — click to write one"
    title="A note about the robot shown — what it is for, in your own words. It is the robot’s: it goes with it into a saved world, a saved thing, and every copy."></textarea>
  <div id="library">
    <div class="row"><button id="exportHeldBtn" title="Save whatever you are holding to a file — any thing: a box, a number, a robot, a nest.">Save held thing</button>
      <button id="exportWorldBtn" title="Save the whole workshop to a file.">Save world</button></div>
    <div class="row"><button id="importBtn" title="Open a file — a picture or a text file arrives as a pad, a sound on a speaker, a 3D model (.glb) as a thing you can hold, a saved thing in your hand, a saved world replaces the workshop. Dropping a file on the page does the same.">Import file</button>
      <button id="devicesBtn" title="A notebook of the workshop's own senses: nests that receive every key press, every move of the pointer, every click. Take one off a page and give it to a robot.">Devices</button></div>
  </div>
  <ul id="steps"><li class="empty">not trained yet</li></ul>
</div>

<!-- outside #bottom: its transform would capture our fixed positioning -->
<div id="held" class="card" style="cursor:pointer"
     title="What your invisible hand is carrying — it follows the mouse, and on a touch screen waits at one spot where you can see it. Click to hold a pad up and read it.">
  <span class="k">holding</span><span class="v" id="heldVal">–</span>
  <span class="k" id="heldTip">type digits to change it</span>
  <button id="heldRead" title="Read what is written on it, in full, and aloud. In a lesson the robot learns to read it out.">Read</button>
  <button id="heldFit" title="Make the pad as big as the ground you are on — the yard, or the table — and set it down over it: a ground of its own, with a picture on it if you like.">As big as the ground</button>
  <button id="heldTurn" title="Turn it over a quarter — the arrow keys do the same, and turn it the other way too.">⟳</button>
  <button id="heldPanel" title="Open its panel — the tray where its behaviour lives. Ctrl+P does the same.">⚙</button>
  <button id="heldBack" title="Put it back exactly where you picked it up. Ctrl+B does the same.">↩</button>
  <button id="heldPlus" title="Bigger — the size is the thing’s own and is saved with it. Ctrl+↑ does the same.">+</button>
  <button id="heldMinus" title="Smaller. Ctrl+↓ does the same.">−</button>
  <button id="heldKeys" title="Show the keyboard, to type on what you are holding">⌨</button>
</div>

<div id="bottom">
<div id="bar" class="card">
  <button id="exitBtn" class="think" style="display:none"
    title="End the lesson. The daydream rewinds; the robot keeps only what it learned.">Leave thought bubble</button>
  <button id="runBtn" class="go"
    title="The robot repeats its training on whatever it was given, and keeps going while its condition still matches.">Run what it learned</button>
  <button id="dustyBtn"
    title="Dusty vacuums things away, and vacuums parts of a robot's thought into wildcards so more things match.">Dusty: asleep</button>
  <span class="sep"></span>
  <label for="speed" title="How fast robots move. Instant skips the animation entirely.">Speed</label>
  <select id="speed" title="How fast robots move. Instant skips the animation entirely.">
    <option value="0.5">½×</option>
    <option value="1" selected>1×</option>
    <option value="2">2×</option>
    <option value="4">4×</option>
    <option value="8">8×</option>
    <option value="inf">Instant</option>
  </select>
  <button id="pauseBtn"
    title="Pause the robots — every robot, at the bench, in a house or on a panel, mid-stride. Everything else goes on: birds, moving things, your hands. Click again and the robots carry on where they stopped.">⏸ Pause</button>
  <span class="sep"></span>
  <button id="undoBtn"
    title="Undo the last move — picking up, putting down, typing, joining, vacuuming, erasing. Ctrl+Z works too.">Undo</button>
  <button id="homeBtn"
    title="Home view — the camera back where it starts: the whole table, or the whole yard. Leaves a close-up too. The Home key does the same.">⌂</button>
  <button id="fullBtn"
    title="Full screen — fill the screen with the workshop. On a tablet this is what gets the browser's own bars out of the way.">⛶</button>
  <button id="moreBtn" title="More — the table, the manual, sound, and reporting a bug.">⋮</button>
  <div id="moreMenu"></div>
</div>
</div>

<!-- martyManual: in the pack -->
<!-- puzzleSet: in the pack -->
<div id="loading">Loading…</div>
<div id="tip"></div>

<script>
// The pack -- the characters' models, Marty's manual, the puzzle set -- is not
// in this file: it would not publish if it were. It is asked for once, kept
// here afterwards, and handed to the app before it starts. Everything below
// runs before the module, which waits on the promise left in
// window.__TT_PACK_READY.
//
// Kept GZIPPED: the pack is over a megabyte of base64 and an artifact's
// storage quota is tight enough to refuse that; compressed it is about half.
// If the browser refuses even so, that is not a failure -- the workshop runs
// perfectly well having to ask again -- but the reader is told, rather than
// left to wonder why it asks every time.
(function () {
  var KEY = 'tt3d.pack.toontalk-3d-pack-2.gz';
  var PACK_URL = 'https://toontalk.github.io/toontalk-3d/toontalk-3d-pack.json';
  var PACK_GZ_URL = PACK_URL + '.gz';
  var el = document.getElementById('loading');
  var say = function (html) { if (el) el.innerHTML = html; };
  var note = function (m) {
    var e = document.getElementById('ttErr');
    if (e) e.textContent = m;
  };

  var b64 = {
    from: function (bytes) {
      var s = '', CH = 0x8000;                 // apply() dies on a long array
      for (var i = 0; i < bytes.length; i += CH) {
        s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
      }
      return btoa(s);
    },
    to: function (str) {
      var bin = atob(str), out = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    },
  };
  var gzip = function (text) {
    return new Response(new Blob([text]).stream()
      .pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
  };
  var gunzip = function (bytes) {
    return new Response(new Blob([bytes]).stream()
      .pipeThrough(new DecompressionStream('gzip'))).text();
  };

  // the two text blocks the app reads at boot, put back where it looks for them
  var plant = function (id, text, gz) {
    var old = document.getElementById(id);
    if (old) old.remove();
    var sc = document.createElement('script');
    sc.type = 'text/plain'; sc.id = id;
    if (gz) sc.dataset.gzip = '1';
    sc.textContent = text;
    document.head.appendChild(sc);
  };
  function unpack(text) {
    var data = JSON.parse(text);
    if (!data || data.format !== 'toontalk-3d-pack-2' || !data.models) {
      throw new Error('that is not the ToonTalk 3D pack (toontalk-3d-pack.json)');
    }
    window.__TT_MODELS = data.models;
    if (data.manual) plant('martyManual', data.manual, false);
    if (data.puzzles) plant('puzzleSet', data.puzzles, !!data.puzzlesGzip);
    return data;
  }

  window.__TT_PACK_READY = new Promise(function (done) {
    var kept = null;
    try { kept = localStorage.getItem(KEY); } catch (e) {}

    var fresh = function () {
      say(
        '<div style="max-width:30rem;margin:0 auto;text-align:center;line-height:1.55">'
        + '<div style="font-size:15px;color:#e6ecf7;margin-bottom:10px">'
        + 'ToonTalk 3D needs its pack</div>'
        + '<div style="margin-bottom:14px">Robby, Dusty and Mimi’s 3D models, Marty’s '
        + 'manual and the puzzles are about a megabyte — more than an artifact may '
        + 'carry. Hand them over once and this browser will remember them.</div>'
        + '<div style="margin-bottom:14px">Save <a href="' + PACK_GZ_URL + '" '
        + 'download="toontalk-3d-pack.json.gz" style="color:#7fd3c6">'
        + 'toontalk-3d-pack.json.gz</a> (a click downloads it) and drop the saved '
        + 'file anywhere on this page, or</div>'
        + '<button id="ttPick" style="font:inherit;font-size:13px;color:#eafff0;'
        + 'background:#2f6b43;border:none;border-radius:8px;padding:8px 16px;'
        + 'cursor:pointer">Choose the file…</button>'
        + '<div id="ttErr" style="margin-top:12px;color:#f0b429;min-height:1.2em">'
        + '</div>'
        + '<div style="margin-top:18px;font-size:12px;color:#8b93a1">It comes '
        + 'with the source, at<br>' + PACK_URL + '</div>'
        + '</div>');
    };

    var accept = function (text) {
      unpack(text);                                   // throws if it is wrong
      say('Loading…');
      done();
      // the keep happens after the app has what it needs, so a refusal here
      // delays nothing
      gzip(text)
        .then(function (buf) {
          localStorage.setItem(KEY, b64.from(new Uint8Array(buf)));
        })
        .catch(function (e) {
          console.warn('the pack was not kept in this browser:', e && e.message);
        });
    };
    window.__ttAcceptPack = accept;                   // for a test harness, which cannot drop a file

    if (kept) {
      gunzip(b64.to(kept))
        .then(function (text) { unpack(text); say('Loading…'); done(); })
        .catch(function () {
          try { localStorage.removeItem(KEY); } catch (e) {}
          fresh();
        });
      return;
    }
    // FETCH IT FIRST, and ask only if that fails: a page served from the site
    // (or a chat preview) gets the pack with no gesture at all. A published
    // artifact's policy refuses the fetch (connect-src 'self' and the font
    // hosts), and there the drop screen is what a reader sees.
    say('Fetching the pack…');
    var fetched = null;
    try { fetched = fetch(PACK_URL, { cache: 'force-cache' }); } catch (e) {}
    Promise.resolve(fetched)
      .then(function (r) { if (!r || !r.ok) throw new Error('no pack at ' + PACK_URL); return r.text(); })
      .then(accept)
      .catch(function () { fresh(); });

    // a dropped file may be the .json or the .gz: the gzip magic says which
    var read = function (file) {
      if (!file) return;
      note('Reading…');
      file.arrayBuffer().then(function (buf) {
        var bytes = new Uint8Array(buf);
        if (bytes.length > 2 && bytes[0] === 0x1f && bytes[1] === 0x8b) return gunzip(bytes);
        return new TextDecoder().decode(bytes);
      }).then(accept).catch(function (e) {
        note(String((e && e.message) || e));
      });
    };

    // A dynamically created, never-attached input: a static hidden one never
    // opens a picker in the app's own web view.
    document.addEventListener('click', function (ev) {
      if (!ev.target || ev.target.id !== 'ttPick') return;
      var inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = '.json,.gz,application/json,application/gzip';
      inp.onchange = function () { read(inp.files && inp.files[0]); };
      inp.click();
    });
    // Drag and drop is desktop only; the button above is the path everywhere else.
    addEventListener('dragover', function (ev) { ev.preventDefault(); });
    addEventListener('drop', function (ev) {
      ev.preventDefault();
      read(ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0]);
    });
  });
})();

umber) and Merge\n(box [nest, nest, bird]: give away the number on the FIRST nest, then swap the\ntwo nests -- and it dozes when the first nest is empty, so neither input runs\nahead; the interleave is strictly fair). Probe: will every integer appear\nafter finitely many steps? Where is 0 in the dance?',3:"Activity 3, \"A variety of sequences\". Goal: ANY sequence you can\ngenerate one term at a time is countable by construction. They invent their\nown sequences (Squares: copy the number, press *, drop it back on itself),\nthen build Match Maker (box [nest, count, bird]: pack the two-hole box [count,\nterm], hand it over, add 1 to count) -- the box IS the pairing, a dance card\nwith the partners' names on it. Encourage invention: fractions in one,\nnegatives in another, one fast, one slow. The subtle point, from Ken's own\nteacher notes: Match Maker pairs the naturals with POSITIONS in a sequence,\nso 5, 5, 5, ... pairs up as well as 1, 2, 3, ... does, while its set of\nvalues is just {5}. A sequence without duplicates is what makes a\none-to-one pairing of SETS; a sequence with them only covers its set.",4:'Activity 4, "All fractions between 0 and 1". Goal: you cannot list\nfractions in size order -- between any two there is another, so there is no\nfirst step -- but BY DENOMINATOR the walk reaches everything: 1/2, 1/3, 2/3,\n1/4... A team of two, and the branch is a SCALE weighing numerator against\ndenominator: Next Numerator\'s condition is the scale tipping right (hand out\nthe [n,d] box, numerator up one); when the scale BALANCES that condition stops\nmatching and the team falls through to Next Denominator (numerator SET back to\n1, denominator up one). Nobody counts; the scale is the entire conditional.\nDuplicates -- 2/4 arriving as 1/2 -- are worth noticing and wondering about:\nthe walk COVERS every fraction, some more than once, which is not the same\nas pairing each fraction with one step. The original set has a No Copies\nrobot that drops any n/d not in lowest terms; ask whether the count is wrong\nwith repeats in, or only untidy.',5:'Activity 5, "Rationals greater than 1". Goal: the lazy way wins. Every\nproper fraction a/b has a reciprocal b/a above 1, so ONE three-step robot --\nDivides 1: fresh 1, drop the incoming number on it with divide, hand out 1/n\n-- turns the whole of Activity 4\'s output into the other set, with the pairing\nalready built in: 1/2 with 2, 2/3 with 3/2. Pat ("more numbers above 1 than in\n(0,1)") and Sally ("infinitely many unit intervals above 1") are for arguing\nwith, not settling for them.',6:'Activity 6, "All the rationals" -- the capstone, built entirely of parts\nalready made: All Fractions + Box to Number (activity 4) + Divides 1 (activity\n5) + Merge (activity 2). Five rooms, one lever. Out of the last nest comes a\nsingle sequence; the nest is labelled "every positive rational?" because that\nis a CLAIM to investigate, not a result to accept. One number is missing --\nAll Fractions only hands out n/d while n is below d, and the reciprocal of 1\nis 1, so 1 never arrives; let them find that and ask where it would go in.\nCountable MEANS every one arrives after finitely many steps. The wonder to\nkeep alive: the rationals are dense, no rational has a next one, and yet\nhere they are in a queue.',7:'Activity 7, "Rationals in any interval". Goal: density and scale. One\narithmetic robot maps the fractions onto any interval without thinning or\ncrowding -- x2 lands them in (0,2), +10 in (10,11), divide by 2 in (0,1/2) --\nbecause every output came from exactly one input and the step can be undone\n(halve it). Joe\'s "doubling thins them out" is the misconception to probe.\nThe three nests filling at the same rate SHOWS the pairing; it does not prove\nit -- reversibility does. Any interval, however short, holds a full copy of\nthe fractions.'},Bw=()=>{const t=Cw[Pw];return t?'\n=== ACTIVITY MODE ===\nThe visitor is working through an "Exploring Infinity" activity sheet -- the\ncardinality of infinite sets, after Kahn\'s WebLabs sequence. You are the\nresearcher in the room, not the answer key:\n- NEVER state the mathematical conclusion outright (never say flatly "the two\n  sets are the same size"). Lead with questions instead: "what came out on the\n  nest?", "would that ever stop?", "who is 3 dancing with?".\n- The tool of thought is the DANCING PARTNERS metaphor: two collections are\n  the same size when every member of each has exactly one partner in the\n  other. Pairing replaces counting; that is the whole method.\n- Ask "what would happen if the robots ran forever?" often -- the question the\n  entire sequence turns on.\n- Predict, test, generalise: before they run something, ask what they expect.\n- Stuck BUILDING is different from stuck THINKING. For building, give the one\n  smallest mechanical step from the manual, then hand the job back; the sheet\n  has fuller hints under "If you get stuck". For thinking, never resolve a\n  paradox for them -- name the two pulls and ask which they believe.\n- A finished world for this activity exists and the sheet can load it. If the\n  rooms of the finished world are already on the table, explain freely what is\n  there and how it works. If they are building their own, do not describe the\n  finished construction unasked.\n\nThe activity they are on now: '+t:""},Ow=`You are Marty the Martian, the friendly green helper who lives in ToonTalk 3D — a 3D workshop where children build programs out of toys. The pieces: NUMBERS (the stack gives 1s; while HOLDING a number, typing digits APPENDS to what it shows — a fresh 1 typed 2 reads 12 — so press Backspace first to clear it; the minus key negates, and * / ^ — or the words mod and set — choose what it DOES when dropped on another number; there is NO way to type a fraction directly: to make p/q, hold a fresh number, press Backspace, type q then /, and drop it on a number showing p — the result is exactly p/q, no rounding), PADS (write by typing; join by
